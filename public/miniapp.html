  const kv = (k, val) => val ? `<div class="vd-kv"><span class="k">${esc(t(k))}</span><span class="v">${esc(val)}</span></div>` : '';
  const age = v.minAge && v.maxAge ? t('vk.ageRange', { a: v.minAge, b: v.maxAge })
            : v.minAge ? t('vk.ageFrom', { n: v.minAge }) : v.maxAge ? t('vk.ageTo', { n: v.maxAge }) : '';
  const info = [
    kv('vk.salary', v.salaryText), kv('vk.schedule', v.schedule), kv('vk.shift', v.shift ? shiftL(v.shift) : ''),
    kv('vk.cond', v.conditions), kv('vk.region', v.location),
    kv('vk.start', v.startDate ? dShort(v.startDate) : ''), kv('vk.need', v.headcount > 1 ? t('unit.people', { n: v.headcount }) : ''),
    kv('vk.exp', v.minExp ? t('vk.expFrom', { n: v.minExp }) : ''), kv('vk.age', age), kv('vk.langs', (v.languages || []).join(', ')),
    kv('vk.status', v.status === 'closed' ? t('vac.closed') : (v.listed ? t('vac.listed') : t('vac.private')))
  ].join('');

  $('shB').innerHTML = `
    ${funnelHtml(f)}
    ${appsBtn(v.id, f)}
    ${v.status === 'open' ? `<button class="btn vk-cta" id="vdMatch">${esc(t('vac.matches'))}</button>` : ''}
    <div class="vd-sec">${esc(t('vd.cands', { n: d.items.length }))}</div>
    <div id="vdItems">${d.items.length ? d.items.map(candHtml).join('')
      : `<div class="cd-wait">${esc(t('vd.none'))}</div>`}</div>
    <div class="vd-sec">${esc(t('vd.terms'))}</div>
    ${info}
    <button class="cd-btn" id="vdMenu" style="width:100%;margin-top:18px">${esc(t('vd.menu'))}</button>`;

  wireCards($('vdItems'), () => showVacancy(id));
  if ($('vdMatch')) $('vdMatch').onclick = e => startMatches(id, e.currentTarget);
  $('shB').querySelectorAll('[data-apps]').forEach(b => b.onclick = () => showApps(id));
  $('vdMenu').onclick = () => vacMenu(id, v);
}

// ── ⋯ menyusi: Tahrirlash, E'lon qilish / olish, Yopish / Qayta ochish ──
function vacMenu(id, vObj){
  const v = vObj || VACS.find(x => x.id === id);
  if (!v) return;
  sheetEnter('menu:' + id, () => vacMenu(id, v));
  const active = v.status !== 'closed';
  openSheet(v.title, `
    <button class="menu-it" data-m="edit">${IC.edit}${esc(t('m.edit'))}</button>
    ${active ? (v.listed
      ? `<button class="menu-it" data-m="unlist">${IC.eyeoff}${esc(t('m.unlist'))}</button>`
      : `<button class="menu-it" data-m="list">${IC.megaphone}${esc(t('m.list'))}</button>`) : ''}
    ${active
      ? `<button class="menu-it d" data-m="close">${IC.close}${esc(t('m.close'))}</button>`
      : `<button class="menu-it" data-m="reopen">${IC.reopen}${esc(t('m.reopen'))}</button>`}`);
  $('shB').querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
    const m = b.dataset.m;
    if (m === 'edit') { vacForm(v); return; }
    if (m === 'close' && !confirm(t('m.closeConfirm'))) return;
    const body = m === 'list' ? { listed: true } : m === 'unlist' ? { listed: false }
               : m === 'close' ? { status: 'closed' } : { status: 'open' };
    b.disabled = true;
    try {
      await api('/api/ma/vacancies/' + encodeURIComponent(id), { method:'PATCH', body: JSON.stringify(body) });
      closeSheet(); haptic(); loadVacancies();
    } catch(e){ showMsg(e.message); b.disabled = false; }
  });
}

// Forma ataylab ikki qismga bo'lingan: TALAB (kimni qidiramiz) va
// TAKLIF (nima beramiz). Mijoz ikkinchisini to'ldirmasa, HR qo'ng'iroq
// qilganda nima aytishini bilmaydi.
// Lavozim — server bilan bir xil ro'yxat (src/data/roles.js), o'zgarsa
// ikkala joyda. Ilgari forma lavozim so'ramasdi: vakansiya 'boshqa'
// bo'lib qolardi va bot qidiruvi uni tanimay yoniga dublikat ochardi.
const ROLES = ['ofitsiant', 'barmen', 'xostess', 'oshpaz', 'kassir', 'menejer', 'operator'];   // yozuvi — t('role.<kalit>')
// Server shabloni bilan bir xil sarlavha — qoida lug'atda (THI18N.vacTitle),
// vacancyAuto.makeTitle ham shundan. Server avtomatik sarlavhani bazaga
// o'zbekcha yozadi va o'quvchi tilida qaytaradi.
const autoTitle = (r, s) => ROLES.includes(r) ? I18N.vacTitle(r, s, LANG) : '';

  sheetEnter('form:' + (v ? v.id : 'new'), () => vacForm(v));
  const d = v || {};
  const sec = k => `<div style="font-size:12px;color:var(--muted);text-transform:uppercase;
      letter-spacing:.5px;font-weight:600;margin:16px 0 0">${esc(t(k))}</div>`;
  const roleOpts = `<option value="">${esc(t('form.choose'))}</option>` + ROLES.map(k =>
    `<option value="${k}" ${d.role === k ? 'selected' : ''}>${esc(t('role.' + k))}</option>`).join('');
  openSheet(t(v ? 'form.edit' : 'form.new'), `
    <div class="fl"><label>${esc(t('form.role'))}</label>
      <select id="fRo">${roleOpts}</select></div>
    <div class="fl"><label>${esc(t('form.title'))}</label>
      <input id="fTi" value="${esc(d.title)}" placeholder="${esc(t('form.titlePh'))}"></div>

    ${sec('form.req')}
    <div class="two">
      <div class="fl"><label>${esc(t('form.exp'))}</label><input id="fEx" inputmode="numeric" value="${d.minExp ?? ''}"></div>
      <div class="fl"><label>${esc(t('form.hc'))}</label><input id="fHc" inputmode="numeric" value="${d.headcount || 1}"></div>
    </div>
    <div class="fl"><label>${esc(t('form.shift'))}</label>
      <select id="fSh">
        <option value=""           ${!d.shift ? 'selected' : ''}>${esc(t('form.any'))}</option>
        <option value="kunduzgi"   ${d.shift === 'kunduzgi' ? 'selected' : ''}>${esc(t('shift.kunduzgi'))}</option>
        <option value="kechki"     ${d.shift === 'kechki' ? 'selected' : ''}>${esc(t('shift.kechki'))}</option>
        <option value="ikkalasi"   ${d.shift === 'ikkalasi' ? 'selected' : ''}>${esc(t('form.both'))}</option>
      </select></div>

    ${sec('form.offer')}
    <div class="two">
      <div class="fl"><label>${esc(t('form.sf'))}</label><input id="fSf" inputmode="numeric" value="${d.salaryFrom ?? ''}" placeholder="4000000"></div>
      <div class="fl"><label>${esc(t('form.st'))}</label><input id="fSt" inputmode="numeric" value="${d.salaryTo ?? ''}" placeholder="5000000"></div>
    </div>
    <div class="fl"><label>${esc(t('form.sc'))}</label><input id="fSc" value="${esc(d.schedule)}" placeholder="6/1, 16:00-24:00"></div>
    <div class="fl"><label>${esc(t('form.co'))}</label>
      <textarea id="fCo" placeholder="${esc(t('form.coPh'))}">${esc(d.conditions)}</textarea>
      <div class="hint">${esc(t('form.coHint'))}</div></div>

    <button class="btn" id="fSave" style="width:100%;margin-top:16px">${esc(t('common.save'))}</button>`);

  // Sarlavha lavozim va smenadan o'zi yoziladi — mijoz o'zi yozguncha
  let autoT = !d.title || d.title === autoTitle(d.role, d.shift);
  const syncT = () => { if (autoT) $('fTi').value = autoTitle($('fRo').value, $('fSh').value); };

// ── Vakansiyaga kelgan arizalar ──
// ── Arizadan kontaktni o'zi ochish ──
// Tasdiq majburiy: pul yechiladi. Telegram'ning o'z oynasi (showConfirm)
// — brauzer confirm()dan ishonchliroq ko'rinadi; eski versiyada zaxira.
function askConfirm(text){
  return new Promise(res => {
    try {
      if (TG && TG.showConfirm && TG.isVersionAtLeast && TG.isVersionAtLeast('6.2')) return TG.showConfirm(text, ok => res(!!ok));
    } catch(e){}
    res(confirm(text));
  });
}

// refresh — arizalar qaysi joyda ko'rsatilgan bo'lsa (tab yoki vakansiya
// oynasi), o'shani qayta chizish
// Telegram ichida brauzer showMsg() ko'rinmasligi mumkin — Telegram oynasi
function showMsg(text){
  try { if (TG && TG.showAlert && TG.isVersionAtLeast && TG.isVersionAtLeast('6.2')) return TG.showAlert(String(text)); } catch(e){}
  alert(text);
}

async function openFromApp(b, refresh){
  if (CREDITS != null && CREDITS < 1) {
    showMsg(t('open.noCredit'));
    showPlans(); return;
  }
  const bal = CREDITS != null ? t('open.bal', { a: CREDITS, b: CREDITS - 1 }) : '';
  const ok = await askConfirm(t('open.confirm', { bal }));
  if (!ok) return;
  b.disabled = true; const was = b.innerHTML; b.textContent = t('open.opening');
  try {
    const r = await api(`/api/ma/applications/${b.dataset.open}/open`, { method:'POST', body:'{}' });
    if (r.balance != null) CREDITS = r.balance;
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
    loadMe(); loadShortlists(); if (VACS.length) loadVacancies();
    if (!$('vAP').classList.contains('hide')) loadApps();
    showResume(r.candidateId || b.dataset.cand);          // darhol ism va telefon
  } catch(e){
    showMsg(e.message);
    b.disabled = false; b.innerHTML = was;
    refresh();                                            // holat o'zgargan bo'lishi mumkin
  }
}

// ── Arizachi kartasi — Arizalar tabi va vakansiya oynasi uchun bitta ──
// Tanlovlardagi bilan bir xil uslub. Rezyume ANONIM (kontaktgacha):
// ko'r-ko'rona "Tanlash"/"Rad etish" qilinmasin.
function appCardHtml(it){
  const c = it.candidate;
  if (!c) return '';
  const meta = factLine(c);
  const done = it.state === 'shortlisted' || it.state === 'rejected';
  const w = whoOf(c);
  const chip = w.open ? ['open', t('ap.open')]
             : it.state === 'shortlisted' ? ['waiting', t('ap.picked')] : it.state === 'rejected' ? ['no', t('ap.rejected')]
             : it.isNew ? ['waiting', t('ap.new')] : ['no', t('ap.seen')];
  const photo = c.hasPhoto ? `<img src="${candPhoto(c.id)}" alt="">` : w.avatar;
  const head = `<div class="cd-top">
      <div class="cd-ph">${photo}</div>
      <div class="cd-mid"><div class="cd-nm">${esc(w.title)}</div>
        <div class="cd-sub">${esc([w.sub, meta].filter(Boolean).join(' · '))}</div></div>
      <span class="stc ${chip[0]}">${esc(chip[1])}</span>
    </div>
    ${!w.open && trustTags(c) ? `<div class="tags" style="margin-top:8px">${trustTags(c)}</div>` : ''}
    ${it.message ? `<div class="cd-wait" style="color:var(--ink)">"${esc(it.message)}"</div>` : ''}`;

  // Kontakt ochilgan — Tanlovlardagi kabi: qo'ng'iroq, chat, rezyume
  if (w.open) {
    const tel = String(c.contact.phone || '').replace(/[^\d+]/g, '');
    return `<div class="cd" data-rzc="${esc(c.id)}">${head}
      <div class="cd-acts">
        ${tel ? `<a class="cd-btn p" href="tel:${esc(tel)}">${IC.phone}${esc(t('act.call'))}</a>` : ''}
        ${c.threadId ? `<button class="cd-btn" data-chat="${esc(c.id)}">${IC.chat}${esc(t('act.write'))}</button>` : ''}
        <button class="cd-btn" data-rz="${esc(c.id)}">${IC.doc}${esc(t('act.resume'))}</button>
      </div>
      <div class="cd-foot"><span>${esc(t('ap.date', { d: dShort(it.createdAt) }) + t('ap.stagesInSl'))}</span></div>
    </div>`;
  }
  return `<div class="cd" data-rzc="${esc(c.id)}">${head}
    <div class="cd-acts${!done && it.instant ? ' paid' : ''}">
      <button class="cd-btn" data-rz="${esc(c.id)}">${IC.doc}${esc(t('act.resume'))}</button>
      ${done ? '' : it.instant
        // Yangi ariza — kontaktni o'zi ochadi (tasdiq bilan, -1 kredit)
        ? `<button class="cd-btn p" data-open="${it.id}" data-cand="${esc(c.id)}">${IC.phone}${esc(t('ap.openContact'))}</button>`
        // Eski ariza yoki telefon tekshirilmagan — HR orqali
        : `<button class="cd-btn p" data-pick="${it.id}">${esc(t('ap.pick'))}</button>`}
      ${done ? '' : `<button class="cd-btn" data-rej="${it.id}" style="color:var(--danger)">${esc(t('ap.reject'))}</button>`}
    </div>
    <div class="cd-foot"><span>${esc(t('ap.date', { d: dShort(it.createdAt) }) + (
      done ? '' : it.instant ? t('ap.instant') : it.why ? ' · ' + it.why : ''))}</span></div>
  </div>`;
}

function wireApps(root, refresh){
  wireCardTap(root);
  root.querySelectorAll('[data-rz]').forEach(b => b.onclick = () => showResume(b.dataset.rz));
  root.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => openChatWith(b.dataset.chat));
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openFromApp(b, refresh));
  root.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/ma/applications/${b.dataset.pick}/pick`, { method:'POST' });
      haptic(); refresh(); if (VACS.length) loadVacancies(); loadShortlists(); }
    catch(e){ showMsg(e.message); b.disabled = false; }
  });
  root.querySelectorAll('[data-rej]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/ma/applications/${b.dataset.rej}/reject`, { method:'POST', body: JSON.stringify({}) });
      refresh(); }
    catch(e){ showMsg(e.message); b.disabled = false; }
  });
  // Server arizalarni ochilganda 'seen' qildi — nuqta va qizil belgilar o'chsin
  refreshUnread();
}

// ── Bitta vakansiyaning arizalari (vakansiya kartasi/sahifasidan) ──
async function showApps(id){
  sheetEnter('apps:' + id, () => showApps(id));
  openSheet(t('apps.sheet'), `<div class="msg">${esc(t('common.loading'))}</div>`);
  let d;
  try { d = await api(`/api/ma/vacancies/${id}/applications`); }
  catch(e){ $('shB').innerHTML = `<div class="msg">${esc(e.message)}</div>`; return; }

  $('shT').textContent = d.vacancy.title;
  if (!d.items.length) {
    $('shB').innerHTML = `<div class="msg">${t(d.vacancy.listed ? 'apps.emptyListed' : 'apps.emptyPrivate')}</div>`;
    return;
  }
  $('shB').innerHTML = d.items.map(appCardHtml).join('');
  wireApps($('shB'), () => showApps(id));
  if (!$('vVC').classList.contains('hide')) loadVacancies();
}

// ══════════════════════════════════════════════════════════
//  ARIZALAR TABI — barcha vakansiyalarning arizalari
// ══════════════════════════════════════════════════════════
// Har kuni ishlatiladi — alohida bo'lim (Balans o'rnida; balans tepadagi
// raqamni bosganda ochiladi). Vakansiya bo'yicha guruhlangan; filtr:
// "Kutilmoqda" (qaror qilinmagan) va "Hammasi".
let AP_ROWS = [], APF = 'wait';
const appWaiting = it => it.state !== 'shortlisted' && it.state !== 'rejected';

async function loadApps(){
  try { AP_ROWS = await api('/api/ma/applications'); renderApps(); }
  catch(e){ $('apList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}

function renderApps(){
  if (!AP_ROWS.length) {
    $('apList').innerHTML = `<div class="msg">${t('ap.empty')}</div>`;
    return;
  }
  const waitN = AP_ROWS.filter(appWaiting).length;
  if (APF === 'wait' && !waitN) APF = 'all';                 // kutilayotgani yo'q — hammasini ko'rsat
  const rows = AP_ROWS.filter(it => APF === 'all' || appWaiting(it));

  const groups = [], gBy = {};
  for (const it of rows) {
    let g = gBy[it.vacancyId];
    if (!g) { g = gBy[it.vacancyId] = { title: it.vacancyTitle, closed: it.vacancyStatus === 'closed', items: [] }; groups.push(g); }
    g.items.push(it);
  }
  groups.sort((a, b) => a.closed - b.closed);                // yopilganlar pastda

  $('apList').innerHTML =
    `<div class="flt">
      <button class="${APF === 'wait' ? 'on' : ''}" data-af="wait">${esc(t('ap.fWait'))}<b>${waitN}</b></button>
      <button class="${APF === 'all' ? 'on' : ''}" data-af="all">${esc(t('ap.fAll'))}<b>${AP_ROWS.length}</b></button>
    </div>` +
    (groups.length ? groups.map(g => `<div class="grp">
      <div class="grp-h"><b>${esc(g.title)}</b>${g.closed ? `<span class="cl">${esc(t('grp.closed'))}</span>` : ''}
        <span>${esc(t('ap.count', { n: g.items.length }))}</span></div>
      ${g.items.map(appCardHtml).join('')}
    </div>`).join('') : `<div class="msg">${esc(t('ap.noneWait'))}</div>`);

  $('apList').querySelectorAll('[data-af]').forEach(b => b.onclick = () => { APF = b.dataset.af; haptic('sel'); renderApps(); });
  wireApps($('apList'), loadApps);
}

async function loadAccount(){
  if (!PLANS) $('hsBody').innerHTML = `<div class="ac-skel"></div><div class="ac-skel s2"></div><div class="ac-skel s3"></div>`;
  try { PLANS = await api('/api/ma/plans'); }
  catch(e){ $('hsBody').innerHTML = `<div class="msg">${esc(e.message)}</div>`; return; }

function heroHtml(d){
  const c = d.current || {}, n = d.credits || 0;
  let term;
  if (c.key) {
    const total = c.startedAt ? Math.max(1, (new Date(c.endsAt) - new Date(c.startedAt)) / DAY_MS) : 30;
    const pct = Math.max(4, Math.min(100, Math.round(c.daysLeft / total * 100)));
    const soon = c.daysLeft <= 3;
    term = `<div class="ac-term ${soon ? 'soon' : ''}"><div class="ac-term-t"><span>${esc(t('ac.until', { date: dmyL(c.endsAt) }))}</span>
      <b>${esc(t('ac.left', { n: c.daysLeft }))}</b></div><div class="ac-bar"><i style="width:${pct}%"></i></div></div>`;
  } else {
    term = `<div class="ac-term none">${esc(t('ac.noPlanD'))}</div>`;
  }
  const pill = c.key ? (c.key === 'trial' ? t('ac.trialPill') : t('plan.' + c.key)) : t('ac.noPlan');
  const cta = c.key && c.key !== 'trial' ? t('ac.renew') : t('ac.choose');
  return `<div class="ac-hero">
    <div class="ac-top"><span>${esc(t('ac.balance'))}</span><span class="ac-pill ${c.key ? '' : 'off'}">${esc(pill)}</span></div>
    <div class="ac-bal"><b>${n}</b><span>${esc(t('ac.unit', { n }))}</span></div>
    <div class="ac-note">${esc(t('ac.note'))}</div>
    ${term}
    <button class="ac-cta" id="hsCta">${esc(cta)}</button>
  </div>`;
}

function pendingHtml(d){
  const pm = d.pendingManual;
  const ar = d.auto || {};
  let out = '';
  if (pm) {
    const st = pm.provider === 'card' ? pm.state : pm.provider === 'invoice' ? 'inv' : 'manual';
    const key = { waiting: 'ac.pendCard', checking: 'ac.pendCheck', rejected: 'ac.pendRej', inv: 'ac.pendInv', manual: 'ac.pendManual' }[st] || 'ac.pendCard';
    const cls = st === 'rejected' ? 'bad' : st === 'checking' ? 'info' : 'warn';
    const click = pm.provider === 'card';
    out += `<${click ? 'button' : 'div'} class="ac-alert ${cls}" ${click ? 'id="hsPend"' : ''}>
      <span class="ac-alert-ic">${st === 'checking' ? '<span class="cp-spin sm"></span>' : AIC.clock}</span>
      <span class="ac-alert-t"><b>${esc(t(key))}</b><small>${esc(t('ac.pendSub', { plan: t('plan.' + pm.planKey), code: pm.code || '' }))}</small></span>
      ${click ? `<span class="ac-chev">${AIC.chev}</span>` : ''}</${click ? 'button' : 'div'}>`;
  }
  if (ar.on && ar.error) out += `<div class="ac-alert bad"><span class="ac-alert-ic">${AIC.refresh}</span>
    <span class="ac-alert-t"><b>${esc(t('pl.auto'))}</b><small>${esc(t('pl.autoErr', { e: ar.error }))}</small></span></div>`;
  return out;
}

function guaranteeCard(g){
  if (!g) return '';
  const hire = g.needHire > 0, need = hire ? g.needHire : g.needCandidates, got = hire ? g.hired : g.candidates;
  if (!need) return '';
  const done = got >= need, R = 24, L = 2 * Math.PI * R, p = Math.min(1, got / need);
  return `<div class="ac-card ac-g ${done ? 'done' : ''}">
    <div class="ac-ring"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="${R}" class="bg"/>
      <circle cx="30" cy="30" r="${R}" class="fg" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(L * (1 - p)).toFixed(1)}"/></svg>
      <b>${got}<small>/${need}</small></b></div>
    <div class="ac-g-t"><b>${AIC.shield}${esc(t('ac.gT'))}</b>
      <span>${esc(t(hire ? 'ac.gHire' : 'ac.gCand', { n: got, need }))}</span>
      <small>${esc(t(done ? 'pl.gDone' : 'pl.gLeft'))}</small></div>
  </div>`;
}

function planDetail(p, cur){
  const g = p.guarantee || {};
  const isCur = cur && cur.key === p.key;
  const per = p.unlimited ? t('ac.perMax') : t('ac.per', { sum: fmtSum(Math.round(p.price / p.contacts / 100) * 100) });
  const feats = [
    g.candidates ? t('pl.gCand', { n: g.candidates }) : '',
    g.hire ? t('pl.gHire') : '',
    p.personalHr ? t('pl.fHr') : '',
    g.replace ? t('pl.fReplace') : '',
    p.key === 'max' ? t('pl.fFirst') : '',
    t('pl.fCarry')
  ].filter(Boolean);
  return `<div class="ac-plan ${p.popular ? 'pop' : ''}">
    <div class="ac-plan-h"><b>${esc(t('plan.' + p.key))}</b>
      ${isCur ? `<span class="ac-tag cur">${esc(t('ac.cur'))}</span>` : p.popular ? `<span class="ac-tag">${esc(t('pl.popular'))}</span>` : ''}</div>
    <div class="ac-price">${fmtSum(p.price)}<small>${esc(t('pl.sum'))} / ${esc(t('pl.days', { n: p.days }))}</small></div>
    <div class="ac-per">${esc(per)}</div>
    <div class="ac-kpi">
      <div><b>${p.unlimited ? '∞' : p.contacts}</b><span>${esc(t('ac.kC'))}</span></div>
      <div><b>${p.days}</b><span>${esc(t('ac.kD'))}</span></div>
      <div><b>${g.hire || g.candidates || '—'}</b><span>${esc(t(g.hire ? 'ac.kH' : 'ac.kG'))}</span></div>
    </div>
    <ul class="ac-feat">${feats.map(f => `<li>${AIC.check}<span>${esc(f)}</span></li>`).join('')}</ul>
    <button class="btn ac-buy" data-buy="${p.key}">${esc(t(isCur ? 'ac.extend' : 'ac.buy', { plan: t('plan.' + p.key) }))}</button>
  </div>`;
}

function rowHtml(a, ic, bg, title, sub, right){
  return `<button class="ac-row" data-a="${a}"><span class="ac-ic" style="background:${bg}">${ic}</span>
    <span class="ac-rt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>
    ${right ? `<span class="ac-rv">${esc(right)}</span>` : ''}<span class="ac-chev">${AIC.chev}</span></button>`;
}

function renderAccount(){

  if (!HS_PLAN || !d.plans.some(p => p.key === HS_PLAN)) HS_PLAN = d.plans.some(p => p.key === c.key) ? c.key : 'pro';
  const ar = d.auto || {};
  $('hsBody').innerHTML = `
    ${heroHtml(d)}
    ${pendingHtml(d)}
    ${guaranteeCard(d.guarantee)}
    ${c.trialAvailable ? `<div class="ac-card ac-trial"><div><b>🎁 ${esc(t('pl.trialT'))}</b><span>${esc(t('pl.trialD'))}</span></div>
      <button class="btn" id="hsTrial">${esc(t('pl.trialBtn'))}</button></div>` : ''}
    <div class="ac-sec" id="hsPlans"><h3>${esc(t('ac.plans'))}</h3><span>${esc(t('pl.launch'))}</span></div>
    <div class="ac-seg">${d.plans.map(p => `<button class="${p.key === HS_PLAN ? 'on' : ''}" data-plan="${p.key}">${esc(t('plan.' + p.key))}${p.popular ? '<i>★</i>' : ''}</button>`).join('')}</div>
    <div id="hsPlan">${planDetail(d.plans.find(p => p.key === HS_PLAN), c)}</div>

      ${rowHtml('ref', AIC.gift, '#E8A317', t('ref.title'), t('ref.short'), '')}
      ${rowHtml('oferta', AIC.doc, '#8E8E93', t('pl.oferta'), '', '')}
      ${rowHtml('help', AIC.help, '#34C759', t('cp.help'), '', '')}
    </div>
    <div class="ac-sec"><h3>${esc(t('ac.hist'))}</h3></div>
    <div class="ac-seg sm"><button class="${HS_HIST === 'pay' ? 'on' : ''}" data-h="pay">${esc(t('ac.hPay'))}</button><button class="${HS_HIST === 'cr' ? 'on' : ''}" data-h="cr">${esc(t('ac.hCr'))}</button></div>
    <div class="ac-list" id="hsHist"></div>`;

function wireAccount(){
  const d = PLANS;
  $('hsCta').onclick = () => { const el = $('hsPlans'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  if ($('hsPend')) $('hsPend').onclick = () => showCardPay(null, d.pendingManual.id);
  if ($('hsTrial')) $('hsTrial').onclick = async () => {
    const b = $('hsTrial'); b.disabled = true;
    try {
      const r = await api('/api/ma/trial', { method:'POST', body:'{}' });
      CREDITS = r.balance; loadMe();
      try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
      showMsg(t('pl.trialOk')); loadAccount();
    } catch(e){ b.disabled = false; showMsg(e.message); }
  };
  $('hsBody').querySelectorAll('[data-plan]').forEach(b => b.onclick = () => {
    HS_PLAN = b.dataset.plan; haptic('sel');
    $('hsBody').querySelectorAll('[data-plan]').forEach(x => x.classList.toggle('on', x === b));
    $('hsPlan').innerHTML = planDetail(d.plans.find(p => p.key === HS_PLAN), d.current);
    wireBuy();
  });
  wireBuy();
  $('hsBody').querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    HS_HIST = b.dataset.h; haptic('sel');
    $('hsBody').querySelectorAll('[data-h]').forEach(x => x.classList.toggle('on', x === b));
    drawHistory();
  });
  $('hsBody').querySelectorAll('.ac-list [data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'auto') showAuto();
    else if (a === 'ref') showReferral();
    else if (a === 'oferta') openExt(location.origin + '/oferta.html?lang=' + LANG);
    else if (a === 'help') openSupport();
  });
}
function wireBuy(){ $('hsBody').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => choosePay(b.dataset.buy)); }

const ST_CLS = { paid: 'ok', checking: 'info', waiting: 'warn', rejected: 'bad', canceled: 'mute', refunded: 'mute' };
async function drawHistory(){
  const box = $('hsHist');
  if (!box) return;
  if (HS_HIST === 'pay') {
    const rows = PLANS.history || [];
    if (!rows.length) { box.innerHTML = `<div class="ac-empty">${esc(t('ac.hNone'))}</div>`; return; }
    box.innerHTML = rows.map(o => {
      const open = o.provider === 'card' && ['waiting', 'checking', 'rejected'].includes(o.state);
      return `<${open ? 'button' : 'div'} class="ac-row ac-h" ${open ? `data-o="${o.id}"` : ''}>${pmIcon(o.provider)}
        <span class="ac-rt"><b>${esc(t('plan.' + o.planKey))}${o.auto ? ' · ' + esc(t('ac.autoTag')) : ''}</b>
          <small>${esc(dt(o.paidAt || o.createdAt))} · №${esc(o.code || '')} · ${esc(t('prov.' + o.provider))}</small></span>
        <span class="ac-hr"><b>${fmtSum(o.amount)}</b><span class="ac-st ${ST_CLS[o.state] || 'mute'}">${esc(t('st.' + o.state))}</span></span></${open ? 'button' : 'div'}>`;
    }).join('');
    box.querySelectorAll('[data-o]').forEach(b => b.onclick = () => showCardPay(null, b.dataset.o));
    return;
  }
  box.innerHTML = `<div class="ac-empty">${esc(t('common.loading'))}</div>`;
  try {
    const rows = await api('/api/ma/credits');
    if (HS_HIST !== 'cr' || !$('hsHist')) return;
    if (!rows.length) { box.innerHTML = `<div class="ac-empty">${esc(t('cr.none'))}</div>`; return; }
    box.innerHTML = rows.map(r => `<div class="ac-row ac-h"><span class="ac-dl ${r.delta > 0 ? 'p' : 'm'}">${r.delta > 0 ? '+' : ''}${r.delta}</span>
      <span class="ac-rt"><b>${esc(crReason(r.reason))}</b><small>${esc(dt(r.createdAt))}${r.note ? ' · ' + esc(r.note) : ''}</small></span>
      <span class="ac-hr"><span class="ac-after">${esc(t('ac.after', { n: r.balanceAfter }))}</span></span></div>`).join('');
  } catch(e){ box.innerHTML = `<div class="ac-empty">${esc(e.message)}</div>`; }
}

// ── To'lov: buyurtma xulosasi + usul ──
function choosePay(key){
  const d = PLANS, p = d && d.plans.find(x => x.key === key);
  if (!p) return;
  sheetEnter('pay:' + key, () => choosePay(key));
  const c = d.current || {}, g = p.guarantee || {};
  // Faol pullik tarif bo'lsa yangi muddat uning oxiridan (billing.activate qoidasi)
  const from = c.key && c.key !== 'trial' && c.endsAt && new Date(c.endsAt) > new Date() ? new Date(c.endsAt) : new Date();
  const to = new Date(from.getTime() + p.days * DAY_MS);
  const add = p.unlimited ? p.contacts : p.contacts;
  const methods = [];
  if (d.card) methods.push({ k: 'card', title: t('pl.card'), sub: t('pl.cardD'), tag: t('ck.fast') });
  for (const k of d.providers || []) if (PM[k]) methods.push({ k, title: k === 'uzum' ? 'Uzum Bank' : PM[k].txt, sub: t(k === 'uzum' ? 'pl.uzumD' : 'pl.afterPay') });
  methods.push({ k: 'invoice', title: t('pl.invoice'), sub: t('pl.invoiceD') });
  methods.push({ k: 'manual', title: t('pl.manual'), sub: t('pl.manualD') });
  let sel = methods[0].k;
  const legal = esc(t('ck.legal')).replace('{oferta}', `<a href="#" id="ckOf">${esc(t('ck.ofertaLink'))}</a>`);
  openSheet(t('ck.title'), `
    <div class="ck-sum">
      <div class="ck-h"><span class="ck-badge ${key}">${esc(t('plan.' + key)).slice(0, 1)}</span>
        <div><b>${esc(t('ck.plan', { plan: t('plan.' + key) }))}</b><small>${esc(t('pl.days', { n: p.days }))} · ${esc(p.unlimited ? t('pl.unlimited') : t('pl.contacts', { n: p.contacts }))}</small></div></div>
      <div class="ck-rows">
        <div><span>${esc(t('ck.valid'))}</span><b>${esc(dmyL(from))} — ${esc(dmyL(to))}</b></div>
        <div><span>${esc(t('ck.contacts'))}</span><b>${p.unlimited ? esc(t('pl.unlimited')) : '+' + p.contacts}</b></div>
        ${!p.unlimited && d.credits > 0 ? `<div><span>${esc(t('ck.balance'))}</span><b>${d.credits} → ${d.credits + add}</b></div>` : ''}
        ${g.candidates || g.hire ? `<div><span>${esc(t('ck.guar'))}</span><b>${esc(g.hire ? t('ck.gHire') : t('ck.gCand', { n: g.candidates }))}</b></div>` : ''}
      </div>
      <div class="ck-total"><span>${esc(t('ck.total'))}</span><b>${fmtSum(p.price)} ${esc(t('pl.sum'))}</b></div>
    </div>
    <div class="ac-sec sm"><h3>${esc(t('ck.method'))}</h3></div>
    <div class="ac-list ck-m">${methods.map(m => `<button class="ac-row" data-m="${m.k}">${pmIcon(m.k)}
      <span class="ac-rt"><b>${esc(m.title)}${m.tag ? ` <em class="ck-tag">${esc(m.tag)}</em>` : ''}</b><small>${esc(m.sub)}</small></span>
      <span class="ck-radio"></span></button>`).join('')}</div>
    <div class="ck-legal">${legal}</div>
    <div class="err" id="payErr" style="color:var(--danger);font-size:13px;min-height:16px;text-align:center"></div>
    <div class="ck-foot"><button class="btn" id="ckGo" style="width:100%"></button></div>`);
  const paint = () => {
    $('shB').querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === sel));
    $('ckGo').textContent = sel === 'invoice' ? t('ck.next') : sel === 'manual' ? t('ck.request') : t('ck.pay', { sum: fmtSum(p.price) });
  };
  $('shB').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { sel = b.dataset.m; haptic('sel'); paint(); });
  paint();
  $('ckOf').onclick = e => { e.preventDefault(); openExt(location.origin + '/oferta.html?lang=' + LANG); };
  $('ckGo').onclick = async () => {
    if (sel === 'card') return showCardPay(key);
    if (sel === 'invoice') return showInvoice(key);
    const b = $('ckGo'); b.disabled = true; $('payErr').textContent = '';
    try {
      const r = await api('/api/ma/orders', { method:'POST', body: JSON.stringify({ plan: key, provider: sel }) });
      if (r.url) { b.textContent = t('pl.opening'); openExt(r.url); setTimeout(() => { b.disabled = false; paint(); }, 2500); return; }
      $('shB').innerHTML = `<div class="cp-state ok"><div class="cp-ic"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg></div>
        <h3>${esc(t('ck.sentT'))}</h3><p>${esc(t('pl.manualSent'))}<br><small>${esc(t('pl.order', { code: r.code }))}</small></p>
        <button class="btn" id="ckDone" style="width:100%">${esc(t('cp.okBtn'))}</button></div>`;

// ── Karta qo'shish (avto-yangilash) ──
// Karta raqami TalentHub serveriga KELMAYDI: so'rovlar to'g'ridan-to'g'ri
// Payme Subscribe API'ga (X-Auth: kassa id), bizga faqat token beriladi.
// Inputlarda name yo'q, formada action yo'q — Payme talabi.
async function paymeCall(method, params){
  const cf = PLANS && PLANS.cardForm;
  if (!cf) throw new Error(t('pl.autoNA'));
  const r = await fetch(cf.api, { method:'POST', headers:{ 'Content-Type':'application/json', 'X-Auth': cf.merchantId },
    body: JSON.stringify({ id: Date.now(), method, params }) });
  const j = await r.json().catch(() => ({}));
  if (j.error) throw new Error((j.error.message && (j.error.message[LANG] || j.error.message.ru)) || j.error.message || 'Payme');
  return j.result;
}

function showCard(){
  sheetEnter('card', showCard);
  openSheet(t('pl.autoAdd'), `
    <form id="cForm" onsubmit="return false" autocomplete="off">
      <div class="fl"><label>${esc(t('pl.cardNum'))}</label><input id="cNum" inputmode="numeric" placeholder="8600 0000 0000 0000" maxlength="19"></div>
      <div class="fl"><label>${esc(t('pl.cardExp'))}</label><input id="cExp" inputmode="numeric" placeholder="MM/YY" maxlength="5"></div>
      <div id="cCodeBox" class="hide"><div class="fl"><label><span id="cSent"></span></label><input id="cCode" inputmode="numeric" maxlength="6" placeholder="••••••"></div></div>
      <button class="btn" id="cGo" style="width:100%">${esc(t('pl.cardSend'))}</button>
    </form>
    <div class="err" id="cErr" style="color:var(--danger);font-size:13px;min-height:18px;margin-top:8px"></div>
    <div class="pm-note"><span class="pm-logo">Payme</span>
      <span>${esc(t('pl.cardNote'))} <a href="#" id="lPmOf">${esc(t('pl.pmOferta'))}</a></span></div>
    <div class="pm-pw">Powered by Payme</div>`);
  $('lPmOf').onclick = e => { e.preventDefault(); openExt('https://cdn.payme.uz/terms/main.html'); };

  $('cExp').oninput = () => { const v = $('cExp').value.replace(/\D/g, '').slice(0, 4); $('cExp').value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v; };
  let token = '';
  $('cGo').onclick = async () => {
    const b = $('cGo'); $('cErr').textContent = ''; b.disabled = true;
    try {
      if (!token) {
        const number = $('cNum').value.replace(/\D/g, ''), exp = $('cExp').value.replace(/\D/g, '');
        if (number.length !== 16 || exp.length !== 4) throw new Error(t('pl.cardReq'));
        const r = await paymeCall('cards.create', { card: { number, expire: exp }, save: true });
        token = r.card.token;
        const v = await paymeCall('cards.get_verify_code', { token });
        $('cSent').textContent = t('pl.cardSent', { phone: v.phone || '' });
        $('cCodeBox').classList.remove('hide'); $('cNum').disabled = $('cExp').disabled = true;
        b.textContent = t('pl.cardVerify'); $('cCode').focus();
      } else {
        const code = $('cCode').value.replace(/\D/g, '');
        if (code.length < 4) throw new Error(t('pl.cardCodeReq'));
        const v = await paymeCall('cards.verify', { token, code });
        await api('/api/ma/card', { method:'POST', body: JSON.stringify({ token: v.card.token }) });
        try { PLANS = await api('/api/ma/plans'); if (!$('vHS').classList.contains('hide')) renderAccount(); } catch(e){}
        try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
        showMsg(t('pl.cardOk'));
        sheetBack();
        return;
      }
    } catch(e){ $('cErr').textContent = e.message; }
    b.disabled = false;
  };
}

// Uch holat bitta oynada: to'lash (karta, summa, "To'ladim") -> tekshirilmoqda
// (o'zi yangilanadi) -> tasdiqlandi. "Topilmadi" bo'lsa forma ogohlantirish bilan

let CP_POLL = null;
const groupCard = n => String(n || '').replace(/(\d{4})(?=\d)/g, '$1 ');

async function copyText(text, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  if (!ok) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
  }
  try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred(ok ? 'success' : 'error'); } catch(e){}
  if (btn) {
    const was = btn.dataset.label || btn.textContent;
    btn.dataset.label = was; btn.classList.add('ok'); btn.textContent = '✓ ' + t('cp.copied');
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.classList.remove('ok'); btn.textContent = was; }, 1600);
  }
}

function drawCardPay(o){
  if (!SH_CUR || SH_CUR.key !== 'cardpay') return;            // foydalanuvchi boshqa oynaga o'tib ketgan
  SH_CUR.render = () => showCardPay(null, o.id);
  clearInterval(CP_POLL);
  // Bosqichlar: To'lov -> Tekshiruv -> Tayyor
  const stepN = o.status === 'paid' ? 3 : o.status === 'checking' ? 2 : 1;
  const steps = `<div class="cp-steps">${['cp.st1', 'cp.st2', 'cp.st3'].map((k, i) =>
    `${i ? '<i class="' + (stepN > i ? 'on' : '') + '"></i>' : ''}<span class="${stepN > i ? 'on' : ''}${stepN === i + 1 ? ' cur' : ''}"><em>${stepN > i + 1 ? '✓' : i + 1}</em>${esc(t(k))}</span>`).join('')}</div>`;
  const head = `${o.status === 'canceled' ? '' : steps}<div class="cp-head"><div class="cp-sum">${fmtSum(o.amount)}<small>${esc(t('pl.sum'))}</small></div>
    <div class="cp-sub">${esc(t('plan.' + o.planKey))} · ${esc(t('cp.order', { code: o.code }))}</div></div>`;

  if (o.status === 'paid') {
    $('shB').innerHTML = `${steps}<div class="cp-state ok"><div class="cp-ic"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg></div>
      <h3>${esc(t('cp.okT'))}</h3><p>${esc(t('cp.okD', { plan: t('plan.' + o.planKey), n: o.credits == null ? (CREDITS || 0) : o.credits }))}</p>
      <button class="btn" id="cpDone" style="width:100%">${esc(t('cp.okBtn'))}</button></div>`;
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
    if (o.credits != null) CREDITS = o.credits;
    loadMe();
    if (!$('vHS').classList.contains('hide')) loadAccount();
    $('cpDone').onclick = () => { closeSheet(); pickTab('tHS'); };
    return;
  }
  if (o.status === 'canceled') {
    $('shB').innerHTML = `${head}<div class="cp-state"><h3>${esc(t('cp.closedT'))}</h3><p>${esc(t('cp.closedD'))}</p>
      <button class="btn" id="cpBack" style="width:100%">${esc(t('cp.back'))}</button></div>`;
    $('cpBack').onclick = () => showPlans();
    return;
  }
  if (o.status === 'checking') {
    $('shB').innerHTML = `${head}<div class="cp-state wait"><div class="cp-ic"><span class="cp-spin"></span></div>
      <h3>${esc(t('cp.checkT'))}</h3><p>${esc(t('cp.checkD'))}</p>
      <button class="btn ghost" id="cpHelp" style="width:100%">${esc(t('cp.help'))}</button></div>`;
    $('cpHelp').onclick = () => openSupport();
    // Tasdiqlanishini kutamiz: 5 s da bir, 10 daqiqagacha (oyna ochiq bo'lsa)
    let n = 0;
    CP_POLL = setInterval(async () => {
      if (++n > 120 || !SH_CUR || SH_CUR.key !== 'cardpay' || !$('sheet').classList.contains('on')) { clearInterval(CP_POLL); return; }
      try { const x = await api('/api/ma/orders/' + encodeURIComponent(o.id)); if (x.status !== 'checking') drawCardPay(x); } catch(e){}
    }, 5000);
    return;
  }

  // waiting | rejected — to'lov formasi
  const c = o.card || {};
  $('shB').innerHTML = `${head}
    ${o.status === 'rejected' ? `<div class="cp-warn"><b>${esc(t('cp.rejT'))}</b><span>${esc(t('cp.rejD'))}</span></div>` : ''}
    <div class="cp-step"><i>${AIC.card}</i><span>${esc(t('cp.s1'))}</span></div>
    <div class="cp-card">
      <div class="cp-card-top"><span class="cp-chip"></span><span class="cp-bank">${esc(c.bank || '')}</span></div>
      <div class="cp-num">${esc(groupCard(c.number))}</div>
      <div class="cp-card-bot"><span class="cp-holder">${esc(c.holder || '')}</span>
        <button class="cp-copy" id="cpCopyNum">${esc(t('cp.copy'))}</button></div>
    </div>
    <div class="cp-step"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></i><span>${esc(t('cp.s2'))}</span></div>
    <div class="cp-row"><b>${fmtSum(o.amount)} ${esc(t('pl.sum'))}</b><button class="cp-copy alt" id="cpCopySum">${esc(t('cp.copy'))}</button></div>
    <div class="cp-hint">${esc(t('cp.note', { code: o.code }))}</div>
    <div class="cp-step"><i>${AIC.check}</i><span>${esc(t('cp.s3'))}</span></div>
    <div class="fl cp-fl"><label>${esc(t('cp.payer'))}</label><input id="cpPayer" maxlength="60" autocomplete="off" placeholder="${esc(t('cp.payerPh'))}"></div>
    <button class="btn" id="cpPaid" style="width:100%">${esc(t('cp.paid'))}</button>
    <div class="err" id="cpErr" style="color:var(--danger);font-size:13px;min-height:18px;margin-top:6px"></div>
    <div class="cp-safe">🔒 ${esc(t('cp.safe'))}</div>
    <button class="lnk cp-cancel" id="cpCancel">${esc(t('cp.cancel'))}</button>`;
  $('cpCopyNum').onclick = e => copyText(c.number || '', e.currentTarget);
  $('cpCopySum').onclick = e => copyText(String(o.amount), e.currentTarget);
  $('cpPaid').onclick = async () => {
    const b = $('cpPaid'); b.disabled = true; $('cpErr').textContent = '';
    try {
      const x = await api('/api/ma/orders/' + encodeURIComponent(o.id) + '/claim', { method:'POST', body: JSON.stringify({ payer: $('cpPayer').value }) });
      haptic('light');
      drawCardPay(x.card ? x : Object.assign({}, o, x));
    } catch(e){ $('cpErr').textContent = e.message; b.disabled = false; }
  };
  $('cpCancel').onclick = async () => {
    if (!(await askConfirm(t('cp.cancelQ')))) return;
    try { await api('/api/ma/orders/' + encodeURIComponent(o.id) + '/cancel', { method:'POST', body:'{}' }); showPlans(); }
    catch(e){ showMsg(e.message); }
  };
}

// ══════════════════════════════════════════════════════════
//  SUHBATLAR
// ══════════════════════════════════════════════════════════
// Tepada qadalgan "TalentHub" galochka bilan, ostida kontakt ochilgan
// nomzodlar. Suhbatni mijoz o'zi boshlay olmaydi — u kontakt ochilganda
// serverda avtomatik ochiladi.

const VF = '<svg class="ch-vf" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">'
  + '<circle cx="12" cy="12" r="11" fill="#2563EB"/>'
  + '<path d="M10.8 16.2l-3.4-3.4 1.3-1.3 2.1 2.1 5-5 1.3 1.3z" fill="#fff"/></svg>';

// Agentlik suhbati — yordam chati (quloqchin: "bu yerda javob beriladi")
const AG_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/>'
  + '<path d="M21 16v2a4 4 0 0 1-4 4h-5"/></svg>';

let CHATS = [], CUR = null;

function tmOf(s){
  if (!s) return '';
  const d = new Date(s), n = new Date();
  const sameDay = d.toDateString() === n.toDateString();
  return sameDay
    ? d.toLocaleTimeString(LOC(), { hour:'2-digit', minute:'2-digit' })
    : d.toLocaleDateString(LOC(), { day:'2-digit', month:'short' });
}

async function loadChats(){
  const box = $('chatList');
  try {
    CHATS = await api('/api/ma/chats');
    drawChats();
  } catch(e){
    box.innerHTML = '<div class="ch-empty">' + esc(e.message) + '</div>';
  }
}

function drawChats(){
  const box = $('chatList');
  setDot(CHATS.reduce((s, c) => s + (c.unread || 0), 0));
  if (!CHATS.length){ box.innerHTML = '<div class="ch-empty">' + esc(t('chat.none')) + '</div>'; return; }
  box.innerHTML = CHATS.map((c, i) => {
    const ag = !!c.pinned;
    const nm = c.title || '—';
    return '<div class="ch-row" data-i="' + i + '">'
      + '<div class="ch-av' + (ag ? ' ag' : '') + '" data-nozoom>' + (ag ? AG_IC : avatarHtml(c)) + '</div>'
      + '<div class="ch-mid"><div class="ch-top"><span class="ch-name">' + esc(nm) + '</span>'
      + (ag ? VF + '<span class="ch-pin">&#128204;</span>' : '') + '</div>'
      + '<div class="ch-last">' + esc(c.subtitle || c.lastMsgText || '') + '</div></div>'
      + '<div class="ch-right"><span class="ch-time">' + (c.lastMsgFrom ? tmOf(c.lastMsgAt) : '') + '</span>'
      + (c.unread ? '<span class="ch-badge">' + c.unread + '</span>' : '') + '</div></div>';
  }).join('');
  box.querySelectorAll('.ch-row').forEach(el => {
    el.onclick = () => openChat(CHATS[+el.dataset.i]);
  });
}

// Kontakt ochilgan nomzod — fotosi (bo'lsa), aks holda bosh harflar
const candPhoto = id => '/api/ma/candidates/' + encodeURIComponent(id) + '/photo?t=' + encodeURIComponent(PT);
function avatarHtml(c){
  return c.open && c.hasPhoto
    ? '<img src="' + candPhoto(c.candidateId) + '" alt="">'
    : esc(initialsOf(c.title));
}

async function openChat(c){
  CUR = c;
  const ag = !!c.pinned;
  $('cvName').textContent = c.title || '—';
  $('cvVf').innerHTML = ag ? VF : '';
  // Nomzod suhbatida ostki qator — lavozimi (oxirgi xabar emas): sarlavha
  // "kim bilan gaplashyapman" ga javob beradi
  $('cvSub').textContent = ag ? t('chat.agency') : (c.position || c.subtitle || '');
  $('cvSub').dataset.after = t('chat.resumeLink');     // CSS ::after — " · rezyume ›"
  $('cvAv').innerHTML = ag ? AG_IC : avatarHtml(c);
  $('cvAv').className = 'ch-av' + (ag ? ' ag' : '');
  // Sarlavhani bosish — rezyume (faqat kontakt ochiq bo'lsa)
  const tap = !ag && c.open && c.candidateId;
  $('cvWho').classList.toggle('tap', !!tap);
  $('cvWho').onclick = tap ? () => showResume(c.candidateId) : null;
  $('cvBody').innerHTML = '<div class="ch-empty">' + esc(t('common.loading')) + '</div>';
  $('cv').classList.remove('hide');
  await reloadMsgs();
  c.unread = 0;
  drawChats();
}

async function reloadMsgs(){
  if (!CUR) return;
  try {
    const d = await api('/api/ma/chats/' + encodeURIComponent(CUR.id) + '/messages');
    drawMsgs(d.messages || []);
  } catch(e){
    $('cvBody').innerHTML = '<div class="ch-empty">' + esc(e.message) + '</div>';
  }
}

function drawMsgs(ms){
  const b = $('cvBody');
  if (!ms.length){
    // Yordam chati bo'sh — salomlashuv (bazaga yozilmaydi)
    b.innerHTML = CUR && CUR.pinned
      ? '<div class="cmsg them">' + esc(t('chat.supportHello')) + '</div>'
      : '<div class="ch-empty">' + esc(t('chat.noMsgs')) + '</div>';
    return;
  }
  b.innerHTML = ms.map(m => {
    // Tizim xabari ALOHIDA ko'rinadi — uni odamning gapi bilan
    // adashtirish yozishmani dalil sifatida ishlatishni buzadi.
    if (m.kind === 'system') return '<div class="cmsg sys">' + esc(m.text) + '</div>';
    const me = m.from === 'client';
    return '<div class="cmsg ' + (me ? 'me' : 'them') + '">' + esc(m.text)
      + '<div class="cmsg-t">' + tmOf(m.createdAt) + '</div></div>';
  }).join('');
  b.scrollTop = b.scrollHeight;
}

// Matn o'zgaruvchisi `t` deb nomlanmasin — tarjima funksiyasi t() ni
// yopib qo'yardi: xato bo'lsa catch ichida t('chat.fail') o'zi yiqilib,
// tugma qotib qolardi (2026-10-20 auditda topildi). `sending` — Enter
// ikki marta bosilsa xabar va Telegram push'i ikki marta ketmasin.
let sending = false;
async function sendMsg(){
  const inp = $('cvIn'), txt = inp.value.trim();
  if (!txt || !CUR || sending) return;
  sending = true;
  $('cvSend').disabled = true;
  try {
    await api('/api/ma/chats/' + encodeURIComponent(CUR.id) + '/messages',
      { method:'POST', body: JSON.stringify({ text: txt }) });
    inp.value = '';
    await reloadMsgs();
    loadChats();
  } catch(e){
    // Xatoni ko'rinadigan qilamiz: jim yutilsa odam qayta-qayta bosadi
    $('cvBody').insertAdjacentHTML('beforeend',
      '<div class="cmsg sys">' + esc(t('chat.fail', { e: e.message })) + '</div>');
    $('cvBody').scrollTop = $('cvBody').scrollHeight;
  }
  sending = false;
  $('cvSend').disabled = false;
}

// ── Rezyume ──
// Faqat kontakt ochilgan nomzod: server tekshiradi (contactView), bu
// yerda shunchaki ko'rsatamiz. Asl PDF emas — nomzodning o'z profili:
// u tahrirlasa mijoz yangisini ko'radi.
// Smena kaliti -> "Kunduzgi" / "Дневная"; notanish qiymat o'zicha
const shiftL = s => s && I18N.D.uz['shift.' + s] !== undefined ? t('shift.' + s) : (s || '');
const sanL = s => ['yes', 'no', 'expired'].includes(s) ? t('san.' + s) : '';
// Anketadagi "qachondan ish boshlay oladi" (now | w1 | w2 | m1)
const startL = s => ['now', 'w1', 'w2', 'm1'].includes(s) ? t('start.' + s) : '';

async function showResume(id){
  sheetEnter('rz:' + id, () => showResume(id));
  openSheet(t('rz.sheet'), '<div class="msg">' + esc(t('common.loading')) + '</div>');
  let r;
  try { r = await api('/api/ma/candidates/' + encodeURIComponent(id)); }
  catch(e){ $('shB').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; return; }

  // Kontaktgacha — anonim: ism o'rnida lavozim, kod; telefon yo'q (server
  // anonymize'dan o'tkazgan, bu yerda faqat sarlavhani moslaymiz)
  const open = r.open !== false;
  // roleText — server rol bo'yicha bir xil yozadi ("Xostess", xom "Хостес" emas)
  const role = r.roleText || r.roleLabel || r.desiredPosition || t('role.candidate');
  const nm = open ? (r.fullName || t('role.candidate')) : role;
  $('shT').textContent = open ? (r.fullName || t('rz.sheet')) : t('rz.code', { c: r.publicCode || '' });
  const meta = [r.age ? t('fact.age', { n: r.age }) : '', r.location || '', expTxt(r.experienceYears, r.experienceMonths)]
    .filter(Boolean).join(' · ');
  const kv = (k, v) => v ? '<div class="rs-kv"><span class="k">' + esc(t(k)) + '</span><span class="v">' + esc(v) + '</span></div>' : '';
  const info = [
    kv('rz.start', startL(r.startWhen)),
    kv('d.shift', shiftL(r.shift)),
    kv('rz.salary', r.salaryExpectation),
    kv('d.edu', r.education),
    kv('d.langs', (r.languages || []).join(', ')),
    kv('rz.san', sanL(r.sanitaryBook))
  ].join('');
  const work = (r.workHistory || []).map(w =>
    '<div class="rs-w"><b>' + esc(w.position || t('rz.pos')) + '</b>'
    + '<div class="m">' + esc([w.company, w.period].filter(Boolean).join(' · ')) + '</div>'
    + (w.description ? '<div class="d">' + esc(w.description) + '</div>' : '') + '</div>').join('');
  // Nomzodning o'z matni — "O'zi haqida"; yo'q bo'lsa AI xulosasi —
  // "Qisqacha" (mijoz uni nomzod yozgan deb o'ylamasin)
  const about = r.experienceSummary || r.summary || '';
  const aboutH = esc(t(r.experienceSummary ? 'rz.about' : 'rz.summary'));

  $('shB').innerHTML =
    '<div class="rs-hd"><div class="rs-ph">'
    + (r.hasPhoto ? '<img src="' + candPhoto(r.id) + '" alt="">' : (open ? esc(nameIni(nm)) : roleIcon(r.role)))
    + '</div><div style="min-width:0"><div class="rs-nm">' + esc(nm) + '</div>'
    + '<div class="rs-po">' + esc(open ? role : (r.publicCode || '')) + '</div>'
    + '<div class="rs-mt">' + esc(meta) + '</div></div></div>'
    + (open
      ? '<div class="rs-ct">'
        + (r.phone ? '<a href="tel:' + esc(r.phone) + '">&#128222; ' + esc(r.phone) + '</a>' : '<span>' + esc(t('rz.noPhone')) + '</span>')
        + (r.email ? '<span>&#9993;&#65039; ' + esc(r.email) + '</span>' : '') + '</div>'
      : '<div class="rs-ct" style="color:var(--muted)"><span>&#128274; ' + esc(t('rz.locked')) + '</span></div>')
    + (about ? '<div class="rs-sec">' + aboutH + '</div><div class="rs-tx">' + esc(about) + '</div>' : '')
    + (work ? '<div class="rs-sec">' + esc(t('rz.work')) + '</div>' + work : '')
    + (info ? '<div class="rs-sec">' + esc(t('rz.info')) + '</div>' + info : '')
    + ((r.skills || []).length ? '<div class="rs-sec">' + esc(t('rz.skills')) + '</div><div class="rs-chips">'
      + r.skills.map(s => '<span>' + esc(s) + '</span>').join('') + '</div>' : '');
}

// ── Qizil nuqta: o'qilmagan xabarlar ──
// Kirganda, suhbatdan chiqqanda va ilovaga qaytganda yangilanadi.
// Suhbatlar ro'yxati ochiq bo'lsa — qo'shimcha so'rovsiz, ro'yxatdan.
// Pastki menyuda o'qilmaganlar SONI (nuqta emas)
function badge(d, n){ if (!d) return; d.classList.toggle('on', n > 0); d.classList.toggle('n', n > 0); d.textContent = n > 0 ? (n > 99 ? '99+' : String(n)) : ''; }
function setDot(n){ badge($('dMS'), n); }
// Arizalar tabidagi nuqta — ko'rilmagan arizalar
function setAppsDot(n){ badge($('dAP'), n); }
function refreshUnread(){
  if (!INIT || $('cabMode').classList.contains('hide')) return;
  api('/api/ma/unread').then(d => { setDot(d.chats); setAppsDot(d.apps); }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshUnread(); });

$('cvBack').onclick = () => { $('cv').classList.add('hide'); CUR = null; refreshUnread(); };
$('cvSend').onclick = sendMsg;
$('cvIn').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
// ── Tablar ──
const TABS = [['tSL','vSL'], ['tAP','vAP'], ['tVC','vVC'], ['tMS','vMS'], ['tHS','vHS']];
function pickTab(id){
  TABS.forEach(([t,v]) => {
    $(t).classList.toggle('on', t === id);
    $(v).classList.toggle('hide', t !== id);
  });
  haptic('sel');
  if (id === 'tAP') loadApps();
  if (id === 'tSL') loadShortlists();
  if (id === 'tVC') loadVacancies();
  if (id === 'tMS') loadChats();
  if (id === 'tHS') { loadAccount(); window.scrollTo(0, 0); }
  // Hisobda balans katta kartada — tepadagi qisqa balans takrorlanmasin
  $('cabMode').classList.toggle('on-hs', id === 'tHS');
  moveLens();
}
TABS.forEach(([tb]) => { $(tb).onclick = () => pickTab(tb); });

// ── Til almashtirish (Aloqa bo'limi) ──
// Serverga yoziladi (Client.lang), keyin joriy bo'lim qayta yuklanadi:
// holat, rol, maosh yorliqlari serverdan yangi tilda kelsin.
async function setLang(l){
  if (!useLang(l)) return;
  haptic('sel');
  try { await api('/api/ma/lang', { method:'PATCH', body: JSON.stringify({ lang: l }) }); } catch(e){}
  loadMe();
  const on = TABS.find(([tb]) => $(tb).classList.contains('on'));
  pickTab(on ? on[0] : 'tSL');                 // linza ham yangi yozuv kengligiga moslashadi
}
document.querySelectorAll('[data-lang]').forEach(b => { b.onclick = () => setLang(b.dataset.lang); });

// ── Linza: faol tab ostiga prujina bilan suriladi ──
// Birinchi joylashuv animatsiyasiz — aks holda ochilganda chapdan uchib keladi.
// Panel yashirin bo'lsa (qidiruv rejimi) o'lchami 0 — kutamiz.
function moveLens(){
  const lens = $('lens'), on = document.querySelector('.tabs .tb.on');
  if (!lens || !on || !on.offsetWidth) return;
  const first = !lens.classList.contains('on');
  if (first) lens.style.transition = 'none';
  lens.style.width = on.offsetWidth + 'px';
  lens.style.transform = 'translateX(' + on.offsetLeft + 'px) scale(1.04,1.16)';
  if (first) { void lens.offsetWidth; lens.style.transition = ''; lens.classList.add('on'); }
}
window.addEventListener('resize', moveLens);

// ── Linzani barmoq bilan surish (iOS Telegram/Instagram kabi) ──
// Barmoq panelda 6px dan ko'p yursa — surish rejimi: linza barmoq ortidan
// yuradi va kattalashadi, ostidagi bo'lim belgilanadi, qo'yib yuborilganda
// o'sha bo'lim ochiladi va linza prujina bilan joyiga o'tiradi.
// Kichik harakat — oddiy bosish (click) bo'lib qoladi.
(function(){
  const nav = document.querySelector('.tabs'), lens = $('lens');
  if (!nav || !lens) return;
  const btns = [...nav.querySelectorAll('.tb')];
  const tick = () => { try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch(e){} };
  let sx = null, pid = null, drag = false, hov = null, quiet = 0;

  // Barmoq ostidagi bo'lim; panel chetidan chiqsa — eng chetdagisi
  const under = x => {
    const first = btns[0].getBoundingClientRect(), last = btns[btns.length - 1].getBoundingClientRect();
    if (x < first.left) return btns[0];
    if (x >= last.right) return btns[btns.length - 1];
    return btns.find(b => { const r = b.getBoundingClientRect(); return x >= r.left && x < r.right; }) || null;
  };

  nav.addEventListener('pointerdown', e => { sx = e.clientX; pid = e.pointerId; drag = false; });

  nav.addEventListener('pointermove', e => {
    if (sx == null || e.pointerId !== pid) return;
    if (!drag) {
      if (Math.abs(e.clientX - sx) < 6) return;
      drag = true;
      try { nav.setPointerCapture(pid); } catch(err){}
      lens.style.transition = 'width .2s, opacity .2s';      // barmoqqa darhol ergashsin
      lens.classList.add('drag', 'on');
    }
    const nr = nav.getBoundingClientRect(), w = lens.offsetWidth;
    const x = Math.max(5, Math.min(nr.width - 5 - w, e.clientX - nr.left - w / 2));
    lens.style.transform = 'translateX(' + x + 'px) scale(1.1,1.3)';
    const b = under(e.clientX);
    if (b && b !== hov) {
      if (hov) hov.classList.remove('hov');
      hov = b; b.classList.add('hov'); tick();
    }
  });

  const end = e => {
    if (sx == null || (e && e.pointerId !== pid)) return;
    const was = drag;
    sx = null; drag = false;
    if (!was) return;                                       // oddiy bosish — click o'zi ishlaydi
    lens.classList.remove('drag');
    lens.style.transition = '';                             // joyiga prujina bilan
    quiet = Date.now() + 350;                               // surishdan keyingi click bo'limni qayta almashtirmasin
    const target = hov;
    if (hov) { hov.classList.remove('hov'); hov = null; }
    if (target) pickTab(target.id); else moveLens();
  };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', end);

  // iOS: linzani surayotganda butun Mini App qimirlab ketardi. Ikki sabab:
  //  1) Telegram'ning "pastga surib yig'ish" imo-ishorasi — barmoq ozgina
  //     pastga og'sa ham ishga tushadi. Barmoq panelda turganda o'chiramiz,
  //     qo'yilganda qaytaramiz: boshqa joyda odatdagidek yopiladi.
  //  2) WebView touch-action'ni to'liq hurmat qilmaydi — sahifa "rezinadek"
  //     cho'ziladi. Panelda boshlangan harakatda aylantirishni to'xtatamiz
  //     (pointer hodisalari va oddiy bosish bunga tegmaydi).
  const swipes = on => { try {
    if (!TG || !TG.isVersionAtLeast || !TG.isVersionAtLeast('7.7')) return;
    on ? TG.enableVerticalSwipes() : TG.disableVerticalSwipes();
  } catch(e){} };
  const restore = () => setTimeout(() => swipes(true), 60);
  nav.addEventListener('touchstart', () => swipes(false), { passive: true });
  nav.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  nav.addEventListener('touchend', restore);
  nav.addEventListener('touchcancel', restore);
  nav.addEventListener('click', e => {
    if (Date.now() < quiet) { e.stopPropagation(); e.preventDefault(); }
  }, true);
})();

// Telegram push tugmasi miniapp.html#chat ga olib keladi — Aloqa tabini ochamiz.
// Element tekshiriladi: INIT bo'lmasa sahifa body'ni almashtiradi va
// tablar yo'qoladi — shunda pickTab null ustida yiqilardi.
if (location.hash === '#chat') setTimeout(() => { if ($('tMS')) pickTab('tMS'); }, 0);

// ── Qidiruv natijasini ochish ──
// Ikki joydan: botdagi "Ko'rish" (?s=) va kabinetdagi "Mos nomzodlar".
async function openSearch(key, fromCab){
  KEY = key; FROM_CAB = !!fromCab;
  SEL.clear(); SEEN.clear(); ROWS = []; cur = -1;
  // openDetail/renderList style.display bilan almashtiradi — xuddi shunday qaytaramiz
  $('detail').innerHTML = ''; $('detail').style.display = 'none';
  $('listView').style.display = 'block';
  $('bar').style.display = 'none';
  $('cnt').textContent = '';
  $('sum').textContent = t('common.loading');
  $('list').innerHTML = '';
  $('bBackCab').classList.toggle('hide', !FROM_CAB);
  $('cabMode').classList.add('hide');
  $('searchMode').classList.remove('hide');
  window.scrollTo(0, 0);
  try{
    const d = await api('/api/ma/session/' + encodeURIComponent(KEY), { method:'POST', body:'{}' });
    useLang(d.lang);                           // botdan to'g'ridan-to'g'ri ochilganda /me chaqirilmaydi
    ROWS = d.candidates || [];
    $('sum').textContent = d.summary || '';
    if (!ROWS.length) { show(esc(t('search.notFound'))); return; }
    renderList();
  }catch(e){ show(esc(e.message)); }
}

function backToCab(){
  $('searchMode').classList.add('hide');
  $('bar').style.display = 'none';
  $('cabMode').classList.remove('hide');
  FROM_CAB = false;
  pickTab('tVC');
  refreshUnread();
}
$('bBackCab').onclick = backToCab;

// ══════════════════════════════════════════════════════════
(async function(){
  if (!INIT) {
    document.body.innerHTML = '<div class="msg">' + esc(t('boot.needTg')) + '</div>';
    return;
  }

  // Kalit bor -> qidiruv natijasi; yo'q -> kabinet (menyu tugmasi)
  if (KEY) { openSearch(KEY, false); return; }

  $('cabMode').classList.remove('hide');
  moveLens();
  // Avval /me — u haqiqiy tilni (Client.lang) beradi; ro'yxatlar shu tilda chizilsin
  await loadMe();
  moveLens();                                    // til almashgan bo'lsa tab yozuvlari kengligi o'zgargan
  loadShortlists();
  refreshUnread();

  // Telegram'dagi "yangi ariza" xabarining "Ko'rish" tugmasi: ?apps=<vakansiya>
  const APPS = new URLSearchParams(location.search).get('apps');
  if (APPS) pickTab('tAP');                     // Arizalar bo'limi
  // Bot "kredit kam qoldi" xabarining tugmasi: ?open=plans
  // Botdagi to'lov xabari / eslatma: ?open=pay&o=<buyurtma>
  const QS = new URLSearchParams(location.search);
  if (QS.get('open') === 'plans') showPlans();
  else if (QS.get('open') === 'pay' && QS.get('o')) showCardPay(null, QS.get('o'));
})();
</script>
