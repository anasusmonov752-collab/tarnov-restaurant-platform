# ── Avtomatik testlar ────────────────────────────────────────
# Har push va PR'da: sof qoidalar (test/unit.test.js) va pul oqimi
# haqiqiy MongoDB'da (test/credits.test.js, mongodb-memory-server
# replika to'plami — tranzaksiya va unikal indeks ham tekshiriladi).
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci emas: package-lock.json da pdf-parse yo'q (Render npm install ishlatadi)
      - run: npm install --no-audit --no-fund
      - run: npm i --no-save mongodb-memory-server@10
      # Natija (testlar soni) annotatsiya bo'lib chiqadi — loglarni ochmasdan ko'rinadi
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Natija
        if: always()
        shell: bash
        run: |
          s=$(grep -E '^(# |ℹ )(tests|pass|fail) [0-9]+' test.log | sed 's/^ℹ /# /' | tr '\n' ' ')
          echo "::notice title=Testlar::${s:-natija topilmadi}"
          grep -E '^not ok|✖' test.log | head -20 | while read -r l; do echo "::error title=Yiqilgan test::$l"; done || true
          # Tafsilot (xato matni, kutilgan/haqiqiy qiymat, qator) — loglarni admin huquqisiz ham ko'rish uchun
          grep -A40 -E '^\s*not ok' test.log | grep -E "location:|error:|expected:|actual:|\.test\.js:[0-9]+|Expected|^\s+[+-] " \
            | head -24 | while read -r l; do echo "::warning title=Tafsilot::$l"; done || true
          # Yiqilgan har fayl bloki bitta annotatsiyada (o'tgan subtestlarsiz): pastki qismi — sabab
          awk '/^(ok|not ok) [0-9]+ - /{ if ($1=="not") { print buf; print $0; print "=====" } buf=""; next } { buf = buf "\n" $0 }' test.log \
            | grep -vE '^\s*ok [0-9]+ |duration_ms|^\s*(---|\.\.\.)\s*$|type: .test.' | grep -E '\S' | tail -60 \
            | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Yiqilgan fayl tafsiloti::/' ; echo
