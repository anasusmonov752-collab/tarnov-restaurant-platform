services:
  - type: web
    name: tarnov-restaurant-platform
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Qiymatlar Render dashboard'ida beriladi (sync: false).
      # Bu yerga HECH QACHON haqiqiy kalit yozilmasin — repo ochiq.
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
    disk:
      name: tarnov-data
      mountPath: /app/data
      sizeGB: 1
