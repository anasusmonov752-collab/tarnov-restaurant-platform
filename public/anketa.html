<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentHub — Anketa</title>
<link rel="stylesheet" href="/css/th.css?v=2">  <!-- dizayn tizimi: ranglar, kunduz/tun -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/js/th-i18n.js?v=16"></script>
<style>
/* Ranglar — dizayn tizimidan (css/th.css), miniapp/profil bilan bir xil;
   kunduz/tun Telegram'dan (applyTheme). */
:root{
  --bg:var(--th-bg); --card:var(--th-surface); --ink:var(--th-ink); --ink-2:var(--th-ink-2); --muted:var(--th-muted);
  --line:var(--th-line); --blue:var(--th-brand); --blue-d:var(--th-brand-2);
  --ok:var(--th-ok); --danger:var(--th-danger);
  --soft-blue:#E8EFFA; --sel:#F2F7FF;
}
:root[data-theme="dark"]{ --soft-blue:rgba(10,132,255,.18); --sel:rgba(10,132,255,.16); }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);
  color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%;min-height:100vh}
.hide{display:none !important}

/* Tepada: progress va qadam */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.bk{border:0;background:none;color:var(--blue);font-size:20px;line-height:1;padding:2px 6px 2px 0;cursor:pointer}
.bk:disabled{opacity:0}
.prog{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--blue);border-radius:4px;transition:width .3s}
.stp{font-size:12.5px;color:var(--muted);min-width:40px;text-align:right}

.wrap{padding:8px 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:18px;padding:22px 18px;box-shadow:0 1px 2px rgba(15,39,71,.05)}
.vac{font-size:13px;color:var(--blue);font-weight:600;margin-bottom:10px}
.secl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.q{font-size:21px;font-weight:700;line-height:1.3}
.hint{font-size:14px;color:var(--muted);line-height:1.5;margin-top:8px}
.err{font-size:13.5px;color:var(--danger);margin-top:12px;min-height:18px}

/* Variantlar — katta, barmoq bilan oson */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:13px;
  padding:14px 15px;font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px}
.opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.on{border-color:var(--blue);background:var(--sel)}
.opt.on i{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px #fff}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opts.grid .opt{font-size:15px;padding:13px 12px}

input.in,textarea.in{width:100%;margin-top:18px;border:1.5px solid var(--line);border-radius:13px;padding:14px;
  font-family:inherit;font-size:17px;color:var(--ink);background:var(--card);outline:none}
input.in:focus,textarea.in:focus{border-color:var(--blue)}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}

/* Telefon */
.share{width:100%;margin-top:20px;border:0;border-radius:14px;background:var(--blue);color:#fff;
  font-family:inherit;font-size:17px;font-weight:700;padding:16px;cursor:pointer}
.ok{margin-top:18px;padding:13px 14px;border-radius:12px;background:rgba(46,158,91,.1);color:#1E7A44;font-weight:600}
.lnk{border:0;background:none;color:var(--blue);font-family:inherit;font-size:14.5px;font-weight:600;margin-top:14px;cursor:pointer;padding:4px 0}

/* Rasm */
.ph{margin-top:18px;width:150px;height:180px;border-radius:16px;background:var(--soft-blue);overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:40px}
.ph img{width:100%;height:100%;object-fit:cover}

/* Rozilik */
.cons{margin-top:16px;padding:14px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.55}
.chk{display:flex;align-items:center;gap:11px;margin-top:16px;font-size:16px;font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--blue)}

/* Ish tajribasi — rezyume kartalari; qo'shish pastdan oynada (C variant) */
.w-empty{text-align:center;padding:26px 6px 6px}
.w-ic{width:60px;height:60px;border-radius:18px;background:var(--soft-blue);color:var(--blue);font-size:28px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.w-ic.ok{background:rgba(46,158,91,.14);color:var(--ok);font-weight:700}
.w-et{font-size:14.5px;color:var(--muted);line-height:1.5}
.w-hint{font-size:13px;color:var(--muted);margin:16px 0 10px}
.w-card{width:100%;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;
  padding:12px;margin-bottom:9px;font-family:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.w-card:active{background:var(--sel)}
.w-av{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.w-av.a0{background:var(--soft-blue);color:var(--blue)}
.w-av.a1{background:rgba(46,158,91,.14);color:var(--ok)}
.w-av.a2{background:rgba(255,149,0,.15);color:#B25E00}
.w-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.w-tx b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-tx small{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.w-pill{flex:none;font-size:12.5px;color:var(--ink-2);background:var(--bg);border-radius:99px;padding:5px 10px}
.w-add{width:100%;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:13px;margin-top:2px;
  font-family:inherit;font-size:15px;font-weight:600;color:var(--blue);cursor:pointer}
/* Pastdan chiqadigan oyna */
.sh-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);transition:background .22s;display:flex;align-items:flex-end}
.sh-ov.on{background:rgba(0,0,0,.32)}
.sh{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .24s ease-out;max-height:88vh;overflow:auto}
.sh-ov.on .sh{transform:none}
.sh.full{height:100%;max-height:none;border-radius:0;padding-top:calc(10px + env(safe-area-inset-top))}
.sh.full .sh-grab{visibility:hidden}
.sh-grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sh-top{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:10px;margin-bottom:14px}
.sh-bk,.sh-x{border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:4px;font-family:inherit}
.sh-bk{color:var(--blue)}
.sh-stp{display:flex;gap:5px}
.sh-stp i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.sh-stp i.on{background:var(--blue)}
.sh-q{font-size:20px;font-weight:700;line-height:1.3}
.sh-h{font-size:14px;color:var(--muted);margin-top:5px}
.sh-in{margin-top:14px}
.sh-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sh-list.ic .opt i{display:none}          /* lavozimlar: emoji bor, doiracha ortiqcha */
.sh-del{display:block;margin:12px auto 0;color:var(--danger)}

/* Pastki tugma */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(238,243,251,0),var(--bg) 30%)}
.btn{width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font-family:inherit;
  font-size:17px;font-weight:700;padding:16px;cursor:pointer}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:10px}

/* Til va boshlash */
.center{text-align:center;padding-top:40px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--blue);color:#fff;font-size:30px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.langs{display:flex;flex-direction:column;gap:11px;margin-top:26px}
.msg{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.6}
.done-ic{width:72px;height:72px;border-radius:50%;background:rgba(46,158,91,.14);color:var(--ok);font-size:36px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
</style>
</head>
<body>

<div class="top hide" id="top">
  <div class="top-row">
    <button class="bk" id="bBack" aria-label="Orqaga">&#10094;</button>
    <div class="prog"><i id="pg"></i></div>
    <div class="stp" id="stp"></div>
  </div>
</div>
<div class="wrap" id="main"><div class="msg">…</div></div>
<div class="bar hide" id="bar">
  <button class="btn" id="bNext"></button>
  <button class="btn ghost hide" id="bSkip"></button>
</div>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
// Kunduz/tun — Telegram sozlamasidan; sarlavha va fon rangi ham moslanadi
// (miniapp.html bilan bir xil qoida — 2026-10-22 iOS dizayni)
function applyTheme(){
  const dark = !!(TG && TG.colorScheme === 'dark');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = dark ? '#000000' : '#F2F2F7';
  try {
    if (TG && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9')) { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); }
    if (TG && TG.isVersionAtLeast && TG.isVersionAtLeast('7.10') && TG.setBottomBarColor) TG.setBottomBarColor(bg);
  } catch(e){}
}
applyTheme();
if (TG) { TG.ready(); TG.expand(); try { TG.onEvent('themeChanged', applyTheme); } catch(e){} }

const INIT = (TG && TG.initData) || '';
const RID = new URLSearchParams(location.search).get('r') || '';
const I18N = window.THI18N;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
const haptic = k => { try { TG && TG.HapticFeedback && (k === 'ok' ? TG.HapticFeedback.notificationOccurred('success') : TG.HapticFeedback.selectionChanged()); } catch(e){} };

// Til: avval Telegram tili (birinchi ekran ikki tilli), keyin nomzod tanlagani
let LANG = (() => { const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user; return I18N.fromTelegram(u && u.language_code); })();
const t = (k, v) => I18N.t(LANG, k, v);
const L = o => (o && (o[LANG] || o.uz)) || '';       // savol matni { uz, ru }

async function api(path, opt){
  let r;
  try {
    r = await fetch('/api/anketa/' + encodeURIComponent(RID) + path, Object.assign({
      headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': INIT }
    }, opt));
  } catch(e){ const er = new Error('net'); er.code = 'net'; throw er; }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const er = new Error(d.code || 'net'); er.code = d.code || 'net'; er.q = d.q; throw er; }
  return d;
}
const errText = code => {
  const k = 'ank.err.' + code;
  return I18N.D.uz[k] ? t(k) : (code === 'auth' ? t('auth.expired') : t('ank.err.net'));
};

let S = null;          // serverdagi holat
let Q = [];            // ko'rinadigan savollar
let idx = -1;          // joriy savol (-1 — kirish ekrani)
let draft = {};        // shu savoldagi tanlov (saqlanmagan)

// ══ Boshlash ══
(async function(){
  if (!INIT || !RID) { $('main').innerHTML = `<div class="msg">${esc(t('boot.needTg'))}</div>`; return; }
  try { S = await api(''); }
  catch(e){ $('main').innerHTML = `<div class="msg">${esc(errText(e.code))}</div>`; return; }
  Q = S.questions || [];
  if (S.status === 'done') { renderDone(null, true); return; }
  if (S.lang) { LANG = S.lang; renderIntro(); }
  else renderLang();
})();

// Til tanlash — har tugma o'z tilida
function renderLang(){
  hideNav();
  $('main').innerHTML = `<div class="center">
    <div class="logo">T</div>
    <div class="q" style="font-size:19px">Tilni tanlang<br>Выберите язык</div>
    <div class="langs">
      <button class="opt" data-l="uz"><i></i>O'zbekcha</button>
      <button class="opt" data-l="ru"><i></i>Русский</button>
    </div></div>`;
  $('main').querySelectorAll('[data-l]').forEach(b => b.onclick = async () => {
    LANG = b.dataset.l; haptic();
    b.classList.add('on');
    api('/lang', { method:'POST', body: JSON.stringify({ lang: LANG }) }).catch(() => {});
    renderIntro();
  });
}

function renderIntro(){
  document.documentElement.lang = LANG;
  hideNav();
  const v = S.vacancy;
  $('main').innerHTML = `<div class="center">
    <div class="logo">T</div>
    ${v ? `<div class="vac">${esc(t('ank.forVacancy', { v: L(v.title) }))}${L(v.salary) ? ' · ' + esc(L(v.salary)) : ''}</div>` : ''}
    <div class="q">${esc(t('ank.introH'))}</div>
    <div class="hint" style="margin-top:12px">${esc(t('ank.introP'))}</div></div>`;
  showBar(t('ank.start'), true, () => { idx = resumeIndex(); renderQ(); });
}

// ── Shartli savollar ──
// Savol faqat oldingi tanlov savolining javobi showIf.in ichida bo'lsa
// ko'rsatiladi; yashirin savol javobi keyingi shartlarga hisoblanmaydi.
// Lavozim ma'lum bo'lsa (vakansiya) — shart shu lavozim bo'yicha.
// Server ham AYNAN shu qoida (survey.shownQuestions) — majburiylikni tekshiradi.
function shownList(){
  const eff = S.presetRole ? { role: S.presetRole } : {};
  return Q.filter(q => {
    const s = q.showIf;
    if (s && s.q && !(s.in || []).includes(eff[s.q])) return false;
    const v = q.type === 'contact' ? S.answers.phone : S.answers[q.id];
    if (!(q.id === 'role' && S.presetRole) && v != null && v !== '') eff[q.id] = v;
    return true;
  });
}
// d yo'nalishida keyingi ko'rinadigan savol (yo'q bo'lsa -1)
function nextShown(from, d){
  const vis = shownList();
  for (let i = from + d; i >= 0 && i < Q.length; i += d) if (vis.includes(Q[i])) return i;
  return -1;
}

// Qaytib kelganda — oxirgi javobdan keyingi savol
function resumeIndex(){
  const first = nextShown(-1, 1);
  if (!S.step) return first;
  const i = Q.findIndex(q => q.id === S.step);
  if (i < 0) return first;
  const n = nextShown(i, 1);
  return n < 0 ? Q.length - 1 : n;
}

// ══ Savol ekrani ══
function renderQ(){
  const q = Q[idx];
  draft = { value: valueOf(q) };
  $('top').classList.remove('hide');
  // Progress — faqat ko'rinadigan savollar bo'yicha (lavozim tanlangach soni o'zgaradi)
  const vis = shownList(), pos = Math.max(0, vis.indexOf(q));
  $('pg').style.width = Math.round((pos / vis.length) * 100) + '%';
  $('stp').textContent = t('ank.step', { a: pos + 1, b: vis.length });
  $('bBack').disabled = nextShown(idx, -1) < 0;
  try { if (TG && TG.BackButton) TG.BackButton.show(); } catch(e){}
  window.scrollTo(0, 0);

  const head = `${S.vacancy && idx === 0 ? `<div class="vac">${esc(L(S.vacancy.title))}</div>` : ''}
    ${q.sec ? `<div class="secl">${esc(t('ank.sec.' + q.sec))}</div>` : ''}
    <div class="q">${esc(L(q.text))}</div>
    ${q.type !== 'consent' && L(q.hint) ? `<div class="hint">${esc(L(q.hint))}</div>` : ''}`;
  let body = '';
  if (q.type === 'choice') {
    const grid = q.options.length > 6;            // tumanlar — ikki ustun
    body = `<div class="opts ${grid ? 'grid' : ''}">${q.options.map(o =>
      `<button class="opt ${draft.value === o.key ? 'on' : ''}" data-k="${esc(o.key)}"><i></i>${esc(L(o))}</button>`).join('')}</div>`;
  } else if (q.type === 'text') {
    body = `<input class="in" id="fIn" value="${esc(draft.value || '')}" autocomplete="name" maxlength="80">`;
  } else if (q.type === 'longtext') {
    body = `<textarea class="in" id="fIn" maxlength="600">${esc(draft.value || '')}</textarea>`;
  } else if (q.type === 'date') {
    const max = isoYearsAgo(14), min = isoYearsAgo(70);
    body = `<input class="in" id="fIn" type="date" min="${min}" max="${max}" value="${esc(draft.value || '')}">`;
  } else if (q.type === 'contact') {
    body = contactHtml();
  } else if (q.type === 'photo') {
    body = `<div class="ph" id="fPh">${S.hasPhoto && S._photoUrl ? `<img src="${S._photoUrl}" alt="">` : '&#128100;'}</div>
      <input type="file" id="fFile" accept="image/*" class="hide">
      <button class="share" id="bPick" style="margin-top:16px">${esc(S.hasPhoto ? t('ank.photoChange') : t('ank.photoBtn'))}</button>`;
  } else if (q.type === 'consent') {
    body = `<div class="cons">${esc(L(q.hint))}</div>
      <label class="chk"><input type="checkbox" id="fChk" ${draft.value === true ? 'checked' : ''}>${esc(t('ank.consentChk'))}</label>`;
  } else if (q.type === 'work') {
    body = `<div id="wk"></div>`;
  }
  $('main').innerHTML = `<div class="card">${head}${body}<div class="err" id="err"></div></div>`;
  wireQ(q);
}

function valueOf(q){
  if (q.type === 'contact') return S.phoneVerified ? '' : (S.answers.phone || '');
  if (q.type === 'photo') return S.hasPhoto ? 'have' : '';
  if (q.type === 'work') {
    // Nusxa: tahrir saqlanmaguncha S.answers'ga tegmaydi. Eski shakldagi javob — bo'sh forma
    const v = S.answers[q.id];
    if (v === 'none') return 'none';
    return Array.isArray(v) ? v.filter(w => w && w.dur).map(w => Object.assign(newJob(), w)) : [];
  }
  return S.answers[q.id] != null ? S.answers[q.id] : '';
}
function isoYearsAgo(n){ const d = new Date(); d.setFullYear(d.getFullYear() - n); return d.toISOString().slice(0, 10); }

function wireQ(q){
  const last = idx === Q.length - 1;
  const nextTxt = last ? t('ank.submit') : t('ank.next');
  if (q.type === 'choice') {
    $('main').querySelectorAll('.opt').forEach(b => b.onclick = () => {
      $('main').querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b));
      draft.value = b.dataset.k; haptic();
      // Tanlov — darhol keyingisiga (ortiqcha bosish yo'q)
      setTimeout(() => save(q), 160);
    });
    showBar(nextTxt, !!draft.value, () => save(q));
  } else if (q.type === 'text' || q.type === 'longtext' || q.type === 'date') {
    const inp = $('fIn');
    const sync = () => { draft.value = inp.value; $('bNext').disabled = q.required && !inp.value.trim(); };
    inp.oninput = sync; inp.onchange = sync;
    if (q.type === 'text') inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (!$('bNext').disabled) save(q); } };
    showBar(nextTxt, !q.required || !!String(draft.value).trim(), () => save(q));
    if (q.type !== 'date') setTimeout(() => inp.focus(), 250);
  } else if (q.type === 'contact') {
    wireContact(q, nextTxt);
  } else if (q.type === 'photo') {
    $('bPick').onclick = () => $('fFile').click();
    $('fFile').onchange = () => pickPhoto(q);
    showBar(nextTxt, S.hasPhoto, () => save(q));
  } else if (q.type === 'consent') {
    $('fChk').onchange = () => { draft.value = $('fChk').checked; $('bNext').disabled = !draft.value; };
    showBar(nextTxt, draft.value === true, () => save(q));
  } else if (q.type === 'work') {
    showBar(nextTxt, false, () => save(q));
    drawWork();
  }
  // Ixtiyoriy savol — o'tkazib yuborish
  if (!q.required && q.type !== 'consent') {
    $('bSkip').textContent = t('ank.skip');
    $('bSkip').classList.remove('hide');
    $('bSkip').onclick = () => go(1);
  } else $('bSkip').classList.add('hide');
}

// ── Ish tajribasi ──
// Rezyume kartalari (C variant, Anas 2026-10-23): har ish joyi — karta
// (lavozim, joy, muddat). Qo'shish va tahrir pastdan oynada, uch qisqa
// bosqich: joy nomi -> lavozim -> muddat; birinchisidan keyin faqat bosiladi.
// "Hali tajribam yo'q" — havola (javob 'none'). Server (survey.checkAnswer
// 'work') shu qoidani qayta tekshiradi; javob nomzodning workHistory'siga.
const MAX_JOBS = 3;
const ROLE_EMOJI = { ofitsiant: '🍽', xostess: '💁', oshpaz: '👨‍🍳', barmen: '🍸', kassir: '🧾', menejer: '📋', operator: '📞', boshqa: '✏️' };
function newJob(){ return { place: '', role: '', other: '', dur: '' }; }
const roleLabel = w => w.role === 'boshqa' ? (w.other || t('ank.w.otherRow')) : t('role.' + w.role);
const nextLabel = () => idx === Q.length - 1 ? t('ank.submit') : t('ank.next');

function drawWork(){
  const v = draft.value, q = Q[idx];
  const bar = (txt, fn) => { showBar(txt, true, fn); };
  if (v === 'none') {
    $('wk').innerHTML = `<div class="w-empty">
      <div class="w-ic ok">&#10003;</div>
      <div class="w-et">${esc(t('ank.w.noneSet'))}</div>
      <button class="lnk" id="wUndo">${esc(t('ank.w.addFirst'))}</button></div>`;
    $('wUndo').onclick = () => { draft.value = []; drawWork(); openEditor(-1); };
    bar(nextLabel(), () => save(q));
    return;
  }
  if (!v.length) {
    $('wk').innerHTML = `<div class="w-empty">
      <div class="w-ic">&#128188;</div>
      <div class="w-et">${esc(t('ank.w.emptyT'))}</div>
      <button class="lnk" id="wNone">${esc(t('ank.w.noneLink'))}</button></div>`;
    $('wNone').onclick = () => { draft.value = 'none'; haptic(); drawWork(); setTimeout(() => save(q), 200); };
    bar(t('ank.w.addFirst'), () => openEditor(-1));
    return;
  }
  $('wk').innerHTML = `<div class="w-hint">${esc(t('ank.w.cardsHint'))}</div>` +
    v.map((w, i) => `<button class="w-card" data-we="${i}">
      <span class="w-av a${i % 3}">${esc((w.place.trim()[0] || '?').toUpperCase())}</span>
      <span class="w-tx"><b>${esc(roleLabel(w))}</b><small>${esc(w.place)}</small></span>
      <span class="w-pill">${esc(t('ank.w.dur.' + w.dur))}</span></button>`).join('') +
    (v.length < MAX_JOBS ? `<button class="w-add" id="wAdd">+ ${esc(t('ank.w.add'))}</button>` : '');
  $('wk').querySelectorAll('[data-we]').forEach(b => b.onclick = () => openEditor(+b.dataset.we));
  if ($('wAdd')) $('wAdd').onclick = () => openEditor(-1);
  bar(nextLabel(), () => save(q));
}

// ── Qo'shish / tahrir oynasi ──
// Telegram "orqaga" — oldingi bosqich, birinchisida oyna yopiladi (closeSheet).
let closeSheet = null;
function openEditor(i){
  if (document.activeElement) document.activeElement.blur();
  const list = draft.value;
  const ed = { i, w: i >= 0 ? Object.assign(newJob(), list[i]) : newJob(), step: 'place' };
  const ov = document.createElement('div');
  ov.className = 'sh-ov';
  ov.innerHTML = '<div class="sh" role="dialog"></div>';
  document.body.appendChild(ov);
  const sh = ov.querySelector('.sh');
  requestAnimationFrame(() => ov.classList.add('on'));

  // Matn bosqichlarida oyna butun ekran (.full): maydon tepada, klaviatura
  // uni yopmaydi. Ilgari pastki oynani klaviatura balandligiga ko'tarardik —
  // iOS Telegram o'zi ham surgani uchun oyna tepaga chiqib ketardi (2026-10-23).
  const close = () => {
    closeSheet = null;
    if (document.activeElement) document.activeElement.blur();
    ov.classList.remove('on'); setTimeout(() => ov.remove(), 220);
  };
  const order = ['place', 'role', 'other', 'dur'];
  const back = () => {
    if (ed.step === 'place') return close();
    ed.step = ed.step === 'dur' && ed.w.role !== 'boshqa' ? 'role' : order[order.indexOf(ed.step) - 1];
    draw();
  };
  closeSheet = back;
  ov.onclick = e => { if (e.target === ov) close(); };
  const commit = () => {
    if (ed.i >= 0) list[ed.i] = ed.w; else list.push(ed.w);
    haptic('ok'); close(); drawWork();
  };

  function draw(){
    const w = ed.w, s = ed.step;
    const seg = s === 'place' ? 1 : s === 'dur' ? 3 : 2;
    const head = `<div class="sh-grab"></div>
      <div class="sh-top">${s !== 'place' ? `<button class="sh-bk" aria-label="${esc(t('ank.w.back'))}">&#10094;</button>` : '<span></span>'}
        <div class="sh-stp">${[1, 2, 3].map(n => `<i class="${n <= seg ? 'on' : ''}"></i>`).join('')}</div>
        <button class="sh-x" aria-label="${esc(t('ank.w.cancel'))}">&#10005;</button></div>`;
    let body = '';
    if (s === 'place' || s === 'other') {
      const isP = s === 'place';
      body = `<div class="sh-q">${esc(t(isP ? 'ank.w.qPlace' : 'ank.w.qOther'))}</div>
        ${isP ? `<div class="sh-h">${esc(t('ank.w.placeHint'))}</div>` : ''}
        <input class="in sh-in" id="shIn" maxlength="${isP ? 80 : 60}" value="${esc(isP ? w.place : w.other)}" placeholder="${esc(t(isP ? 'ank.w.placePh' : 'ank.w.otherPh'))}">
        <button class="btn" id="shGo" style="margin-top:14px">${esc(t('ank.w.cont'))}</button>
        ${isP && ed.i >= 0 ? `<button class="lnk sh-del" id="shDel">${esc(t('ank.w.delete'))}</button>` : ''}`;
    } else {
      const isR = s === 'role';
      const opts = isR ? I18N.WORK_ROLES.map(r => [r, (ROLE_EMOJI[r] || '') + ' ' + (r === 'boshqa' ? t('ank.w.otherRow') : t('role.' + r))])
                       : I18N.WORK_DURS.map(d => [d, t('ank.w.dur.' + d)]);
      const cur = isR ? w.role : w.dur;
      body = `<div class="sh-q">${esc(t(isR ? 'ank.w.qRole' : 'ank.w.dur'))}</div>
        <div class="sh-h">${esc(isR ? w.place : t('ank.w.durHint'))}</div>
        <div class="sh-list ${isR ? 'ic' : ''}">${opts.map(([k, l]) => `<button class="opt ${k === cur ? 'on' : ''}" data-k="${esc(k)}"><i></i>${esc(l)}</button>`).join('')}</div>`;
    }
    sh.classList.toggle('full', s === 'place' || s === 'other');
    sh.innerHTML = head + body;
    sh.querySelector('.sh-x').onclick = close;
    const bk = sh.querySelector('.sh-bk'); if (bk) bk.onclick = back;

    if (s === 'place' || s === 'other') {
      const inp = $('shIn'), go = $('shGo');
      const ok = () => inp.value.trim().length >= 2;
      go.disabled = !ok();
      inp.oninput = () => { go.disabled = !ok(); };
      const next = () => {
        if (!ok()) return;
        if (s === 'place') { w.place = inp.value.trim(); ed.step = 'role'; }
        else { w.other = inp.value.trim(); ed.step = 'dur'; }
        draw();
      };
      go.onclick = next;
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); next(); } };
      setTimeout(() => inp.focus(), 280);
      const del = $('shDel');
      if (del) del.onclick = () => { list.splice(ed.i, 1); close(); drawWork(); };
    } else {
      sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
        sh.querySelectorAll('[data-k]').forEach(x => x.classList.toggle('on', x === b));
        haptic();
        setTimeout(() => {
          if (s === 'role') {
            if (w.role !== b.dataset.k && b.dataset.k !== 'boshqa') w.other = '';
            w.role = b.dataset.k; ed.step = w.role === 'boshqa' ? 'other' : 'dur'; draw();
          } else { w.dur = b.dataset.k; commit(); }
        }, 160);
      });
    }
  }
  draw();
}


// ── Telefon ──
// "Raqamni ulashish" — Telegram kontaktni BOTGA yuboradi, server uni
// tasdiqlangan deb yozadi. Biz bu yerda serverdan holatni so'raymiz.
// Eski Telegram (requestContact yo'q) yoki rad etilsa — qo'lda kiritish.
let manualPhone = false;
function contactHtml(){
  if (S.phoneVerified) return `<div class="ok">${esc(t('ank.phoneOk', { p: S.phone }))}</div>`;
  const canShare = TG && TG.requestContact && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9');
  if (canShare && !manualPhone) {
    return `<button class="share" id="bShare">${esc(t('ank.shareBtn'))}</button>
      <div class="hint hide" id="wait" style="margin-top:12px">${esc(t('ank.waitPhone'))}</div>
      <button class="lnk" id="bManual">${esc(t('ank.manual'))}</button>`;
  }
  return `<input class="in" id="fIn" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" value="${esc(draft.value || '')}">
    <div class="hint">${esc(t('ank.phoneManualNote'))}</div>`;
}
function wireContact(q, nextTxt){
  if (S.phoneVerified) { showBar(nextTxt, true, () => save(q)); return; }
  if ($('bShare')) {
    showBar(nextTxt, false, () => save(q));
    $('bShare').onclick = () => {
      $('wait').classList.remove('hide');
      try {
        TG.requestContact(ok => {
          if (!ok) { $('wait').classList.add('hide'); return; }
          pollPhone(q, nextTxt, 0);
        });
      } catch(e){ manualPhone = true; renderQ(); }
    };
    $('bManual').onclick = () => { manualPhone = true; renderQ(); };
    return;
  }
  const inp = $('fIn');
  inp.oninput = () => { draft.value = inp.value; $('bNext').disabled = inp.value.replace(/\D/g, '').length < 9; };
  showBar(nextTxt, String(draft.value).replace(/\D/g, '').length >= 9, () => save(q));
  setTimeout(() => inp.focus(), 250);
}
// Kontakt bot orqali keladi — server webhook'i yozguncha bir necha soniya
async function pollPhone(q, nextTxt, n){
  try {
    const d = await api('');
    if (d.phoneVerified) {
      S.phoneVerified = true; S.phone = d.phone; haptic('ok');
      renderQ(); return;
    }
  } catch(e){}
  if (n < 12) setTimeout(() => pollPhone(q, nextTxt, n + 1), 1200);
  else { manualPhone = true; renderQ(); }
}

// ── Rasm: 800px gacha, JPEG 80% (loyiha qoidasi) ──
function pickPhoto(q){
  const f = $('fFile').files[0];
  if (!f) return;
  const img = new Image();
  img.onload = async () => {
    const k = Math.min(1, 800 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.8);
    URL.revokeObjectURL(img.src);
    $('fPh').innerHTML = `<img src="${data}" alt="">`;
    $('bPick').disabled = true;
    try {
      await api('/answer', { method:'POST', body: JSON.stringify({ q: q.id, value: data }) });
      S.hasPhoto = true; S._photoUrl = data; draft.value = 'have';
      $('bPick').textContent = t('ank.photoChange'); $('bNext').disabled = false; haptic('ok');
    } catch(e){ $('err').textContent = errText(e.code); }
    $('bPick').disabled = false;
  };
  img.onerror = () => { $('err').textContent = t('ank.err.photo'); };
  img.src = URL.createObjectURL(f);
}

// ── Saqlash va keyingisi ──
// Bitta saqlash: variant bosilgach 160 ms da avtomatik saqlanadi — shu
// orada "Keyingisi" ham bosilsa ikkinchi save keyingi savolning qiymatini
// OLDINGI savolga yozib, bir savolni sakrab o'tardi (2026-10-20 sinovda topildi)
let saving = false;
async function save(q){
  if (saving || Q[idx] !== q) return;
  const b = $('bNext');
  if (b.disabled && q.type !== 'choice') return;
  saving = true;
  try { await saveNow(q, b); } finally { saving = false; }
}
async function saveNow(q, b){
  $('err').textContent = '';
  let value = draft.value;
  if (q.type === 'photo') value = undefined;                    // rasm tanlanganda saqlangan
  if (q.type === 'contact' && S.phoneVerified) value = '';
  if (q.type === 'work' && value !== 'none') value = value.map(w => ({ place: w.place.trim(), role: w.role,
    other: w.role === 'boshqa' ? w.other.trim() : '', dur: w.dur }));
  b.disabled = true;
  try {
    if (value !== undefined) {
      await api('/answer', { method:'POST', body: JSON.stringify({ q: q.id, value }) });
      if (q.type === 'contact') S.answers.phone = value;
      else if (q.type !== 'photo') S.answers[q.id] = value;
    }
    S.step = q.id;
    if (idx === Q.length - 1) return await submit();
    go(1);
  } catch(e){
    $('err').textContent = errText(e.code);
    b.disabled = false;
  }
}

// Keyingi/oldingi KO'RINADIGAN savolga (masalan "Tajribam yo'q" — "Oxirgi
// ish joyi" so'ralmaydi; oshpazga xostess savoli chiqmaydi)
function go(d){
  const i = nextShown(idx, d);
  if (i < 0) return;
  idx = i;
  renderQ();
}
$('bBack').onclick = () => go(-1);
try { TG && TG.BackButton && TG.BackButton.onClick(() => {
  if (closeSheet) { closeSheet(); return; }                       // avval tanlov oynasi yopiladi
  if (idx < 0) return;
  if (nextShown(idx, -1) >= 0) go(-1); else renderIntro();
}); } catch(e){}

async function submit(){
  const b = $('bNext');
  b.disabled = true; b.textContent = t('ank.sending');
  try {
    const r = await api('/submit', { method:'POST', body: '{}' });
    haptic('ok');
    renderDone(r);
  } catch(e){
    // Majburiy savol qolib ketgan bo'lsa — o'shanga qaytamiz
    if (e.code === 'required' && e.q) {
      const i = Q.findIndex(q => q.id === e.q);
      if (i >= 0) { idx = i; renderQ(); $('err').textContent = errText('required'); return; }
    }
    $('err').textContent = errText(e.code);
    b.disabled = false; b.textContent = t('ank.submit');
  }
}

// Yuborilgach nomzod bo'sh "Rahmat" ekranida qolmaydi: 2 soniyada o'zi
// kabinetga o'tadi — ariza bergan bo'lsa "Arizalarim"ga, aks holda
// "Ish o'rinlari"ga (mos ishlar tepada). Ilgari yagona tugma "Yopish" edi
// va profilni nomzod o'zi topishi kerak edi. Telegram imzosi sahifalar
// orasida saqlanadi (telegram-web-app.js sessionStorage).
function renderDone(r, already){
  hideNav();
  const next = (r && r.next) || 'jobs';
  const n = r && r.matches, all = r && r.jobs;
  const go = () => { location.replace('/profil.html#' + next); };
  $('main').innerHTML = `<div class="center">
    <div class="done-ic">&#10003;</div>
    <div class="q">${esc(already ? t('ank.already') : t('ank.doneH'))}</div>
    ${r && r.applied && r.vacancyTitle ? `<div class="ok" style="margin-top:18px">${esc(t('ank.doneApplied', { v: r.vacancyTitle }))}</div>` : ''}
    ${n ? `<div class="ok" style="margin-top:14px">${esc(t('ank.matches', { n }))}</div>`
        : all ? `<div class="hint" style="margin-top:12px">${esc(t('ank.jobsAll', { n: all }))}</div>` : ''}
    <div class="hint" style="margin-top:16px">${esc(t('ank.going'))}</div>
  </div>`;
  showBar(next === 'apps' ? t('ank.goApps') : t('ank.goJobs'), true, go);
  setTimeout(go, already ? 700 : 2200);
}

function showBar(txt, enabled, fn){
  $('bar').classList.remove('hide');
  const b = $('bNext');
  b.textContent = txt; b.disabled = !enabled; b.onclick = fn;
  $('bSkip').classList.add('hide');
}
function hideNav(){
  $('top').classList.add('hide');
  try { if (TG && TG.BackButton) TG.BackButton.hide(); } catch(e){}
}
</script>
