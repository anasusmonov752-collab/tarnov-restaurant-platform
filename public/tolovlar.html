<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentHub — To'lovlar</title>
<!-- TalentHub dizayn tizimi va umumiy menyu (th-shell) -->
<link rel="icon" href="/img/talenthub-mark.svg" type="image/svg+xml">
<script src="/js/uz-date.js"></script>
<link rel="stylesheet" href="/css/th.css?v=2">
<link rel="stylesheet" href="/css/th-app.css?v=2">
<script src="/js/th-shell.js?v=4" defer></script>
<style>
/* Tarif buyurtmalari (routes/billing): qo'lda tasdiqlash, Payme/Click holati */
:root{ --bg:#EEF3FB; --ink:#16233A; --gold:#2563EB; --card:#FFFFFF; --line:#E1E8F2; --muted:#64748B; --danger:#C25B4C; --ok:#2E9E5B; --warn:#B4802E; --soft:#F3F7FD; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit}
.topbar{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px}
.tb-title{font-size:16.5px;font-weight:700;line-height:1}
.tb-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}
.main{flex:1;overflow-y:auto;padding:20px 24px 40px}
.wrap{max-width:900px;margin:0 auto}
.mx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.mx div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.mx small{display:block;font-size:12.5px;color:var(--muted)}
.mx b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.mx b.wr{color:var(--warn)}
.prov{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.55}
.prov b{font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:7px;margin-left:6px}
.pill.on{background:rgba(46,158,91,.12);color:#1E7A46}
.pill.off{background:#F1F5FA;color:var(--muted)}
.prov code{font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:5px}
.seg{display:flex;background:var(--th-fill,#E9EEF5);border-radius:10px;padding:2px;gap:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:500}
.seg button .n{color:var(--muted);margin-left:4px;font-weight:400}
.seg button.on{background:var(--th-surface,#fff);box-shadow:0 3px 8px rgba(0,0,0,.12);font-weight:600}
.od{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.od.pend{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.od-h{display:flex;gap:12px;align-items:flex-start}
.nm{font-size:15.5px;font-weight:600}
.sb{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.sum{margin-left:auto;text-align:right;white-space:nowrap}
.sum b{font-size:17px;font-variant-numeric:tabular-nums}
.sum small{display:block;font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;background:#F1F5FA;color:var(--muted)}
.tag.wt{background:rgba(217,142,43,.14);color:#9A5B0C}
.tag.ok{background:rgba(46,158,91,.12);color:#1E7A46}
.tag.no{background:rgba(194,91,76,.12);color:var(--danger)}
.tag.ts{background:#FFF4D6;color:#8A5A00}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn-p{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-p:hover{background:#24804A}
.btn-no{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;background:#16233A;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;display:none}
@media(max-width:760px){ .mx{grid-template-columns:1fr 1fr} .main{padding:14px} }
</style>
</head>
<body>

<div class="topbar">
  <div><div class="tb-title">To'lovlar</div><div class="tb-sub">Tarif buyurtmalari</div></div>
</div>

<div class="main"><div class="wrap">
  <div class="mx" id="mx"></div>
  <div class="prov" id="prov"></div>
  <div class="seg" id="seg"></div>
  <div id="list"><div class="empty">Yuklanmoqda…</div></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="/js/utils.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const toastMsg = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2400); };
const sum = n => Number(n || 0).toLocaleString('ru-RU');
const PLAN = { base: 'Base', pro: 'Pro', max: 'Max', trial: 'Sinov' };
const PROV = { payme: 'Payme', click: 'Click', uzum: 'Uzum Bank', manual: 'Menejer orqali', invoice: 'Hisob-faktura' };
const BY = { payme: 'Payme', click: 'Click', uzum: 'Uzum Bank', admin: 'qo\'lda tasdiqlandi' };
const offline = o => o.provider === 'manual' || o.provider === 'invoice';
const TABS = [['pending', 'Kutilmoqda'], ['paid', 'To\'langan'], ['canceled', 'Bekor'], ['refunded', 'Qaytarilgan'], ['all', 'Hammasi']];
let DATA = { orders: [], providers: [] }, TAB = 'pending', ASK = '';   // ASK — tasdiqlash kutilayotgan buyurtma (ikki bosqich)

function when(d){ const x = new Date(d); return x.toLocaleDateString('uz') + ' ' + x.toLocaleTimeString('uz', { hour: '2-digit', minute: '2-digit' }); }

async function load(){
  try { DATA = await api('/api/billing/orders'); }
  catch(e){ $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  render();
}

function render(){
  const os = DATA.orders || [];
  const real = os.filter(o => !(o.client && o.client.isTest));
  const month = new Date(); month.setDate(1); month.setHours(0, 0, 0, 0);
  const paidM = real.filter(o => o.status === 'paid' && new Date(o.paidAt) >= month);
  $('mx').innerHTML = `
    <div><small>Tasdiq kutmoqda</small><b class="${os.some(o => o.status === 'pending' && offline(o)) ? 'wr' : ''}">${os.filter(o => o.status === 'pending' && offline(o)).length}</b></div>
    <div><small>Shu oy to'langan</small><b>${paidM.length}</b></div>
    <div><small>Shu oy tushum, so'm</small><b>${sum(paidM.reduce((s, o) => s + o.amount, 0))}</b></div>`;

  const pv = DATA.providers || [];
  const base = location.origin;
  $('prov').innerHTML = `<b>To'lov tizimlari:</b>
    Payme <span class="pill ${pv.includes('payme') ? 'on' : 'off'}">${pv.includes('payme') ? 'ulangan' : 'ulanmagan'}</span>
    · Click <span class="pill ${pv.includes('click') ? 'on' : 'off'}">${pv.includes('click') ? 'ulangan' : 'ulanmagan'}</span>
    · Uzum <span class="pill ${pv.includes('uzum') ? 'on' : 'off'}">${pv.includes('uzum') ? 'ulangan' : 'ulanmagan'}</span>
    · Avto-yangilash <span class="pill ${DATA.subscribe ? 'on' : 'off'}">${DATA.subscribe ? 'ulangan' : 'ulanmagan'}</span>
    ${pv.length < 3 ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--muted)">Qanday ulanadi</summary>
      <div style="color:var(--muted);line-height:1.6;margin-top:6px">Ulanmagan tizim o'rniga mijoz "Menejer orqali" yoki "Hisob-faktura" so'rovini yuboradi — shu yerda yoki botdagi tugma bilan tasdiqlaysiz.<br>
      <b>Payme</b> (business.payme.uz, kassa → "order_id" hisob maydoni, bir martalik): Render'ga <code>PAYME_MERCHANT_ID</code>, <code>PAYME_KEY</code>
      (sinovda TEST_KEY va <code>PAYME_TEST=1</code>); endpoint <code>${esc(base)}/api/pay/payme</code>. Fiskal chek: <code>PAYME_IKPU</code>, <code>PAYME_PACKAGE_CODE</code> (soliq.uz MXIK), <code>PAYME_VAT</code>.
      Avto-yangilash: kassada Subscribe ruxsati + <code>PAYME_SUBSCRIBE=1</code>.<br>
      <b>Click</b> (merchant.click.uz): <code>CLICK_SERVICE_ID</code>, <code>CLICK_MERCHANT_ID</code>, <code>CLICK_SECRET_KEY</code>;
      Prepare <code>${esc(base)}/api/pay/click/prepare</code>, Complete <code>${esc(base)}/api/pay/click/complete</code>.<br>
      <b>Uzum Bank</b> (merchants.uzumbank.uz, Merchant API): <code>UZUM_SERVICE_ID</code>, <code>UZUM_LOGIN</code>, <code>UZUM_PASSWORD</code>;
      vebhuk asosi <code>${esc(base)}/api/pay/uzum</code> (/check, /create, /confirm, /reverse, /status), to'lov maydoni — <code>order_id</code>.</div></details>` : ''}`;

  const count = k => k === 'all' ? os.length : os.filter(o => o.status === k).length;
  $('seg').innerHTML = TABS.map(([k, l]) => `<button class="${TAB === k ? 'on' : ''}" data-t="${k}">${l}<span class="n">${count(k)}</span></button>`).join('');
  $('seg').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { TAB = b.dataset.t; ASK = ''; render(); });

  const rows = os.filter(o => TAB === 'all' || o.status === TAB);
  if (!rows.length) { $('list').innerHTML = `<div class="empty">${TAB === 'pending' ? 'Tasdiq kutayotgan buyurtma yo\'q' : 'Buyurtma yo\'q'}</div>`; return; }
  $('list').innerHTML = rows.map(o => {
    const c = o.client || {};
    const st = o.status === 'paid' ? `<span class="tag ok">To'landi · ${esc(BY[o.paidBy] || o.paidBy)}</span>`
      : o.status === 'canceled' ? '<span class="tag no">Bekor qilingan</span>'
      : o.status === 'refunded' ? '<span class="tag no">Qaytarilgan</span>' : '<span class="tag wt">To\'lov kutilmoqda</span>';
    const inv = o.provider === 'invoice' ? `<div class="sb" style="margin-top:6px">📄 ${esc(o.invoiceCompany)} · STIR ${esc(o.invoiceInn)}</div>` : '';
    const now = c.plan && c.plan.key ? `<span class="tag">Hozir: ${esc(PLAN[c.plan.key] || c.plan.key)} · ${c.plan.daysLeft} kun</span>` : '';
    return `<div class="od ${o.status === 'pending' ? 'pend' : ''}">
      <div class="od-h">
        <div><div class="nm">${esc(c.name || '—')}</div>
          <div class="sb">${o.code ? '№' + esc(o.code) + ' · ' : ''}${esc(PLAN[o.planKey] || o.planKey)} · ${esc(PROV[o.provider] || o.provider)}${o.auto ? ' · avto' : ''} · ${esc(when(o.createdAt))}</div>${inv}</div>
        <div class="sum"><b>${sum(o.amount)}</b><small>so'm</small></div>
      </div>
      <div class="tags">${st}${now}<span class="tag">Balans: ${c.credits == null ? '—' : c.credits} kredit</span>${c.isTest ? '<span class="tag ts">🧪 SINOV</span>' : ''}</div>
      ${o.status === 'pending' ? `<div class="acts">
        ${ASK === o.id
          ? `<span style="font-size:13px">Pul olinganini tasdiqlaysizmi? Tarif darhol yoqiladi.</span>
             <button class="btn btn-p" data-yes="${o.id}">Ha, to'landi</button><button class="btn" data-no="1">Yo'q</button>`
          : `<button class="btn btn-p" data-paid="${o.id}">To'landi — tarifni yoqish</button>
             <button class="btn btn-no" data-cancel="${o.id}">Bekor qilish</button>`}
      </div>` : ''}
    </div>`;
  }).join('');
  $('list').querySelectorAll('[data-paid]').forEach(b => b.onclick = () => { ASK = b.dataset.paid; render(); });
  $('list').querySelectorAll('[data-no]').forEach(b => b.onclick = () => { ASK = ''; render(); });
  $('list').querySelectorAll('[data-yes]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api('/api/billing/orders/' + b.dataset.yes + '/paid', { method: 'POST' });
      toastMsg(r.already ? 'Allaqachon yoqilgan' : 'Tarif yoqildi — balans ' + r.balance); ASK = ''; load(); window.thShell && thShell.refreshCounts(); }
    catch(e){ toastMsg(e.message); b.disabled = false; }
  });
  $('list').querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api('/api/billing/orders/' + b.dataset.cancel + '/cancel', { method: 'POST' }); toastMsg('Bekor qilindi'); load(); window.thShell && thShell.refreshCounts(); }
    catch(e){ toastMsg(e.message); b.disabled = false; }
  });
}

load();
</script>
</body>
</html>
