<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentHub — Mijozlar va tanlovlar</title>
<!-- TalentHub dizayn tizimi va umumiy menyu (th-shell) -->
<link rel="icon" href="/img/talenthub-mark.svg" type="image/svg+xml">
<script src="/js/uz-date.js"></script>
<link rel="stylesheet" href="/css/th.css">
<link rel="stylesheet" href="/css/th-app.css">
<script src="/js/th-shell.js" defer></script>
<script src="/js/th-viewer.js" defer></script>
<style>
:root{
  --bg:#EEF3FB; --ink:#16233A; --green:#0F2747; --green2:#0A1B33;
  --gold:#2563EB; --gold-d:#1D4ED8; --card:#FFFFFF; --line:#E1E8F2;
  --muted:#64748B; --danger:#C25B4C; --ok:#2E9E5B; --warn:#B4802E;
  --shadow:0 1px 3px rgba(16,32,24,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(15,39,71,.22);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font-family:inherit}

/* Oq sarlavha — Mini App bilan bir tilda. Oldin to'q ko'k gradient edi:
   u sahifaning oq tanasidan uzilib turardi va e'tiborni kontentdan
   tortib olardi. Ko'k endi faqat belgi va faol tabda. */
.topbar{flex:none;background:var(--card);border-bottom:1px solid var(--line);color:var(--ink);padding:12px 20px;display:flex;align-items:center;gap:14px;z-index:40}
.back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none}
.back:hover{background:#F3F7FD;color:var(--ink)}
.tb-mark{width:36px;height:36px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center}
.tb-mark span{font-style:italic;font-weight:700;font-size:20px;color:#fff}
.tb-title{font-size:16.5px;font-weight:700;line-height:1}
.tb-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}
.tb-spacer{flex:1}
.view-sw{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;text-decoration:none}
.view-sw:hover{background:#F3F7FD;color:var(--ink)}
.view-sw.on{background:var(--gold);border-color:var(--gold);color:#fff}

.wrap{flex:1;overflow-y:auto;padding:18px 22px 40px}
.inner{max-width:1180px;margin:0 auto}

.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head h2{font-size:19px;font-weight:800}
.head .sp{flex:1}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700}
.btn:hover{background:#F3F7FD}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-p:hover{background:var(--gold-d)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(.94)}
.btn-no{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn-no:hover{background:#FDF3F1}
.btn-sm{padding:6px 10px;font-size:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:14px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.clk{cursor:pointer}
tr.clk:hover{background:#F6F9FE}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.p-ok{background:rgba(46,158,91,.12);color:var(--ok)}
.p-wait{background:rgba(180,128,46,.14);color:var(--warn)}
.p-off{background:rgba(100,116,139,.14);color:var(--muted)}
.p-no{background:rgba(194,91,76,.12);color:var(--danger)}
.p-cr{background:rgba(37,99,235,.12);color:var(--gold);font-size:13px}

.ov{position:fixed;inset:0;background:rgba(10,24,44,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:200}
.ov.on{display:flex}
.md{background:var(--card);border-radius:14px;width:100%;max-width:620px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.md-top{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:14px 14px 0 0}
.md-top b{font-size:16px;flex:1}
.md-x{border:none;background:transparent;font-size:19px;cursor:pointer;color:var(--muted);line-height:1}
.md-b{padding:18px}

label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink);background:#FBFCFE}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.fld{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.linkbox{background:#F3F7FD;border:1px solid var(--line);border-radius:9px;padding:11px;font-size:12.5px;word-break:break-all;font-family:ui-monospace,monospace;margin-bottom:10px}

.ci{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px}
.ci-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}
.ci-nm{font-weight:700;font-size:14.5px;flex:1}
.ci-meta{font-size:12.5px;color:var(--muted);line-height:1.6}
.ci-act{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.hidden{display:none}

/* Toast — utils.js toast() shu klasslarni qo'yadi. Bu sahifa style.css ni
   ulamaydi (u qorong'i mavzu), shuning uchun uslub shu yerda turishi shart.
   Ilgari CSS yo'q edi va 400/401 xatolari ko'rinmay ketardi. */
#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:380px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:10px;padding:12px 16px;font-size:13.5px;font-weight:500;color:var(--ink);box-shadow:0 8px 24px rgba(16,32,24,.16);pointer-events:auto}
.toast-icon{display:flex;flex:none;color:var(--muted)}
.toast-success{border-left-color:var(--ok)}       .toast-success .toast-icon{color:var(--ok)}
.toast-error{border-left-color:var(--danger)}     .toast-error .toast-icon{color:var(--danger)}
.toast-info{border-left-color:var(--gold)}        .toast-info .toast-icon{color:var(--gold)}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/restaurant-admin.html">&#8592; Panel</a>
  <div class="tb-mark"><span>T</span></div>
  <div>
    <div class="tb-title">Mijozlar va tanlovlar</div>
    <div class="tb-sub">TalentHub</div>
  </div>
  <div class="tb-spacer"></div>
  <span class="view-sw" id="aiChip" title="AI kunlik kvotasi" style="cursor:default">AI …</span>
  <button class="view-sw on" id="tabC">Mijozlar</button>
  <button class="view-sw" id="tabS">Tanlovlar</button>
  <a class="view-sw" href="/recruitment.html">Nomzodlar bazasi</a>
</div>

<div class="wrap"><div class="inner">

  <!-- ── MIJOZLAR ── -->
  <div id="vC">
    <div class="head">
      <h2>Mijozlar</h2>
      <div class="sp"></div>
      <button class="btn btn-p" id="bNew">+ Yangi mijoz</button>
    </div>
    <div id="qual"></div>
    <div class="card" id="cList"><div class="empty">Yuklanmoqda...</div></div>
  </div>

  <!-- ── TANLOVLAR ── -->
  <div id="vS" class="hidden">
    <div class="head"><h2>Tanlovlar</h2></div>
    <div class="card" id="sList"><div class="empty">Yuklanmoqda...</div></div>
  </div>

</div></div>

<div class="ov" id="ov"><div class="md">
  <div class="md-top"><b id="mdT">—</b><button class="md-x" id="mdX">&#10005;</button></div>
  <div class="md-b" id="mdB"></div>
</div></div>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
const $ = id => document.getElementById(id);
let CLIENTS = [], SHORTS = [];

// ── Modal ──
function openMd(title, html){ $('mdT').textContent = title; $('mdB').innerHTML = html; $('ov').classList.add('on'); }
function closeMd(){ $('ov').classList.remove('on'); $('mdB').innerHTML = ''; }
$('mdX').onclick = closeMd;
$('ov').onclick = e => { if (e.target === $('ov')) closeMd(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMd(); });

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const dt = s => s ? new Date(s).toLocaleDateString('uz-UZ', { day:'2-digit', month:'short', year:'numeric' }) : '—';

// ══ MIJOZLAR ══════════════════════════════════════════════
const CST = {
  active:  { cls:'p-ok',   lbl:'Faol' },
  pending: { cls:'p-wait', lbl:'Kutilmoqda' },
  blocked: { cls:'p-no',   lbl:'Bloklangan' }
};

async function loadClients(){
  try { CLIENTS = await api('/api/clients'); } catch(e){ toast(e.message, 'error'); return; }
  if (!CLIENTS.length) {
    $('cList').innerHTML = '<div class="empty">Hali mijoz yo\'q. "+ Yangi mijoz" bilan boshlang.</div>';
    return;
  }
  const rows = CLIENTS.map(c => {
    const st = CST[c.status] || CST.pending;
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:9px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--soft);font-weight:700;color:var(--gold);font-size:14px">${logoHtml(c)}</span><div><b>${esc(c.name)}</b>${c.contactName ? '<div style="font-size:12px;color:var(--muted)">' + esc(c.contactName) + '</div>' : ''}</div></div></td>
      <td>${esc(c.phone) || '—'}</td>
      <td><span class="pill p-cr">${c.credits}</span></td>
      <td><span class="pill ${st.cls}">${st.lbl}</span></td>
      <td><span class="pill ${c.linked ? 'p-ok' : 'p-off'}">${c.linked ? 'Ulangan' : 'Ulanmagan'}</span></td>
      <td>${c.openShortlists || 0}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-sm" data-ed="${c.id}">Tahrirlash</button>
        <button class="btn btn-sm" data-link="${c.id}">Havola</button>
        <button class="btn btn-sm" data-cr="${c.id}">Kredit</button>
      </td>
    </tr>`;
  }).join('');

  $('cList').innerHTML = `<table>
    <thead><tr><th>Mijoz</th><th>Telefon</th><th>Kredit</th><th>Holat</th><th>Telegram</th><th>Ochiq tanlov</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;

  $('cList').querySelectorAll('[data-link]').forEach(b => b.onclick = () => showLink(b.dataset.link));
  $('cList').querySelectorAll('[data-cr]').forEach(b => b.onclick = () => showCredits(b.dataset.cr));
  $('cList').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => showEdit(b.dataset.ed));

  // Lokatsiyasi yo'q mijozlar — qo'ng'iroqda birinchi so'raladigan
  // narsa shu, shuning uchun ko'rinib tursin
  const noLoc = CLIENTS.filter(c => !c.location).length;
  $('qual').insertAdjacentHTML('beforeend', noLoc
    ? `<div class="card" style="border-left:3px solid var(--warn);margin-bottom:14px"><div class="pad"
        style="font-size:13.5px;line-height:1.6">
        <b>${noLoc} ta mijozda manzil ko'rsatilmagan.</b>
        <span style="color:var(--muted)">Nomzodga qo'ng'iroq qilganda birinchi
        "qayerda?" deb so'raydi — "Tahrirlash" dan to'ldiring.</span></div></div>`
    : '');
}

// ── Logotip ──
// Rasm brauzerda 256px gacha kichraytiriladi (server 200 KB gacha qabul
// qiladi). PNG/WebP — shaffoflik saqlanadi; JPEG — 85% sifat.
const logoHtml = c => c.hasLogo
  ? `<img src="/api/clients/${encodeURIComponent(c.id)}/logo?v=${encodeURIComponent(c.logoAt || '')}" alt="" style="width:100%;height:100%;object-fit:cover">`
  : esc(String(c.name || '?').trim().slice(0, 1).toUpperCase());
function shrinkLogo(file){
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return reject(new Error('Faqat PNG, JPEG yoki WebP rasm'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 256 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      let data = file.type === 'image/jpeg' ? cv.toDataURL('image/jpeg', 0.85) : cv.toDataURL('image/png');
      if (data.length > 200000) data = cv.toDataURL('image/jpeg', 0.8);     // juda katta PNG — JPEG'ga
      data.length > 200000 ? reject(new Error('Rasm juda katta')) : resolve(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Rasmni o\'qib bo\'lmadi')); };
    img.src = url;
  });
}

function showEdit(id){
  const c = CLIENTS.find(x => x.id === id);
  openMd('Tahrirlash — ' + c.name, `
    <div class="fld"><label>Logotip</label>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="eLg" style="width:64px;height:64px;border-radius:16px;overflow:hidden;flex:none;display:grid;place-items:center;
          background:var(--soft);font-weight:700;color:var(--gold);font-size:22px">${logoHtml(c)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" id="eLgUp">${c.hasLogo ? 'Almashtirish' : 'Logotip yuklash'}</button>
          ${c.hasLogo ? '<button class="btn btn-sm btn-no" id="eLgDel">O\'chirish</button>' : ''}
        </div>
        <input type="file" id="eLgF" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Nomzod kontakt ochilgach kompaniya kartasida ko'radi. Kvadrat rasm yaxshi chiqadi.</div>
    </div>
    <div class="fld"><label>Restoran nomi</label><input type="text" id="eNm" value="${esc(c.name)}"></div>
    <div class="row2">
      <div class="fld"><label>Menejer ismi</label><input type="text" id="eCn" value="${esc(c.contactName)}"></div>
      <div class="fld"><label>Telefon</label><input type="text" id="ePh" value="${esc(c.phone)}"></div>
    </div>
    <div class="fld"><label>Tuman</label><input type="text" id="eLo" value="${esc(c.location)}" placeholder="Chilonzor"></div>
    <div class="fld"><label>Manzil / mo'ljal</label><input type="text" id="eAd" value="${esc(c.address)}" placeholder="Bunyodkor 12, Mega Planet ro'parasi"></div>
    <div class="fld"><label>Restoran haqida</label><input type="text" id="eAb" value="${esc(c.about)}" placeholder="150 o'rinli, yevropa oshxonasi"></div>
    <button class="btn btn-p" id="eSave" style="width:100%">Saqlash</button>`);

  // Logotip darhol saqlanadi (Saqlash tugmasini kutmaydi)
  const saveLogo = async (logo) => {
    try {
      const r = await api('/api/clients/' + id, { method:'PATCH', body: JSON.stringify({ logo }) });
      Object.assign(c, { hasLogo: r.hasLogo, logoAt: r.logoAt });
      $('eLg').innerHTML = logoHtml(c);
      toast(logo ? 'Logotip saqlandi' : 'Logotip o\'chirildi', 'success');
      loadClients();
      showEdit(id);                                     // tugmalar holati yangilansin
    } catch(e){ toast(e.message, 'error'); }
  };
  $('eLgUp').onclick = () => $('eLgF').click();
  $('eLgF').onchange = async () => {
    const f = $('eLgF').files[0];
    if (!f) return;
    try { saveLogo(await shrinkLogo(f)); } catch(e){ toast(e.message, 'error'); }
  };
  if ($('eLgDel')) $('eLgDel').onclick = () => { if (confirm('Logotip o\'chirilsinmi?')) saveLogo(''); };

  $('eSave').onclick = async () => {
    $('eSave').disabled = true;
    try {
      await api('/api/clients/' + id, { method:'PATCH', body: JSON.stringify({
        name: $('eNm').value.trim(), contactName: $('eCn').value.trim(),
        phone: $('ePh').value.trim(), location: $('eLo').value.trim(),
        address: $('eAd').value.trim(), about: $('eAb').value.trim()
      })});
      toast('Saqlandi', 'success');
      closeMd(); loadClients();
    } catch(e){ toast(e.message, 'error'); $('eSave').disabled = false; }
  };
}

$('bNew').onclick = () => {
  openMd('Yangi mijoz', `
    <div class="fld"><label>Restoran nomi *</label><input type="text" id="fNm" placeholder="Chaykhana Navruz"></div>
    <div class="row2">
      <div class="fld"><label>Menejer ismi</label><input type="text" id="fCn" placeholder="Aziz"></div>
      <div class="fld"><label>Telefon</label><input type="text" id="fPh" placeholder="+998 90 123 45 67"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Tuman *</label><input type="text" id="fLo" placeholder="Chilonzor"></div>
      <div class="fld"><label>Boshlang'ich kredit</label><input type="number" id="fCr" value="5" min="0"></div>
    </div>
    <div class="fld"><label>Manzil / mo'ljal</label><input type="text" id="fAd" placeholder="Bunyodkor ko'chasi 12, Mega Planet ro'parasi"></div>
    <div class="fld"><label>Restoran haqida</label><input type="text" id="fAb" placeholder="150 o'rinli, yevropa oshxonasi"></div>
    <div class="fld"><label>Izoh</label><textarea id="fNo" rows="2"></textarea></div>
    <button class="btn btn-p" id="fSave" style="width:100%">Yaratish</button>`);

  $('fSave').onclick = async () => {
    const name = $('fNm').value.trim();
    if (!name) return toast('Nom kiriting', 'error');
    $('fSave').disabled = true;
    try {
      await api('/api/clients', { method:'POST', body: JSON.stringify({
        name, contactName: $('fCn').value.trim(), phone: $('fPh').value.trim(),
        location: $('fLo').value.trim(), address: $('fAd').value.trim(),
        about: $('fAb').value.trim(),
        note: $('fNo').value.trim(), startCredits: parseInt($('fCr').value, 10) || 0
      })});
      toast('Mijoz yaratildi', 'success');
      closeMd(); loadClients();
    } catch(e){ toast(e.message, 'error'); $('fSave').disabled = false; }
  };
};

async function showLink(id){
  const c = CLIENTS.find(x => x.id === id);
  openMd('Telegram ulanishi', '<div class="empty">Olinmoqda...</div>');
  let r;
  try { r = await api('/api/clients/' + id + '/link'); }
  catch(e){ $('mdB').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }

  // Ulangan mijozni uzish kerak bo'ladi: bitta Telegram hisobi ham mijoz,
  // ham nomzod bo'la olmaydi. Sinovda va rol o'zgarganda shu tugma kerak.
  const unlink = c.linked ? `
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
      <div style="font-size:13.5px;margin-bottom:10px">
        Hozir ulangan${c.tgUsername ? ': <b>@' + esc(c.tgUsername) + '</b>' : ''}.
      </div>
      <button class="btn btn-no" id="bUn" style="width:100%">Ulanishni uzish</button>
      <div style="font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.6">
        Uzilgach mijoz botdan foydalana olmaydi. Qayta ulash uchun yuqoridagi
        havolani yuborasiz.
      </div>
    </div>` : '';

  $('mdB').innerHTML = `
    <div style="font-size:13.5px;line-height:1.7;margin-bottom:12px">
      Bu havolani <b>${esc(c.name)}</b> menejeriga yuboring. U bosgach bot uni taniydi
      va nomzod qidira oladi.
    </div>
    <div class="linkbox" id="lk">${esc(r.link)}</div>
    <button class="btn btn-p" id="bCp" style="width:100%">Nusxa olish</button>
    <div style="font-size:12.5px;color:var(--muted);margin-top:11px;line-height:1.6">
      Havola bir martalik — ishlatilgach kuchini yo'qotadi. Yangisi kerak bo'lsa
      shu tugmani qayta bosing.
    </div>
    ${unlink}`;

  $('bCp').onclick = async () => {
    try { await navigator.clipboard.writeText(r.link); toast('Nusxa olindi', 'success'); }
    catch { toast('Nusxa olinmadi — qo\'lda belgilang', 'error'); }
  };

  if ($('bUn')) $('bUn').onclick = async () => {
    if (!confirm(`${c.name} botdan uziladi. Davom etamizmi?`)) return;
    $('bUn').disabled = true;
    try {
      await api('/api/clients/' + id + '/unlink', { method:'POST' });
      toast('Uzildi', 'success');
      closeMd(); loadClients();
    } catch(e){ toast(e.message, 'error'); $('bUn').disabled = false; }
  };
}

async function showCredits(id){
  const c = CLIENTS.find(x => x.id === id);
  openMd('Kredit — ' + c.name, `
    <div style="margin-bottom:14px">Joriy balans: <span class="pill p-cr">${c.credits}</span></div>
    <div class="row2">
      <div class="fld"><label>Miqdor (manfiy = ayirish)</label><input type="number" id="aAm" value="5"></div>
      <div class="fld"><label>Izoh</label><input type="text" id="aNo" placeholder="To'lov"></div>
    </div>
    <button class="btn btn-p" id="aGo" style="width:100%;margin-bottom:16px">Qo'llash</button>
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Tarix</div>
    <div id="aHist"><div class="empty">Yuklanmoqda...</div></div>`);

  $('aGo').onclick = async () => {
    const amount = parseInt($('aAm').value, 10);
    if (!amount) return toast('Miqdor kiriting', 'error');
    $('aGo').disabled = true;
    try {
      const r = await api('/api/clients/' + id + '/credits', { method:'POST',
        body: JSON.stringify({ amount, note: $('aNo').value.trim() }) });
      toast('Yangi balans: ' + r.balance, 'success');
      closeMd(); loadClients();
    } catch(e){ toast(e.message, 'error'); $('aGo').disabled = false; }
  };

  const REASON = { purchase:'To\'lov', bonus:'Bonus', reveal:'Kontakt ochildi', refund:'Qaytarildi', adjust:'Tuzatish' };
  try {
    const h = await api('/api/clients/' + id + '/credits');
    $('aHist').innerHTML = h.length
      ? '<table><tbody>' + h.map(x => `<tr>
          <td style="white-space:nowrap">${dt(x.createdAt)}</td>
          <td><b style="color:${x.delta > 0 ? 'var(--ok)' : 'var(--danger)'}">${x.delta > 0 ? '+' : ''}${x.delta}</b></td>
          <td>${REASON[x.reason] || esc(x.reason)}${x.note ? ' · ' + esc(x.note) : ''}</td>
          <td style="text-align:right;color:var(--muted)">${x.balanceAfter}</td>
        </tr>`).join('') + '</tbody></table>'
      : '<div class="empty">Harakat yo\'q</div>';
  } catch(e){ $('aHist').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

// ══ TANLOVLAR ═════════════════════════════════════════════
const IST = {
  selected:     { cls:'p-off',  lbl:'Tanlandi' },
  contacting:   { cls:'p-wait', lbl:'Bog\'lanilmoqda' },
  candidate_ok: { cls:'p-ok',   lbl:'Nomzod rozi' },
  candidate_no: { cls:'p-no',   lbl:'Nomzod rad etdi' },
  revealed:     { cls:'p-ok',   lbl:'Kontakt ochilgan' },
  interview:    { cls:'p-ok',   lbl:'Suhbat belgilandi' },
  hired:        { cls:'p-ok',   lbl:'Ishga olindi' },
  not_fit:      { cls:'p-no',   lbl:'Mos kelmadi' },
  refunded:     { cls:'p-wait', lbl:'Kredit qaytarildi' }
};

// Rad sabablari serverdan olinadi — ro'yxat ikki joyda yozilmasin
let META = null;
async function meta(){
  if (!META) { try { META = await api('/api/shortlists/meta'); } catch { META = { candReasons: [] }; } }
  return META;
}

async function loadShorts(){
  try { SHORTS = await api('/api/shortlists'); } catch(e){ toast(e.message, 'error'); return; }
  if (!SHORTS.length) {
    $('sList').innerHTML = '<div class="empty">Hali tanlov yo\'q. Mijoz Mini App\'da nomzod tanlagach shu yerda paydo bo\'ladi.</div>';
    return;
  }
  $('sList').innerHTML = `<table>
    <thead><tr><th>Mijoz</th><th>Sana</th><th>Nomzod</th><th>Kutilmoqda</th><th>Ochilgan</th><th>Balans</th></tr></thead>
    <tbody>${SHORTS.map(s => `<tr class="clk" data-sl="${s.id}">
      <td><b>${esc(s.clientName)}</b></td>
      <td>${dt(s.createdAt)}</td>
      <td>${s.counts.total}</td>
      <td>${s.counts.waiting ? '<span class="pill p-wait">' + s.counts.waiting + '</span>' : '—'}</td>
      <td>${s.counts.revealed ? '<span class="pill p-ok">' + s.counts.revealed + '</span>' : '—'}</td>
      <td><span class="pill p-cr">${s.clientCredits == null ? '?' : s.clientCredits}</span></td>
    </tr>`).join('')}</tbody></table>`;

  $('sList').querySelectorAll('[data-sl]').forEach(r => r.onclick = () => openShort(r.dataset.sl));
}

async function openShort(id){
  openMd('Tanlov', '<div class="empty">Yuklanmoqda...</div>');
  let d;
  try { d = await api('/api/shortlists/' + id); }
  catch(e){ $('mdB').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }

  $('mdT').textContent = (d.client && d.client.name) || 'Tanlov';

  // Qidiruv matni va mijoz taklifi — qo'ng'iroq qilishdan oldin
  // ko'z oldingizda tursin: kimni qidirgan va nima taklif qilyapti
  // Qo'ng'iroq kartasi — nomzodga qo'ng'iroq qilganda kerak bo'lgan
  // hamma narsa bir joyda. Nomzod birinchi ikki narsani so'raydi:
  // "qayerda?" va "qancha?". Ikkalasi ham shu yerda turishi kerak,
  // aks holda har safar mijoz kartasini qidirib o'tirasiz.
  const cl = d.client || {};
  const place = [cl.location, cl.address].filter(Boolean).map(esc).join(' · ');
  const head = `<div style="background:#F2F7FF;border:1px solid #D8E6FF;border-radius:12px;
      padding:13px;margin-bottom:14px;line-height:1.55">
      <div style="font-size:15.5px;font-weight:700">${esc(cl.name) || 'Mijoz'}</div>
      ${place
        ? `<div style="font-size:13.5px;color:var(--muted);margin-top:2px">${place}</div>`
        : `<div style="font-size:13px;color:var(--danger);margin-top:2px">Manzil ko'rsatilmagan — nomzod birinchi shuni so'raydi</div>`}
      ${cl.about ? `<div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(cl.about)}</div>` : ''}
      ${d.summary ? `<div style="font-size:14px;margin-top:9px"><b>So'rov:</b> ${esc(d.summary)}</div>` : ''}
      ${d.offer
        ? `<div style="font-size:14px;margin-top:6px"><b>Taklif:</b> ${esc(d.offer)}</div>`
        : `<div style="font-size:13px;color:var(--warn);margin-top:6px">Taklif shartlari yo'q — mijozdan so'rang (maosh, smena)</div>`}
      <div style="font-size:12.5px;color:var(--muted);margin-top:9px">
        ${dt(d.createdAt)} · ${d.counts.total} ta nomzod · balans
        <span class="pill p-cr">${cl.credits ?? '?'}</span>
      </div>
    </div>`;

  const body = d.items.map(it => {
    const c = it.candidate;
    const st = IST[it.state] || IST.selected;
    // Siz qo'yadigan amallar faqat kontakt ochilgunicha. Keyingisi
    // mijozning qo'lida: suhbat, ishga olish, rad.
    const agencyDone = ['revealed', 'refunded', 'interview', 'hired', 'not_fit'].includes(it.state);
    if (!c) return `<div class="ci"><div class="ci-meta">Nomzod o'chirilgan (${esc(it.candidateId).slice(0,8)})</div></div>`;

    return `<div class="ci" data-it="${esc(c.id)}">
      <div class="ci-top">
        <div class="ci-nm">${esc(c.fullName) || 'Nomsiz'}
          <span style="font-weight:600;color:var(--muted);font-size:12.5px">${esc(c.publicCode) || ''}</span>
        </div>
        <span class="pill ${st.cls}">${st.lbl}</span>
      </div>
      <div class="ci-meta">
        ${esc(c.desiredPosition) || '—'}<br>
        ${[c.age ? c.age + ' yosh' : '', esc(c.location) || '', c.experienceYears ? c.experienceYears + ' yil' : '']
          .filter(Boolean).join(' · ')}<br>
        <b>${esc(c.phone) || 'telefon yo\'q'}</b>${c.email ? ' · ' + esc(c.email) : ''}
      </div>
      ${it.reasonLabel ? `<div style="font-size:12.5px;color:var(--danger);margin-top:7px">Sabab: ${esc(it.reasonLabel)}</div>` : ''}
      ${it.interviewAt ? `<div style="font-size:12.5px;color:var(--ok);margin-top:7px">Suhbat: ${new Date(it.interviewAt).toLocaleString('uz-UZ',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
      <div class="ci-act" id="act-${esc(c.id)}">
        ${agencyDone ? '' : `
          <button class="btn btn-sm" data-st="contacting"   data-c="${esc(c.id)}">Bog'lanyapman</button>
          <button class="btn btn-sm btn-ok" data-st="candidate_ok" data-c="${esc(c.id)}">Nomzod rozi</button>
          <button class="btn btn-sm btn-no" data-no="${esc(c.id)}">Rad etdi</button>
          <button class="btn btn-sm btn-p"  data-rv="${esc(c.id)}">Kontaktni och (-1)</button>`}
        ${['revealed', 'interview'].includes(it.state) ? `
          ${it.state === 'revealed' ? `<button class="btn btn-sm" data-oc="interview" data-c="${esc(c.id)}">Suhbat belgilandi</button>` : ''}
          <button class="btn btn-sm btn-ok" data-oc="hired" data-c="${esc(c.id)}">Ishga olindi</button>
          <button class="btn btn-sm btn-no" data-oc="not_fit" data-c="${esc(c.id)}">Mos kelmadi</button>` : ''}
        ${['revealed', 'interview', 'not_fit'].includes(it.state)
          ? `<button class="btn btn-sm" data-rf="${esc(c.id)}">Kreditni qaytarish (+1)</button>` : ''}
      </div>
    </div>`;
  }).join('');

  $('mdB').innerHTML = head + body;

  // "Rad etdi" — sababsiz qabul qilmaymiz. Sabab eng qimmatli
  // ma'lumot: 50 ta qo'ng'iroqdan keyin mijozga "6 tasi maosh sababli
  // rad etdi" deb aniq gapirish mumkin bo'ladi.
  $('mdB').querySelectorAll('[data-no]').forEach(b => b.onclick = async () => {
    const cid = b.dataset.no;
    const m = await meta();
    const box = $('act-' + cid);
    box.innerHTML = `<div style="width:100%">
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:7px">Nega rad etdi?</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${(m.candReasons||[]).map(r =>
          `<button class="btn btn-sm" data-rs="${r.key}" data-c="${cid}">${esc(r.label)}</button>`).join('')}
        <button class="btn btn-sm" data-cancel="${cid}">Bekor</button>
      </div></div>`;

    box.querySelectorAll('[data-rs]').forEach(x => x.onclick = async () => {
      x.disabled = true;
      try {
        await api(`/api/shortlists/${id}/items/${cid}`, { method:'PATCH',
          body: JSON.stringify({ state:'candidate_no', reason: x.dataset.rs }) });
        openShort(id); loadShorts();
      } catch(e){ toast(e.message, 'error'); x.disabled = false; }
    });
    box.querySelector('[data-cancel]').onclick = () => openShort(id);
  });

  $('mdB').querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      await api(`/api/shortlists/${id}/items/${b.dataset.c}`, { method:'PATCH',
        body: JSON.stringify({ state: b.dataset.st }) });
      openShort(id); loadShorts();
    } catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });

  // Natija — agentlik belgilaydi (mijoz telefonda aytgan, Mini App'da bosmagan).
  // Suhbat — sana bilan; Mos kelmadi — sabab bilan (mijoz sabablari ro'yxati).
  $('mdB').querySelectorAll('[data-oc]').forEach(b => b.onclick = async () => {
    const cid = b.dataset.c, st = b.dataset.oc, box = $('act-' + cid);
    const send = async (extra, btns) => {
      btns.forEach(x => x.disabled = true);
      try {
        await api(`/api/shortlists/${id}/outcome/${cid}`, { method:'POST', body: JSON.stringify(Object.assign({ state: st }, extra)) });
        toast(st === 'hired' ? 'Ishga olindi deb belgilandi' : st === 'interview' ? 'Suhbat belgilandi' : 'Mos kelmadi deb belgilandi', 'success');
        openShort(id); loadShorts();
      } catch(e){ toast(e.message, 'error'); btns.forEach(x => x.disabled = false); }
    };
    if (st === 'hired') {
      if (!confirm('Nomzod ishga olindi deb belgilanadi (yakuniy). Davom etamizmi?')) return;
      return send({}, [b]);
    }
    if (st === 'interview') {
      const d = new Date(Date.now() + 864e5); d.setMinutes(0, 0, 0);
      const local = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
      box.innerHTML = `<div style="width:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="font-size:12.5px;color:var(--muted)">Suhbat qachon?</span>
        <input type="datetime-local" id="ivAt-${esc(cid)}" value="${local}" style="max-width:220px">
        <button class="btn btn-sm btn-p" data-go="1">Saqlash</button><button class="btn btn-sm" data-cancel="1">Bekor</button></div>`;
      box.querySelector('[data-go]').onclick = () => {
        const v = box.querySelector('input').value;
        if (!v) return toast('Sanani tanlang', 'error');
        send({ interviewAt: new Date(v).toISOString() }, [...box.querySelectorAll('button')]);
      };
      box.querySelector('[data-cancel]').onclick = () => openShort(id);
      return;
    }
    const m = await meta();
    box.innerHTML = `<div style="width:100%">
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:7px">Nega mos kelmadi? (mijoz aytgan sabab)</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${(m.clientReasons||[]).map(r => `<button class="btn btn-sm" data-cr="${esc(r.key)}">${esc(r.label)}</button>`).join('')}
        <button class="btn btn-sm" data-cancel="1">Bekor</button></div></div>`;
    box.querySelectorAll('[data-cr]').forEach(x => x.onclick = () => send({ reason: x.dataset.cr }, [...box.querySelectorAll('button')]));
    box.querySelector('[data-cancel]').onclick = () => openShort(id);
  });

  // Kreditni qaytarish — sababsiz emas (mijozga ham shu sabab boradi)
  $('mdB').querySelectorAll('[data-rf]').forEach(b => b.onclick = async () => {
    const cid = b.dataset.rf;
    const m = await meta();
    const box = $('act-' + cid);
    box.innerHTML = `<div style="width:100%">
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:7px">Nega qaytariladi? Mijozga 1 kredit qaytadi va sababi bilan xabar boradi.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${(m.refundReasons||[]).map(r =>
          `<button class="btn btn-sm" data-rr="${esc(r.key)}">${esc(r.label)}</button>`).join('')}
        <button class="btn btn-sm" data-cancel="1">Bekor</button>
      </div></div>`;
    box.querySelectorAll('[data-rr]').forEach(x => x.onclick = async () => {
      box.querySelectorAll('button').forEach(y => y.disabled = true);
      try {
        const r = await api(`/api/shortlists/${id}/refund/${cid}`, { method:'POST',
          body: JSON.stringify({ reason: x.dataset.rr }) });
        toast(r.already ? 'Allaqachon qaytarilgan'
          : r.credited ? 'Qaytarildi. Balans: ' + r.balance
          : 'Holat yopildi — bu kontakt uchun kredit yechilmagan edi', 'success');
        openShort(id); loadShorts();
      } catch(e){ toast(e.message, 'error'); box.querySelectorAll('button').forEach(y => y.disabled = false); }
    });
    box.querySelector('[data-cancel]').onclick = () => openShort(id);
  });

  $('mdB').querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
    if (!confirm('Kontakt mijozga ochiladi va 1 kredit yechiladi. Davom etamizmi?')) return;
    b.disabled = true;
    try {
      const r = await api(`/api/shortlists/${id}/reveal/${b.dataset.rv}`, { method:'POST' });
      toast(r.already ? 'Allaqachon ochilgan' : 'Ochildi. Balans: ' + r.balance, 'success');
      openShort(id); loadShorts();
    } catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });
}

// Ma'lumot sifati. Qidiruv nega natija bermayotganini shu ko'rsatadi:
// "2 yil tajribali ofitsiant" topilmasa, sabab odatda filtr emas —
// experienceYears tahlil qilinmagan bo'lsa 0 bo'lib qoladi.
function showQuality(a){
  const q = a.quality, n = a.total || 0;
  if (!q || !n) return;

  const bad = [
    { k:'noRole',  v:q.noRole,  t:'rolsiz ("boshqa")',   why:'lavozim bo\'yicha filtr ishlamaydi' },
    { k:'noExp',   v:q.noExp,   t:'tajribasi ko\'rsatilmagan', why:'"N yil tajriba" so\'rovi ularni topmaydi' },
    { k:'noLoc',   v:q.noLoc,   t:'hududsiz',            why:'tuman bo\'yicha qidiruvdan tushib qoladi' },
    { k:'noPhone', v:q.noPhone, t:'telefonsiz',          why:'kontakt ochib bo\'lmaydi' }
  ].filter(x => x.v > 0).sort((x, y) => y.v - x.v);

  if (!bad.length) return;
  const worst = bad[0];
  if (worst.v / n < 0.1) return;        // 10% dan kam bo'lsa bezovta qilmaymiz

  $('qual').innerHTML = `<div class="card" style="border-left:3px solid var(--warn);margin-bottom:14px">
    <div class="pad">
      <b style="font-size:15px">Ma'lumot sifati — qidiruvga ta'sir qilyapti</b>
      <div style="font-size:13.5px;line-height:1.75;margin-top:9px;color:var(--muted)">
        ${bad.map(x => `<div><b style="color:var(--ink)">${x.v}</b> ta ${x.t}
          <span style="font-size:12.5px">— ${x.why}</span></div>`).join('')}
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6">
        Jami ${n} ta nomzod. Bu maydonlar to'ldirilmaguncha filtr to'liq ishlamaydi.
      </div>
    </div></div>`;
}

// AI kunlik kvotasi. Pilot paytida ko'z oldida tursin: kvota tugasa
// bot jim qoladi va sababini bilmay qolish oson.
async function loadAi(){
  const el = $('aiChip');
  try {
    const a = await api('/api/recruitment/analytics');
    // statusAll() massiv qaytaradi: [{model, used, limit, remaining, exhausted}]
    const q = (a.ai && a.ai.quota) || [];
    const rows = q.filter(x => x && x.limit);
    if (!rows.length) { el.textContent = a.ai && a.ai.configured ? 'AI ✓' : 'AI ✕'; return; }

    // Eng tang ahvoldagisini ko'rsatamiz — birinchi tugaydigani muhim
    const worst = rows.reduce((x, y) => (x.remaining / x.limit) < (y.remaining / y.limit) ? x : y);
    const pct = worst.remaining / worst.limit;
    el.textContent = `AI ${worst.remaining}/${worst.limit}`;
    el.style.color = pct < 0.15 ? 'var(--danger)' : (pct < 0.4 ? 'var(--warn)' : 'var(--muted)');
    el.title = q.map(s =>
      `${s.model}: ${s.limit ? s.remaining + '/' + s.limit + ' qoldi' : 'cheksiz'}`).join('\n');

    showQuality(a);
  } catch { el.textContent = 'AI ?'; }
}

(async () => {
  await requireRole('restaurant');
  loadClients();
  loadShorts();          // sanoqlar darhol to'g'ri ko'rinsin
  loadAi();
  // "Bugun" sahifasidan: #sl=<tanlov id> — o'sha tanlovni darhol ochamiz
  const m = /[#&]sl=([\w-]+)/.exec(location.hash);
  if (m) { $('tabS').click(); openShort(decodeURIComponent(m[1])); }
})();
