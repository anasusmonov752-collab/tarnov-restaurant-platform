<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentHub — Vakansiyalar</title>
<!-- TalentHub dizayn tizimi va umumiy menyu (th-shell) -->
<link rel="icon" href="/img/talenthub-mark.svg" type="image/svg+xml">
<script src="/js/uz-date.js"></script>
<link rel="stylesheet" href="/css/th.css?v=2">
<link rel="stylesheet" href="/css/th-app.css?v=2">
<script src="/js/th-shell.js?v=3" defer></script>
<script src="/js/th-viewer.js?v=2" defer></script>
<script src="/js/th-i18n.js?v=14"></script>  <!-- afzalliklar ro'yxati serverniki bilan bir xil (PERK_KEYS) -->
<style>
:root{
  --bg:#EEF3FB; --ink:#16233A; --green:#0F2747; --green2:#0A1B33;
  --gold:#2563EB; --gold-d:#1D4ED8; --card:#FFFFFF; --line:#E1E8F2;
  --muted:#64748B; --danger:#C25B4C; --ok:#2E9E5B; --warn:#B4802E;
  --shadow:0 1px 3px rgba(16,32,24,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(15,39,71,.22);border-radius:6px}
button,input,select,textarea{font-family:inherit}

.topbar{flex:none;background:var(--card);border-bottom:1px solid var(--line);color:var(--ink);padding:12px 20px;display:flex;align-items:center;gap:14px;z-index:40}
.back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none}
.back:hover{background:#F3F7FD;color:var(--ink)}
.tb-mark{width:36px;height:36px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center}
.tb-mark span{font-style:italic;font-weight:700;font-size:20px;color:#fff}
.tb-title{font-size:16.5px;font-weight:700;line-height:1}
.tb-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}
.tb-spacer{flex:1}
.view-sw{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;text-decoration:none}
.view-sw:hover{background:#F3F7FD;color:var(--ink)}
.view-sw.on{background:var(--gold);border-color:var(--gold);color:#fff}

.wrap{flex:1;overflow-y:auto;padding:18px 22px 40px}
.inner{max-width:1180px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head h2{font-size:19px;font-weight:800}
.head .sp{flex:1}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700}
.btn:hover{background:#F3F7FD}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-p:hover{background:var(--gold-d)}
.btn-no{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.p-ok{background:rgba(46,158,91,.12);color:var(--ok)}
.p-wait{background:rgba(180,128,46,.14);color:var(--warn)}
.p-off{background:rgba(100,116,139,.14);color:var(--muted)}
.p-no{background:rgba(194,91,76,.12);color:var(--danger)}
.p-new{background:rgba(37,99,235,.12);color:var(--gold)}

.ov{position:fixed;inset:0;background:rgba(10,24,44,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:200}
.ov.on{display:flex}
.md{background:var(--card);border-radius:14px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.md-top{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:14px 14px 0 0}
.md-top b{font-size:16px;flex:1}
.md-x{border:none;background:transparent;font-size:19px;cursor:pointer;color:var(--muted)}
.md-b{padding:18px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink);background:#FBFCFE}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.fld{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}
.ci{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px}
.ci b{font-size:14.5px}
.ci .m{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:3px}

/* Toast — utils.js toast() shu klasslarni qo'yadi. Bu sahifa style.css ni
   ulamaydi (u qorong'i mavzu), shuning uchun uslub shu yerda turishi shart.
   Ilgari CSS yo'q edi va 400/401 xatolari ko'rinmay ketardi. */
#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:380px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:10px;padding:12px 16px;font-size:13.5px;font-weight:500;color:var(--ink);box-shadow:0 8px 24px rgba(16,32,24,.16);pointer-events:auto}
.toast-icon{display:flex;flex:none;color:var(--muted)}
.toast-success{border-left-color:var(--ok)}       .toast-success .toast-icon{color:var(--ok)}
.toast-error{border-left-color:var(--danger)}     .toast-error .toast-icon{color:var(--danger)}
.toast-info{border-left-color:var(--gold)}        .toast-info .toast-icon{color:var(--gold)}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/restaurant-admin.html">&#8592; Panel</a>
  <div class="tb-mark"><span>T</span></div>
  <div>
    <div class="tb-title">Vakansiyalar</div>
    <div class="tb-sub">TalentHub</div>
  </div>
  <div class="tb-spacer"></div>
  <a class="view-sw" href="/mijozlar.html">Mijozlar</a>
  <a class="view-sw" href="/anketalar.html">Anketalar</a>
  <a class="view-sw" href="/recruitment.html">Nomzodlar bazasi</a>
</div>

<div class="wrap"><div class="inner">
  <div class="head">
    <h2>Barcha vakansiyalar</h2>
    <div class="sp"></div>
    <select id="fSt" style="width:auto;margin-right:8px">
      <option value="">Hammasi</option>
      <option value="open" selected>Ochiq</option>
      <option value="paused">To'xtatilgan</option>
      <option value="closed">Yopilgan</option>
    </select>
    <button class="btn" id="bAnk" style="margin-right:8px">Umumiy anketa havolasi</button>
    <button class="btn btn-p" id="bNew">+ Vakansiya</button>
  </div>
  <div id="warn"></div>
  <div class="card" id="list"><div class="empty">Yuklanmoqda...</div></div>
</div></div>

<div class="ov" id="ov"><div class="md">
  <div class="md-top"><b id="mdT">—</b><button class="md-x" id="mdX">&#10005;</button></div>
  <div class="md-b" id="mdB"></div>
</div></div>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
const $ = id => document.getElementById(id);
let ROWS = [], CLIENTS = [];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = s => s ? new Date(s).toLocaleDateString('uz-UZ',{day:'2-digit',month:'short'}) : '—';

function openMd(t, h){ $('mdT').textContent = t; $('mdB').innerHTML = h; $('ov').classList.add('on'); }
function closeMd(){ $('ov').classList.remove('on'); $('mdB').innerHTML = ''; }
$('mdX').onclick = closeMd;
$('ov').onclick = e => { if (e.target === $('ov')) closeMd(); };

const ST = { open:['p-ok','Ochiq'], paused:['p-wait','To\'xtatilgan'], closed:['p-off','Yopilgan'] };

async function load(){
  const q = $('fSt').value ? '?status=' + $('fSt').value : '';
  try { ROWS = await api('/api/vacancies' + q); }
  catch(e){ toast(e.message, 'error'); return; }

  // Tasdiqlanmaganlar — nomzodlarga ko'rsatilmayapti, bu yo'qotish
  // Yopiq (avtomatik) vakansiyalar baribir ro'yxatda yo'q — ogohlantirishga kirmaydi
  const stale = ROWS.filter(v => v.listed && v.stale && v.status === 'open');
  $('warn').innerHTML = stale.length
    ? `<div class="card" style="border-left:3px solid var(--warn);margin-bottom:14px"><div style="padding:14px">
        <b style="font-size:15px">${stale.length} ta vakansiya tasdiqlanmagan</b>
        <div style="font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.6">
          14 kundan ortiq tasdiqlanmagan vakansiya nomzodlarga <b>ko'rsatilmaydi</b>.
          Mijozdan so'rang: o'rin hali ochiqmi?</div></div></div>`
    : '';

  if (!ROWS.length) {
    $('list').innerHTML = '<div class="empty">Vakansiya yo\'q. Mijoz o\'zi ochadi yoki siz kiritasiz.</div>';
    return;
  }

  $('list').innerHTML = `<table>
    <thead><tr><th>Vakansiya</th><th>Mijoz</th><th>Taklif</th><th>Arizalar</th><th>Tanlov</th><th>Holat</th><th></th></tr></thead>
    <tbody>${ROWS.map(v => {
      const [cls, lbl] = ST[v.status] || ST.open;
      return `<tr>
        <td><b>${esc(v.title)}</b>
          ${v.venue ? `<div style="font-size:12px;color:var(--muted)">${esc(v.venue)}</div>` : ''}
          ${v.headcount > 1 ? `<div style="font-size:12px;color:var(--muted)">${v.headcount} ta odam</div>` : ''}</td>
        <td>${esc(v.clientName)}
          ${v.clientLocation ? `<div style="font-size:12px;color:var(--muted)">${esc(v.clientLocation)}</div>` : ''}</td>
        <td>${esc(v.salaryText) || '<span style="color:var(--warn)">ko\'rsatilmagan</span>'}
          ${v.shift ? `<div style="font-size:12px;color:var(--muted)">${esc(v.shift)}</div>` : ''}</td>
        <td>${v.apps ? `${v.apps}${v.appsNew ? ` <span class="pill p-new">${v.appsNew} yangi</span>` : ''}` : '—'}</td>
        <td>${v.shortlists || '—'}</td>
        <td><span class="pill ${cls}">${lbl}</span>
          ${!v.listed ? '<div><span class="pill p-off" style="margin-top:4px" title="Qidiruvdan o\'zi yaratilgan, nomzodlar ko\'rmaydi">yopiq</span></div>' : ''}
          ${v.listed && v.stale && v.status === 'open' ? '<div><span class="pill p-no" style="margin-top:4px">tasdiqlang</span></div>' : ''}
          ${v.verifiedAt ? '<div><span class="pill p-ok" style="margin-top:4px" title="Nomzod «TalentHub tekshirgan ✓» belgisini ko\'radi">tekshirilgan ✓</span></div>' : ''}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-sm" data-app="${v.id}">Arizalar</button>
          <button class="btn btn-sm" data-ank="${v.id}">Anketa</button>
          <button class="btn btn-sm" data-cf="${v.id}">Tasdiqlash</button>
          <button class="btn btn-sm" data-vf="${v.id}" title="Ish beruvchiga qo'ng'iroq qilib o'rin ochiqligini tasdiqlatdingizmi?">${v.verifiedAt ? 'Tekshiruvni olish' : 'Tekshirildi'}</button>
          <button class="btn btn-sm" data-ed="${v.id}">Tahrirlash</button>
        </td></tr>`;
    }).join('')}</tbody></table>`;

  $('list').querySelectorAll('[data-app]').forEach(b => b.onclick = () => showApps(b.dataset.app));
  $('list').querySelectorAll('[data-ank]').forEach(b => b.onclick = () => {
    const v = ROWS.find(x => x.id === b.dataset.ank);
    showAnketaLink(v.id, v.title);
  });
  $('list').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => form(ROWS.find(x => x.id === b.dataset.ed)));
  $('list').querySelectorAll('[data-cf]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/vacancies/${b.dataset.cf}/confirm`, { method:'POST' }); toast('Tasdiqlandi', 'success'); load(); }
    catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });
  // "Tekshirildi" — faqat ish beruvchiga qo'ng'iroqdan keyin: nomzod ishonch belgisini ko'radi
  $('list').querySelectorAll('[data-vf]').forEach(b => b.onclick = async () => {
    const v = ROWS.find(x => x.id === b.dataset.vf);
    if (!v.verifiedAt && !confirm('Ish beruvchiga qo\'ng\'iroq qilib, o\'rin hali ochiqligini tasdiqlatdingizmi?\nNomzod «TalentHub tekshirgan ✓» belgisini ko\'radi.')) return;
    b.disabled = true;
    try {
      await api(`/api/vacancies/${v.id}/verify`, { method:'POST', body: JSON.stringify({ off: !!v.verifiedAt }) });
      toast(v.verifiedAt ? 'Belgi olindi' : 'Tekshirildi', 'success'); load();
    } catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });
}
$('fSt').onchange = load;

// ── Anketa havolasi ──
// E'lon uchun: nomzod bosadi -> botda "Anketani to'ldirish" -> Mini App.
// Har e'lon joyiga alohida havola (kanal) — qaysi biri nomzod olib
// kelayotgani pastdagi natijada ko'rinadi (services/survey, /api/surveys).
const STEP_L = { role:'Lavozim', fullName:'Ism', birthDate:'Tug\'ilgan sana', gender:'Jins', phone:'Telefon',
  location:'Tuman', experience:'Tajriba', lastJob:'Oxirgi ish', shift:'Smena', salary:'Maosh',
  russian:'Rus tili', sanitary:'Sanitar kitobcha', study:'O\'qish', photo:'Rasm', consent:'Rozilik',
  '(boshlamagan)':'ochdi, lekin boshlamadi' };

function statsHtml(st){
  if (!st.channels.length) return '<div class="empty" style="padding:16px 0">Hali hech kim boshlamagan.</div>';
  const rows = st.channels.map(c => `<tr><td>${esc(c.label)}</td><td>${c.started}</td><td><b>${c.done}</b></td>
    <td>${c.started ? Math.round(c.done / c.started * 100) + '%' : '—'}</td></tr>`).join('');
  const drop = st.dropAt.slice(0, 3).map(x => `${esc(STEP_L[x.step] || x.step)} — ${x.n}`).join(' · ');
  return `<table style="margin-top:8px"><thead><tr><th>Manba</th><th>Boshladi</th><th>Yubordi</th><th>Konversiya</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${drop ? `<div style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6">
      Tugatmaganlar oxirgi javob bergan savol: ${drop}</div>` : ''}`;
}

async function showAnketaLink(vid, title){
  openMd(vid ? 'Anketa havolasi — ' + title : 'Umumiy anketa havolasi', '<div class="empty">Yuklanmoqda...</div>');
  let ch = 'vakuz';                                   // asosiy e'lon joyi — o'z kanalimiz (survey.CHANNELS)
  const qv = vid ? '&vacancyId=' + encodeURIComponent(vid) : '';
  const draw = async () => {
    let d, st;
    try {
      [d, st] = await Promise.all([
        api('/api/surveys/link?channel=' + ch + qv),
        api('/api/surveys/stats?' + qv.slice(1))
      ]);
    } catch(e){ $('mdB').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    const opts = Object.entries(d.channels).map(([k, l]) =>
      `<option value="${k}" ${k === ch ? 'selected' : ''}>${esc(l)}</option>`).join('');
    $('mdB').innerHTML = `
      <div style="font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:14px">
        ${vid ? 'Nomzod anketani to\'ldirgach shu vakansiyaga <b>ariza ham tushadi</b> — mijoz kabinetida ko\'rinadi.'
              : 'Nomzod lavozimni o\'zi tanlaydi va bazaga tushadi.'}
        Telefon Telegram orqali tasdiqlanadi, rozilik alohida so'raladi.</div>
      <div class="fld"><label>E'lon qayerga qo'yiladi</label><select id="lCh">${opts}</select></div>
      <div class="fld"><label>Havola</label>
        <div style="display:flex;gap:8px"><input type="text" id="lUrl" readonly value="${esc(d.link)}">
        <button class="btn btn-p" id="lCp">Nusxa</button></div></div>
      <div class="sec">Natija${vid ? ' (shu vakansiya)' : ''}</div>
      ${statsHtml(st)}`;
    $('lCh').onchange = () => { ch = $('lCh').value; draw(); };
    $('lCp').onclick = async () => {
      try { await navigator.clipboard.writeText(d.link); }
      catch(e){ $('lUrl').select(); document.execCommand('copy'); }
      toast('Havoladan nusxa olindi', 'success');
    };
  };
  draw();
}
$('bAnk').onclick = () => showAnketaLink('', '');

// ── Forma ──
// Lavozim — server bilan bir xil ro'yxat (src/data/roles.js), o'zgarsa
// hamma joyda. Busiz vakansiya 'boshqa' bo'lib qolardi va bot qidiruvi
// uni tanimay yoniga dublikat ochardi.
const ROLES = [['ofitsiant','Ofitsiant'],['barmen','Barmen'],['xostess','Xostess'],
  ['oshpaz','Oshpaz'],['kassir','Kassir'],['menejer','Menejer'],['operator','Call-markaz operatori']];
const SHIFT_T = { kunduzgi:'kunduzgi smena', kechki:'kechki smena', ikkalasi:'kunduzgi/kechki smena' };
// Afzalliklar — server bilan bir xil kalitlar va yozuvlar (th-i18n PERK_KEYS)
const PERKS = THI18N.PERK_KEYS.map(k => [k, THI18N.t('uz', 'perk.' + k)]);
// Server shabloni bilan bir xil sarlavha (vacancyAuto.makeTitle)
const autoTitle = (r, s) => {
  const l = (ROLES.find(x => x[0] === r) || [])[1];
  return l ? (SHIFT_T[s] ? l + ', ' + SHIFT_T[s] : l) : '';
};

function form(v){
  const d = v || {};
  const opts = CLIENTS.map(c => `<option value="${c.id}" ${d.clientId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const roleOpts = `<option value="">— tanlang —</option>` + ROLES.map(([k, l]) =>
    `<option value="${k}" ${d.role === k ? 'selected' : ''}>${l}</option>`).join('');
  openMd(v ? 'Vakansiyani tahrirlash' : 'Yangi vakansiya', `
    ${v ? '' : `<div class="fld"><label>Mijoz *</label><select id="fCl">${opts}</select></div>`}
    <div class="fld"><label>Lavozim *</label><select id="fRo">${roleOpts}</select></div>
    <div class="fld"><label>Sarlavha *</label><input type="text" id="fTi" value="${esc(d.title)}" placeholder="Ofitsiant, kechki smena"></div>

    <div class="sec">Talab</div>
    <div class="row2">
      <div class="fld"><label>Tajriba (yil)</label><input type="number" id="fEx" value="${d.minExp ?? ''}"></div>
      <div class="fld"><label>Nechta odam</label><input type="number" id="fHc" value="${d.headcount || 1}" min="1"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Smena</label><select id="fSh">
        <option value="">Farqi yo'q</option>
        <option value="kunduzgi" ${d.shift==='kunduzgi'?'selected':''}>Kunduzgi</option>
        <option value="kechki"   ${d.shift==='kechki'?'selected':''}>Kechki</option>
        <option value="ikkalasi" ${d.shift==='ikkalasi'?'selected':''}>Ikkalasi</option>
      </select></div>
      <div class="fld"><label>Tuman</label><input type="text" id="fLo" value="${esc(d.location)}" placeholder="Chilonzor"></div>
    </div>

    <div class="sec">Taklif — nomzod shuni o'qiydi</div>
    <div class="row2">
      <div class="fld"><label>Maosh (dan)</label><input type="number" id="fSf" value="${d.salaryFrom ?? ''}" placeholder="4000000"></div>
      <div class="fld"><label>Maosh (gacha)</label><input type="number" id="fSt2" value="${d.salaryTo ?? ''}" placeholder="5000000"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Maosh nimaga</label><select id="fSp">
        <option value="month" ${(d.salaryPeriod || 'month') === 'month' ? 'selected' : ''}>Oyiga</option>
        <option value="day"   ${d.salaryPeriod === 'day' ? 'selected' : ''}>Kuniga</option>
        <option value="shift" ${d.salaryPeriod === 'shift' ? 'selected' : ''}>Smenasiga</option>
      </select></div>
      <div class="fld"><label>To'lov</label><select id="fPo">
        <option value="">—</option>
        <option value="daily"   ${d.payout === 'daily' ? 'selected' : ''}>Har kuni</option>
        <option value="weekly"  ${d.payout === 'weekly' ? 'selected' : ''}>Har hafta</option>
        <option value="twice"   ${d.payout === 'twice' ? 'selected' : ''}>Oyiga 2 marta</option>
        <option value="monthly" ${d.payout === 'monthly' ? 'selected' : ''}>Oyiga 1 marta</option>
      </select></div>
    </div>
    <div class="fld"><label>Grafik</label><input type="text" id="fSc" value="${esc(d.schedule)}" placeholder="6/1, 16:00-24:00"></div>
    <div class="fld"><label>Afzalliklar</label><div style="display:flex;flex-wrap:wrap;gap:6px">${PERKS.map(([k, l]) =>
      `<label style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin:0;cursor:pointer">
        <input type="checkbox" data-pk="${k}" ${(d.perks || []).includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div></div>

    <div class="sec">Nomzod uchun tavsif — restoran NOMISIZ</div>
    <div class="fld"><label>Joy tavsifi</label><input type="text" id="fVn" value="${esc(d.venue)}" maxlength="80" placeholder="Uyg'ur oshxonasi restorani, 3 filial"></div>
    <div class="fld"><label>Mo'ljal</label><input type="text" id="fLm" value="${esc(d.landmark)}" maxlength="80" placeholder="Bodomzor metrosi yonida"></div>
    <div class="fld"><label>Bir qatorli jalb (e'londagi haqiqiy fakt)</label><input type="text" id="fHk" value="${esc(d.hook)}" maxlength="160" placeholder="Yangi filial: jamoa noldan yig'ilmoqda"></div>
    <div class="fld"><label>Vazifalar (har qatorda bittadan)</label><textarea id="fDu" rows="3">${esc((d.duties || []).join('\n'))}</textarea></div>
    <div class="fld"><label>Talablar (har qatorda bittadan)</label><textarea id="fRq" rows="3">${esc((d.requirements || []).join('\n'))}</textarea></div>
    <div class="fld"><label>Qo'shimcha (erkin matn)</label><textarea id="fCo" rows="2">${esc(d.conditions)}</textarea></div>
    ${v ? `<div class="fld"><label>Holat</label><select id="fStt">
      <option value="open"   ${d.status==='open'?'selected':''}>Ochiq</option>
      <option value="paused" ${d.status==='paused'?'selected':''}>To'xtatilgan</option>
      <option value="closed" ${d.status==='closed'?'selected':''}>Yopilgan</option>
    </select></div>` : ''}
    <button class="btn btn-p" id="fSave" style="width:100%">Saqlash</button>`);

  // Sarlavha lavozim va smenadan o'zi yoziladi — qo'lda yozilguncha
  let autoT = !d.title || d.title === autoTitle(d.role, d.shift);
  const syncT = () => { if (autoT) $('fTi').value = autoTitle($('fRo').value, $('fSh').value); };
  $('fTi').oninput = () => { autoT = false; };
  $('fRo').onchange = syncT;
  $('fSh').onchange = syncT;

  $('fSave').onclick = async () => {
    const role = $('fRo').value;
    if (!role) return toast('Lavozimni tanlang', 'error');
    const title = $('fTi').value.trim() || autoTitle(role, $('fSh').value);
    const body = {
      role, title, minExp: $('fEx').value, headcount: $('fHc').value,
      shift: $('fSh').value, location: $('fLo').value.trim(),
      salaryFrom: $('fSf').value, salaryTo: $('fSt2').value,
      schedule: $('fSc').value.trim(), conditions: $('fCo').value.trim(),
      salaryPeriod: $('fSp').value, payout: $('fPo').value,
      perks: [...document.querySelectorAll('[data-pk]:checked')].map(x => x.dataset.pk),
      venue: $('fVn').value.trim(), landmark: $('fLm').value.trim(), hook: $('fHk').value.trim(),
      duties: $('fDu').value, requirements: $('fRq').value
    };
    if (!v) body.clientId = $('fCl').value;
    if (v && $('fStt')) body.status = $('fStt').value;

    $('fSave').disabled = true;
    try {
      if (v) await api('/api/vacancies/' + v.id, { method:'PATCH', body: JSON.stringify(body) });
      else   await api('/api/vacancies', { method:'POST', body: JSON.stringify(body) });
      toast('Saqlandi', 'success'); closeMd(); load();
    } catch(e){ toast(e.message, 'error'); $('fSave').disabled = false; }
  };
}
$('bNew').onclick = () => {
  if (!CLIENTS.length) return toast('Avval mijoz yarating', 'error');
  form(null);
};

// ── Arizalar (to'liq kontakt bilan) ──
const AST = { new:['p-new','Yangi'], seen:['p-wait','Mijoz ko\'rdi'],
              shortlisted:['p-ok','Tanlandi'], rejected:['p-no','Rad etildi'] };

async function showApps(id){
  openMd('Arizalar', '<div class="empty">Yuklanmoqda...</div>');
  let d;
  try { d = await api(`/api/vacancies/${id}/applications`); }
  catch(e){ $('mdB').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  $('mdT').textContent = d.vacancy.title;
  if (!d.items.length) {
    $('mdB').innerHTML = '<div class="empty">Hali ariza yo\'q.</div>';
    return;
  }
  $('mdB').innerHTML = d.items.map(it => {
    const c = it.candidate;
    const [cls, lbl] = AST[it.state] || AST.new;
    if (!c) return `<div class="ci"><div class="m">Nomzod o'chirilgan</div></div>`;
    const meta = [c.desiredPosition, c.experienceYears ? c.experienceYears + ' yil' : '',
                  c.age ? c.age + ' yosh' : '', c.location].filter(Boolean).join(' · ');
    return `<div class="ci">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <b style="flex:1">${esc(c.fullName) || 'Nomsiz'}
          <span style="font-weight:600;color:var(--muted);font-size:12.5px">${esc(c.publicCode)}</span></b>
        <span class="pill ${cls}">${lbl}</span>
      </div>
      <div class="m">${esc(meta)}</div>
      <div class="m"><b style="color:var(--ink)">${esc(c.phone) || 'telefon yo\'q'}</b>${c.email ? ' · ' + esc(c.email) : ''}</div>
      ${it.message ? `<div class="m" style="color:var(--ink);margin-top:6px">"${esc(it.message)}"</div>` : ''}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
        <span class="m" style="margin:0">${dt(it.createdAt)}</span>
        <a class="btn btn-sm" style="margin-left:auto;text-decoration:none" href="/recruitment.html?${c.source === 'anketa' ? 'src=anketa&' : ''}q=${encodeURIComponent(c.publicCode || c.fullName || '')}">Bazada ochish</a>
        ${['new', 'seen'].includes(it.state) ? `
          <button class="btn btn-sm btn-p" data-apa="shortlist" data-app="${esc(it.id)}">Tanlovga qo'shish</button>
          <button class="btn btn-sm" data-apa="reject" data-app="${esc(it.id)}">Rad etish</button>` : ''}
      </div>
    </div>`;
  }).join('');

  // Agentlik qarori: tanlovga (mijozning shu vakansiyadagi tanlovi) yoki rad
  $('mdB').querySelectorAll('[data-apa]').forEach(b => b.onclick = async () => {
    const act = b.dataset.apa;
    if (act === 'reject' && !confirm('Ariza rad etiladi. Davom etamizmi?')) return;
    b.disabled = true;
    try {
      await api(`/api/vacancies/${id}/applications/${b.dataset.app}/${act}`, { method:'POST' });
      toast(act === 'shortlist' ? 'Tanlovga qo\'shildi — Mijozlar sahifasida davom eting' : 'Rad etildi', 'success');
      showApps(id); load();
      if (window.thShell) thShell.refreshCounts();
    } catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });
}

(async () => {
  await requireRole('restaurant');
  try { CLIENTS = await api('/api/clients'); } catch { CLIENTS = []; }
  load();
})();
</script>
