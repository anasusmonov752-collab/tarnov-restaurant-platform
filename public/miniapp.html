<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentHub</title>
<script src="/js/uz-date.js"></script>  <!-- o'zbekcha sana: brauzerda uz formati bo'lmasa -->
<link rel="stylesheet" href="/css/th.css?v=2">  <!-- dizayn tizimi: ranglar, kunduz/tun -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>window.thViewerHostBack = true;</script>  <!-- orqaga tugmasi zanjiri onTgBack'da (rasm oynasi) -->
<script src="/js/th-viewer.js?v=2" defer></script>
<script src="/js/th-i18n.js?v=16"></script>
<style>
/* Ranglar — TalentHub dizayn tizimidan (css/th.css, iOS uslubi).
   Telegram'ning --tg-theme-* RANGLARI olinmaydi (avval shunday edi va
   tungi rejimda brend yo'qolardi), faqat kunduz/tun HOLATI olinadi:
   applyTheme() <html data-theme> qo'yadi, th.css o'z tungi palitrasini
   beradi — ko'k brend va kredit rangi ikkala rejimda ham o'zimizniki. */
:root{
  --bg:var(--th-bg); --card:var(--th-surface); --ink:var(--th-ink); --ink-2:var(--th-ink-2); --muted:var(--th-muted);
  --line:var(--th-line); --blue:var(--th-brand); --blue-d:var(--th-brand-2);
  --ok:var(--th-ok); --warn:var(--th-warn); --danger:var(--th-danger);
  --btn:var(--blue); --btn-ink:#fff; --link:var(--th-link);
  --soft-blue:#E8EFFA;          /* avatar va tizim xabari foni */
}
:root[data-theme="dark"]{ --soft-blue:rgba(10,132,255,.18); }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));   /* suzuvchi panel ostida qolmasin */
  -webkit-text-size-adjust:100%}
.wrap{padding:12px}
.hide{display:none !important}

/* ── Ro'yxat ── */
.top{position:sticky;top:0;background:var(--bg);padding:10px 12px;z-index:5;border-bottom:1px solid var(--line)}
.backcab{border:0;background:transparent;color:var(--blue);font-family:inherit;font-size:14px;
  font-weight:600;padding:2px 0 8px;cursor:pointer}
.sum{font-size:13.5px;color:var(--muted);line-height:1.45}
.cnt{font-size:13px;color:var(--muted);margin-top:3px}

.c{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;
  display:flex;gap:11px;position:relative;cursor:pointer;
  border:2px solid transparent;transition:border-color .12s}
.c.on{border-color:var(--btn)}
.c.seen .pos::after{content:' ·';color:var(--muted)}
.ph{width:68px;height:84px;border-radius:10px;flex:none;overflow:hidden;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover}
/* Anonim nomzod — lavozim belgisi (kod harflari o'rniga) */
.role-ic{width:28px;height:28px;color:var(--link)}
.cd-ph .role-ic{width:24px;height:24px}
.b{flex:1;min-width:0}
.code{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
.pos{font-size:15.5px;font-weight:600;margin-top:1px;line-height:1.25}
.meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.t{font-size:11.5px;padding:3px 8px;border-radius:7px;background:var(--bg);color:var(--muted)}
.t.ai{color:var(--ok)}
.t.act{color:var(--ok)}
.t.no{color:#B4542B}
.seenmark{font-size:11.5px;color:var(--muted);margin-top:6px;display:none}
.c.seen .seenmark{display:block}
.tick{position:absolute;top:10px;right:10px;width:23px;height:23px;border-radius:50%;
  border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.c.on .tick{background:var(--btn);border-color:var(--btn)}
.c.on .tick::after{content:'';width:6px;height:11px;border:solid var(--btn-ink);
  border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* ── Alohida sahifa ── */
#detail{display:none}
.d-ph{width:100%;max-height:300px;object-fit:cover;display:block;background:var(--card)}
.d-ph-none{height:150px;background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:30px;font-weight:600;color:var(--muted)}
.d-head{padding:14px 12px 0}
.d-code{font-size:12.5px;color:var(--muted);font-family:ui-monospace,monospace}
.d-pos{font-size:21px;font-weight:600;line-height:1.2;margin-top:2px}
.d-meta{font-size:14px;color:var(--muted);margin-top:6px}
.sec{padding:14px 12px 0}
.sec h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:7px}
.sec p{font-size:14.5px;line-height:1.6}
.ai{background:var(--card);border-radius:12px;padding:12px;font-size:14px;line-height:1.55}
.ai b{color:var(--link)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:5px 11px;border-radius:9px;background:var(--card)}
.w{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.w-p{font-size:15px;font-weight:600}
.w-c{font-size:13.5px;color:var(--muted);margin-top:1px}
.w-d{font-size:13.5px;margin-top:6px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right}

/* ── Pastki amal paneli (qidiruv rejimi) ── */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:14px;border:none;border-radius:12px;background:var(--btn);
  color:var(--btn-ink);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--bg);color:var(--ink)}
.nav{width:52px;flex:none;padding:14px 0;border:none;border-radius:12px;
  background:var(--bg);color:var(--ink);font-size:17px;cursor:pointer}
.nav:disabled{opacity:.3}
.pg{font-size:13px;color:var(--muted);flex:none;min-width:48px;text-align:center}
.msg{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px;line-height:1.6}

/* ══ KABINET ══════════════════════════════════════════════ */
/* Oq va havodor — nomzod profili bilan bir tilda. Oldin to'q ko'k
   gradient edi; mobilda og'ir ko'rinar va asosiy raqamni (balans)
   bo'rttirish o'rniga u bilan raqobatlashardi. */
.chead{background:var(--card);border-bottom:1px solid var(--line);
  padding:18px 16px 16px;position:sticky;top:0;z-index:6}
.chead .nm{font-size:15px;color:var(--muted);font-weight:500}
.chead .cr{display:flex;align-items:baseline;gap:9px;margin-top:6px}
.chead .cr b{font-size:34px;font-weight:600;color:var(--th-amber);line-height:1}   /* kredit — pul rangi */
.chead .cr span{font-size:13px;color:var(--muted);line-height:1.4}

.stats{display:flex;gap:8px;padding:12px 12px 0}
.stat{flex:1;background:var(--card);border-radius:11px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:700}
.stat span{font-size:11px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}

.sl{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sl-h{padding:12px 13px;border-bottom:1px solid var(--line)}
.sl-h .q{font-size:14.5px;font-weight:600;line-height:1.35}
.sl-h .d{font-size:12.5px;color:var(--muted);margin-top:3px}
.it{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;gap:11px}
.it:last-child{border-bottom:none}
.it .av{width:46px;height:56px;border-radius:9px;flex:none;overflow:hidden;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.it .av img{width:100%;height:100%;object-fit:cover}
.it .bd{flex:1;min-width:0}
.it .p{font-size:14.5px;font-weight:600;line-height:1.3}
.it .m{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.st{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;margin-top:7px}
.st.waiting{background:rgba(180,128,46,.13);color:var(--warn)}
.st.open{background:rgba(46,158,91,.13);color:var(--ok)}
.st.no{background:rgba(194,91,76,.12);color:var(--danger)}
.st.refunded{background:rgba(100,116,139,.14);color:var(--muted)}
.ct{margin-top:9px;background:rgba(46,158,91,.07);border:1px solid rgba(46,158,91,.25);
  border-radius:10px;padding:10px}
.ct .nm{font-size:14.5px;font-weight:700}
.ct a{display:block;font-size:16px;font-weight:700;color:var(--ok);text-decoration:none;margin-top:5px}
.ct .em{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-all}
.rz{font-size:12.5px;color:var(--danger);margin-top:6px;line-height:1.45}
.iv{font-size:12.5px;color:var(--ok);font-weight:600;margin-top:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ab{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;
  font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
.ab.ok{border-color:rgba(46,158,91,.4);color:var(--ok)}
.ab.no{border-color:rgba(194,91,76,.35);color:var(--danger)}
.ab:disabled{opacity:.5}
.ivbox{margin-top:9px}
.ivbox input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  font-family:inherit;font-size:15px;color:var(--ink);background:var(--card)}

.le{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.le:last-child{border-bottom:none}
.le .dl{font-size:16px;font-weight:700;min-width:34px}
.le .dl.p{color:var(--ok)}
.le .dl.m{color:var(--danger)}
.le .rr{flex:1;font-size:13.5px}
.le .rr i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.le .ba{font-size:13px;color:var(--muted)}

.card{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px}
.pad{padding:14px 13px}
.h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin:0 0 9px 13px}

/* ── Vakansiyalar ── */
.vc{background:var(--card);border-radius:14px;padding:13px;margin-bottom:11px}
.vc .ti{font-size:15.5px;font-weight:600;line-height:1.3}
.vc .mt{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.vc .row{display:flex;gap:7px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px}
.tag.open{background:rgba(46,158,91,.13);color:var(--ok)}
.tag.paused{background:rgba(180,128,46,.14);color:var(--warn)}
.tag.closed{background:rgba(100,116,139,.14);color:var(--muted)}
.tag.stale{background:rgba(194,91,76,.12);color:var(--danger)}
.tag.app{background:rgba(37,99,235,.12);color:var(--blue)}
.tag.priv{background:rgba(100,116,139,.14);color:var(--ink)}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink);cursor:pointer}
.sbtn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.sbtn.d{border-color:var(--danger);color:var(--danger)}

/* ══ NOMZOD KARTASI (Tanlovlar va vakansiya sahifasi) ══════════
   Kontakt ochilgach sarlavhada ISM va foto; lavozim rol bo'yicha bir
   xil yoziladi. Qaror — uchta tugma emas, bosqichlar chizig'i. */
.grp{margin-bottom:18px}
.grp-h{display:flex;align-items:baseline;gap:8px;padding:2px 4px 9px}
.grp-h b{font-size:16px;font-weight:700;flex:1;min-width:0}
.grp-h span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.grp-h .cl{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(100,116,139,.14);color:var(--muted)}
.cd{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(15,39,71,.05)}
.cd-top{display:flex;gap:12px;align-items:center}
.cd-ph{width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden;background:var(--soft-blue);
  color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.cd-ph img{width:100%;height:100%;object-fit:cover}
/* Kartaning o'zini bosish — rezyume (tugmalar o'z ishini qiladi) */
.cd[data-rzc]{cursor:pointer;transition:background .15s}
.cd[data-rzc]:active{background:var(--soft-blue)}
.cd-mid{flex:1;min-width:0}
.cd-nm{font-size:16px;font-weight:700;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cd-sub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stc{flex:none;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap}
.stc.waiting{background:rgba(180,128,46,.13);color:var(--warn)}
.stc.open{background:rgba(37,99,235,.1);color:var(--blue)}
.stc.hired{background:rgba(46,158,91,.14);color:var(--ok)}
.stc.no,.stc.refunded{background:rgba(100,116,139,.13);color:var(--muted)}
.cd-wait{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45}
.cd-acts{display:flex;gap:8px;margin-top:12px}
/* Pullik amal (kontaktni ochish) — alohida keng qatorda, narxi bilan; qolganlari ostida (iOS) */
.cd-acts.paid{flex-wrap:wrap}
.cd-acts.paid .cd-btn[data-open]{flex:1 0 100%;order:-1;white-space:nowrap;padding:12px 10px}
.cd-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;
  border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer}
.cd-btn svg{width:17px;height:17px;flex:none}
.cd-btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.cd-steps{display:flex;align-items:flex-start;margin-top:14px;padding:0 2px}
.sp{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:76px;
  font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;border:0;background:none;
  font-family:inherit;padding:0;cursor:default}
.sp i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}
.sp.done{color:var(--ink)}
.sp.done i{background:var(--blue);border-color:var(--blue)}
.sp.next{color:var(--blue);cursor:pointer}
.sp.next i{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.sp.hiredone i{background:var(--ok);border-color:var(--ok)}
.sp-ln{flex:1;height:2px;background:var(--line);margin-top:10px;border-radius:2px}
.sp-ln.done{background:var(--blue)}
.sp-ln.win{background:var(--ok)}
.cd-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.cd-foot span{flex:1}
.cd-nf{border:0;background:none;color:var(--danger);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 0}
.cd-box:empty{display:none}
.cd-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cd-box .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.cd-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:15px}

/* Pastki oyna — "Orqaga" va balans */
.sh-bk{border:none;background:transparent;font-size:18px;color:var(--blue);padding:0 12px 0 0;cursor:pointer;line-height:1}
.cr-big{display:flex;align-items:baseline;gap:9px;padding:6px 0 14px}
.cr-big b{font-size:40px;font-weight:700;color:var(--blue);line-height:1}
/* Tariflar (src/data/plans.js): holat qatori, kartalar, to'lov usuli */
.pl-now{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.pl-now b{font-size:15px}
.pl-now span{color:var(--muted);font-size:13px}
.pl-note{font-size:12.5px;color:var(--blue);font-weight:600;margin:0 0 10px}
.pl-card{border:1.5px solid var(--line);border-radius:16px;padding:15px 15px 14px;margin-bottom:11px;background:var(--card)}
.pl-card.pop{border-color:var(--blue)}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl-name{font-size:18px;font-weight:700}
.pl-tag{font-size:11.5px;font-weight:700;color:#fff;background:var(--blue);border-radius:99px;padding:3px 9px}
.pl-price{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.3px}
.pl-price small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.pl-meta{font-size:14px;font-weight:600;color:var(--blue);margin-top:2px}
.pl-f{list-style:none;margin:10px 0 12px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.4}
.pl-f li{display:flex;gap:7px}
.pl-f li::before{content:'✓';color:var(--ok);font-weight:700;flex:none}
.pl-f li.g{color:var(--ink)}
.pl-f li.g::before{content:'★';color:#E8A317}
.pl-terms{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
.pl-banner{background:rgba(232,163,23,.13);color:#8A5A00;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.pl-g{background:var(--bg);border-radius:12px;padding:11px 13px;margin:-4px 0 12px}
.pl-g-t{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;gap:8px}
.pl-g-t b{font-size:15px}
.pl-g-bar{height:6px;border-radius:99px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.pl-g-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E8A317,#F5C04A)}
.pl-g-d{font-size:12px;color:var(--muted);line-height:1.4}
.pl-auto-l{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.pl-auto-r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.pl-auto-e{font-size:12.5px;color:var(--danger);margin-top:6px}
.lnk{background:none;border:none;padding:0;color:var(--blue);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.pl-terms a{color:var(--blue)}
.ref-o{margin-top:10px}
.ref-hero{font-size:44px;text-align:center;margin:4px 0 6px}
.ref-d{font-size:15px;line-height:1.5;text-align:center;margin-bottom:14px}
.ref-link{background:var(--bg);border-radius:12px;padding:12px;font-size:13.5px;word-break:break-all;margin-bottom:10px;user-select:all;-webkit-user-select:all}
.ref-st{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 4px}
.ref-steps{font-size:13.5px;line-height:1.5;padding-left:20px;color:var(--ink);margin:10px 0 0}
.pm-note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:10px}
.pm-note a{color:var(--blue)}
.pm-logo{flex:none;background:#33CCCC;color:#fff;font-weight:800;border-radius:8px;padding:5px 8px;font-size:12px}

/* ── Tab paneli: "suyuq shisha" ──
   Namuna — iOS Liquid Glass. Haqiqiy sinish (ortidagini egib ko'rsatish)
   veb'da mumkin emas: Safari backdrop-filter'da SVG filtrni qo'llamaydi.
   Shuning uchun taqlid: yupqa shisha + kuchli blur, yuqori chetda
   yaltirash, faol bo'limda kamalak chetli "linza" prujina bilan suriladi.
   Shisha faqat ortidan nimadir o'tganda ko'rinadi — bo'sh och fonda oq.
   Emoji EMAS — Lucide ikonkalari. Yozuv qoladi: bo'limlar universal emas.
   Blur ishlamaydigan eski WebView'da oddiy oq fon (@supports). */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:2px;padding:5px;border-radius:28px;z-index:10;isolation:isolate;
  background:rgba(255,255,255,.96);border:1px solid rgba(225,232,242,.9);
  box-shadow:0 10px 30px rgba(15,39,71,.16),0 2px 6px rgba(15,39,71,.08)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .tabs{background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.66));   /* audit: .34/.14 da orqadagi matn ko'rinardi */
    -webkit-backdrop-filter:blur(14px) saturate(210%);backdrop-filter:blur(14px) saturate(210%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),
      inset 0 0 0 .5px rgba(15,39,71,.07),0 10px 30px rgba(15,39,71,.16),0 2px 6px rgba(15,39,71,.08)}
}
/* Yuqori yarmidagi yaltirash — shishaning "qalinligi" */
.tabs::before{content:'';position:absolute;left:2px;right:2px;top:1px;height:46%;
  border-radius:26px 26px 12px 12px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}

/* Faol bo'lim — linza. Bitta element, moveLens() uni faol tab ostiga
   suradi; tablardan biroz kattaroq (scale), namunadagidek panel chetidan
   chiqib turadi. ::after — kamalak chet (sinish chizig'i taqlidi). */
.lens{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:23px;z-index:0;
  pointer-events:none;opacity:0;
  transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1),opacity .2s;
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.9),rgba(255,255,255,.4) 55%,rgba(255,255,255,.2));
  box-shadow:inset 0 1px 1px #fff,inset 0 -3px 6px rgba(255,255,255,.45),
    0 4px 14px rgba(15,39,71,.15),0 1px 2px rgba(15,39,71,.08)}
.lens::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(100deg,rgba(255,80,160,.65),rgba(255,196,80,.5) 22%,rgba(255,255,255,.8) 46%,
    rgba(80,196,255,.65) 72%,rgba(140,96,255,.65));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.lens.on{opacity:1}
/* Surish: sahifa aylanmasin, matn belgilanmasin, uzoq bosishda menyu chiqmasin */
.tabs{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Surilayotgan linza — kattaroq va shaffofroq, "lupa" kabi */
.lens.drag{background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.7),rgba(255,255,255,.22) 60%,rgba(255,255,255,.08));
  box-shadow:inset 0 1px 1px #fff,inset 0 -4px 8px rgba(255,255,255,.5),
    0 10px 24px rgba(15,39,71,.2),0 2px 4px rgba(15,39,71,.1)}
.tb.hov{color:var(--ink)}

/* Tungi rejim: qoramtir shisha (iOS dark material), linza xira oq */
:root[data-theme="dark"] .tabs{ background:rgba(28,28,30,.94); border-color:rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4); }
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root[data-theme="dark"] .tabs{ background:linear-gradient(180deg,rgba(44,44,46,.82),rgba(28,28,30,.74));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 10px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4); }
}
:root[data-theme="dark"] .tabs::before{ background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0)); }
:root[data-theme="dark"] .lens, :root[data-theme="dark"] .lens.drag{
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.22),rgba(255,255,255,.10) 60%,rgba(255,255,255,.05));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25), 0 4px 14px rgba(0,0,0,.4); }

.tb{position:relative;z-index:1;flex:1;min-width:0;border:none;background:transparent;border-radius:21px;

      <!-- Til — har tilda o'z nomi bilan: tilni tushunmagan odam ham topsin -->
      <div class="lng"><span data-t="lang.title">Til / Язык</span>
        <div class="seg"><button data-lang="uz">O'zbekcha</button><button data-lang="ru">Русский</button></div></div>
      <button class="btn" id="bChat" style="width:100%" data-t="chat.backToBot">Botga qaytish</button>
    </div>
  </div>

  <!-- Ochilgan suhbat: butun ekran, pastdagi tablar ustidan.
       Shunda klaviatura chiqqanda tab paneli yozuv maydonini bosmaydi. -->
  <div class="cv hide" id="cv">
    <div class="cv-h">
      <button class="cv-back" id="cvBack">&#10094;</button>
      <div class="cv-who" id="cvWho">
        <div class="ch-av" id="cvAv" data-nozoom>—</div>
        <div style="flex:1;min-width:0">
          <div class="ch-top"><span class="ch-name" id="cvName">—</span><span id="cvVf"></span></div>
          <div class="ch-last" id="cvSub"></div>
        </div>
      </div>
    </div>
    <div class="cv-b" id="cvBody"></div>
    <div class="cv-f">
      <input id="cvIn" placeholder="Xabar yozing…" data-tp="chat.placeholder" autocomplete="off" maxlength="2000">
      <button class="cv-send" id="cvSend">&#10148;</button>
    </div>
  </div>

  <!-- Ikonkalar: Lucide (clipboard-list, inbox, briefcase, message-circle) -->
  <nav class="tabs">
    <span class="lens" id="lens" aria-hidden="true"></span>
    <button class="tb on" id="tSL"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span><span data-t="tab.sl">Tanlovlar</span></button>
    <button class="tb"    id="tAP"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><i class="dot" id="dAP"></i></span><span data-t="tab.ap">Arizalar</span></button>
    <button class="tb"    id="tVC"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg></span><span data-t="tab.vc">Vakansiya</span></button>
    <button class="tb"    id="tMS"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><i class="dot" id="dMS"></i></span><span data-t="tab.ms">Aloqa</span></button>
  </nav>
</div>

<div class="sheet" id="sheet">
  <div class="sh">
    <div class="sh-h"><button class="sh-bk hide" id="shBack" aria-label="Orqaga" data-ta="common.back">&#10094;</button><b id="shT">—</b><button class="sh-x" id="shX">&#10005;</button></div>
    <div class="sh-b" id="shB"></div>
  </div>
</div>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
// Kunduz/tun — Telegram sozlamasidan. Sarlavha, fon va pastki panel
// ranglari ham ilovaga moslanadi: ilgari tungi Telegram'da qora
// sarlavha ostida oq sahifa chiqardi (2026-10-20 audit).
function applyTheme(){
  const dark = !!(TG && TG.colorScheme === 'dark');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = dark ? '#000000' : '#F2F2F7';
  try {
    if (TG && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9')) { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); }
    if (TG && TG.isVersionAtLeast && TG.isVersionAtLeast('7.10') && TG.setBottomBarColor) TG.setBottomBarColor(bg);
  } catch(e){}
}
applyTheme();
if (TG) { TG.ready(); TG.expand(); try { TG.onEvent('themeChanged', applyTheme); } catch(e){} }

// ── Til ──
// Hamma matn t('kalit') orqali — lug'at public/js/th-i18n.js da, server
// ham shundan foydalanadi. Haqiqiy tanlov serverda (Client.lang); bu yerda
// birinchi chizish uchun taxmin: oxirgi tanlov yoki Telegram tili.
// Server boshqa til qaytarsa (/me, seans) — useLang() uni qo'llaydi.
const I18N = window.THI18N;
let LANG = (() => {
  try { const s = localStorage.getItem('th_lang'); if (I18N.LANGS.includes(s)) return s; } catch(e){}
  const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  return I18N.fromTelegram(u && u.language_code);
})();
const t = (k, v) => I18N.t(LANG, k, v);
const LOC = () => LANG === 'ru' ? 'ru-RU' : 'uz-UZ';

// Statik matnlar: data-t (matn), data-tp (placeholder), data-ta (aria-label)
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
  document.querySelectorAll('[data-ta]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.ta)); });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
}
// Serverdan kelgan til (manba — Client.lang). true — til o'zgardi.
function useLang(l){
  if (!I18N.LANGS.includes(l) || l === LANG) return false;
  LANG = l;
  try { localStorage.setItem('th_lang', l); } catch(e){}
  applyStatic();
  return true;
}
applyStatic();

// Qidiruv seansi kaliti. Botdan ?s= bilan keladi; kabinetdagi "Mos
// nomzodlar" esa uni joyida almashtiradi (openSearch) — sahifani qayta
// yuklamaymiz, chunki Telegram initData qayta yuklashda yo'qolishi mumkin.
let KEY = new URLSearchParams(location.search).get('s') || '';
let FROM_CAB = false;      // qidiruv kabinetdan ochilgan — orqaga qaytish bor
const INIT = (TG && TG.initData) || '';
const $ = id => document.getElementById(id);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const haptic = t => { try { TG && TG.HapticFeedback && TG.HapticFeedback[t==='sel'?'selectionChanged':'impactOccurred'](t==='sel'?undefined:'light'); } catch(e){} };

// Rasm havolasi uchun token — server har javobda beradi (X-Photo-Token).
// Havolaga Telegram imzosi (INIT) qo'yilmaydi: u butun API kaliti.
let PT = '';
async function api(path, opt){
  const r = await fetch(path, Object.assign({
    headers: { 'Content-Type':'application/json', 'X-Telegram-Init-Data': INIT }
  }, opt));
  PT = r.headers.get('X-Photo-Token') || PT;
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || t('common.error'));    // server xatoni mijoz tilida beradi
  return d;
}

const dt = s => s ? new Date(s).toLocaleDateString(LOC(),{day:'2-digit',month:'short'}) : '';
const initialsOf = code => String(code||'—').replace('A-','').slice(0,2);

// ══════════════════════════════════════════════════════════
//  QIDIRUV REJIMI
// ══════════════════════════════════════════════════════════
const SEL = new Set(), SEEN = new Set();
let ROWS = [], cur = -1;

const show = h => { $('list').innerHTML = `<div class="msg">${h}</div>`; };
const photoUrl = c => `/api/ma/photo/${encodeURIComponent(KEY)}/${encodeURIComponent(c.id)}?t=${encodeURIComponent(PT)}`;

function statusChip(c){
  if (!c.jobStatus || c.jobStatus === 'unknown') return '';
  const cls = c.jobStatus === 'active' ? 'act' : (c.jobStatus === 'not_looking' ? 'no' : '');
  return `<span class="t ${cls}">${esc(t('job.' + c.jobStatus))}</span>`;
}
// "3 yil tajriba · 24 yosh · Toshkent" — kartalar, arizalar, rezyumeda bir xil
// 0 yil, lekin oylar bor (anketa: "6 oy – 1 yil") — "1 yilgacha", tajribasiz emas
const expTxt = (n, m) => n ? t('fact.exp', { n }) : m ? t('fact.expLt1') : t('fact.noExp');
function factLine(c){
  const b = [expTxt(c.experienceYears, c.experienceMonths)];
  if (c.age) b.push(t('fact.age', { n: c.age }));
  if (c.location) b.push(c.location);
  return b.join(' · ');
}

function cardHtml(c){
  // Kimlik qoidasi (whoOf): oldin kontaktini ochgan nomzod — ism bilan
  const w = whoOf(c);
  return `<div class="c ${SEL.has(c.id)?'on':''} ${SEEN.has(c.id)?'seen':''}" data-id="${c.id}">
    <div class="ph">${c.hasPhoto ? `<img src="${photoUrl(c)}" alt="">` : w.avatar}</div>
    <div class="b">
      <div class="code">${esc(w.open ? w.sub : c.publicCode)}</div>
      <div class="pos">${esc(w.title)}</div>
      <div class="meta">${esc(factLine(c))}</div>
      <div class="tags">
        ${trustTags(c)}
        ${c.fitScore ? `<span class="t ai">${esc(t('card.ai', { n: c.fitScore }))}</span>` : ''}
        ${statusChip(c)}
        ${c.startWhen === 'now' ? `<span class="t act">${esc(t('card.now'))}</span>` : ''}
        ${c.salaryExpectation ? `<span class="t">${esc(c.salaryExpectation)}</span>` : ''}
      </div>
      <div class="seenmark">${esc(t('card.seen'))}</div>
    </div>
    <div class="tick"></div>
  </div>`;
}

function renderList(){
  cur = -1;
  $('listView').style.display = 'block';
  $('detail').style.display = 'none';
  if (TG && TG.BackButton) TG.BackButton.hide();

  $('list').innerHTML = ROWS.map(cardHtml).join('');
  document.querySelectorAll('.c').forEach(el=>{
    el.onclick = e => {
      if (e.target.classList.contains('tick')) { toggle(el.dataset.id); return; }
      openDetail(ROWS.findIndex(r => r.id === el.dataset.id));
    };
  });
  updateBar();
}

function toggle(id){
  SEL.has(id) ? SEL.delete(id) : SEL.add(id);
  haptic('sel');
  const el = document.querySelector(`.c[data-id="${id}"]`);
  if (el) el.classList.toggle('on');
  updateBar();
}

function openDetail(i){
  if (i < 0 || i >= ROWS.length) return;
  cur = i;
  const c = ROWS[i];
  SEEN.add(c.id);

  $('listView').style.display = 'none';
  const d = $('detail');
  // 'block' aniq yoziladi: bo'sh qiymat inline stilni olib tashlaydi va
  // CSS'dagi #detail{display:none} qaytib kuchga kiradi.
  d.style.display = 'block';
  window.scrollTo(0, 0);
  // Bosilishi umumiy onTgBack orqali (bitta ishlovchi — har ochilishda yangisi qo'shilmasin)
  if (TG && TG.BackButton) TG.BackButton.show();

  const work = (c.workHistory||[]).map(w => `
    <div class="w">
      <div class="w-p">${esc(w.position || t('w.noPos'))}</div>
      ${w.company ? `<div class="w-c">${esc(w.company)}</div>` : ''}
      ${w.period ? `<div class="w-c">${esc(w.period)}</div>` : ''}
      ${w.description ? `<div class="w-d">${esc(w.description)}</div>` : ''}
    </div>`).join('');

  const who = whoOf(c);
  d.innerHTML = `
    ${c.hasPhoto ? `<img class="d-ph" src="${photoUrl(c)}" alt="">`
                 : `<div class="d-ph-none">${esc(who.ini)}</div>`}
    <div class="d-head">
      <div class="d-code">${esc(who.open ? who.sub : c.publicCode)}</div>
      <div class="d-pos">${esc(who.title)}</div>
      <div class="d-meta">${esc(factLine(c))}</div>
      <div class="tags" style="margin-top:9px">
        ${c.fitScore ? `<span class="t ai">${esc(t('d.aiFit', { n: c.fitScore }))}</span>` : ''}
        ${statusChip(c)}
      </div>
    </div>
    ${c.summary ? `<div class="sec"><h3>${esc(t('d.summary'))}</h3><div class="ai">${esc(c.summary)}</div></div>` : ''}
    ${c.fitReason ? `<div class="sec"><div class="ai"><b>${esc(t('d.why'))}</b> ${esc(c.fitReason)}</div></div>` : ''}
    <div class="sec"><h3>${esc(t('d.info'))}</h3>
      ${startL(c.startWhen) ? `<div class="kv"><span class="k">${esc(t('rz.start'))}</span><span class="v">${esc(startL(c.startWhen))}</span></div>` : ''}
      ${c.salaryExpectation ? `<div class="kv"><span class="k">${esc(t('d.salary'))}</span><span class="v">${esc(c.salaryExpectation)}</span></div>` : ''}
      ${c.experienceYears ? `<div class="kv"><span class="k">${esc(t('d.totalExp'))}</span><span class="v">${esc(t('unit.years', { n: c.experienceYears }))}</span></div>` : ''}
      ${c.education ? `<div class="kv"><span class="k">${esc(t('d.edu'))}</span><span class="v">${esc(c.education)}</span></div>` : ''}
      ${c.location ? `<div class="kv"><span class="k">${esc(t('d.region'))}</span><span class="v">${esc(c.location)}</span></div>` : ''}
      ${c.shift ? `<div class="kv"><span class="k">${esc(t('d.shift'))}</span><span class="v">${esc(shiftL(c.shift))}</span></div>` : ''}
    </div>
    ${(c.languages||[]).length ? `<div class="sec"><h3>${esc(t('d.langs'))}</h3><div class="chips">${c.languages.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>` : ''}
    ${(c.skills||[]).length ? `<div class="sec"><h3>${esc(t('d.skills'))}</h3><div class="chips">${c.skills.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>` : ''}
    ${c.experienceSummary ? `<div class="sec"><h3>${esc(t('d.aboutExp'))}</h3><p>${esc(c.experienceSummary)}</p></div>` : ''}
    ${work ? `<div class="sec"><h3>${esc(t('d.work'))}</h3>${work}</div>` : ''}
    <div style="height:14px"></div>`;

  updateBar();
}

function updateBar(){
  const bar = $('bar');
  bar.style.display = ROWS.length ? 'flex' : 'none';

  if (cur < 0) {
    $('cnt').textContent = t('bar.count', { n: ROWS.length }) + (SEL.size ? t('bar.selected', { n: SEL.size }) : '');
    bar.innerHTML = `<button class="btn" id="send" ${SEL.size?'':'disabled'}>
      ${esc(SEL.size ? t('bar.send', { n: SEL.size }) : t('bar.pickSome'))}</button>`;
    if (SEL.size) $('send').onclick = submit;
    return;
  }

  const c = ROWS[cur], on = SEL.has(c.id);
  bar.innerHTML = `
    <button class="nav" id="prev" ${cur===0?'disabled':''}>&#9664;</button>
    <span class="pg">${cur+1} / ${ROWS.length}</span>
    <button class="btn ${on?'ghost':''}" id="pick">${esc(on ? t('bar.picked') : t('bar.pick'))}</button>
    <button class="nav" id="next" ${cur===ROWS.length-1?'disabled':''}>&#9654;</button>`;
  $('prev').onclick = ()=>openDetail(cur-1);
  $('next').onclick = ()=>openDetail(cur+1);
  $('pick').onclick = ()=>{ SEL.has(c.id) ? SEL.delete(c.id) : SEL.add(c.id); haptic('sel'); updateBar(); };
}

async function submit(){
  const b = $('send');
  b.disabled = true; b.textContent = t('common.sending');
  try{
    const r = await api('/api/ma/shortlist', {
      method:'POST', body: JSON.stringify({ key: KEY, ids: [...SEL] })
    });
    $('bar').style.display = 'none';
    $('sum').textContent = ''; $('cnt').textContent = '';
    show(t('sub.done', { n: Number(r.count) || 0 }));        // lug'at matni ishonchli, n — son
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
    // Kabinetdan ochilgan bo'lsa — kabinetga qaytamiz (Mini App'ni yopmaymiz)
    if (FROM_CAB) setTimeout(backToCab, 2500);
    else if (TG) setTimeout(()=>TG.close(), 3000);
  }catch(e){
    b.disabled = false; b.textContent = t('common.retry');
    show(esc(t('sub.fail', { e: e.message })));
  }
}

// ══════════════════════════════════════════════════════════
//  KABINET
// ══════════════════════════════════════════════════════════
// Joriy balans — arizadan kontakt ochishda tasdiq matni va oldindan tekshiruv uchun
let CREDITS = null;
async function loadMe(){
  try{
    const m = await api('/api/ma/me');
    useLang(m.lang);                     // haqiqiy tanlov — serverda (Client.lang)
    $('cName').textContent = m.name || t('cab.client');
    $('cCred').textContent = m.credits;
    $('cCredNote').textContent = t('cab.credits', { n: m.credits }) + (m.plan && m.plan.key ? ' · ' + t('plan.' + m.plan.key) : '');
    CREDITS = m.credits;                 // "Kontaktni ochish" tasdig'ida balans
    const s = m.stats || {};
    $('cStats').innerHTML = `
      <div class="stat"><b>${s.searches||0}</b><span>${t('st.searches')}</span></div>
      <div class="stat"><b>${s.picked||0}</b><span>${t('st.picked')}</span></div>
      <div class="stat"><b>${s.revealed||0}</b><span>${t('st.revealed')}</span></div>
      <div class="stat"><b>${s.avgHours==null?'—':s.avgHours<1?'&lt;1':Math.round(s.avgHours)}</b><span>${t('st.hours')}</span></div>`;
  }catch(e){ $('cName').textContent = e.message; }
}

// ══════════════════════════════════════════════════════════
//  NOMZOD KARTASI — "Tanlovlar" va vakansiya sahifasi uchun bitta
// ══════════════════════════════════════════════════════════
// Kontakt ochilgach sarlavhada ISM va foto (kod emas), lavozim rol
// bo'yicha bir xil ("Xostess", xom "Хостес" emas). Qaror — bosqichlar
// chizig'i: Kontakt → Suhbat → Ishga olindi; "Mos kelmadi" kichik havola.

const OY = {
  uz: ['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'],
  ru: ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек']
};
// "18-okt" / "18 окт"
const dShort = s => { if (!s) return ''; const d = new Date(s); return t('date.short', { d: d.getDate(), m: OY[LANG][d.getMonth()] }); };
const dTime = s => { const d = new Date(s); return dShort(s) + ', ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const nameIni = s => String(s || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '—';

// ── Nomzod sarlavhasi — HAMMA JOYDA bitta qoida ──
// Kontakt ochilgan (server contact beradi): sarlavha — ISM-FAMILIYA,
// ostida lavozim. Ochilmagan: sarlavha — lavozim, ostida kod.
// Tanlovlar, Arizalar, qidiruv kartalari va rezyume shundan foydalanadi —
// yangi joy qo'shilsa ham shu funksiyani chaqiring.
function whoOf(c){
  const role = c.roleText || c.roleLabel || c.desiredPosition || t('role.candidate');
  const name = c.contact && c.contact.fullName;
  // avatar — tayyor HTML: ochilganda ism bosh harflari, anonimda lavozim
  // belgisi ("7K" kabi kod harflari kartalarni bir-biridan ajratmasdi — audit)
  return name
    ? { open: true, title: name, sub: role, ini: nameIni(name), avatar: esc(nameIni(name)) }
    : { open: false, title: role, sub: c.publicCode || '', ini: initialsOf(c.publicCode), avatar: roleIcon(c.role) };
}
// Lavozim belgisi (Lucide uslubida). Ro'yxatda yo'q lavozim — odam belgisi.
const ROLE_IC = {
  xostess: '<path d="M3 20a1 1 0 0 1-1-1v-1a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1Z"/><path d="M20 16a8 8 0 1 0-16 0M12 4v4M10 4h4"/>',
  oshpaz: '<path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.46.32-.84.73-1.04a4 4 0 0 0-2.14-7.59 5 5 0 0 0-9.18 0 4 4 0 0 0-2.14 7.59c.41.2.73.58.73 1.04V20a1 1 0 0 0 1 1ZM6 17h12"/>',
  ofitsiant: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  barmen: '<path d="M8 22h8M7 10h10M12 15v7M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z"/>',
  kassir: '<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
  menejer: '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
  _: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
};
const roleIcon = r => `<svg class="role-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ROLE_IC[r] || ROLE_IC._}</svg>`;
// Ishonch belgilari (server: faqat ha/yo'q, raqamsiz)
const trustTags = c => (c.phoneVerified ? `<span class="t act">✓ ${esc(t('card.verified'))}</span>` : '')
                     + (c.fromAnketa ? `<span class="t">${esc(t('card.anketa'))}</span>` : '');
const IC = {

// Holat chipi: 'waiting' | 'open' | 'hired' | 'refunded' -> lug'at 'chip.*'
const chipOf = st => ['waiting', 'open', 'hired', 'refunded'].includes(st) ? t('chip.' + st) : '';
// "3 soat", "2 kun" — HR qancha vaqtdan beri bog'lanayotgani
function agoTxt(s){
  if (!s) return '';
  const h = (Date.now() - new Date(s).getTime()) / 36e5;
  return h < 1 ? t('ago.lt1') : h < 24 ? t('ago.h', { n: Math.floor(h) }) : t('ago.d', { n: Math.floor(h / 24) });
}

function stepsHtml(it){
  const st = it.stage, sl = esc(it.shortlistId), id = esc(it.candidateId);
  const ivDone = st === 'interview' || st === 'hired', hired = st === 'hired';
  // Keyingi qadam bosiladi: kontaktdan keyin suhbat yoki darhol ishga olish
  const ivAttr = !ivDone ? `data-iv="${id}" data-sl="${sl}"` : '';
  const hrAttr = !hired ? `data-hire="${id}" data-sl="${sl}"` : '';
  return `<div class="cd-steps">
      <div class="sp done${hired ? ' hiredone' : ''}"><i>&#10003;</i>${esc(t('step.contact'))}</div>
      <div class="sp-ln ${hired ? 'win' : ivDone ? 'done' : ''}"></div>
      <button class="sp ${ivDone ? 'done' + (hired ? ' hiredone' : '') : 'next'}" ${ivAttr}><i>${ivDone ? '&#10003;' : ''}</i>${esc(t('step.interview'))}</button>
      <div class="sp-ln ${hired ? 'win' : ''}"></div>
      <button class="sp ${hired ? 'done hiredone' : 'next'}" ${hrAttr}><i>${hired ? '&#10003;' : ''}</i>${esc(t('step.hired'))}</button>

function candHtml(it){
  const w = whoOf(it), open = w.open, name = w.title;
  const meta = [factLine({ experienceYears: it.experienceYears, experienceMonths: it.experienceMonths, age: it.age, location: it.location })];
  const sub = [w.sub, ...meta].filter(Boolean).join(' · ');
  const photo = it.hasPhoto
    ? `<img src="/api/ma/photo-sl/${encodeURIComponent(it.shortlistId)}/${encodeURIComponent(it.candidateId)}?t=${encodeURIComponent(PT)}" alt="">`
    : w.avatar;
  // stateLabel serverdan mijoz tilida keladi
  const chipTxt = it.state === 'no' ? it.stateLabel : (chipOf(it.state) || it.stateLabel);

  let body = '';
  if (open && it.stage !== 'not_fit') {
    const tel = String(it.contact.phone || '').replace(/[^\d+]/g, '');

        <button class="cd-btn" data-rz="${esc(it.candidateId)}">${IC.doc}${esc(t('act.resume'))}</button>

    // Ixcham: bitta qator holat + rezyume (kontaktgacha — anonim).
    // Uzun izoh har kartada takrorlanib ro'yxatni tartibsiz qilardi.
    const line = open ? t('nf.btn') + (it.reason ? ' — ' + it.reason : '')
               : it.state === 'waiting' ? t('line.hr', { t: agoTxt(it.since) })
               : (it.reason || it.stateLabel);

      <button class="cd-link" data-rz="${esc(it.candidateId)}">${esc(t('link.resume'))}</button></div>`;

      <div class="cd-ph">${photo}</div>
      <div class="cd-mid"><div class="cd-nm">${esc(name)}</div><div class="cd-sub">${esc(sub)}</div></div>
      <span class="stc ${esc(it.state)}">${esc(chipTxt)}</span>

}

// ── Tanlovlar: vakansiya bo'yicha guruhlangan ──
// Endi har tanlovning vakansiyasi bor — "Xostes · 18-okt" kabi qidiruv
// nomi o'rniga mijozga tanish vakansiya nomi chiqadi.
// Filtr va tartib: harakat talab qiladiganlar (kontakt ochilgan — qo'ng'iroq
// qilish kerak) tepada; yopilgan vakansiyalar pastda yig'ilgan.
let SL_ROWS = [], SLF = 'all', showClosedSl = false;
const FILTERS = ['all', 'contact', 'wait', 'hired'];          // yozuvi — t('f.<kalit>')
const inFilter = (it, f) => f === 'all'
  || (f === 'wait' && it.state === 'waiting')
  || (f === 'contact' && !!it.contact && (it.stage === 'contact' || it.stage === 'interview'))
  || (f === 'hired' && it.stage === 'hired');
const prio = it => inFilter(it, 'contact') ? 0 : it.state === 'waiting' ? 1 : it.stage === 'hired' ? 2 : 3;

async function loadShortlists(){
  try { SL_ROWS = await api('/api/ma/shortlists'); renderShortlists(); }
  catch(e){ $('slList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}

function renderShortlists(){
  if (!SL_ROWS.length) {
    $('slList').innerHTML = `<div class="msg">${t('sl.empty')}</div>`;
    return;
  }
  const groups = [], gBy = {};
  for (const s of SL_ROWS) {
    const key = s.vacancyId || 's:' + s.id;
    let g = gBy[key];
    if (!g) { g = gBy[key] = { title: s.vacancyTitle || s.summary, closed: s.vacancyStatus === 'closed', items: [], seen: new Set() }; groups.push(g); }
    for (const it of s.items) if (!g.seen.has(it.candidateId)) { g.seen.add(it.candidateId); g.items.push(it); }
  }
  const all = groups.flatMap(g => g.items);
  const cnt = Object.fromEntries(FILTERS.map(k => [k, all.filter(it => inFilter(it, k)).length]));

  const groupHtml = g => {
    const items = g.items.filter(it => inFilter(it, SLF)).sort((a, b) => prio(a) - prio(b));
    if (!items.length) return '';
    const opened = g.items.filter(i => i.contact).length;
    return `<div class="grp">
      <div class="grp-h"><b>${esc(g.title)}</b>${g.closed ? `<span class="cl">${esc(t('grp.closed'))}</span>` : ''}
        <span>${esc(t('grp.count', { n: g.items.length }) + (opened ? t('grp.contacts', { n: opened }) : ''))}</span></div>
      ${items.map(candHtml).join('')}
    </div>`;
  };
  const act = groups.filter(g => !g.closed).map(groupHtml).join('');
  const closedG = groups.filter(g => g.closed);
  const closedHtml = closedG.map(groupHtml).join('');

  $('slList').innerHTML =
    `<div class="flt">${FILTERS.filter(k => k === 'all' || cnt[k]).map(k =>
      `<button class="${SLF === k ? 'on' : ''}" data-f="${k}">${esc(t('f.' + k))}<b>${cnt[k]}</b></button>`).join('')}</div>` +
    (act || (!closedHtml ? `<div class="msg">${esc(t('sl.none'))}</div>` : '')) +
    (closedHtml ? `<button class="vk-closed-h" id="bClosedSl">${showClosedSl ? '&#9662;' : '&#9656;'} ${esc(t('sl.closedVacs', { n: closedG.length }))}</button>` +
      (showClosedSl ? closedHtml : '') : '');

  $('slList').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { SLF = b.dataset.f; haptic('sel'); renderShortlists(); });
  if ($('bClosedSl')) $('bClosedSl').onclick = () => { showClosedSl = !showClosedSl; renderShortlists(); };
  wireCards($('slList'), loadShortlists);
}

const NOT_FIT = ['experience', 'language', 'no_show', 'salary_ask', 'other'];

async function decide(slId, candId, body){

// Kartalardagi amallar. root — qaysi ro'yxat (Tanlovlar yoki vakansiya
// sahifasi), refresh — qarordan keyin o'shani qayta chizish. Forma
// kartaning o'z qutisiga chiziladi: bir nomzod ikki ro'yxatda bo'lsa ham
// id to'qnashmaydi.
// Kartaning bo'sh joyini bosish — rezyume. Ichidagi tugma, havola, bosqichlar
// va forma o'z ishini qiladi (ularga bosilsa karta ochilmaydi); fotoni
// bosish — rasm oynasi (th-viewer, capture bosqichida ushlaydi).
const CARD_SKIP = 'button, a, input, select, textarea, label, .cd-box, .cd-steps';
function wireCardTap(root){
  root.querySelectorAll('[data-rzc]').forEach(cd => cd.onclick = e => {
    if (e.target.closest(CARD_SKIP)) return;
    haptic(); showResume(cd.dataset.rzc);
  });
}

function wireCards(root, refresh){
  const boxOf = el => el.closest('.cd').querySelector('.cd-box');
  wireCardTap(root);
  root.querySelectorAll('[data-rz]').forEach(b => b.onclick = () => showResume(b.dataset.rz));
  root.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => openChatWith(b.dataset.chat));

  // Suhbat sanasi
  root.querySelectorAll('[data-iv]').forEach(b => b.onclick = () => {
    const box = boxOf(b), id = b.dataset.iv, sl = b.dataset.sl;
    box.innerHTML = `<div style="font-size:13px;color:var(--muted)">${esc(t('iv.when'))}</div>
      <input type="datetime-local" style="margin-top:8px">
      <div class="acts"><button class="sbtn p">${esc(t('common.save'))}</button><button class="sbtn">${esc(t('common.cancel'))}</button></div>`;
    const [ok, no] = box.querySelectorAll('button');
    ok.onclick = async () => {
      const v = box.querySelector('input').value;
      if (!v) return;
      ok.disabled = true;
      try { await decide(sl, id, { state:'interview', interviewAt: new Date(v).toISOString() }); refresh(); }
      catch(e){ showMsg(e.message); ok.disabled = false; }
    };
    no.onclick = () => { box.innerHTML = ''; };
  });

  // Ishga olindi — butun tizimning yakuniy ko'rsatkichi
  root.querySelectorAll('[data-hire]').forEach(b => b.onclick = async () => {
    if (!confirm(t('hire.confirm'))) return;
    b.disabled = true;
    try { await decide(b.dataset.sl, b.dataset.hire, { state:'hired' }); refresh(); }
    catch(e){ showMsg(e.message); b.disabled = false; }
  });

  // Mos kelmadi — sabab bilan, aks holda keyingi qidiruv yaxshilanmaydi
  root.querySelectorAll('[data-nf]').forEach(b => b.onclick = () => {
    const box = boxOf(b), id = b.dataset.nf, sl = b.dataset.sl;
    box.innerHTML = `<div style="font-size:13px;color:var(--muted)">${esc(t('nf.why'))}</div>
      <div class="acts">${NOT_FIT.map(k => `<button class="sbtn" data-r="${k}">${esc(nfLabel(k))}</button>`).join('')}
        <button class="sbtn" data-r="">${esc(t('common.cancel'))}</button></div>`;
    box.querySelectorAll('[data-r]').forEach(x => x.onclick = async () => {
      if (!x.dataset.r) { box.innerHTML = ''; return; }
      x.disabled = true;
      try { await decide(sl, id, { state:'not_fit', reason: x.dataset.r }); refresh(); }
      catch(e){ showMsg(e.message); x.disabled = false; }
    });
  });
}

// ── Pastki oyna: zanjir ──
// Oynalar bir-birining ustiga ochiladi (Vakansiya → Arizalar → Rezyume).
// "‹" bir qadam orqaga, X hammasini yopadi. Ilgari rezyume arizalar
// O'RNIGA ochilardi va X hammasini yopib yuborardi.
// Har oyna boshida sheetEnter(kalit, qayta_chizish) — orqaga qaytilganda
// oldingisi qayta chiziladi (ma'lumot yangi bo'ladi). Kalit bir xil bo'lsa
// (oyna o'zini yangilasa) zanjirga qo'shilmaydi.
// Telegram'ning o'z "Orqaga" tugmasi ham shu zanjir bo'yicha ishlaydi.
let SH_CUR = null, SH_STACK = [], SH_RESTORE = false;
function sheetEnter(key, render){
  if (!SH_RESTORE && SH_CUR && SH_CUR.key !== key && $('sheet').classList.contains('on')) SH_STACK.push(SH_CUR);
  SH_CUR = { key, render };
  SH_RESTORE = false;
  syncBack();
}
function sheetBack(){
  const prev = SH_STACK.pop();
  if (!prev) { closeSheet(); return; }
  SH_RESTORE = true; SH_CUR = null;
  prev.render();
}
function syncBack(){
  $('shBack').classList.toggle('hide', !SH_STACK.length);
  try {
    if (TG && TG.BackButton && TG.isVersionAtLeast && TG.isVersionAtLeast('6.1')) {
      // Oyna yopilganda tugmani yashiramiz — lekin qidiruvda nomzod ochiq bo'lsa, u uniki
      const inDetail = !$('searchMode').classList.contains('hide') && cur >= 0;
      if ($('sheet').classList.contains('on') || inDetail) TG.BackButton.show(); else TG.BackButton.hide();
    }
  } catch(e){}
}
function openSheet(title, html){ $('shT').textContent = title; $('shB').innerHTML = html; $('sheet').classList.add('on'); syncBack(); }
function closeSheet(){ $('sheet').classList.remove('on'); $('shB').innerHTML = ''; SH_STACK = []; SH_CUR = null; syncBack(); }
$('shX').onclick = closeSheet;
$('shBack').onclick = sheetBack;
$('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); };
// Telegram "Orqaga" — BITTA ishlovchi: ochiq oyna bo'lsa zanjir bo'yicha,
// qidiruvda nomzod ochiq bo'lsa ro'yxatga. Ilgari qidiruv tafsiloti har
// ochilishda o'z ishlovchisini qo'shardi va kabinetdagi oynalar bilan
// to'qnashib, tugmani yashirib qo'yardi.
function onTgBack(){
  // Avval ochiq rasm (th-viewer) yopiladi — ilova yoki oyna emas
  if (window.thViewer && thViewer.consumeBack()) return;
  if ($('sheet').classList.contains('on')) { sheetBack(); return; }
  if (!$('searchMode').classList.contains('hide') && cur >= 0) renderList();
}
try { TG && TG.BackButton && TG.BackButton.onClick(onTgBack); } catch(e){}

let VACS = [], showClosed = false;

const daysAgo = s => Math.max(0, Math.floor((Date.now() - new Date(s).getTime()) / 864e5));

function funnelHtml(f){

// Arizalar — vakansiya ichiga kirmasdan ko'rinadigan joyda. Yangi bo'lsa
// yashil belgi; hammasi ko'rilgan bo'lsa — oddiy havola.
function appsBtn(id, f){
  if (!f || !f.apps) return '';
  return f.appsNew
    ? `<button class="vk-apps" data-apps="${esc(id)}"><i></i><span>${esc(t('apps.new', { n: f.appsNew }))}</span>${esc(t('apps.view'))}</button>`
    : `<button class="vk-apps calm" data-apps="${esc(id)}"><span>${esc(t('apps.all', { n: f.apps }))}</span>${esc(t('apps.view'))}</button>`;
}

function vacCardHtml(v){
  const active = v.status !== 'closed';
  const f = v.funnel || {};
  const meta = [v.salaryText || t('vac.noSalary'),
                v.schedule || (v.shift && shiftL(v.shift) !== v.shift ? shiftL(v.shift) + ' ' + t('word.shift') : '')]
    .filter(Boolean).join(' · ');
  const n = daysAgo(v.confirmedAt || v.createdAt);
  // "Tasdiqlash" o'rniga ma'nosi bilan: e'lon qilingan va bir necha kun
  // yangilanmagan bo'lsa — "Hali ochiqmi?"
  const ask = v.status === 'open' && v.listed && n >= 3;
  const foot = [
    !active ? t('vac.closed') : (n === 0 ? t('vac.today') : t('vac.daysAgo', { n })),
    v.status === 'paused' ? t('vac.paused') : '',
    active && !v.listed ? t('vac.private') : ''
  ].filter(Boolean).map(esc).join(' · ');
  return `<div class="vk ${active ? '' : 'closed'}" data-vk="${esc(v.id)}">
    <div class="vk-h"><div class="vk-ti">${esc(v.title)}</div>
      <button class="vk-more" data-more="${esc(v.id)}" aria-label="${esc(t('vac.more'))}">&#8943;</button></div>
    <div class="vk-mt">${esc(meta)}</div>
    ${funnelHtml(f)}
    ${appsBtn(v.id, f)}
    ${v.status === 'open' ? `<button class="btn vk-cta" data-match="${esc(v.id)}">${esc(t('vac.matches'))}</button>` : ''}
    <div class="vk-ft">${foot}${ask ? ` · ${esc(t('vac.stillOpen'))} <button class="vk-yes" data-conf="${esc(v.id)}">${esc(t('common.yes'))}</button>` : ''}</div>
  </div>`;
}

function renderVacs(){
  if (!VACS.length) {
    $('vcList').innerHTML = `<div class="msg">${t('vac.empty')}</div>`;
    return;
  }
  const act = VACS.filter(v => v.status !== 'closed'), cl = VACS.filter(v => v.status === 'closed');
  $('vcList').innerHTML = act.map(vacCardHtml).join('') + (cl.length
    ? `<button class="vk-closed-h" id="bClosed">${showClosed ? '&#9662;' : '&#9656;'} ${esc(t('vac.closedList', { n: cl.length }))}</button>` +
      (showClosed ? cl.map(vacCardHtml).join('') : '')
    : '');
  if ($('bClosed')) $('bClosed').onclick = () => { showClosed = !showClosed; renderVacs(); };

  const root = $('vcList');
  root.querySelectorAll('[data-vk]').forEach(el => el.onclick = e => {
    if (e.target.closest('button')) return;              // ichidagi tugmalar o'zi ishlaydi

// Mos nomzodlar — vakansiya mezonlari bo'yicha anonim kartalar
async function startMatches(id, b){
  b.disabled = true; const was = b.textContent; b.textContent = t('common.searching');
  try {

// ── ⋯ menyusi: Tahrirlash, E'lon qilish / olish, Yopish / Qayta ochish ──
function vacMenu(id, vObj){
  const v = vObj || VACS.find(x => x.id === id);
  if (!v) return;
  sheetEnter('menu:' + id, () => vacMenu(id, v));
  const active = v.status !== 'closed';
  openSheet(v.title, `
    <button class="menu-it" data-m="edit">${IC.edit}${esc(t('m.edit'))}</button>
    ${active ? (v.listed
      ? `<button class="menu-it" data-m="unlist">${IC.eyeoff}${esc(t('m.unlist'))}</button>`
      : `<button class="menu-it" data-m="list">${IC.megaphone}${esc(t('m.list'))}</button>`) : ''}
    ${active
      ? `<button class="menu-it d" data-m="close">${IC.close}${esc(t('m.close'))}</button>`
      : `<button class="menu-it" data-m="reopen">${IC.reopen}${esc(t('m.reopen'))}</button>`}`);
  $('shB').querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
    const m = b.dataset.m;
    if (m === 'edit') { vacForm(v); return; }
    if (m === 'close' && !confirm(t('m.closeConfirm'))) return;
    const body = m === 'list' ? { listed: true } : m === 'unlist' ? { listed: false }
               : m === 'close' ? { status: 'closed' } : { status: 'open' };
    b.disabled = true;
    try {
      await api('/api/ma/vacancies/' + encodeURIComponent(id), { method:'PATCH', body: JSON.stringify(body) });
      closeSheet(); haptic(); loadVacancies();
    } catch(e){ showMsg(e.message); b.disabled = false; }
  });
}

// TAKLIF (nima beramiz). Mijoz ikkinchisini to'ldirmasa, HR qo'ng'iroq
// qilganda nima aytishini bilmaydi.
// Lavozim — server bilan bir xil ro'yxat (src/data/roles.js), o'zgarsa
// ikkala joyda. Ilgari forma lavozim so'ramasdi: vakansiya 'boshqa'
// bo'lib qolardi va bot qidiruvi uni tanimay yoniga dublikat ochardi.
const ROLES = ['ofitsiant', 'barmen', 'xostess', 'oshpaz', 'kassir', 'menejer', 'operator'];   // yozuvi — t('role.<kalit>')

// vacancyAuto.makeTitle ham shundan. Server avtomatik sarlavhani bazaga
// o'zbekcha yozadi va o'quvchi tilida qaytaradi.
const autoTitle = (r, s) => ROLES.includes(r) ? I18N.vacTitle(r, s, LANG) : '';

    </div>
    <div class="fl"><label>${esc(t('form.shift'))}</label>
      <select id="fSh">

// ── Vakansiyaga kelgan arizalar ──
// ── Arizadan kontaktni o'zi ochish ──
// Tasdiq majburiy: pul yechiladi. Telegram'ning o'z oynasi (showConfirm)
// — brauzer confirm()dan ishonchliroq ko'rinadi; eski versiyada zaxira.
function askConfirm(text){
  return new Promise(res => {
    try {
      if (TG && TG.showConfirm && TG.isVersionAtLeast && TG.isVersionAtLeast('6.2')) return TG.showConfirm(text, ok => res(!!ok));
    } catch(e){}
    res(confirm(text));
  });
}

// refresh — arizalar qaysi joyda ko'rsatilgan bo'lsa (tab yoki vakansiya
// oynasi), o'shani qayta chizish
// Telegram ichida brauzer showMsg() ko'rinmasligi mumkin — Telegram oynasi
function showMsg(text){
  try { if (TG && TG.showAlert && TG.isVersionAtLeast && TG.isVersionAtLeast('6.2')) return TG.showAlert(String(text)); } catch(e){}
  alert(text);
}

async function openFromApp(b, refresh){
  if (CREDITS != null && CREDITS < 1) {
    showMsg(t('open.noCredit'));
    showPlans(); return;
  }
  const bal = CREDITS != null ? t('open.bal', { a: CREDITS, b: CREDITS - 1 }) : '';
  const ok = await askConfirm(t('open.confirm', { bal }));
  if (!ok) return;
  b.disabled = true; const was = b.innerHTML; b.textContent = t('open.opening');
  try {
    const r = await api(`/api/ma/applications/${b.dataset.open}/open`, { method:'POST', body:'{}' });
    if (r.balance != null) CREDITS = r.balance;
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
    loadMe(); loadShortlists(); if (VACS.length) loadVacancies();
    if (!$('vAP').classList.contains('hide')) loadApps();
    showResume(r.candidateId || b.dataset.cand);          // darhol ism va telefon
  } catch(e){
    showMsg(e.message);
    b.disabled = false; b.innerHTML = was;
    refresh();                                            // holat o'zgargan bo'lishi mumkin
  }
}

// ── Arizachi kartasi — Arizalar tabi va vakansiya oynasi uchun bitta ──
// Tanlovlardagi bilan bir xil uslub. Rezyume ANONIM (kontaktgacha):
// ko'r-ko'rona "Tanlash"/"Rad etish" qilinmasin.
function appCardHtml(it){
  const c = it.candidate;
  if (!c) return '';
  const meta = factLine(c);
  const done = it.state === 'shortlisted' || it.state === 'rejected';
  const w = whoOf(c);
  const chip = w.open ? ['open', t('ap.open')]
             : it.state === 'shortlisted' ? ['waiting', t('ap.picked')] : it.state === 'rejected' ? ['no', t('ap.rejected')]
             : it.isNew ? ['waiting', t('ap.new')] : ['no', t('ap.seen')];
  const photo = c.hasPhoto ? `<img src="${candPhoto(c.id)}" alt="">` : w.avatar;
  const head = `<div class="cd-top">
      <div class="cd-ph">${photo}</div>
      <div class="cd-mid"><div class="cd-nm">${esc(w.title)}</div>
        <div class="cd-sub">${esc([w.sub, meta].filter(Boolean).join(' · '))}</div></div>
      <span class="stc ${chip[0]}">${esc(chip[1])}</span>
    </div>
    ${!w.open && trustTags(c) ? `<div class="tags" style="margin-top:8px">${trustTags(c)}</div>` : ''}
    ${it.message ? `<div class="cd-wait" style="color:var(--ink)">"${esc(it.message)}"</div>` : ''}`;

  // Kontakt ochilgan — Tanlovlardagi kabi: qo'ng'iroq, chat, rezyume
  if (w.open) {
    const tel = String(c.contact.phone || '').replace(/[^\d+]/g, '');
    return `<div class="cd" data-rzc="${esc(c.id)}">${head}
      <div class="cd-acts">
        ${tel ? `<a class="cd-btn p" href="tel:${esc(tel)}">${IC.phone}${esc(t('act.call'))}</a>` : ''}
        ${c.threadId ? `<button class="cd-btn" data-chat="${esc(c.id)}">${IC.chat}${esc(t('act.write'))}</button>` : ''}
        <button class="cd-btn" data-rz="${esc(c.id)}">${IC.doc}${esc(t('act.resume'))}</button>
      </div>
      <div class="cd-foot"><span>${esc(t('ap.date', { d: dShort(it.createdAt) }) + t('ap.stagesInSl'))}</span></div>
    </div>`;
  }
  return `<div class="cd" data-rzc="${esc(c.id)}">${head}
    <div class="cd-acts${!done && it.instant ? ' paid' : ''}">
      <button class="cd-btn" data-rz="${esc(c.id)}">${IC.doc}${esc(t('act.resume'))}</button>
      ${done ? '' : it.instant
        // Yangi ariza — kontaktni o'zi ochadi (tasdiq bilan, -1 kredit)
        ? `<button class="cd-btn p" data-open="${it.id}" data-cand="${esc(c.id)}">${IC.phone}${esc(t('ap.openContact'))}</button>`
        // Eski ariza yoki telefon tekshirilmagan — HR orqali
        : `<button class="cd-btn p" data-pick="${it.id}">${esc(t('ap.pick'))}</button>`}
      ${done ? '' : `<button class="cd-btn" data-rej="${it.id}" style="color:var(--danger)">${esc(t('ap.reject'))}</button>`}
    </div>
    <div class="cd-foot"><span>${esc(t('ap.date', { d: dShort(it.createdAt) }) + (
      done ? '' : it.instant ? t('ap.instant') : it.why ? ' · ' + it.why : ''))}</span></div>
  </div>`;
}

function wireApps(root, refresh){
  wireCardTap(root);
  root.querySelectorAll('[data-rz]').forEach(b => b.onclick = () => showResume(b.dataset.rz));
  root.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => openChatWith(b.dataset.chat));
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openFromApp(b, refresh));
  root.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/ma/applications/${b.dataset.pick}/pick`, { method:'POST' });
      haptic(); refresh(); if (VACS.length) loadVacancies(); loadShortlists(); }
    catch(e){ showMsg(e.message); b.disabled = false; }
  });
  root.querySelectorAll('[data-rej]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/ma/applications/${b.dataset.rej}/reject`, { method:'POST', body: JSON.stringify({}) });
      refresh(); }
    catch(e){ showMsg(e.message); b.disabled = false; }
  });
  // Server arizalarni ochilganda 'seen' qildi — nuqta va qizil belgilar o'chsin
  refreshUnread();
}

// ══════════════════════════════════════════════════════════
//  ARIZALAR TABI — barcha vakansiyalarning arizalari
// ══════════════════════════════════════════════════════════
// Har kuni ishlatiladi — alohida bo'lim (Balans o'rnida; balans tepadagi
// raqamni bosganda ochiladi). Vakansiya bo'yicha guruhlangan; filtr:
// "Kutilmoqda" (qaror qilinmagan) va "Hammasi".
let AP_ROWS = [], APF = 'wait';
const appWaiting = it => it.state !== 'shortlisted' && it.state !== 'rejected';

async function loadApps(){
  try { AP_ROWS = await api('/api/ma/applications'); renderApps(); }
  catch(e){ $('apList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}

function renderApps(){
  if (!AP_ROWS.length) {
    $('apList').innerHTML = `<div class="msg">${t('ap.empty')}</div>`;
    return;
  }
  const waitN = AP_ROWS.filter(appWaiting).length;
  if (APF === 'wait' && !waitN) APF = 'all';                 // kutilayotgani yo'q — hammasini ko'rsat
  const rows = AP_ROWS.filter(it => APF === 'all' || appWaiting(it));

  const groups = [], gBy = {};
  for (const it of rows) {
    let g = gBy[it.vacancyId];
    if (!g) { g = gBy[it.vacancyId] = { title: it.vacancyTitle, closed: it.vacancyStatus === 'closed', items: [] }; groups.push(g); }
    g.items.push(it);
  }
  groups.sort((a, b) => a.closed - b.closed);                // yopilganlar pastda

  $('apList').innerHTML =
    `<div class="flt">
      <button class="${APF === 'wait' ? 'on' : ''}" data-af="wait">${esc(t('ap.fWait'))}<b>${waitN}</b></button>
      <button class="${APF === 'all' ? 'on' : ''}" data-af="all">${esc(t('ap.fAll'))}<b>${AP_ROWS.length}</b></button>
    </div>` +
    (groups.length ? groups.map(g => `<div class="grp">
      <div class="grp-h"><b>${esc(g.title)}</b>${g.closed ? `<span class="cl">${esc(t('grp.closed'))}</span>` : ''}
        <span>${esc(t('ap.count', { n: g.items.length }))}</span></div>
      ${g.items.map(appCardHtml).join('')}
    </div>`).join('') : `<div class="msg">${esc(t('ap.noneWait'))}</div>`);

  $('apList').querySelectorAll('[data-af]').forEach(b => b.onclick = () => { APF = b.dataset.af; haptic('sel'); renderApps(); });
  wireApps($('apList'), loadApps);
}

  ? `<div class="pl-now"><div><b>${esc(t('plan.' + p.key))}</b><br><span>${esc(t('pl.until', { date: new Date(p.endsAt).toLocaleDateString(LOC()), n: p.daysLeft }))}</span></div></div>`

// Kafolat holati: "5 tadan 3 ta nomzod berildi" (billing.guaranteeProgress)
function guaranteeHtml(g){
  if (!g) return '';
  const hire = g.needHire > 0;
  const need = hire ? g.needHire : g.needCandidates, got = hire ? g.hired : g.candidates;
  if (!need) return '';
  const pct = Math.min(100, Math.round(got / need * 100));
  return `<div class="pl-g"><div class="pl-g-t"><span>${esc(t(hire ? 'pl.gProgHire' : 'pl.gProg'))}</span><b>${got} / ${need}</b></div>
    <div class="pl-g-bar"><i style="width:${pct}%"></i></div>
    <div class="pl-g-d">${esc(t(got >= need ? 'pl.gDone' : 'pl.gLeft'))}</div></div>`;
}

function planCard(p){
  const g = p.guarantee || {};

    g.candidates ? `<li class="g">${esc(t('pl.gCand', { n: g.candidates }))}</li>` : '',
    g.hire ? `<li class="g">${esc(t('pl.gHire'))}</li>` : '',
    p.personalHr ? `<li>${esc(t('pl.fHr'))}</li>` : '',
    g.replace ? `<li>${esc(t('pl.fReplace'))}</li>` : '',
    p.key === 'max' ? `<li>${esc(t('pl.fFirst'))}</li>` : '',

}

// ── Karta qo'shish (avto-yangilash) ──
// Karta raqami TalentHub serveriga KELMAYDI: so'rovlar to'g'ridan-to'g'ri
// Payme Subscribe API'ga (X-Auth: kassa id), bizga faqat token beriladi.
// Inputlarda name yo'q, formada action yo'q — Payme talabi.
async function paymeCall(method, params){
  const cf = PLANS && PLANS.cardForm;
  if (!cf) throw new Error(t('pl.autoNA'));
  const r = await fetch(cf.api, { method:'POST', headers:{ 'Content-Type':'application/json', 'X-Auth': cf.merchantId },
    body: JSON.stringify({ id: Date.now(), method, params }) });
  const j = await r.json().catch(() => ({}));
  if (j.error) throw new Error((j.error.message && (j.error.message[LANG] || j.error.message.ru)) || j.error.message || 'Payme');
  return j.result;
}

function showCard(){
  sheetEnter('card', showCard);
  openSheet(t('pl.autoAdd'), `
    <form id="cForm" onsubmit="return false" autocomplete="off">
      <div class="fl"><label>${esc(t('pl.cardNum'))}</label><input id="cNum" inputmode="numeric" placeholder="8600 0000 0000 0000" maxlength="19"></div>
      <div class="fl"><label>${esc(t('pl.cardExp'))}</label><input id="cExp" inputmode="numeric" placeholder="MM/YY" maxlength="5"></div>
      <div id="cCodeBox" class="hide"><div class="fl"><label><span id="cSent"></span></label><input id="cCode" inputmode="numeric" maxlength="6" placeholder="••••••"></div></div>
      <button class="btn" id="cGo" style="width:100%">${esc(t('pl.cardSend'))}</button>
    </form>
    <div class="err" id="cErr" style="color:var(--danger);font-size:13px;min-height:18px;margin-top:8px"></div>
    <div class="pm-note"><span class="pm-logo">Payme</span>
      <span>${esc(t('pl.cardNote'))} <a href="#" id="lPmOf">${esc(t('pl.pmOferta'))}</a></span></div>
    <div class="pm-pw">Powered by Payme</div>`);
  $('lPmOf').onclick = e => { e.preventDefault(); openExt('https://cdn.payme.uz/terms/main.html'); };
  $('cNum').oninput = () => { const v = $('cNum').value.replace(/\D/g, '').slice(0, 16); $('cNum').value = v.replace(/(\d{4})(?=\d)/g, '$1 '); };
  $('cExp').oninput = () => { const v = $('cExp').value.replace(/\D/g, '').slice(0, 4); $('cExp').value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v; };
  let token = '';
  $('cGo').onclick = async () => {
    const b = $('cGo'); $('cErr').textContent = ''; b.disabled = true;
    try {
      if (!token) {
        const number = $('cNum').value.replace(/\D/g, ''), exp = $('cExp').value.replace(/\D/g, '');
        if (number.length !== 16 || exp.length !== 4) throw new Error(t('pl.cardReq'));
        const r = await paymeCall('cards.create', { card: { number, expire: exp }, save: true });
        token = r.card.token;
        const v = await paymeCall('cards.get_verify_code', { token });
        $('cSent').textContent = t('pl.cardSent', { phone: v.phone || '' });
        $('cCodeBox').classList.remove('hide'); $('cNum').disabled = $('cExp').disabled = true;
        b.textContent = t('pl.cardVerify'); $('cCode').focus();
      } else {
        const code = $('cCode').value.replace(/\D/g, '');
        if (code.length < 4) throw new Error(t('pl.cardCodeReq'));
        const v = await paymeCall('cards.verify', { token, code });
        await api('/api/ma/card', { method:'POST', body: JSON.stringify({ token: v.card.token }) });
        try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
        showMsg(t('pl.cardOk'));
        sheetBack();
        return;
      }
    } catch(e){ $('cErr').textContent = e.message; }
    b.disabled = false;
  };
}
