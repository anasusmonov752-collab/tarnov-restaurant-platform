<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RestoOne — Nomzodlar bazasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2ECE1; --ink:#19241D; --green:#16291F; --green2:#102018;
  --gold:#C9A84C; --gold-d:#9C7E2E; --card:#FBF9F3; --line:rgba(20,41,31,.12);
  --muted:#6B7A70; --danger:#C25B4C; --ok:#2E9E5B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(20,41,31,.2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:inherit}

/* ── Topbar ── */
.topbar{background:linear-gradient(180deg,var(--green),var(--green2));color:#F5EFDF;padding:16px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30;box-shadow:0 4px 20px rgba(16,32,24,.18)}
.back{display:flex;align-items:center;gap:8px;background:rgba(201,168,76,.14);border:1px solid rgba(201,168,76,.3);color:#F5EFDF;padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-decoration:none;transition:all .2s}
.back:hover{background:rgba(201,168,76,.24)}
.tb-title{font-size:19px;font-weight:800;letter-spacing:.3px}
.tb-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(201,168,76,.8);font-weight:700;margin-top:2px}
.tb-mark{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(201,168,76,.28)}
.tb-mark span{font-style:italic;font-weight:700;font-size:23px;color:#14291F}

.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}

/* ── Upload zone ── */
.dropzone{background:var(--card);border:2px dashed rgba(201,168,76,.5);border-radius:18px;padding:26px;text-align:center;transition:all .2s;cursor:pointer;animation:fadeup .4s}
.dropzone.drag{border-color:var(--gold);background:#FBF4E2;transform:scale(1.005)}
.dz-ic{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:rgba(201,168,76,.14);display:flex;align-items:center;justify-content:center;color:var(--gold-d)}
.dz-title{font-size:16px;font-weight:800}
.dz-sub{font-size:13px;color:var(--muted);margin-top:4px}
.dz-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{font-family:inherit;font-weight:700;font-size:13.5px;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid transparent;transition:all .18s;display:inline-flex;align-items:center;gap:7px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#14291F;box-shadow:0 4px 14px rgba(201,168,76,.3)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:rgba(20,41,31,.05)}
.btn-danger{background:rgba(194,91,76,.12);color:var(--danger);border-color:rgba(194,91,76,.3)}
.btn-danger:hover{background:rgba(194,91,76,.2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Stats ── */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:110px;flex:1;animation:fadeup .4s}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* ── Filters ── */
.filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;animation:fadeup .4s}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:14px;color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
select,input[type=number]{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
input[type=number]{width:120px;cursor:text}
.f-lbl{font-size:11px;color:var(--muted);font-weight:700;margin-right:-4px}

/* ── Candidate cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:all .18s;animation:pop .3s;position:relative;overflow:hidden}
.card:hover{border-color:rgba(201,168,76,.55);box-shadow:0 8px 24px rgba(16,32,24,.1);transform:translateY(-2px)}
.card-top{display:flex;align-items:flex-start;gap:12px}
.avatar{width:46px;height:46px;flex:none;border-radius:12px;background:linear-gradient(135deg,#1B3A2D,#16291F);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.c-name{font-size:15.5px;font-weight:800;line-height:1.2}
.c-pos{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11.5px;font-weight:700;color:var(--ink);background:rgba(20,41,31,.06);border-radius:8px;padding:4px 9px;display:inline-flex;align-items:center;gap:5px}
.c-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.c-phone{font-size:13px;font-weight:700;color:var(--green)}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.stars .off{color:rgba(20,41,31,.16)}

.empty{text-align:center;padding:60px 20px;color:var(--muted);animation:fadeup .4s}
.empty svg{opacity:.4;margin-bottom:14px}
.empty h3{font-size:17px;color:var(--ink);font-weight:800;margin-bottom:6px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(16,32,24,.55);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--bg);border-radius:20px;max-width:640px;width:100%;box-shadow:0 30px 80px rgba(16,32,24,.4);animation:pop .3s;overflow:hidden}
.modal-head{background:linear-gradient(180deg,var(--green),var(--green2));color:#F5EFDF;padding:20px 22px;display:flex;align-items:flex-start;gap:14px}
.modal-head .avatar{width:54px;height:54px;font-size:20px;background:rgba(201,168,76,.18);color:var(--gold)}
.modal-x{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:#F5EFDF;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.modal-body{padding:20px 22px;max-height:62vh;overflow-y:auto}
.mb-sec{margin-bottom:18px}
.mb-sec h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-d);font-weight:800;margin-bottom:9px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:14px;color:var(--ink)}
.field textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-box{background:rgba(201,168,76,.09);border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.5}
.raw-toggle{font-size:12.5px;color:var(--gold-d);font-weight:700;cursor:pointer;text-decoration:underline}
.raw-box{white-space:pre-wrap;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;max-height:220px;overflow-y:auto;margin-top:8px;display:none}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--card)}
.tag-badge{font-size:11px;font-weight:700;background:rgba(20,41,31,.06);border-radius:7px;padding:3px 8px}
.ai-flag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;background:rgba(46,158,91,.14);color:var(--ok)}
.ai-flag.no{background:rgba(194,91,76,.14);color:var(--danger)}
.star-input span{cursor:pointer;font-size:22px;color:rgba(20,41,31,.16);transition:color .1s}
.star-input span.on{color:var(--gold)}

/* ── Upload progress ── */
.uploading{position:fixed;inset:0;background:rgba(16,32,24,.6);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center}
.uploading.show{display:flex}
.up-card{background:var(--bg);border-radius:18px;padding:30px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.spinner{width:44px;height:44px;border:4px solid rgba(201,168,76,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}

#toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--green);color:#F5EFDF;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;animation:fadeup .3s}
.toast-success{background:var(--ok)}
.toast-error{background:var(--danger)}
.toast-icon{display:flex}

@media(max-width:560px){
  .row2{grid-template-columns:1fr}
  .stat{min-width:calc(50% - 5px)}
  .wrap{padding:16px 12px 50px}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/restaurant-admin.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Admin panel
  </a>
  <div class="tb-mark"><span>R</span></div>
  <div>
    <div class="tb-title">Nomzodlar bazasi</div>
    <div class="tb-sub">Rekruting · Rezyume filtri</div>
  </div>
</div>

<div class="wrap">

  <!-- Upload -->
  <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
    <div class="dz-ic">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <div class="dz-title">Rezyumelarni yuklang</div>
    <div class="dz-sub">PDF fayllarni bu yerga tashlang yoki tanlang — AI o'qib, maydonlarga ajratadi</div>
    <div class="dz-actions" onclick="event.stopPropagation()">
      <button class="btn btn-gold" onclick="document.getElementById('fileInput').click()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Fayl tanlash (PDF)
      </button>
      <button class="btn btn-ghost" onclick="openText()">Matn joylash</button>
      <select id="srcSelect" title="Manba">
        <option value="hh">Manba: hh.uz</option>
        <option value="manual">Qo'lda</option>
        <option value="referral">Tavsiya</option>
        <option value="telegram">Telegram</option>
        <option value="other">Boshqa</option>
      </select>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.txt,application/pdf,text/plain" multiple style="display:none" onchange="onFilePick(this.files)">
  </div>

  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- Filters -->
  <div class="filters">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" placeholder="Ism, telefon, lavozim, ko'nikma yoki matn bo'yicha qidirish...">
    </div>
    <select id="fRole"><option value="all">Barcha lavozim</option></select>
    <select id="fStatus"><option value="all">Barcha holat</option></select>
    <select id="fLang"><option value="all">Barcha til</option></select>
    <input type="number" id="fExp" min="0" placeholder="Min tajriba (yil)">
    <select id="fSort">
      <option value="new">Yangi avval</option>
      <option value="old">Eski avval</option>
      <option value="exp">Ko'p tajriba</option>
      <option value="rating">Yuqori baho</option>
      <option value="name">Ism (A-Z)</option>
    </select>
    <button class="btn btn-ghost" onclick="resetFilters()">Tozalash</button>
  </div>

  <!-- List -->
  <div id="list"></div>
</div>

<!-- Detail modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<!-- Text paste modal -->
<div class="overlay" id="textOverlay" onclick="if(event.target===this)closeText()">
  <div class="modal" style="max-width:560px">
    <div class="modal-head"><div><div class="tb-title">Rezyume matnini joylang</div><div class="tb-sub" style="color:rgba(201,168,76,.8)">AI tahlil qiladi</div></div><button class="modal-x" onclick="closeText()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Ism (ixtiyoriy)</label><input id="txtName" placeholder="Fayl nomi o'rniga"></div>
      <div class="field"><label>Rezyume matni</label><textarea id="txtBody" style="min-height:200px" placeholder="hh.uz rezyume matnini shu yerga nusxalab joylang..."></textarea></div>
    </div>
    <div class="modal-foot" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeText()">Bekor</button>
      <button class="btn btn-gold" onclick="submitText()">Qo'shish</button>
    </div>
  </div>
</div>

<!-- Upload spinner -->
<div class="uploading" id="uploading">
  <div class="up-card">
    <div class="spinner"></div>
    <div style="font-weight:800;font-size:15px" id="upText">Yuklanmoqda...</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:5px">AI rezyumelarni tahlil qilmoqda, biroz kuting</div>
  </div>
</div>

<div id="toast-container"></div>

<script src="/js/utils.js"></script>
<script>
const ROLE_LABELS = { ofitsiant:'Ofitsiant', barmen:'Barmen', xostess:'Xostess', oshpaz:'Oshpaz', kassir:'Kassir', menejer:'Menejer', boshqa:'Boshqa' };
const ROLE_EMOJI  = { ofitsiant:'🍽', barmen:'🍸', xostess:'💁', oshpaz:'👨‍🍳', kassir:'🧾', menejer:'📋', boshqa:'👤' };
const STATUS = {
  new:      {l:'Yangi',        c:'#C9A84C'},
  contacted:{l:"Bog'lanildi",  c:'#3B82C4'},
  interview:{l:'Suhbat',       c:'#7C5CBF'},
  trial:    {l:'Sinovda',      c:'#D98E2B'},
  hired:    {l:'Ishga olindi', c:'#2E9E5B'},
  rejected: {l:'Rad etildi',   c:'#C25B4C'},
  reserve:  {l:'Zaxira',       c:'#6B7A70'},
};
const SOURCE_LABELS = { hh:'hh.uz', manual:"Qo'lda", referral:'Tavsiya', telegram:'Telegram', other:'Boshqa' };

let CANDIDATES = [];
let CURRENT = null;
let curRating = 0;
const filters = { q:'', role:'all', status:'all', language:'all', minExp:'', sort:'new' };

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const initials = n => String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2) || '?';
function stars(n){ n=n||0; let s=''; for(let i=1;i<=5;i++) s+=`<span class="${i<=n?'':'off'}">★</span>`; return s; }

// ── Init ──
(async function(){
  await requireRole('restaurant');
  // Role filter options
  const rSel = document.getElementById('fRole');
  Object.keys(ROLE_LABELS).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=ROLE_EMOJI[k]+' '+ROLE_LABELS[k]; rSel.appendChild(o); });
  const sSel = document.getElementById('fStatus');
  Object.keys(STATUS).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=STATUS[k].l; sSel.appendChild(o); });

  // Listeners
  let t;
  document.getElementById('q').addEventListener('input', e=>{ clearTimeout(t); t=setTimeout(()=>{ filters.q=e.target.value; loadList(); },350); });
  document.getElementById('fRole').addEventListener('change', e=>{ filters.role=e.target.value; loadList(); });
  document.getElementById('fStatus').addEventListener('change', e=>{ filters.status=e.target.value; loadList(); });
  document.getElementById('fLang').addEventListener('change', e=>{ filters.language=e.target.value; loadList(); });
  document.getElementById('fExp').addEventListener('input', e=>{ clearTimeout(t); t=setTimeout(()=>{ filters.minExp=e.target.value; loadList(); },350); });
  document.getElementById('fSort').addEventListener('change', e=>{ filters.sort=e.target.value; loadList(); });

  // Drag & drop
  const dz = document.getElementById('dropzone');
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','dragend'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); onFilePick(e.dataTransfer.files); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeText(); } });

  await Promise.all([loadStats(), loadList()]);
})();

// ── Load ──
function qs(){
  const p = new URLSearchParams();
  Object.entries(filters).forEach(([k,v])=>{ if(v!=='' && v!=='all' && v!=null) p.set(k,v); });
  return p.toString();
}
async function loadList(){
  try{
    CANDIDATES = await api('/api/recruitment?'+qs());
    populateLangFilter();
    renderList();
  }catch(e){ toast(e.message,'error'); }
}
async function loadStats(){
  try{
    const s = await api('/api/recruitment/stats');
    renderStats(s);
  }catch(e){ /* silent */ }
}
function renderStats(s){
  const order = ['new','contacted','interview','trial','hired'];
  const el = document.getElementById('stats');
  let html = `<div class="stat" style="border-color:rgba(201,168,76,.4)"><b>${s.total||0}</b><span>Jami nomzod</span></div>`;
  order.forEach(k=>{ html += `<div class="stat"><b style="color:${STATUS[k].c}">${s.byStatus?.[k]||0}</b><span>${STATUS[k].l}</span></div>`; });
  el.innerHTML = html;
}
function populateLangFilter(){
  const langs = new Set();
  CANDIDATES.forEach(c=>(c.languages||[]).forEach(l=>l&&langs.add(l.trim())));
  const sel = document.getElementById('fLang');
  const cur = filters.language;
  sel.innerHTML = '<option value="all">Barcha til</option>' + [...langs].sort().map(l=>`<option value="${esc(l)}" ${cur===l?'selected':''}>${esc(l)}</option>`).join('');
}

// ── Render list ──
function renderList(){
  const el = document.getElementById('list');
  if(!CANDIDATES.length){
    el.innerHTML = `<div class="empty">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <h3>Hozircha nomzod yo'q</h3>
      <p>Yuqoridan rezyume PDF fayllarini yuklang — AI ularni avtomat o'qib bazaga qo'shadi.</p>
    </div>`;
    return;
  }
  el.innerHTML = '<div class="grid">' + CANDIDATES.map(cardHtml).join('') + '</div>';
}
function cardHtml(c){
  const st = STATUS[c.status] || STATUS.new;
  const role = ROLE_LABELS[c.role] || 'Boshqa';
  const meta = [];
  if(c.experienceYears) meta.push(`<span class="chip">⏱ ${c.experienceYears} yil</span>`);
  if(c.location) meta.push(`<span class="chip">📍 ${esc(c.location)}</span>`);
  (c.languages||[]).slice(0,3).forEach(l=>meta.push(`<span class="chip">${esc(l)}</span>`));
  return `<div class="card" onclick="openDetail('${c.id}')">
    <div class="card-top">
      <div class="avatar">${esc(initials(c.fullName))}</div>
      <div style="flex:1;min-width:0">
        <div class="c-name">${esc(c.fullName||'Nomsiz')}</div>
        <div class="c-pos">${ROLE_EMOJI[c.role]||'👤'} ${esc(c.desiredPosition||role)}</div>
      </div>
      <span class="badge" style="background:${st.c}22;color:${st.c}">${st.l}</span>
    </div>
    <div class="c-meta">${meta.join('')}</div>
    <div class="c-foot">
      <span class="c-phone">${esc(c.phone||'—')}</span>
      <span class="stars">${stars(c.rating)}</span>
    </div>
  </div>`;
}

// ── Detail ──
async function openDetail(id){
  try{
    CURRENT = await api('/api/recruitment/'+id);
    curRating = CURRENT.rating||0;
    renderModal();
    document.getElementById('overlay').classList.add('show');
    document.body.style.overflow='hidden';
  }catch(e){ toast(e.message,'error'); }
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); document.body.style.overflow=''; CURRENT=null; }
function setRating(n){ curRating=n; document.querySelectorAll('.star-input span').forEach((s,i)=>s.classList.toggle('on', i<n)); }

function renderModal(){
  const c = CURRENT;
  const roleOpts = Object.keys(ROLE_LABELS).map(k=>`<option value="${k}" ${c.role===k?'selected':''}>${ROLE_EMOJI[k]} ${ROLE_LABELS[k]}</option>`).join('');
  const statusOpts = Object.keys(STATUS).map(k=>`<option value="${k}" ${c.status===k?'selected':''}>${STATUS[k].l}</option>`).join('');
  const srcOpts = Object.keys(SOURCE_LABELS).map(k=>`<option value="${k}" ${c.source===k?'selected':''}>${SOURCE_LABELS[k]}</option>`).join('');
  const aiBadge = c.aiParsed ? '<span class="ai-flag">AI tahlil qildi</span>' : '<span class="ai-flag no">AI o\'qiy olmadi — qo\'lda to\'ldiring</span>';

  document.getElementById('modal').innerHTML = `
    <div class="modal-head">
      <div class="avatar">${esc(initials(c.fullName))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:19px;font-weight:800">${esc(c.fullName||'Nomsiz')}</div>
        <div style="font-size:12.5px;color:rgba(245,239,223,.75);margin-top:3px">${ROLE_EMOJI[c.role]||'👤'} ${esc(c.desiredPosition||ROLE_LABELS[c.role]||'')}</div>
        <div style="margin-top:8px">${aiBadge}</div>
      </div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${c.summary ? `<div class="mb-sec"><div class="summary-box">${esc(c.summary)}</div></div>` : ''}

      <div class="mb-sec">
        <h4>Holat va baho</h4>
        <div class="row2">
          <div class="field"><label>Holat</label><select id="mStatus">${statusOpts}</select></div>
          <div class="field"><label>Rol</label><select id="mRole">${roleOpts}</select></div>
        </div>
        <div class="field"><label>Baho</label><div class="star-input" id="mStars">${[1,2,3,4,5].map(i=>`<span class="${i<=curRating?'on':''}" onclick="setRating(${i})">★</span>`).join('')}</div></div>
      </div>

      <div class="mb-sec">
        <h4>Aloqa</h4>
        <div class="row2">
          <div class="field"><label>Telefon</label><input id="mPhone" value="${esc(c.phone)}"></div>
          <div class="field"><label>Email</label><input id="mEmail" value="${esc(c.email)}"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Lavozim</label><input id="mPos" value="${esc(c.desiredPosition)}"></div>
          <div class="field"><label>Hudud</label><input id="mLoc" value="${esc(c.location)}"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Tajriba (yil)</label><input type="number" id="mExp" min="0" value="${c.experienceYears||0}"></div>
          <div class="field"><label>Manba</label><select id="mSrc">${srcOpts}</select></div>
        </div>
      </div>

      <div class="mb-sec">
        <h4>Ma'lumot</h4>
        ${c.experienceSummary ? `<div class="field"><label>Tajriba</label><div style="font-size:13.5px">${esc(c.experienceSummary)}</div></div>` : ''}
        ${c.education ? `<div class="field"><label>Ta'lim</label><div style="font-size:13.5px">${esc(c.education)}</div></div>` : ''}
        ${c.age ? `<div class="field"><label>Yosh</label><div style="font-size:13.5px">${c.age}</div></div>` : ''}
        ${c.salaryExpectation ? `<div class="field"><label>Kutilgan maosh</label><div style="font-size:13.5px">${esc(c.salaryExpectation)}</div></div>` : ''}
        ${(c.skills&&c.skills.length) ? `<div class="field"><label>Ko'nikmalar</label><div>${c.skills.map(s=>`<span class="tag-badge" style="margin:2px">${esc(s)}</span>`).join(' ')}</div></div>` : ''}
        <div class="field"><label>Tillar (vergul bilan)</label><input id="mLangs" value="${esc((c.languages||[]).join(', '))}"></div>
        <div class="field"><label>Teglar (vergul bilan)</label><input id="mTags" value="${esc((c.tags||[]).join(', '))}"></div>
      </div>

      <div class="mb-sec">
        <h4>Izohlar</h4>
        <div class="field"><textarea id="mNotes" placeholder="Suhbat, kuzatuv, kelishuvlar...">${esc(c.notes)}</textarea></div>
      </div>

      <div class="mb-sec">
        <span class="raw-toggle" onclick="const b=document.getElementById('rawBox'); b.style.display=b.style.display==='block'?'none':'block'">Original rezyume matnini ko'rsatish/yashirish</span>
        <div class="raw-box" id="rawBox">${esc(c.rawText||'(matn saqlanmagan)')}</div>
        ${c.hasFile ? `<div style="margin-top:10px"><a class="btn btn-ghost" href="/api/recruitment/${c.id}/file" target="_blank">📄 Original faylni ochish</a></div>` : ''}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" onclick="delCandidate('${c.id}')">O'chirish</button>
      <button class="btn btn-gold" onclick="saveDetail('${c.id}')">Saqlash</button>
    </div>`;
}

async function saveDetail(id){
  const g = i => document.getElementById(i);
  const payload = {
    status: g('mStatus').value,
    role: g('mRole').value,
    source: g('mSrc').value,
    rating: curRating,
    phone: g('mPhone').value,
    email: g('mEmail').value,
    desiredPosition: g('mPos').value,
    location: g('mLoc').value,
    experienceYears: g('mExp').value,
    notes: g('mNotes').value,
    languages: g('mLangs').value.split(',').map(s=>s.trim()).filter(Boolean),
    tags: g('mTags').value.split(',').map(s=>s.trim()).filter(Boolean)
  };
  try{
    await api('/api/recruitment/'+id, { method:'PATCH', body: JSON.stringify(payload) });
    toast('Saqlandi','success');
    closeModal();
    await Promise.all([loadStats(), loadList()]);
  }catch(e){ toast(e.message,'error'); }
}
async function delCandidate(id){
  if(!confirm("Bu nomzodni o'chirishni tasdiqlaysizmi?")) return;
  try{
    await api('/api/recruitment/'+id, { method:'DELETE' });
    toast("O'chirildi",'success');
    closeModal();
    await Promise.all([loadStats(), loadList()]);
  }catch(e){ toast(e.message,'error'); }
}

// ── Upload ──
async function onFilePick(fileList){
  const files = [...(fileList||[])];
  document.getElementById('fileInput').value='';
  if(!files.length) return;
  const fd = new FormData();
  files.forEach(f=>fd.append('files', f));
  fd.append('source', document.getElementById('srcSelect').value);

  const up = document.getElementById('uploading');
  document.getElementById('upText').textContent = files.length+' ta fayl yuklanmoqda...';
  up.classList.add('show');
  try{
    const r = await apiForm('/api/recruitment/upload', fd);
    up.classList.remove('show');
    let msg = `${r.created} ta qo'shildi`;
    if(r.duplicates) msg += `, ${r.duplicates} ta takror`;
    if(r.failed) msg += `, ${r.failed} ta xato`;
    toast(msg, r.failed && !r.created ? 'error' : 'success');
    if(r.failed){
      const bad = (r.items||[]).filter(i=>!i.ok);
      if(bad.length) console.warn('Yuklanmagan fayllar:', bad);
    }
    await Promise.all([loadStats(), loadList()]);
  }catch(e){ up.classList.remove('show'); toast(e.message,'error'); }
}

function openText(){ document.getElementById('textOverlay').classList.add('show'); document.body.style.overflow='hidden'; }
function closeText(){ document.getElementById('textOverlay').classList.remove('show'); document.body.style.overflow=''; document.getElementById('txtBody').value=''; document.getElementById('txtName').value=''; }
async function submitText(){
  const text = document.getElementById('txtBody').value.trim();
  if(text.length<20){ toast('Matn juda qisqa','error'); return; }
  const up = document.getElementById('uploading');
  document.getElementById('upText').textContent = 'Tahlil qilinmoqda...';
  closeText(); up.classList.add('show');
  try{
    const r = await api('/api/recruitment/upload-text', { method:'POST', body: JSON.stringify({ text, fileName: document.getElementById('txtName').value, source: document.getElementById('srcSelect').value }) });
    up.classList.remove('show');
    toast(r.duplicate ? 'Bu nomzod allaqachon bor (takror)' : "Nomzod qo'shildi", 'success');
    await Promise.all([loadStats(), loadList()]);
  }catch(e){ up.classList.remove('show'); toast(e.message,'error'); }
}

function resetFilters(){
  filters.q=''; filters.role='all'; filters.status='all'; filters.language='all'; filters.minExp=''; filters.sort='new';
  document.getElementById('q').value='';
  document.getElementById('fRole').value='all';
  document.getElementById('fStatus').value='all';
  document.getElementById('fLang').value='all';
  document.getElementById('fExp').value='';
  document.getElementById('fSort').value='new';
  loadList();
}
</script>
</body>
