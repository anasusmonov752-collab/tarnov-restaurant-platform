<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentHub — Vakansiyalar</title>
<!-- TalentHub dizayn tizimi va umumiy menyu (th-shell) -->
<link rel="icon" href="/img/talenthub-mark.svg" type="image/svg+xml">
<script src="/js/uz-date.js"></script>
<link rel="stylesheet" href="/css/th.css?v=2">
<link rel="stylesheet" href="/css/th-app.css?v=2">
<script src="/js/th-shell.js?v=4" defer></script>
<script src="/js/th-viewer.js?v=2" defer></script>
<script src="/js/th-i18n.js?v=27"></script>
<script src="/js/th-story.js?v=4" defer></script>  <!-- afzalliklar ro'yxati serverniki bilan bir xil (PERK_KEYS) -->
<style>
:root{
  --bg:#EEF3FB; --ink:#16233A; --green:#0F2747; --green2:#0A1B33;
  --gold:#2563EB; --gold-d:#1D4ED8; --card:#FFFFFF; --line:#E1E8F2;
  --muted:#64748B; --danger:#C25B4C; --ok:#2E9E5B; --warn:#B4802E;
  --shadow:0 1px 3px rgba(16,32,24,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(15,39,71,.22);border-radius:6px}
button,input,select,textarea{font-family:inherit}

.topbar{flex:none;background:var(--card);border-bottom:1px solid var(--line);color:var(--ink);padding:12px 20px;display:flex;align-items:center;gap:14px;z-index:40}
.back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none}
.back:hover{background:#F3F7FD;color:var(--ink)}
.tb-mark{width:36px;height:36px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center}
.tb-mark span{font-style:italic;font-weight:700;font-size:20px;color:#fff}
.tb-title{font-size:16.5px;font-weight:700;line-height:1}
.tb-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}
.tb-spacer{flex:1}
.view-sw{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;text-decoration:none}
.view-sw:hover{background:#F3F7FD;color:var(--ink)}
.view-sw.on{background:var(--gold);border-color:var(--gold);color:#fff}

.wrap{flex:1;overflow-y:auto;padding:18px 22px 40px}
.inner{max-width:1180px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head h2{font-size:19px;font-weight:800}
.head .sp{flex:1}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700}
.btn:hover{background:#F3F7FD}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-p:hover{background:var(--gold-d)}
.btn-no{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.p-ok{background:rgba(46,158,91,.12);color:var(--ok)}
.p-wait{background:rgba(180,128,46,.14);color:var(--warn)}
.p-off{background:rgba(100,116,139,.14);color:var(--muted)}
.p-no{background:rgba(194,91,76,.12);color:var(--danger)}
.p-new{background:rgba(37,99,235,.12);color:var(--gold)}

.ov{position:fixed;inset:0;background:rgba(10,24,44,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:200}
.ov.on{display:flex}
.md{background:var(--card);border-radius:14px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.md-top{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:14px 14px 0 0}
.md-top b{font-size:16px;flex:1}
.md-x{border:none;background:transparent;font-size:19px;cursor:pointer;color:var(--muted)}
.md-b{padding:18px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink);background:#FBFCFE}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.fld{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}
/* Story oynasi: chapda boshqaruv, o'ngda jonli ko'rinish (keng ekranda yopishqoq) */
.st{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.st-l{flex:1 1 320px;min-width:280px}
.st-r{flex:0 0 auto;position:sticky;top:64px;margin:0 auto}
.st-r canvas{width:288px;height:512px;border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.18);display:block}
.st-h{font-size:14px;font-weight:650;color:var(--ink);margin:18px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.st-h span,.st-lbl{font-size:12px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
.st-vac{display:flex;flex-direction:column;gap:2px}
.st label.st-ck{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;
  padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer}
.st label.st-ck:hover{background:var(--soft)}
.st label.st-ck input{width:16px;height:16px;margin:0;flex:none}
.st label.st-ck span{flex:1;min-width:0}
.st label.st-ck em{font-style:normal;font-size:12px;color:var(--muted)}
.st label.st-ck.off{opacity:.55;cursor:default}
.st-add{border:1px dashed var(--line2);background:transparent;color:var(--link);font-weight:600;font-size:13.5px;border-radius:9px;padding:8px 12px;margin-top:8px;cursor:pointer;width:100%;text-align:left}
.st-add:hover{background:var(--soft)}
.st-addf{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;background:var(--soft)}
.st-addf .fld{margin-bottom:10px}
.st-note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 10px}
.st-th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st-th button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px 8px;
  font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer}
.st-th button i{width:34px;height:34px;border-radius:9px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.st-th button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(37,99,235,.12);font-weight:650}
.st-ph{display:flex;gap:10px;align-items:center;margin-top:10px}
.st-ph label{text-transform:none;letter-spacing:0}
.st-ph .st-note{margin:0}
.st-sty{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.st-sty button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 4px 7px;
  font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.st-sty canvas{width:100%;aspect-ratio:9/16;border-radius:7px;display:block;background:var(--soft)}
.st-sty button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(37,99,235,.12);font-weight:650}
@media (max-width:640px){ .st-th{grid-template-columns:repeat(2,1fr)} .st-sty{grid-template-columns:repeat(3,1fr)} .st-r{position:static} }
.ci{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px}
.ci b{font-size:14.5px}
.ci .m{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:3px}

/* Toast — utils.js toast() shu klasslarni qo'yadi. Bu sahifa style.css ni
   ulamaydi (u qorong'i mavzu), shuning uchun uslub shu yerda turishi shart.
   Ilgari CSS yo'q edi va 400/401 xatolari ko'rinmay ketardi. */
#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:380px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:10px;padding:12px 16px;font-size:13.5px;font-weight:500;color:var(--ink);box-shadow:0 8px 24px rgba(16,32,24,.16);pointer-events:auto}
.toast-icon{display:flex;flex:none;color:var(--muted)}
.toast-success{border-left-color:var(--ok)}       .toast-success .toast-icon{color:var(--ok)}
.toast-error{border-left-color:var(--danger)}     .toast-error .toast-icon{color:var(--danger)}
.toast-info{border-left-color:var(--gold)}        .toast-info .toast-icon{color:var(--gold)}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/restaurant-admin.html">&#8592; Panel</a>
  <div class="tb-mark"><span>T</span></div>
  <div>
    <div class="tb-title">Vakansiyalar</div>
    <div class="tb-sub">TalentHub</div>
  </div>
  <div class="tb-spacer"></div>
  <a class="view-sw" href="/mijozlar.html">Mijozlar</a>
  <a class="view-sw" href="/anketalar.html">Anketalar</a>
  <a class="view-sw" href="/recruitment.html">Nomzodlar bazasi</a>
</div>

<div class="wrap"><div class="inner">
  <div class="head">
    <h2>Barcha vakansiyalar</h2>
    <div class="sp"></div>
    <select id="fSt" style="width:auto;margin-right:8px">
      <option value="">Hammasi</option>
      <option value="open" selected>Ochiq</option>
      <option value="paused">To'xtatilgan</option>
      <option value="closed">Yopilgan</option>
    </select>
    <button class="btn" id="bStory" style="margin-right:8px">Story rasm</button>
    <button class="btn" id="bCh" style="margin-right:8px">Kanal</button>
    <button class="btn" id="bAnk" style="margin-right:8px">Umumiy anketa havolasi</button>
    <button class="btn btn-p" id="bNew">+ Vakansiya</button>
  </div>
  <div id="warn"></div>
  <div class="card" id="list"><div class="empty">Yuklanmoqda...</div></div>
</div></div>

<div class="ov" id="ov"><div class="md">
  <div class="md-top"><b id="mdT">—</b><button class="md-x" id="mdX">&#10005;</button></div>
  <div class="md-b" id="mdB"></div>
</div></div>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
const $ = id => document.getElementById(id);
let ROWS = [], CLIENTS = [];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = s => s ? new Date(s).toLocaleDateString('uz-UZ',{day:'2-digit',month:'short'}) : '—';

function openMd(t, h){ $('mdT').textContent = t; $('mdB').innerHTML = h; $('mdB').closest('.md').style.maxWidth = ''; $('ov').classList.add('on'); }

// ── Vakansiyalar kanali (services/jobPost) ──
// Bot kanalda "xabar joylash" huquqli admin bo'lishi kerak — server tekshiradi.
async function channelForm(){
  openMd('Vakansiyalar kanali', '<div class="empty">Yuklanmoqda...</div>');
  let c;
  try { c = await api('/api/vacancies/channel'); }
  catch(e){ $('mdB').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  $('mdB').innerHTML = `
    <div style="font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:14px">
      E'lon qilingan vakansiya kanalga <b>o'zi chiqadi</b> (kunduzi, bir vaqtda 3 tagacha) — anketa tugmasi bilan,
      restoran nomisiz. Bazadagi mos nomzodlarga bot o'zi xabar yozadi. Vakansiya yopilsa — postga «Yopildi».
      <br><br><b>Avval:</b> kanal sozlamalari → Administratorlar → botni qo'shing, «Xabar joylash» huquqi bilan.</div>
    <div class="fld"><label>Kanal</label><input type="text" id="chIn" value="${esc(c.channel)}" placeholder="@vakansiya_uz"></div>
    ${c.title ? `<div style="font-size:13px;color:var(--muted);margin:-6px 0 12px">Ulangan: <b>${esc(c.title)}</b> · ${c.posted} ta e'lon joylangan</div>` : ''}
    <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:16px;text-transform:none;letter-spacing:0">
      <input type="checkbox" id="chAuto" ${c.auto ? 'checked' : ''} style="width:auto"> Yangi vakansiyalar o'zi chiqsin</label>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Kanal ulangan paytdan oldingi vakansiyalar o'zi chiqmaydi —
      ularni ro'yxatda «Kanalga joylash» bilan chiqarasiz.</div>
    <button class="btn btn-p" id="chSave" style="width:100%">Tekshirish va saqlash</button>`;
  $('chSave').onclick = async () => {
    $('chSave').disabled = true;
    try {
      await api('/api/vacancies/channel', { method:'PUT', body: JSON.stringify({ channel: $('chIn').value.trim(), auto: $('chAuto').checked }) });
      toast('Saqlandi', 'success'); closeMd(); load();
    } catch(e){ toast(e.message, 'error'); $('chSave').disabled = false; }
  };
}
function closeMd(){ $('ov').classList.remove('on'); $('mdB').innerHTML = ''; }
$('mdX').onclick = closeMd;
$('ov').onclick = e => { if (e.target === $('ov')) closeMd(); };

const ST = { open:['p-ok','Ochiq'], paused:['p-wait','To\'xtatilgan'], closed:['p-off','Yopilgan'] };

async function load(){
  const q = $('fSt').value ? '?status=' + $('fSt').value : '';
  try { ROWS = await api('/api/vacancies' + q); }
  catch(e){ toast(e.message, 'error'); return; }

  // Tasdiqlanmaganlar — nomzodlarga ko'rsatilmayapti, bu yo'qotish
  // Yopiq (avtomatik) vakansiyalar baribir ro'yxatda yo'q — ogohlantirishga kirmaydi
  const stale = ROWS.filter(v => v.listed && v.stale && v.status === 'open');
  $('warn').innerHTML = stale.length
    ? `<div class="card" style="border-left:3px solid var(--warn);margin-bottom:14px"><div style="padding:14px">
        <b style="font-size:15px">${stale.length} ta vakansiya tasdiqlanmagan</b>
        <div style="font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.6">
          14 kundan ortiq tasdiqlanmagan vakansiya nomzodlarga <b>ko'rsatilmaydi</b>.
          Mijozdan so'rang: o'rin hali ochiqmi?</div></div></div>`
    : '';

  if (!ROWS.length) {
    $('list').innerHTML = '<div class="empty">Vakansiya yo\'q. Mijoz o\'zi ochadi yoki siz kiritasiz.</div>';
    return;
  }

  $('list').innerHTML = `<table>
    <thead><tr><th>Vakansiya</th><th>Mijoz</th><th>Taklif</th><th>Arizalar</th><th>Tanlov</th><th>Holat</th><th></th></tr></thead>
    <tbody>${ROWS.map(v => {
      const [cls, lbl] = ST[v.status] || ST.open;
      return `<tr>
        <td><b>${esc(v.title)}</b>${v.status === 'open' && !v.hasRu ? ` <span title="Rus tilidagi nomzod o'zbekcha matnni ko'radi — Tahrirlash → Ruscha" style="font-size:11px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-left:4px">RU yo'q</span>` : ''}
          ${v.venue ? `<div style="font-size:12px;color:var(--muted)">${esc(v.venue)}</div>` : ''}
          ${v.headcount > 1 ? `<div style="font-size:12px;color:var(--muted)">${v.headcount} ta odam</div>` : ''}</td>
        <td>${esc(v.clientName)}
          ${v.clientLocation ? `<div style="font-size:12px;color:var(--muted)">${esc(v.clientLocation)}</div>` : ''}</td>
        <td>${esc(v.salaryText) || '<span style="color:var(--warn)">ko\'rsatilmagan</span>'}
          ${v.shift ? `<div style="font-size:12px;color:var(--muted)">${esc(v.shift)}</div>` : ''}</td>
        <td>${v.apps ? `${v.apps}${v.appsNew ? ` <span class="pill p-new">${v.appsNew} yangi</span>` : ''}` : '—'}</td>
        <td>${v.shortlists || '—'}</td>
        <td><span class="pill ${cls}">${lbl}</span>
          ${!v.listed ? '<div><span class="pill p-off" style="margin-top:4px" title="Qidiruvdan o\'zi yaratilgan, nomzodlar ko\'rmaydi">yopiq</span></div>' : ''}
          ${v.listed && v.stale && v.status === 'open' ? '<div><span class="pill p-no" style="margin-top:4px">tasdiqlang</span></div>' : ''}
          ${v.verifiedAt ? '<div><span class="pill p-ok" style="margin-top:4px" title="Nomzod «TalentHub tekshirgan ✓» belgisini ko\'radi">tekshirilgan ✓</span></div>' : ''}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-sm" data-app="${v.id}">Arizalar</button>
          <button class="btn btn-sm" data-ank="${v.id}">Anketa</button>
          ${v.channelUrl ? `<a class="btn btn-sm" href="${esc(v.channelUrl)}" target="_blank" rel="noopener" title="${v.alertedN ? v.alertedN + ' ta mos nomzodga xabar ketgan' : ''}">Kanalda ↗</a>`
            : !v.channelPosted && v.status === 'open' && v.listed && !v.isTest ? `<button class="btn btn-sm" data-chp="${v.id}">Kanalga joylash</button>` : ''}
          <button class="btn btn-sm" data-cf="${v.id}">Tasdiqlash</button>
          <button class="btn btn-sm" data-vf="${v.id}" title="Ish beruvchiga qo'ng'iroq qilib o'rin ochiqligini tasdiqlatdingizmi?">${v.verifiedAt ? 'Tekshiruvni olish' : 'Tekshirildi'}</button>
          <button class="btn btn-sm" data-ed="${v.id}">Tahrirlash</button>
        </td></tr>`;
    }).join('')}</tbody></table>`;

  $('list').querySelectorAll('[data-app]').forEach(b => b.onclick = () => showApps(b.dataset.app));
  $('list').querySelectorAll('[data-ank]').forEach(b => b.onclick = () => {
    const v = ROWS.find(x => x.id === b.dataset.ank);
    showAnketaLink(v.id, v.title);
  });
  $('list').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => form(ROWS.find(x => x.id === b.dataset.ed)));
  // Kanalga qo'lda (eski vakansiyalar uchun ham) — services/jobPost
  $('list').querySelectorAll('[data-chp]').forEach(b => b.onclick = async () => {
    if (!confirm('Vakansiya kanalga joylansinmi? Bazadagi mos nomzodlarga ham xabar boradi.')) return;
    b.disabled = true;
    try {
      const r = await api(`/api/vacancies/${b.dataset.chp}/channel-post`, { method:'POST' });
      toast(r.already ? 'Allaqachon joylangan' : `Kanalga chiqdi · ${r.alerted || 0} ta mos nomzodga xabar`, 'success'); load();
    } catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });
  $('list').querySelectorAll('[data-cf]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/vacancies/${b.dataset.cf}/confirm`, { method:'POST' }); toast('Tasdiqlandi', 'success'); load(); }
    catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });
  // "Tekshirildi" — faqat ish beruvchiga qo'ng'iroqdan keyin: nomzod ishonch belgisini ko'radi
  $('list').querySelectorAll('[data-vf]').forEach(b => b.onclick = async () => {
    const v = ROWS.find(x => x.id === b.dataset.vf);
    if (!v.verifiedAt && !confirm('Ish beruvchiga qo\'ng\'iroq qilib, o\'rin hali ochiqligini tasdiqlatdingizmi?\nNomzod «TalentHub tekshirgan ✓» belgisini ko\'radi.')) return;
    b.disabled = true;
    try {
      await api(`/api/vacancies/${v.id}/verify`, { method:'POST', body: JSON.stringify({ off: !!v.verifiedAt }) });
      toast(v.verifiedAt ? 'Belgi olindi' : 'Tekshirildi', 'success'); load();
    } catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });
}
$('fSt').onchange = load;

// ── Anketa havolasi ──
// E'lon uchun: nomzod bosadi -> botda "Anketani to'ldirish" -> Mini App.
// Har e'lon joyiga alohida havola (kanal) — qaysi biri nomzod olib
// kelayotgani pastdagi natijada ko'rinadi (services/survey, /api/surveys).
const STEP_L = { role:'Lavozim', fullName:'Ism', birthDate:'Tug\'ilgan sana', gender:'Jins', phone:'Telefon',
  location:'Tuman', experience:'Tajriba', lastJob:'Oxirgi ish', shift:'Smena', salary:'Maosh',
  russian:'Rus tili', sanitary:'Sanitar kitobcha', study:'O\'qish', photo:'Rasm', consent:'Rozilik',
  '(boshlamagan)':'ochdi, lekin boshlamadi' };

function statsHtml(st){
  if (!st.channels.length) return '<div class="empty" style="padding:16px 0">Hali hech kim boshlamagan.</div>';
  const rows = st.channels.map(c => `<tr><td>${esc(c.label)}</td><td>${c.started}</td><td><b>${c.done}</b></td>
    <td>${c.started ? Math.round(c.done / c.started * 100) + '%' : '—'}</td></tr>`).join('');
  const drop = st.dropAt.slice(0, 3).map(x => `${esc(STEP_L[x.step] || x.step)} — ${x.n}`).join(' · ');
  return `<table style="margin-top:8px"><thead><tr><th>Manba</th><th>Boshladi</th><th>Yubordi</th><th>Konversiya</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${drop ? `<div style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6">
      Tugatmaganlar oxirgi javob bergan savol: ${drop}</div>` : ''}`;
}

async function showAnketaLink(vid, title){
  openMd(vid ? 'Anketa havolasi — ' + title : 'Umumiy anketa havolasi', '<div class="empty">Yuklanmoqda...</div>');
  let ch = 'vakuz';                                   // asosiy e'lon joyi — o'z kanalimiz (survey.CHANNELS)
  const qv = vid ? '&vacancyId=' + encodeURIComponent(vid) : '';
  const draw = async () => {
    let d, st;
    try {
      [d, st] = await Promise.all([
        api('/api/surveys/link?channel=' + ch + qv),
        api('/api/surveys/stats?' + qv.slice(1))
      ]);
    } catch(e){ $('mdB').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    const opts = Object.entries(d.channels).map(([k, l]) =>
      `<option value="${k}" ${k === ch ? 'selected' : ''}>${esc(l)}</option>`).join('');
    $('mdB').innerHTML = `
      <div style="font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:14px">
        ${vid ? 'Nomzod anketani to\'ldirgach shu vakansiyaga <b>ariza ham tushadi</b> — mijoz kabinetida ko\'rinadi.'
              : 'Nomzod lavozimni o\'zi tanlaydi va bazaga tushadi.'}
        Telefon Telegram orqali tasdiqlanadi, rozilik alohida so'raladi.</div>
      <div class="fld"><label>E'lon qayerga qo'yiladi</label><select id="lCh">${opts}</select></div>
      <div class="fld"><label>Havola</label>
        <div style="display:flex;gap:8px"><input type="text" id="lUrl" readonly value="${esc(d.link)}">
        <button class="btn btn-p" id="lCp">Nusxa</button></div></div>
      <div class="sec">Natija${vid ? ' (shu vakansiya)' : ''}</div>
      ${statsHtml(st)}`;
    $('lCh').onchange = () => { ch = $('lCh').value; draw(); };
    $('lCp').onclick = async () => {
      try { await navigator.clipboard.writeText(d.link); }
      catch(e){ $('lUrl').select(); document.execCommand('copy'); }
      toast('Havoladan nusxa olindi', 'success');
    };
  };
  draw();
}
$('bAnk').onclick = () => showAnketaLink('', '');

// Lavozim — server bilan bir xil ro'yxat (src/data/roles.js), o'zgarsa
// hamma joyda. Busiz vakansiya 'boshqa' bo'lib qolardi va bot qidiruvi
// uni tanimay yoniga dublikat ochardi.
const ROLES = [['ofitsiant','Ofitsiant'],['barmen','Barmen'],['xostess','Xostess'],
  ['oshpaz','Oshpaz'],['kassir','Kassir'],['menejer','Menejer'],['operator','Call-markaz operatori']];
const SHIFT_T = { kunduzgi:'kunduzgi smena', kechki:'kechki smena', ikkalasi:'kunduzgi/kechki smena' };
// Afzalliklar — server bilan bir xil kalitlar va yozuvlar (th-i18n PERK_KEYS)
const PERKS = THI18N.PERK_KEYS.map(k => [k, THI18N.t('uz', 'perk.' + k)]);
// Server shabloni bilan bir xil sarlavha (vacancyAuto.makeTitle)
const autoTitle = (r, s) => {
  const l = (ROLES.find(x => x[0] === r) || [])[1];
  return l ? (SHIFT_T[s] ? l + ', ' + SHIFT_T[s] : l) : '';
};

    <div class="fld"><label>Grafik</label><input type="text" id="rSc" value="${esc(ru.schedule)}" maxlength="120"></div>

    $('fSave').disabled = true;
    try {
      if (v) await api('/api/vacancies/' + v.id, { method:'PATCH', body: JSON.stringify(body) });
      else   await api('/api/vacancies', { method:'POST', body: JSON.stringify(body) });
      toast('Saqlandi', 'success'); closeMd(); load();
    } catch(e){ toast(e.message, 'error'); $('fSave').disabled = false; }
  };

// 2026-11-27 (Anas: "shashlikchi kerak, lekin vakansiya formasini to'ldirmoqchi emasman"):

//     shu mijozga HAQIQIY ochiq vakansiya ochiladi (listed:true) — story'ni ko'rib botga kirgan

//   • 4 ta tayyor mavzu (erkin rang yo'q — brend bir xil qolsin), "O'z rasmingiz" — rasm faqat
//     brauzerda, serverga yuklanmaydi.
//   • Bitta lavozim tanlansa — alohida kompozitsiya (thStory: katta maosh + afzalliklar).

  openMd('Story rasm', '<div class="empty">Yuklanmoqda...</div>');
  $('mdB').closest('.md').style.maxWidth = '880px';
  let rows;
  try { rows = (await api('/api/vacancies?status=open')).filter(v => v.listed !== false && !v.isTest); }
  catch (e) { $('mdB').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const byCl = {};
  rows.forEach(v => { (byCl[v.clientId] = byCl[v.clientId] || { name: v.clientName, rows: [] }).rows.push(v); });
  const cls = Object.entries(byCl).sort((a, b) => b[1].rows.length - a[1].rows.length);
  if (!cls.length) { $('mdB').innerHTML = '<div class="empty">Ochiq vakansiya yo\'q.</div>'; return; }
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
  const THEMES = thStory.THEMES;
  const STY = thStory.STYLES;
  const S = { cl: cls[0][0], lang: 'uz', sel: null, showName: true, theme: THEMES[store.get('thStoryTheme')] ? store.get('thStoryTheme') : 'tungi', photo: null,

  $('mdB').innerHTML = `
    <div class="st">
      <div class="st-l">
        <div class="row2">
          <div class="fld"><label>Mijoz</label><select id="sCl">${cls.map(([id, c]) => `<option value="${esc(id)}">${esc(c.name)} · ${c.rows.length} ta</option>`).join('')}</select></div>

        </div>
        <div class="st-h">Lavozimlar <span>ko'pi bilan 4 ta · bittasini tanlasangiz — alohida ko'rinish</span></div>
        <div id="sVac" class="st-vac"></div>
        <button class="st-add" id="sAddBtn" type="button">+ Yangi lavozim</button>
        <div id="sAdd" class="st-addf" hidden>
          <div class="fld"><label>Nomi</label><input type="text" id="aT" maxlength="120" placeholder="Masalan: Shashlikchi"></div>
          <div class="row2">
            <div class="fld"><label>Maosh, so'm</label><input type="text" id="aP" inputmode="numeric" placeholder="300 000 yoki 250 000–350 000"></div>
            <div class="fld"><label>Davr</label><select id="aD"><option value="day">kuniga</option><option value="month">oyiga</option><option value="shift">smenaga</option></select></div>
          </div>
          <div class="st-note" id="aHint"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-p btn-sm" id="aSave" type="button">Qo'shish</button>
            <button class="btn btn-sm" id="aCancel" type="button">Bekor</button>
          </div>
        </div>
        <label class="st-ck" style="margin-top:8px"><input type="checkbox" id="sPay" checked><span>Maoshni ko'rsatish</span><em>o'chirilsa — o'rnida vakansiyaning shartlari</em></label>

        <div class="st-sty" id="sSty">${Object.entries(STY).map(([k, n]) => `<button type="button" data-st="${k}"><canvas width="108" height="192"></canvas>${esc(n)}</button>`).join('')}</div>

        <div class="st-th" id="sTh">${Object.entries(THEMES).map(([k, t]) => `<button type="button" data-th="${k}"><i style="background:${SW[k]}"></i>${esc(t.label)}</button>`).join('')}</div>

        </div>
        <div class="st-h">Matn</div>
        <label class="st-ck"><input type="checkbox" id="sName" checked>Restoran nomini ko'rsatish</label>
        <div class="fld"><label>Sarlavha <span class="st-lbl">har qator alohida, *so'z* — ajratib ko'rsatiladi</span></label><textarea id="sH1" rows="3"></textarea></div>
        <div class="row2">
          <div class="fld"><label>Ostki qator</label><input type="text" id="sSub"></div>
          <div class="fld"><label>Filiallar</label><input type="text" id="sLoc"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-p" id="sDl" style="flex:1">PNG yuklab olish</button>
          <button class="btn" id="sVid" style="flex:1">Video (${thStory.VIDEO_SECONDS} s)</button>
        </div>
        <div id="sVidSt" class="st-note" style="margin-top:8px"></div>
        <div class="st-note" style="margin-top:6px">Story'da pastki bo'sh joyga Telegram «Ссылка» stikerini qo'ying: t.me/TalentHubUzBot</div>

      <div class="st-r"><canvas id="sCv"></canvas></div>
    </div>`;
  const cur = () => byCl[S.cl].rows;
  const hasPay = v => v.salaryFrom || v.salaryTo;
  function vacList(){
    const rs = cur();
    // Standart: eng ko'p to'lanadigani oldin, har xil roldan (keyin qo'lda almashtiriladi)
    if (!S.sel) {
      const val = v => (v.salaryPeriod === 'month' ? 1 : 26) * (v.salaryTo || v.salaryFrom || 0);
      const paid = rs.filter(hasPay).sort((a, b) => val(b) - val(a));
      const pick = [], seen = new Set();
      paid.forEach(v => { if (pick.length < 4 && !seen.has(v.role)) { pick.push(v.id); seen.add(v.role); } });
      paid.forEach(v => { if (pick.length < 4 && !pick.includes(v.id)) pick.push(v.id); });
      S.sel = new Set(pick);
    }
    // Maosh ko'rsatilmasa — maoshsiz vakansiya ham tanlanadi (o'rnida shartlari chiqadi)
    const ok = v => !S.showPay || hasPay(v);
    if (S.showPay) [...S.sel].forEach(id => { const v = rs.find(x => x.id === id); if (v && !hasPay(v)) S.sel.delete(id); });
    $('sVac').innerHTML = rs.map(v => `<label class="st-ck${ok(v) ? '' : ' off'}">
      <input type="checkbox" data-v="${esc(v.id)}" ${S.sel.has(v.id) ? 'checked' : ''} ${ok(v) ? '' : 'disabled'}>
      <span>${esc(v.title)}</span>${hasPay(v) ? '' : '<em>maosh yo\'q</em>'}</label>`).join('');
    $('sVac').querySelectorAll('[data-v]').forEach(el => el.onchange = () => {
      if (el.checked && S.sel.size >= 4) { el.checked = false; toast('Ko\'pi bilan 4 ta'); return; }
      el.checked ? S.sel.add(el.dataset.v) : S.sel.delete(el.dataset.v); draw(true);
    });
  }
  // "Rasm" mavzusi: o'z rasmi bo'lmasa — kutubxonadan, lavozimga qarab (thStory.photoGroup); "Boshqa rasm" — keyingisi
  async function data(){
    const rs = cur().filter(v => S.sel.has(v.id));
    const d = thStory.fromVacancies(rs, { lang: S.lang, name: S.showName ? byCl[S.cl].name : '', hidePay: !S.showPay });
    d.theme = S.theme; d.photo = S.photo; d.style = S.style;
    if (S.style === 'klassik' && S.theme === 'rasm' && !S.photo) {
      try { d.photo = await thStory.loadPhoto(thStory.photoUrl(thStory.photoGroup(d), S.libIdx || 0)); }
      catch (e) { toast(e.message, 'error'); }
    }
    return d;
  }
  async function draw(reset){
    const seq = S.seq = (S.seq || 0) + 1;      // tez-tez bosilsa eski chizish yangisining ustiga tushmasin
    const d = await data();
    if (reset) { $('sH1').value = d.lines.join('\n'); $('sSub').value = d.sub; $('sLoc').value = d.loc; }
    d.lines = $('sH1').value.split('\n'); d.sub = $('sSub').value; d.loc = $('sLoc').value;
    const cv = await thStory.render(d);
    const out = $('sCv'); if (!out || seq !== S.seq) return;
    out.width = cv.width; out.height = cv.height; out.getContext('2d').drawImage(cv, 0, 0);
    if (reset || !S.thumbsDone) thumbs(d, seq);
  }
  // Uslub tugmalarida — shu lavozimlar bilan haqiqiy kichik ko'rinish (har uslub o'z rasmi bilan)
  async function thumbs(d, seq){
    S.thumbsDone = true;
    for (const b of $('sSty').querySelectorAll('[data-st]')) {
      const cv = await thStory.render(Object.assign({}, d, { style: b.dataset.st }));
      if (seq !== S.seq) return;
      const c = b.querySelector('canvas'); c.getContext('2d').drawImage(cv, 0, 0, c.width, c.height);
    }
  }
  function themeUi(){
    $('sSty').querySelectorAll('[data-st]').forEach(b => b.classList.toggle('on', b.dataset.st === S.style));
    const kl = S.style === 'klassik';
    $('sTh').hidden = $('sThH').hidden = !kl;
    $('sTh').querySelectorAll('[data-th]').forEach(b => b.classList.toggle('on', b.dataset.th === S.theme));
    $('sPh').hidden = !kl || S.theme !== 'rasm';
  }

  // ── Yangi lavozim -> haqiqiy vakansiya ──
  // "300 000", "250 000–350 000", "3 mln", "300" (= 300 000 — ming deb tushuniladi, ostida ko'rsatiladi)
  function parsePay(s){
    const t = String(s || '').toLowerCase();
    const mln = /mln|млн|million/.test(t);
    const nums = t.split(/[-–—]|dan|gacha|до/).map(p => p.replace(',', '.').replace(/[^\d.]/g, '')).filter(Boolean).map(Number).filter(n => n > 0);
    const k = n => mln && n < 1000 ? Math.round(n * 1e6) : n < 1000 ? n * 1000 : Math.round(n);
    const [a, b] = nums.map(k);
    if (!a) return null;
    return b && b !== a ? { from: Math.min(a, b), to: Math.max(a, b) } : { from: a, to: null };
  }
  const UNIT = { day: "so'm / kun", month: "so'm / oy", shift: "so'm / smena" };
  function addHint(){
    const p = parsePay($('aP').value);
    const nm = byCl[S.cl].name;
    $('aHint').innerHTML = (p ? `Storyda: <b>${esc(thStory.money(p.from, p.to, 'uz'))}</b> ${UNIT[$('aD').value]}<br>` : '')
      + `${esc(nm)} uchun ochiq vakansiya ham ochiladi — nomzod botda shu ishni topib ariza beradi.`;
  }
  // Mijozning umumiy ma'lumoti (filiallar, maosh berish tartibi) — boshqa vakansiyalaridan; afzalliklar KO'CHIRILMAYDI
  // (har lavozimda boshqacha bo'lishi mumkin — keyin vakansiya formasida qo'shiladi)
  const common = f => { const n = {}; cur().forEach(v => { if (v[f]) n[v[f]] = (n[v[f]] || 0) + 1; }); return (Object.entries(n).sort((a, b) => b[1] - a[1])[0] || [''])[0]; };
  $('sAddBtn').onclick = () => { $('sAdd').hidden = false; $('sAddBtn').hidden = true; addHint(); $('aT').focus(); };
  $('aCancel').onclick = () => { $('sAdd').hidden = true; $('sAddBtn').hidden = false; };
  ['aP', 'aD'].forEach(id => $(id).oninput = addHint);
  $('aSave').onclick = async () => {
    const title = $('aT').value.trim(), p = parsePay($('aP').value);
    if (!title) { toast('Lavozim nomini yozing'); $('aT').focus(); return; }
    if (!p) { toast('Maoshni yozing — storyda shu raqam chiqadi'); $('aP').focus(); return; }
    const dup = cur().find(v => v.title.trim().toLowerCase() === title.toLowerCase());
    if (dup) { toast('Bu lavozim ro\'yxatda bor — belgilang'); return; }
    const b = $('aSave'); b.disabled = true;
    try {
      const v = await api('/api/vacancies', { method: 'POST', body: JSON.stringify({
        clientId: S.cl, title, salaryFrom: p.from, salaryTo: p.to, salaryPeriod: $('aD').value,
        location: common('location'), payout: common('payout'), listed: true }) });
      v.clientName = byCl[S.cl].name;
      cur().push(v);
      // Shu lavozim uchun story: faqat yangisi belgilanadi (bitta lavozim ko'rinishi); qolganini qo'lda qo'shish mumkin
      S.sel = new Set([v.id]);
      $('aT').value = ''; $('aP').value = '';
      $('sAdd').hidden = true; $('sAddBtn').hidden = false;
      const o = $('sCl').querySelector(`option[value="${S.cl}"]`); if (o) o.textContent = `${byCl[S.cl].name} · ${cur().length} ta`;
      vacList(); draw(true);
      toast('Vakansiya ochildi — botda ko\'rinadi', 'success');
      if (typeof load === 'function') load();
    } catch (e) { toast(e.message, 'error'); }
    b.disabled = false;
  };

  $('sTh').onclick = e => {
    const b = e.target.closest('[data-th]'); if (!b) return;
    S.theme = b.dataset.th; store.set('thStoryTheme', S.theme); themeUi(); draw(false);
  };
  $('sSty').onclick = e => {
    const b = e.target.closest('[data-st]'); if (!b) return;
    S.style = b.dataset.st; store.set('thStoryStyle', S.style); themeUi(); draw(false);
  };
  $('sPay').onchange = () => { S.showPay = $('sPay').checked; vacList(); draw(true); };
  $('sNext').onclick = () => {
    S.photo = null; S.libIdx = (S.libIdx || 0) + 1;
    $('sPhSt').textContent = 'Rasm lavozimga qarab o\'zi tanlanadi.'; draw(false);
  };
  $('sFile').onchange = () => {
    const f = $('sFile').files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { S.photo = img; $('sPhSt').textContent = f.name + ' · faqat shu kompyuterda, serverga yuklanmaydi'; draw(false); };
    img.onerror = () => toast('Rasm ochilmadi', 'error');
    img.src = URL.createObjectURL(f);
  };
  $('sCl').onchange = () => { S.cl = $('sCl').value; S.sel = null; vacList(); draw(true); };
  $('sLang').onchange = () => { S.lang = $('sLang').value; draw(true); };
  $('sName').onchange = () => { S.showName = $('sName').checked; draw(true); };
  ['sH1', 'sSub', 'sLoc'].forEach(id => $(id).oninput = () => draw(false));
  const fname = ext => `TalentHub-story-${S.lang}.${ext}`;
  $('sDl').onclick = () => {
    const a = document.createElement('a');
    a.download = fname('png'); a.href = $('sCv').toDataURL('image/png'); a.click();
  };
  // Video — o'sha dizayn, animatsiya bilan (thStory.renderVideo); brauzer real vaqtda yozadi
  const vidLabel = `Video (${thStory.VIDEO_SECONDS} s)`;
  if (!thStory.videoType()) { $('sVid').disabled = true; $('sVidSt').textContent = 'Bu brauzer video yoza olmaydi — Chrome yoki Safari\'da oching.'; }
  $('sVid').onclick = async () => {
    const b = $('sVid'), st = $('sVidSt');
    const d = await data();
    d.lines = $('sH1').value.split('\n'); d.sub = $('sSub').value; d.loc = $('sLoc').value;
    b.disabled = true; $('sDl').disabled = true;
    st.textContent = 'Yozilmoqda… shu oynani yopmang va boshqa varaqqa o\'tmang';
    try {
      const v = await thStory.renderVideo(d, { onProgress: p => { b.textContent = `Video · ${Math.round(p * 100)}%`; } });
      const url = URL.createObjectURL(v.blob);
      const a = document.createElement('a');
      a.download = fname(v.ext); a.href = url; a.click();
      st.innerHTML = `${v.mp4 ? 'MP4 tayyor' : 'WebM tayyor — Telegram/Instagram uchun MP4 kerak bo\'lsa Chrome\'ni yangilang'} · ${(v.blob.size / 1048576).toFixed(1)} MB. `
        + `<a href="${url}" download="${fname(v.ext)}">Qayta yuklash</a>`
        + `<video src="${url}" controls muted playsinline style="display:block;width:270px;margin-top:8px;border-radius:14px"></video>`;
    } catch (e) { st.textContent = e.message; toast(e.message, 'error'); }
    b.disabled = false; $('sDl').disabled = false; b.textContent = vidLabel;
  };
  themeUi(); vacList(); draw(true);
}
$('bStory').onclick = () => { if (!window.thStory) { toast('Yuklanmoqda, qayta bosing'); return; } storyForm(); };
$('bNew').onclick = () => {
  if (!CLIENTS.length) return toast('Avval mijoz yarating', 'error');
  form(null);
};

// ── Arizalar (to'liq kontakt bilan) ──
const AST = { new:['p-new','Yangi'], seen:['p-wait','Mijoz ko\'rdi'],
              shortlisted:['p-ok','Tanlandi'], rejected:['p-no','Rad etildi'] };

async function showApps(id){
  openMd('Arizalar', '<div class="empty">Yuklanmoqda...</div>');
  let d;
  try { d = await api(`/api/vacancies/${id}/applications`); }
  catch(e){ $('mdB').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  $('mdT').textContent = d.vacancy.title;
  if (!d.items.length) {
    $('mdB').innerHTML = '<div class="empty">Hali ariza yo\'q.</div>';
    return;
  }
  $('mdB').innerHTML = d.items.map(it => {
    const c = it.candidate;
    const [cls, lbl] = AST[it.state] || AST.new;
    if (!c) return `<div class="ci"><div class="m">Nomzod o'chirilgan</div></div>`;
    const meta = [c.desiredPosition, c.experienceYears ? c.experienceYears + ' yil' : '',
                  c.age ? c.age + ' yosh' : '', c.location].filter(Boolean).join(' · ');
    return `<div class="ci">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <b style="flex:1">${esc(c.fullName) || 'Nomsiz'}
          <span style="font-weight:600;color:var(--muted);font-size:12.5px">${esc(c.publicCode)}</span></b>
        <span class="pill ${cls}">${lbl}</span>
      </div>
      <div class="m">${esc(meta)}</div>
      <div class="m"><b style="color:var(--ink)">${esc(c.phone) || 'telefon yo\'q'}</b>${c.email ? ' · ' + esc(c.email) : ''}</div>
      ${it.message ? `<div class="m" style="color:var(--ink);margin-top:6px">"${esc(it.message)}"</div>` : ''}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
        <span class="m" style="margin:0">${dt(it.createdAt)}</span>
        <a class="btn btn-sm" style="margin-left:auto;text-decoration:none" href="/recruitment.html?${c.source === 'anketa' ? 'src=anketa&' : ''}q=${encodeURIComponent(c.publicCode || c.fullName || '')}">Bazada ochish</a>
        ${['new', 'seen'].includes(it.state) ? `
          <button class="btn btn-sm btn-p" data-apa="shortlist" data-app="${esc(it.id)}">Tanlovga qo'shish</button>
          <button class="btn btn-sm" data-apa="reject" data-app="${esc(it.id)}">Rad etish</button>` : ''}
      </div>
    </div>`;
  }).join('');

  // Agentlik qarori: tanlovga (mijozning shu vakansiyadagi tanlovi) yoki rad
  $('mdB').querySelectorAll('[data-apa]').forEach(b => b.onclick = async () => {
    const act = b.dataset.apa;
    if (act === 'reject' && !confirm('Ariza rad etiladi. Davom etamizmi?')) return;
    b.disabled = true;
    try {
      await api(`/api/vacancies/${id}/applications/${b.dataset.app}/${act}`, { method:'POST' });
      toast(act === 'shortlist' ? 'Tanlovga qo\'shildi — Mijozlar sahifasida davom eting' : 'Rad etildi', 'success');
      showApps(id); load();
      if (window.thShell) thShell.refreshCounts();
    } catch(e){ toast(e.message, 'error'); b.disabled = false; }
  });
}

(async () => {
  await requireRole('restaurant');
  try { CLIENTS = await api('/api/clients'); } catch { CLIENTS = []; }
  load();
})();
</script>
