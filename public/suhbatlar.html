<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentHub — Suhbatlar</title>
<!-- TalentHub dizayn tizimi va umumiy menyu (th-shell) -->
<link rel="icon" href="/img/talenthub-mark.svg" type="image/svg+xml">
<script src="/js/uz-date.js"></script>
<link rel="stylesheet" href="/css/th.css">
<link rel="stylesheet" href="/css/th-app.css">
<script src="/js/th-shell.js" defer></script>
<style>
:root{
  --bg:#EEF3FB; --card:#FFFFFF; --ink:#16233A; --muted:#64748B;
  --line:#E1E8F2; --blue:#2563EB; --blue-d:#1D4ED8;
  --ok:#2E9E5B; --warn:#B4802E; --danger:#C25B4C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;font-size:15px}
button,input{font-family:inherit}

.topbar{flex:none;background:var(--card);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:14px}
.back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);
  color:var(--muted);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;
  font-weight:600;text-decoration:none}
.back:hover{background:#F3F7FD;color:var(--ink)}
.tb-title{font-size:16.5px;font-weight:700}
.tb-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-top:3px}

.chips{flex:none;display:flex;gap:8px;padding:12px 20px;background:var(--card);
  border-bottom:1px solid var(--line);overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

.main{flex:1;display:flex;min-height:0}
.side{width:360px;flex:none;border-right:1px solid var(--line);overflow-y:auto;background:var(--card)}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}

.row{display:flex;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#F3F7FD}
.row.on{background:#E8EFFA}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;background:#E8EFFA;color:var(--blue)}
.av.ag{background:var(--blue);color:#fff}
.mid{flex:1;min-width:0}
.nm{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.tmx{font-size:11px;color:var(--muted)}
.bdg{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.kd{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:5px}
.kd.cc{background:#EAF4EC;color:var(--ok)}
.kd.ca{background:#FDF3E3;color:var(--warn)}

.ph{flex:none;padding:13px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.pb{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px}
.pf{flex:none;display:flex;gap:9px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line)}
.pf input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 15px;
  font-size:14.5px;outline:none;background:var(--bg);color:var(--ink)}
.pf input:focus{border-color:var(--blue)}
.pf button{flex:none;background:var(--blue);color:#fff;border:0;border-radius:20px;
  padding:10px 20px;font-weight:650;font-size:14px;cursor:pointer}
.pf button:disabled{opacity:.5}

.cmsg{max-width:62%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.45;
  word-wrap:break-word;white-space:pre-wrap}
.cmsg.ag{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.cmsg.cl{align-self:flex-start;background:var(--card);border:1px solid var(--line);
  border-bottom-left-radius:5px}
.cmsg.cd{align-self:flex-start;background:#EAF4EC;border:1px solid #CFE6D6;
  border-bottom-left-radius:5px}
.cmsg.sys{align-self:center;background:#E8EFFA;color:#3A5070;font-size:12.5px;
  text-align:center;border-radius:12px;max-width:80%}
.cmsg-w{font-size:10.5px;font-weight:700;opacity:.7;margin-bottom:3px}
.cmsg-t{font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.empty{padding:50px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}

#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;
  flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:380px;background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:10px;
  padding:12px 16px;font-size:13.5px;font-weight:500;color:var(--ink);
  box-shadow:0 8px 24px rgba(16,32,24,.16);pointer-events:auto}
.toast-icon{display:flex;flex:none;color:var(--muted)}
.toast-success{border-left-color:var(--ok)}   .toast-success .toast-icon{color:var(--ok)}
.toast-error{border-left-color:var(--danger)} .toast-error .toast-icon{color:var(--danger)}
.toast-info{border-left-color:var(--blue)}    .toast-info .toast-icon{color:var(--blue)}

.back-m{display:none;border:0;background:transparent;color:var(--link,#0066E0);font:inherit;font-weight:600;padding:0 10px 0 0;cursor:pointer}
@media(max-width:820px){
  .side{width:100%}
  .main.open .side{display:none}
  .main:not(.open) .pane{display:none}
  .back-m{display:inline-flex !important}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/restaurant-admin.html">&#10094; Panel</a>
  <div><div class="tb-title">Suhbatlar</div><div class="tb-sub">Nazorat</div></div>
</div>

<div class="chips">
  <button class="chip on" data-f="">Hammasi</button>
  <button class="chip" data-f="unread">Javob kerak</button>
  <button class="chip" data-f="cc">Mijoz &#8596; Nomzod</button>
  <button class="chip" data-f="ca">Mijoz &#8596; Agentlik</button>
</div>

<div class="main" id="main">
  <div class="side" id="side"><div class="empty">Yuklanmoqda…</div></div>
  <div class="pane">
    <div class="ph" id="ph"><b>Suhbatni tanlang</b></div>
    <div class="pb" id="pb"></div>
    <div class="pf">
      <input id="inp" placeholder="Xabar yozing…" autocomplete="off" maxlength="2000" disabled>
      <button id="snd" disabled>Yuborish</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/utils.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ini = s => String(s||'—').replace(/[^\p{L}\p{N} ]/gu,'').trim().slice(0,2).toUpperCase();
const tmOf = s => { if(!s) return ''; const d=new Date(s), n=new Date();
  return d.toDateString()===n.toDateString()
    ? d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})
    : d.toLocaleDateString('uz-UZ',{day:'2-digit',month:'short'}); };

async function j(p, opt){
  const r = await fetch(p, Object.assign({ headers:{'Content-Type':'application/json'} }, opt));
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || 'Xato');
  return d;
}

let ROWS = [], CUR = null, F = '';

async function load(){
  const q = F === 'unread' ? '?unread=1' : (F ? '?kind=' + F : '');
  try {
    ROWS = await j('/api/chats' + q);
    draw();
  } catch(e){ $('side').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

function draw(){
  if(!ROWS.length){ $('side').innerHTML = '<div class="empty">Suhbat yoq</div>'; return; }
  $('side').innerHTML = ROWS.map(function(t, i){
    const cc = t.kind === 'cc';
    const nm = cc ? (t.clientName + ' ↔ ' + (t.candidateCode || t.candidateName)) : t.clientName;
    return '<div class="row' + (CUR && CUR.id===t.id ? ' on' : '') + '" data-i="' + i + '">'
      + '<div class="av' + (cc ? '' : ' ag') + '">' + esc(ini(t.clientName)) + '</div>'
      + '<div class="mid"><div class="nm">' + esc(nm) + '</div>'
      + '<div class="sb">' + esc(t.lastMsgText || t.position || '—') + '</div></div>'
      + '<div class="rt"><span class="tmx">' + (t.lastMsgFrom ? tmOf(t.lastMsgAt) : '') + '</span>'
      + (t.unread
          ? '<span class="bdg">' + t.unread + '</span>'
          : '<span class="kd ' + t.kind + '">' + (cc ? 'N' : 'A') + '</span>')
      + '</div></div>';
  }).join('');
  $('side').querySelectorAll('.row').forEach(function(el){
    el.onclick = function(){ openThread(ROWS[+el.dataset.i]); };
  });
}

async function openThread(t){
  CUR = t; draw();
  $('main').classList.add('open');
  const cc = t.kind === 'cc';
  // Telefonda ro'yxatga qaytish (ilgari .open olib tashlanmasdi — qaytib bo'lmasdi)
  $('ph').innerHTML = '<button class="back-m" id="backM" aria-label="Suhbatlar ro\x27yxati">&#10094; Suhbatlar</button>'
    + '<b>' + esc(cc ? (t.clientName + ' ↔ ' + t.candidateName) : t.clientName) + '</b>'
    + (cc && t.candidateCode ? ' <span class="kd cc">' + esc(t.candidateCode) + '</span>' : '')
    + (t.position ? '<div class="sb">' + esc(t.position) + '</div>' : '');
  $('backM').onclick = function(){ $('main').classList.remove('open'); };
  $('pb').innerHTML = '<div class="empty">Yuklanmoqda…</div>';
  $('inp').disabled = false;
  $('snd').disabled = false;
  await reload();
  t.unread = 0;
  draw();
}

async function reload(){
  if(!CUR) return;
  try {
    const d = await j('/api/chats/' + encodeURIComponent(CUR.id) + '/messages');
    const W = { client:'Mijoz', candidate:'Nomzod', agency:'Siz' };
    const C = { client:'cl', candidate:'cd', agency:'ag' };
    const ms = d.messages || [];
    $('pb').innerHTML = ms.length
      ? ms.map(function(m){
          if (m.kind === 'system') return '<div class="cmsg sys">' + esc(m.text) + '</div>';
          return '<div class="cmsg ' + (C[m.from] || 'cl') + '">'
            + '<div class="cmsg-w">' + (W[m.from] || m.from) + '</div>' + esc(m.text)
            + '<div class="cmsg-t">' + tmOf(m.createdAt) + '</div></div>';
        }).join('')
      : '<div class="empty">Hali xabar yoq</div>';
    $('pb').scrollTop = $('pb').scrollHeight;
  } catch(e){ $('pb').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

async function send(){
  const t = $('inp').value.trim();
  if(!t || !CUR) return;
  $('snd').disabled = true;
  try {
    await j('/api/chats/' + encodeURIComponent(CUR.id) + '/messages',
      { method:'POST', body: JSON.stringify({ text: t }) });
    $('inp').value = '';
    await reload();
    await load();
  } catch(e){ if (typeof toast === 'function') toast(e.message, 'error'); }
  $('snd').disabled = false;
}

$('snd').onclick = send;
$('inp').onkeydown = function(e){ if(e.key === 'Enter') send(); };
document.querySelectorAll('.chip').forEach(function(c){
  c.onclick = function(){
    document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on');
    F = c.dataset.f;
    load();
  };
});

load();
// Yangi xabarlar o'zi kelsin — sahifa ochiq turganda qo'lda yangilash kerak emas
setInterval(function(){ if(!document.hidden) load(); }, 30000);
</script>
</body>
</html>
