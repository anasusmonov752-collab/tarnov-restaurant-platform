// Qidiruv va filtr — brauzerda (ro'yxat 60 tagacha): matn (sarlavha, joy,
// mo'ljal, tavsif), "Sizga mos", lavozim. Lavozim chiplari — ro'yxatda borlari.
const JF = { q: '', mos: false, role: '' };
const ROLES_F = ['ofitsiant', 'oshpaz', 'xostess', 'barmen', 'kassir', 'menejer', 'operator'];   // nomi — t('role.<k>')
const norm = s => String(s || '').toLowerCase().replace(/[ʻʼ‘’`']/g, '');
function drawJobFilter(){
  const roles = [...new Set(JOBS.map(v => v.role).filter(r => ROLES_F.includes(r)))];
  const n = JOBS.filter(v => v.match).length;
  $('jobF').innerHTML = [
    `<button class="${!JF.mos && !JF.role ? 'on' : ''}" data-f="all">${esc(t('cb.all', { n: JOBS.length }))}</button>`,
    n ? `<button class="${JF.mos ? 'on' : ''}" data-f="mos">${esc(t('cb.fitN', { n }))}</button>` : '',
    ...roles.map(r => `<button class="${JF.role === r ? 'on' : ''}" data-f="r:${r}">${esc(t('role.' + r))}</button>`)
  ].join('');
  $('jobF').querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    const f = b.dataset.f;
    if (f === 'all') { JF.mos = false; JF.role = ''; }
    else if (f === 'mos') JF.mos = !JF.mos;
    else { const r = f.slice(2); JF.role = JF.role === r ? '' : r; }
    drawJobFilter(); drawJobs();
  });
}
$('jobQ').oninput = () => { JF.q = $('jobQ').value; drawJobs(); };

async function loadJobs(){
  try{
    const rows = await api('/api/cand/vacancies');
    JOBS = rows;
    if (!rows.length) {
      $('jobBar').classList.add('hide');
      $('jobList').innerHTML = `<div class="msg">${nl2br(t('cb.noJobs'))}</div>`;
      return;
    }
    $('jobBar').classList.toggle('hide', rows.length < 4);     // 3 ta ish uchun qidiruv ortiqcha
    drawJobFilter();
    drawJobs();
    if (OPEN_VAC) { const j = JOBS.find(x => x.id === OPEN_VAC); OPEN_VAC = null; if (j) showJob(j); }
  }catch(e){ $('jobList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}

function drawJobs(){
  const q = norm(JF.q).trim();
  const list = JOBS.map((v, i) => [v, i]).filter(([v]) =>
    (!JF.mos || v.match) && (!JF.role || v.role === JF.role) &&
    (!q || norm([v.title, v.venue, placeOf(v), v.hook, v.description, v.conditions].join(' ')).includes(q)));
  if (!list.length) {
    $('jobList').innerHTML = `<div class="msg">${esc(t('cb.noFound'))}<br><button class="lnk" id="jobReset">${esc(t('cb.reset'))}</button></div>`;
    $('jobReset').onclick = () => { JF.q = ''; JF.mos = false; JF.role = ''; $('jobQ').value = ''; drawJobFilter(); drawJobs(); };
    return;
  }
  {
    $('jobList').innerHTML = list.map(([v, i]) => {
      const need = [
        v.minExp ? t('cb.expJob', { n: v.minExp }) : '',
        v.shift ? (v.shift === 'ikkalasi' ? vShift(v.shift) : t('cb.shiftOf', { s: shiftLbl(v.shift).toLowerCase() })) : '',
        (v.languages || []).join(', ')
      ].filter(Boolean).join(' · ');
      // Karta qisqa: kim (joy), qayerda, qancha, nima beriladi. Qolgani — "Batafsil"
      const pk = perksOf(v);
      const sub = [v.payoutText, v.schedule].filter(Boolean).join(' · ');
      return `<div class="jb tap" data-vi="${i}">
        <div class="ti">${esc(v.title)}</div>
        ${v.venue ? `<div class="vn">${esc(v.venue)}</div>` : ''}
        <div class="pl">${esc(placeOf(v))}</div>
        <div class="sl ${v.salaryText ? '' : 'no'}">${salLine(v) || esc(t('cb.noSal'))}</div>
        ${sub ? `<div class="ln" style="margin-top:3px">${esc(sub)}</div>` : ''}
        ${pk.chips.length ? `<div class="pk">${pk.chips.slice(0, 3).map(p => `<span>${esc(p)}</span>`).join('')}</div>` : ''}
        ${v.hook ? `<div class="hk">${esc(v.hook)}</div>` : ''}
        ${need ? `<div class="ln" style="margin-top:7px">${esc(t('cb.need', { x: need }))}</div>` : ''}
        <div class="row">
          ${v.match ? matchTag() : ''}
          ${trustTag(v)}
        </div>
        <div class="more">${esc(t('cb.more'))}</div>
        <div class="row">
          <button class="ab" data-ap="${v.id}" ${v.applied ? 'disabled' : ''}>
            ${esc(t(v.applied ? 'cb.applied' : 'cb.apply'))}</button>
        </div>
      </div>`;
    }).join('');

    // Kartani bosish — to'liq sahifa. Tugma bosilsa karta ochilmasin.
    document.querySelectorAll('[data-vi]').forEach(el => el.onclick = () => showJob(JOBS[+el.dataset.vi]));
    // "Ariza berish" — darhol yubormaydi, ariza oynasini ochadi (tekshiruv + xat)
    document.querySelectorAll('[data-ap]').forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      const j = JOBS.find(x => x.id === b.dataset.ap);
      if (j) openApply(j);
    });
  }
}

const AST = { new:'wait', seen:'wait', shortlisted:'ok', rejected:'no' };
let APPS = [];

async function loadApps(){
  try{
    const rows = await api('/api/cand/applications');
    if (!rows.length) {
      $('appList').innerHTML = `<div class="msg">${nl2br(t('cb.noApps'))}</div>`;
      return;
    }
    APPS = rows;
    $('appList').innerHTML = rows.map((a, i) => {
      const v = a.vacancy;
      return `<div class="jb ${v ? 'tap' : ''}" data-ai="${i}">
        <div class="ti">${v ? esc(v.title) : esc(t('cb.vDeleted'))}</div>
        ${v ? `<div class="pl">${esc(v.companyOpen ? v.place : [v.venue, placeOf(v)].filter(Boolean).join(' · '))}</div>` : ''}
        ${v && v.salaryText ? `<div class="sl">${salLine(v)}</div>` : ''}
        <div class="row">
          <span class="tg2 ${v && v.companyOpen ? 'ok' : ({ ok:'ok', no:'no', go:'fresh', wait:'wait' }[a.tone] || AST[a.state] || 'wait')}">${esc(a.stateLabel)}</span>
          <span style="font-size:12.5px;color:var(--muted)">${dmy(a.createdAt)}</span>
        </div>
        ${(a.steps || []).length ? `<div class="stp">${a.steps.map((s, i) =>
          `<div class="${i === a.steps.length - 1 ? 'cur' : ''} ${s.key === 'hired' ? 'ok' : s.key === 'closed' ? 'no' : ''}">${esc(s.label)}${s.at ? `<small>${dmy(s.at)}</small>` : ''}</div>`).join('')}
          ${a.final ? '' : `<div style="color:var(--muted)">${esc(t('cb.nextStep'))}</div>`}</div>` : ''}
        ${a.message ? `<div class="ln" style="margin-top:6px">${esc(t('cb.yourMsg', { m: a.message }))}</div>` : ''}
        ${v && v.companyOpen ? `<div class="more" data-co="${esc(v.clientId)}" style="cursor:pointer">${esc(t('cb.aboutCo'))}</div>` : ''}
      </div>`;
    }).join('');
    // Kontakt ochilgan — kompaniya kartasi (chatdagi bilan bir xil)
    document.querySelectorAll('[data-co]').forEach(el => el.onclick = ev => { ev.stopPropagation(); showCompany(el.dataset.co); });
    // Kartaning o'zini bosish: kontakt ochilgan bo'lsa — kompaniya, aks holda —
    // vakansiya sahifasi (restoran nomi kontaktgacha ko'rinmaydi)
    document.querySelectorAll('[data-ai]').forEach(el => el.onclick = ev => {
      if (ev.target.closest('button, a')) return;
      const a = APPS[+el.dataset.ai], v = a && a.vacancy;
      if (!v) return;
      haptic();
      if (v.companyOpen && v.clientId) showCompany(v.clientId);
      else showJob(Object.assign({}, v, { applied: true }));
    });
  }catch(e){ $('appList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}

const dmy = d => d ? new Date(d).toLocaleDateString(LOC(),{day:'2-digit',month:'short'}) : '';


// ══════════════════════════════════════════════════════════
//  SUHBATLAR
// ══════════════════════════════════════════════════════════
// Tepada qadalgan "TalentHub" (agentlik) — u BotMessage'dagi mavjud
// Telegram yozishmasi, shuning uchun id'si maxsus: 'agency'.
// Ostida kontaktingizni ochgan mijozlar — ular NOMI bilan ko'rinadi,
// chunki kontakt ochilgan, ya'ni tanishish allaqachon bo'lgan.

const VF = '<svg class="ch-vf" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">'
  + '<circle cx="12" cy="12" r="11" fill="#2563EB"/>'
  + '<path d="M10.8 16.2l-3.4-3.4 1.3-1.3 2.1 2.1 5-5 1.3 1.3z" fill="#fff"/></svg>';

// Agentlik suhbati — yordam chati (yulduzcha emas, quloqchin: "bu yerda javob beriladi")
const AG_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/>'
  + '<path d="M21 16v2a4 4 0 0 1-4 4h-5"/></svg>';

let CHATS = [], CUR = null;

const initialsOf = s => String(s || '—').replace(/[^\p{L}\p{N} ]/gu, '').trim().slice(0, 2).toUpperCase();

function tmOf(s){
  if (!s) return '';
  const d = new Date(s), n = new Date();
  return d.toDateString() === n.toDateString()
    ? d.toLocaleTimeString(LOC(), { hour:'2-digit', minute:'2-digit' })
    : d.toLocaleDateString(LOC(), { day:'2-digit', month:'short' });
}

// quiet — jonli yangilash (pastda): xato bo'lsa ro'yxat o'chirilmaydi
async function loadChats(quiet){
  try {
    CHATS = await api('/api/cand/chats');
    drawChats();
  } catch(e){
    if (!quiet) $('chatList').innerHTML = '<div class="ch-empty">' + esc(e.message) + '</div>';
  }
}

function drawChats(){
  const box = $('chatList');
  setDot(CHATS.reduce((s, c) => s + (c.unread || 0), 0));
  if (!CHATS.length){ box.innerHTML = '<div class="ch-empty">' + esc(t('cb.noChats')) + '</div>'; return; }
  box.innerHTML = CHATS.map((c, i) => {
    const ag = !!c.pinned;
    const nm = c.title || '—';
    return '<div class="ch-row" data-i="' + i + '">'
      + '<div class="ch-av' + (ag ? ' ag' : '') + '" data-nozoom>' + (ag ? AG_IC : coAvatar(c)) + '</div>'
      + '<div class="ch-mid"><div class="ch-top"><span class="ch-name">' + esc(nm) + '</span>'
      + (ag ? VF + '<span class="ch-pin">&#128204;</span>' : '') + '</div>'
      + '<div class="ch-last">' + esc(c.subtitle || c.lastMsgText || '') + '</div></div>'
      + '<div class="ch-right"><span class="ch-time">' + (c.lastMsgFrom ? tmOf(c.lastMsgAt) : '') + '</span>'
      + (c.unread ? '<span class="ch-badge">' + c.unread + '</span>' : '') + '</div></div>';
  }).join('');
  box.querySelectorAll('.ch-row').forEach(el => {
    el.onclick = () => openChat(CHATS[+el.dataset.i]);
  });
}

// Ish beruvchi — logotipi (kontakt ochiq va yuklangan bo'lsa), aks holda bosh harflar.
// Ro'yxatda bosish suhbatni ochadi (data-nozoom); to'liq ko'rish — kompaniya kartasida.
function coAvatar(c){
  return c.open && c.hasLogo
    ? '<img src="/api/cand/companies/' + encodeURIComponent(c.clientId) + '/logo?t=' + encodeURIComponent(PT)
      + '&v=' + encodeURIComponent(c.logoAt || '') + '" alt="">'
    : esc(initialsOf(c.title));
}

async function openChat(c){
  CUR = c;
  const ag = !!c.pinned;
  $('cvName').textContent = c.title || '—';
  $('cvVf').innerHTML = ag ? VF : '';
  $('cvSub').textContent = ag ? t('cb.support') : (c.subtitle || '');
  $('cvAv').innerHTML = ag ? AG_IC : coAvatar(c);
  $('cvAv').className = 'ch-av' + (ag ? ' ag' : '');
  // Mijoz nomini bosish — kompaniya va vakansiya (faqat kontakt ochiq bo'lsa)
  const tap = !ag && c.open && c.clientId;
  $('cvWho').classList.toggle('tap', !!tap);
  $('cvWho').onclick = tap ? () => showCompany(c.clientId) : null;
  $('cvBody').innerHTML = '<div class="ch-empty">' + esc(t('cb.loading')) + '</div>';
  MSG_SIG = '';
  $('cv').classList.remove('hide');
  await reloadMsgs();
  c.unread = 0;
  drawChats();
}

async function reloadMsgs(quiet){
  if (!CUR) return;
  const id = CUR.id;
  try {
    const d = await api('/api/cand/chats/' + encodeURIComponent(id) + '/messages');
    if (!CUR || CUR.id !== id) return;                 // javob kelguncha boshqa suhbat ochildi
    drawMsgs(d.messages || []);
  } catch(e){
    if (!quiet) $('cvBody').innerHTML = '<div class="ch-empty">' + esc(e.message) + '</div>';
  }
}

// Oxirgi chizilgan yozishma — o'zgarmagan bo'lsa qayta chizilmaydi (jonli yangilash)
let MSG_SIG = '';
function drawMsgs(ms){
  const b = $('cvBody');
  const last = ms[ms.length - 1];
  const sig = ms.length + ':' + (last ? (last.id || last.createdAt) : '');
  if (sig === MSG_SIG) return;
  const first = !MSG_SIG;
  // Pastda turgan bo'lsa — yangi xabarga tushadi; yuqorini o'qiyotgan bo'lsa — joyida qoladi
  const atEnd = first || b.scrollHeight - b.scrollTop - b.clientHeight < 80;
  MSG_SIG = sig;
  if (!ms.length){
    // Yordam chati bo'sh — salomlashuv (bazaga yozilmaydi), "nima yozaman" savoliga javob
    b.innerHTML = CUR && CUR.pinned
      ? '<div class="cmsg them">' + esc(t('cb.hello')) + '</div>'
      : '<div class="ch-empty">' + esc(t('cb.noMsgs')) + '</div>';
    return;
  }
  b.innerHTML = ms.map(m => {
    if (m.kind === 'system') return '<div class="cmsg sys">' + esc(m.text) + '</div>';
    const me = m.from === 'candidate';
    return '<div class="cmsg ' + (me ? 'me' : 'them') + '">' + esc(m.text)
      + '<div class="cmsg-t">' + tmOf(m.createdAt) + '</div></div>';
  }).join('');
  if (atEnd) b.scrollTop = b.scrollHeight;
}

async function sendMsg(){
  const inp = $('cvIn'), txt = inp.value.trim();
  if (!txt || !CUR) return;
  $('cvSend').disabled = true;
  try {
    await api('/api/cand/chats/' + encodeURIComponent(CUR.id) + '/messages',
      { method:'POST', body: JSON.stringify({ text: txt }) });
    inp.value = '';
    await reloadMsgs();
    $('cvBody').scrollTop = $('cvBody').scrollHeight;     // o'z xabari — doim ko'rinsin
    loadChats();
  } catch(e){
    $('cvBody').insertAdjacentHTML('beforeend',
      '<div class="cmsg sys">' + esc(t('cb.notSent', { e: e.message })) + '</div>');
    $('cvBody').scrollTop = $('cvBody').scrollHeight;
  }
  $('cvSend').disabled = false;
}

// ── Qizil nuqta: o'qilmagan xabarlar (mijozlardan) ──
// Kirganda, suhbatdan chiqqanda va ilovaga qaytganda yangilanadi.
// Pastki menyuda o'qilmaganlar SONI (nuqta emas)
function badge(d, n){ if (!d) return; d.classList.toggle('on', n > 0); d.classList.toggle('n', n > 0); d.textContent = n > 0 ? (n > 99 ? '99+' : String(n)) : ''; }
function setDot(n){ badge($('dM'), n); }
function refreshUnread(){
  if (!INIT) return;
  api('/api/cand/unread').then(d => setDot(d.chats)).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshUnread(); });

$('cvBack').onclick = () => { $('cv').classList.add('hide'); CUR = null; refreshUnread(); };

// ── Jonli chat ── (miniapp.html bilan bir xil qoida)
// Mini App'ga server o'zi xabar yubora olmaydi (push faqat bot orqali).
// Suhbat ochiq — har 4 s, "Xabarlar" ro'yxati ochiq — har 12 s, boshqa
// paytda — o'qilmaganlar soni har 30 s. Ilova fonda bo'lsa so'ralmaydi.
let LIVE_N = 0;
function liveTick(){
  if (document.hidden || !INIT) return;
  LIVE_N++;
  if (CUR && !$('cv').classList.contains('hide')) { reloadMsgs(true); return; }
  if ($('chatList').offsetParent) { if (LIVE_N % 3 === 0) loadChats(true); return; }
  if (LIVE_N % 8 === 0) refreshUnread();
}
setInterval(liveTick, 4000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !CUR || $('cv').classList.contains('hide')) return;
  reloadMsgs(true);
});
$('cvSend').onclick = sendMsg;
$('cvIn').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };

// Telegram xabaridagi tugma profil.html#chat ga olib keladi —
// shu holda darhol Xabarlar tabini ochamiz.
// Element tekshiriladi: INIT bo'lmasa tablar yo'qoladi.
if (location.hash === '#chat') setTimeout(() => { if ($('tM')) pickTab('tM'); }, 0);
// Ariza xabaridagi tugmalar: #apps — Arizalarim, #jobs — Ish o'rinlari (services/appLife)
if (location.hash === '#apps') setTimeout(() => { if ($('tA')) pickTab('tA'); }, 0);
if (location.hash === '#jobs' || /^#v=/.test(location.hash)) setTimeout(() => { if ($('tJ')) pickTab('tJ'); }, 0);
// ── Tablar ──
const TABS = [['tP','app'], ['tJ','vJ'], ['tA','vA'], ['tM','vM']];
function pickTab(id){
  TABS.forEach(([tb, v]) => {
    $(tb).classList.toggle('on', tb === id);
    $(v).classList.toggle('hide', tb !== id);
  });
  haptic();
  window.scrollTo(0, 0);
  if (id === 'tJ') loadJobs();
  if (id === 'tA') loadApps();
  if (id === 'tM') loadChats();
  moveLens();
}
TABS.forEach(([tb]) => { $(tb).onclick = () => pickTab(tb); });

// ── Linza: faol tab ostiga prujina bilan suriladi ──
// Birinchi joylashuv animatsiyasiz — aks holda ochilganda chapdan uchib keladi.
function moveLens(){
  const lens = $('lens'), on = document.querySelector('.tabs .tb.on');
  if (!lens || !on || !on.offsetWidth) return;
  const first = !lens.classList.contains('on');
  if (first) lens.style.transition = 'none';
  lens.style.width = on.offsetWidth + 'px';
  lens.style.transform = 'translateX(' + on.offsetLeft + 'px) scale(1.04,1.16)';
  if (first) { void lens.offsetWidth; lens.style.transition = ''; lens.classList.add('on'); }
}
window.addEventListener('resize', moveLens);

// ── Linzani barmoq bilan surish (iOS Telegram/Instagram kabi) ──
// Barmoq panelda 6px dan ko'p yursa — surish rejimi: linza barmoq ortidan
// yuradi va kattalashadi, ostidagi bo'lim belgilanadi, qo'yib yuborilganda
// o'sha bo'lim ochiladi va linza prujina bilan joyiga o'tiradi.
// Kichik harakat — oddiy bosish (click) bo'lib qoladi.
(function(){
  const nav = document.querySelector('.tabs'), lens = $('lens');
  if (!nav || !lens) return;
  const btns = [...nav.querySelectorAll('.tb')];
  const tick = () => { try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch(e){} };
  let sx = null, pid = null, drag = false, hov = null, quiet = 0;

  // Barmoq ostidagi bo'lim; panel chetidan chiqsa — eng chetdagisi
  const under = x => {
    const first = btns[0].getBoundingClientRect(), last = btns[btns.length - 1].getBoundingClientRect();
    if (x < first.left) return btns[0];
    if (x >= last.right) return btns[btns.length - 1];
    return btns.find(b => { const r = b.getBoundingClientRect(); return x >= r.left && x < r.right; }) || null;
  };

  nav.addEventListener('pointerdown', e => { sx = e.clientX; pid = e.pointerId; drag = false; });

  nav.addEventListener('pointermove', e => {
    if (sx == null || e.pointerId !== pid) return;
    if (!drag) {
      if (Math.abs(e.clientX - sx) < 6) return;
      drag = true;
      try { nav.setPointerCapture(pid); } catch(err){}
      lens.style.transition = 'width .2s, opacity .2s';      // barmoqqa darhol ergashsin
      lens.classList.add('drag', 'on');
    }
    const nr = nav.getBoundingClientRect(), w = lens.offsetWidth;
    const x = Math.max(5, Math.min(nr.width - 5 - w, e.clientX - nr.left - w / 2));
    lens.style.transform = 'translateX(' + x + 'px) scale(1.1,1.3)';
    const b = under(e.clientX);
    if (b && b !== hov) {
      if (hov) hov.classList.remove('hov');
      hov = b; b.classList.add('hov'); tick();
    }
  });

  const end = e => {
    if (sx == null || (e && e.pointerId !== pid)) return;
    const was = drag;
    sx = null; drag = false;
    if (!was) return;                                       // oddiy bosish — click o'zi ishlaydi
    lens.classList.remove('drag');
    lens.style.transition = '';                             // joyiga prujina bilan
    quiet = Date.now() + 350;                               // surishdan keyingi click bo'limni qayta almashtirmasin
    const target = hov;
    if (hov) { hov.classList.remove('hov'); hov = null; }
    if (target) pickTab(target.id); else moveLens();
  };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', end);

  // iOS: linzani surayotganda butun Mini App qimirlab ketardi. Ikki sabab:
  //  1) Telegram'ning "pastga surib yig'ish" imo-ishorasi — barmoq ozgina
  //     pastga og'sa ham ishga tushadi. Barmoq panelda turganda o'chiramiz,
  //     qo'yilganda qaytaramiz: boshqa joyda odatdagidek yopiladi.
  //  2) WebView touch-action'ni to'liq hurmat qilmaydi — sahifa "rezinadek"
  //     cho'ziladi. Panelda boshlangan harakatda aylantirishni to'xtatamiz
  //     (pointer hodisalari va oddiy bosish bunga tegmaydi).
  const swipes = on => { try {
    if (!TG || !TG.isVersionAtLeast || !TG.isVersionAtLeast('7.7')) return;
    on ? TG.enableVerticalSwipes() : TG.disableVerticalSwipes();
  } catch(e){} };
  const restore = () => setTimeout(() => swipes(true), 60);
  nav.addEventListener('touchstart', () => swipes(false), { passive: true });
  nav.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  nav.addEventListener('touchend', restore);
  nav.addEventListener('touchcancel', restore);
  nav.addEventListener('click', e => {
    if (Date.now() < quiet) { e.stopPropagation(); e.preventDefault(); }
  }, true);
})();
moveLens();

// ── Tilni almashtirish (profildagi UZ | RU) ──
// Saqlanadi (Candidate.lang) — bot xabarlari ham shu tilda. Server javoblari
// (vakansiya, ariza bosqichlari) yangi tilda bo'lishi uchun ro'yxatlar keyingi
// ochilishda qayta o'qiladi (pickTab har safar yuklaydi).
async function setLang(l){
  if (l === LANG) return;
  const prev = LANG;
  LANG = l; applyStatic(); haptic();
  try {
    await api('/api/cand/me', { method:'PATCH', body: JSON.stringify({ lang: l }) });
    render(await api('/api/cand/me'));
  } catch(e){
    LANG = prev; applyStatic(); render(P);
  }
}

(async function(){
  if (!INIT) { $('app').innerHTML = `<div class="msg">${esc(t('cb.onlyTg'))}</div>`; return; }
  try {
    const me = await api('/api/cand/me');
    if (me.lang && me.lang !== LANG) { LANG = me.lang; applyStatic(); }
    render(me); refreshUnread();
  }
  catch(e){ $('app').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
})();
</script>
