<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RestoOne — Nomzodlar bazasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FB; --ink:#16233A; --green:#0F2747; --green2:#0A1B33;
  --gold:#2563EB; --gold-d:#1D4ED8; --card:#FFFFFF; --line:#E1E8F2;
  --muted:#64748B; --danger:#C25B4C; --ok:#2E9E5B;
  --shadow:0 1px 3px rgba(16,32,24,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(15,39,71,.22);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
button,input,select{font-family:inherit}

.topbar{flex:none;background:linear-gradient(180deg,var(--green),var(--green2));color:#F5EFDF;padding:13px 20px;display:flex;align-items:center;gap:14px;z-index:40}
.back{display:flex;align-items:center;gap:7px;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);color:#F5EFDF;padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;text-decoration:none}
.back:hover{background:rgba(37,99,235,.26)}
.tb-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center}
.tb-mark span{font-style:italic;font-weight:700;font-size:21px;color:#F4F9FF}
.tb-title{font-size:17px;font-weight:800;line-height:1}
.tb-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(37,99,235,.85);font-weight:700;margin-top:3px}
.tb-spacer{flex:1}
.view-sw{display:flex;align-items:center;gap:7px;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.28);color:rgba(245,239,223,.9);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:700;text-decoration:none}
.view-sw:hover{background:rgba(37,99,235,.24)}
.tb-total{font-size:13px;color:rgba(245,239,223,.8);font-weight:700}
.tb-total b{color:var(--gold);font-size:16px}

.wrap{flex:1;display:grid;grid-template-columns:252px 1fr;gap:16px;padding:16px 20px;overflow:hidden}

/* ── Chap voronka ── */
.side{overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.sbox h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px;padding:0 4px}
.sitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;border:1px solid transparent}
.sitem:hover{background:#F3F7FD}
.sitem.on{background:rgba(37,99,235,.09);border-color:rgba(37,99,235,.25);color:var(--gold-d)}
.sitem .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sitem .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .cnt{font-size:12.5px;color:var(--muted);font-weight:700}
.sitem.on .cnt{color:var(--gold-d)}
.sitem.sub{padding-left:22px;font-weight:500;font-size:13px}

/* ── O'ng ustun ── */
.main{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.hint{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:14px;display:flex;align-items:center;gap:8px}
.hint b{color:var(--gold-d)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font-weight:700;font-size:13px;border-radius:10px;padding:9px 15px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--gold);background:#F5F9FF}
.btn-p{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-p:hover{background:var(--gold-d);border-color:var(--gold-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:7px 12px;font-size:12.5px}
.srch{flex:1;min-width:180px;max-width:300px}
.srch input{width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink)}
.srch input:focus{outline:none;border-color:var(--gold)}
.upz{border:2px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;background:#F8FAFD}
.upz:hover,.upz.over{border-color:var(--gold);background:#F3F7FD}
.upz .t{font-size:15px;font-weight:700;margin-top:8px}
.upz .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fld select,.fld input{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink)}
.prog{position:fixed;inset:0;background:rgba(16,32,24,.6);z-index:200;display:none;align-items:center;justify-content:center}
.prog.on{display:flex}
.prog-c{background:#fff;border-radius:14px;padding:24px 28px;min-width:300px;text-align:center}
.prog-b{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:13px}
.prog-b i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}

/* ── Telegram ── */
.tgb{position:relative}
.tgb.on{background:#229ED9;border-color:#229ED9;color:#fff}
.tgb.on:hover{background:#1b87ba;border-color:#1b87ba}
.tgb.wait{background:#FFF7E8;border-color:#E8D5A8;color:#9A6B10}
.tgb.off{opacity:.5;cursor:not-allowed}
.tgb .dot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;line-height:17px;text-align:center;padding:0 4px;font-weight:700}
.tg-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.tg-pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px}
.chat{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;margin-bottom:11px}
.bub{max-width:78%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bub.in{align-self:flex-start;background:#F1F5FA;border-bottom-left-radius:4px}
.bub.out{align-self:flex-end;background:#229ED9;color:#fff;border-bottom-right-radius:4px}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;padding:3px 0;max-width:100%;text-align:center}
.bub.err{align-self:flex-end;background:rgba(194,91,76,.12);color:var(--danger);border:1px solid rgba(194,91,76,.3)}
.bub .t{font-size:10.5px;opacity:.65;margin-top:3px}
.tg-send{display:flex;gap:8px}
.tg-send textarea{flex:1;min-height:40px;max-height:110px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-family:inherit;resize:vertical;color:var(--ink)}
.tg-send textarea:focus{outline:none;border-color:var(--gold)}
.linkbox{display:flex;gap:8px;align-items:center;background:#F3F7FD;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:9px}
.linkbox code{flex:1;font-size:12px;word-break:break-all;color:var(--gold-d);font-family:ui-monospace,monospace}

.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}

/* ── hh uslubidagi karta ── */
.rc{flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rc.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.rc-body{display:flex;gap:16px;padding:16px 18px}
.rc-ph{width:112px;height:140px;flex:none;border-radius:10px;overflow:hidden;background:#E8EEF7;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#8597AE;cursor:zoom-in}
.rc-ph img{width:100%;height:100%;object-fit:cover}
.rc-main{flex:1;min-width:0}
.rc-pos{font-size:17px;font-weight:700;color:var(--gold-d);cursor:pointer;display:inline-block}
.rc-pos:hover{text-decoration:underline}
.rc-meta{font-size:13.5px;color:var(--ink);margin-top:4px}
.rc-meta .sep{color:#C3CEDD;margin:0 7px}
.rc-meta .dim{color:var(--muted)}
.rc-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;background:#F1F5FA;color:var(--muted)}
.tag.ok{background:rgba(46,158,91,.1);color:#1E7A46}
.tag.ai{background:rgba(37,99,235,.1);color:var(--gold-d)}
.rc-rows{margin-top:13px;border-top:1px solid var(--line)}
.rc-row{display:grid;grid-template-columns:142px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.rc-row:last-child{border-bottom:none}
.rc-k{color:var(--muted);font-weight:600}
.rc-v{min-width:0}
.rc-v .pt{color:#C3CEDD;margin:0 7px}
.lnk{color:var(--gold-d);cursor:pointer;font-weight:600}
.lnk:hover{text-decoration:underline}
.rc-foot{display:flex;align-items:center;gap:9px;padding:11px 18px;background:#F8FAFD;border-top:1px solid var(--line);flex-wrap:wrap}
.cb{width:19px;height:19px;border-radius:5px;border:2px solid #C3CEDD;background:#fff;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.cb.on{background:var(--gold);border-color:var(--gold)}
.cb.on::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.foot-sp{flex:1}
.icb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icb:hover{border-color:var(--gold);color:var(--gold-d)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:12px;height:230px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── Modal (tafsilot + tarix) ── */
.ov{position:fixed;inset:0;background:rgba(16,32,24,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.ov.on{display:flex}
.md{background:var(--card);border-radius:14px;width:100%;max-width:1000px;overflow:hidden}
.md-top{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.md-x{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;color:var(--muted)}
.md-grid{display:grid;grid-template-columns:1fr 290px;gap:18px;padding:18px}
.md-box{border:1px solid var(--line);border-radius:12px;padding:15px}
.md-box h4{font-size:15px;font-weight:700;margin-bottom:11px}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:4px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:14px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.tl-t{font-size:13.5px;font-weight:600}
.tl-d{font-size:12px;color:var(--muted);margin-top:2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;background:var(--green);color:#F5EFDF;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;display:none}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}.side{display:none}.md-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/restaurant-admin.html">← Admin</a>
  <div class="tb-mark"><span>R</span></div>
  <div><div class="tb-title">Nomzodlar bazasi</div><div class="tb-sub">Rekruting · Ro'yxat</div></div>
  <div class="tb-spacer"></div>
  <span class="tb-total">Jami: <b id="tbTotal">—</b></span>
  <button class="view-sw" id="tgStatusBtn" title="Telegram bot holati">Telegram</button>
  <a class="view-sw" href="/recruitment-kanban.html" title="Kanban ko'rinishiga o'tish">⊞ Kanban</a>
</div>

<div class="wrap">
  <aside class="side">
    <div class="sbox">
      <h3>Tanlov voronkasi</h3>
      <div id="funnel"></div>
    </div>
    <div class="sbox">
      <h3>Lavozim</h3>
      <div id="roles"></div>
    </div>
  </aside>

  <section class="main">
    <div class="hint" id="hint">Yuklanmoqda…</div>
    <div class="bulk">
      <div class="srch"><input id="q" placeholder="Ism, lavozim, ko'nikma, telefon…" autocomplete="off"></div>
      <button class="btn btn-sm btn-p" id="bUpload">⬆ Rezyume yuklash</button>
      <span style="width:1px;height:22px;background:var(--line)"></span>
      <button class="btn btn-sm" id="bSelAll">Barchasini tanlash</button>
      <button class="btn btn-sm btn-p" id="bInvite" disabled>Suhbatga chaqirish</button>
      <button class="btn btn-sm" id="bReserve" disabled>Zaxiraga</button>
      <button class="btn btn-sm" id="bReject" disabled>Rad etish</button>
      <button class="btn btn-sm tgb" id="bTgInvite" disabled>Telegramga taklif</button>
      <span style="font-size:12.5px;color:var(--muted);font-weight:600" id="selCnt"></span>
    </div>
    <div class="list" id="list">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    </div>
  </section>
</div>

<div class="ov" id="ov"><div class="md" id="md"></div></div>

<div class="ov" id="upOv">
  <div class="md" style="max-width:520px">
    <div class="md-top"><b style="font-size:16px">Rezyume yuklash</b><button class="md-x" id="upX">✕</button></div>
    <div style="padding:18px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="fld"><label>Manba</label>
          <select id="uSource">
            <option value="hh">hh.uz</option><option value="manual">Qo'lda</option>
            <option value="referral">Tavsiya</option><option value="telegram">Telegram</option><option value="other">Boshqa</option>
          </select>
        </div>
        <div class="fld"><label>Filial (ixtiyoriy)</label><input id="uBranch" placeholder="masalan: Chorsu"></div>
      </div>
      <div class="upz" id="upz">
        <div style="font-size:26px;color:var(--gold)">⬆</div>
        <div class="t">PDF fayllarni tashlang yoki tanlang</div>
        <div class="s">Bir vaqtda bir nechta fayl mumkin — AI o'qib maydonlarga ajratadi</div>
        <input type="file" id="fileInput" accept=".pdf,.txt,application/pdf,text/plain" multiple style="display:none">
      </div>
    </div>
  </div>
</div>

<div class="prog" id="prog">
  <div class="prog-c">
    <div style="font-size:14px;font-weight:700" id="progT">Yuklanmoqda…</div>
    <div class="prog-b"><i id="progB"></i></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STAGES = [
  { k:'new', l:'Yangi', c:'#2563EB' },
  { k:'phone', l:'Tel. suhbat', c:'#3B82C4' },
  { k:'interview', l:'Suhbat', c:'#7C5CBF' },
  { k:'interview2', l:'2-bosqich', c:'#B5539C' },
  { k:'trial', l:'Sinov muddati', c:'#D98E2B' },
  { k:'hired', l:'Ishga olindi', c:'#2E9E5B' },
  { k:'reserve', l:'Zaxira', c:'#6B7A70' },
  { k:'rejected', l:'Rad etildi', c:'#C25B4C' },
];
const SMAP = Object.fromEntries(STAGES.map(s=>[s.k,s]));
const ROLES = { ofitsiant:'Ofitsiant', barmen:'Barmen', xostess:'Xostess', oshpaz:'Oshpaz', kassir:'Kassir', menejer:'Menejer', operator:'Call operator', boshqa:'Boshqa' };
const SRC = { hh:'hh.uz', manual:"Qo'lda", referral:'Tavsiya', telegram:'Telegram', other:'Boshqa' };

let ALL = [], FS = 'new', FR = '', Q = '', SEL = new Set();

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast = m => { const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); };

function initials(n){ return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?'; }
// hh PDF'lari anonim — ism o'rniga "Женщина, 21 год, ..." kelishi mumkin; yoshni ikki marta yozmaymiz
function hasAge(n){ return /\d+\s*(год|года|лет|yosh)/i.test(n||''); }
function dayAgo(d){
  if(!d) return '';
  const n = Math.floor((Date.now()-new Date(d))/864e5);
  return n<=0 ? 'bugun' : n===1 ? 'kecha' : n+' kun oldin';
}

async function api(url, opt){
  const r = await fetch(url, Object.assign({ headers:{'Content-Type':'application/json'} }, opt));
  if(r.status===401){ location.href='/index.html'; throw new Error('auth'); }
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || 'Xato');
  return r.json();
}

function renderSide(){
  const byStage = {}, byRole = {};
  ALL.forEach(c=>{
    byStage[c.status||'new'] = (byStage[c.status||'new']||0)+1;
    if((c.status||'new')===FS) byRole[c.role||'boshqa'] = (byRole[c.role||'boshqa']||0)+1;
  });
  document.getElementById('funnel').innerHTML = STAGES.map(s=>`
    <div class="sitem ${FS===s.k?'on':''}" data-stage="${s.k}">
      <span class="dot" style="background:${s.c}"></span>
      <span class="lbl">${s.l}</span>
      <span class="cnt">${byStage[s.k]||0}</span>
    </div>`).join('');

  const rs = Object.keys(byRole).sort((a,b)=>byRole[b]-byRole[a]);
  document.getElementById('roles').innerHTML =
    `<div class="sitem ${FR===''?'on':''}" data-role=""><span class="lbl">Barchasi</span><span class="cnt">${ALL.filter(c=>(c.status||'new')===FS).length}</span></div>` +
    rs.map(r=>`<div class="sitem sub ${FR===r?'on':''}" data-role="${r}"><span class="lbl">${ROLES[r]||r}</span><span class="cnt">${byRole[r]}</span></div>`).join('');

  document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>{ FS=el.dataset.stage; FR=''; SEL.clear(); render(); });
  document.querySelectorAll('[data-role]').forEach(el=>el.onclick=()=>{ FR=el.dataset.role; SEL.clear(); render(); });
}

// ── Telegram holati ──
// Bot o'zi birinchi yoza olmaydi, shuning uchun nomzod havolani bosmaguncha
// yozib bo'lmaydi. Tugma shu holatni ko'rsatadi.
const TG = {
  none:    { cls:'',     lbl:'Telegramga taklif', can:true,  hint:'Havola yaratiladi' },
  invited: { cls:'wait', lbl:'Taklif yuborilgan', can:true,  hint:'Nomzod hali bosmagan' },
  linked:  { cls:'on',   lbl:'Yozish',            can:true,  hint:'Ulangan' },
  blocked: { cls:'off',  lbl:'Bloklagan',         can:false, hint:'Nomzod botni bloklagan' },
  stopped: { cls:'off',  lbl:'Chiqib ketgan',     can:false, hint:'Nomzod /stop yuborgan' }
};
function tgInfo(c){ return TG[c.tgState] || TG.none; }

function matchQ(c){
  if(!Q) return true;
  const hay = [c.fullName, c.desiredPosition, c.phone, c.email, c.location, c.experienceSummary,
               (c.skills||[]).join(' '), (c.languages||[]).join(' '), ROLES[c.role]].join(' ').toLowerCase();
  return Q.split(/\s+/).every(w => hay.includes(w));
}
// Qidiruv barcha bosqichlar bo'ylab ishlaydi — nomzod qaysi bosqichda ekanini bilmasligingiz mumkin
function visible(){
  if(Q) return ALL.filter(matchQ);
  return ALL.filter(c=>(c.status||'new')===FS && (!FR || (c.role||'boshqa')===FR));
}

function card(c){
  const st = SMAP[c.status] || STAGES[0];
  const tg = tgInfo(c);
  const ph = c.hasPhoto
    ? `<img src="/api/recruitment/${c.id}/photo?v=${encodeURIComponent(c.updatedAt||'')}" alt="">`
    : esc(initials(c.fullName));
  const skills = (c.skills||[]).slice(0,5).map(esc).join('<span class="pt">•</span>') || '<span style="color:var(--muted)">—</span>';

function render(){

    ? (v.length ? `<b>${v.length} ta</b> topildi — barcha bosqichlar bo'ylab` : `"${esc(Q)}" bo'yicha hech narsa topilmadi`)
    : (v.length ? `<b>${v.length} ta</b> nomzod — <b>${st.l}</b> bosqichida${FR?` · ${ROLES[FR]}`:''}`
                : `<b>${st.l}</b> bosqichida nomzod yo'q`);

    : `<div class="empty">${Q ? 'Boshqa so\'z bilan qidirib ko\'ring' : 'Bu bosqich bo\'sh'}</div>`;

  const n = SEL.size;
  document.getElementById('selCnt').textContent = n ? `${n} ta tanlandi` : '';
  ['bInvite','bReserve','bReject','bTgInvite'].forEach(id=>document.getElementById(id).disabled = !n);

  document.querySelectorAll('[data-sel]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const id = el.dataset.sel;
    SEL.has(id) ? SEL.delete(id) : SEL.add(id);
    render();
  });
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openCard(el.dataset.open));
  document.querySelectorAll('[data-photo]').forEach(el=>{ if(el.dataset.photo) el.onclick=()=>openPhoto(el.dataset.photo); });

async function openThread(c){
  document.getElementById('md').innerHTML = `
    <div class="md-top"><b style="font-size:16px">${esc(c.fullName||'Nomzod')}</b><button class="md-x" id="mdX">✕</button></div>
    <div style="padding:18px">

      <div class="chat" id="tgChat">Yuklanmoqda…</div>
      <div class="tg-send">
        <textarea id="tgText" placeholder="Xabar yozing… (Enter — yuborish)"></textarea>
        <button class="btn btn-p" id="tgSend">Yuborish</button>
      </div>
    </div>`;
  document.getElementById('ov').classList.add('on');
  document.getElementById('mdX').onclick = closeMd;

  async function load(){
    try{
      const r = await api(`/api/recruitment/${c.id}/tg/thread`);
      const box = document.getElementById('tgChat');
      if(!box) return;
      box.innerHTML = r.messages.length ? r.messages.map(m=>{
        const t = new Date(m.createdAt).toLocaleString('uz',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        if(m.kind === 'system') return `<div class="bub sys">${esc(m.text)} · ${t}</div>`;
        const cls = m.error ? 'err' : (m.direction === 'in' ? 'in' : 'out');
        return `<div class="bub ${cls}">${esc(m.text)}${m.error?`\n⚠ ${esc(m.error)}`:''}<div class="t">${t}</div></div>`;
      }).join('') : '<div class="bub sys">Hali xabar yo\'q</div>';
      box.scrollTop = box.scrollHeight;
      c.tgUnread = 0;
    }catch(e){ toast(e.message); }
  }
  await load();

  async function send(){
    const ta = document.getElementById('tgText');
    const text = ta.value.trim();
    if(!text) return;
    const btn = document.getElementById('tgSend');
    btn.disabled = true; ta.disabled = true;
    try{
      await api(`/api/recruitment/${c.id}/tg/message`, { method:'POST', body: JSON.stringify({ text }) });
      ta.value = '';
      await load();
      render();
    }catch(e){
      toast(e.message);
      if(/bloklagan|chiqqan/i.test(e.message)){ c.tgState = /bloklagan/i.test(e.message)?'blocked':'stopped'; render(); closeMd(); }
    }finally{ btn.disabled = false; ta.disabled = false; ta.focus(); }
  }
  document.getElementById('tgSend').onclick = send;
  document.getElementById('tgText').onkeydown = e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  };
  document.getElementById('tgText').focus();
}

function prog(txt, pct){
  document.getElementById('progT').textContent = txt;
  document.getElementById('progB').style.width = pct + '%';

async function doUpload(fileList){
  const files = [...(fileList||[])];
  if(!files.length) return;
  const source = document.getElementById('uSource').value;
  const branch = document.getElementById('uBranch').value;
  upOv.classList.remove('on');
  document.getElementById('prog').classList.add('on');
  prog(`0 / ${files.length} qayta ishlandi`, 0);

  // 3 tadan to'plamlab — har so'rov qisqa, uzilish xavfi kam, progress jonli
  const CHUNK = 3, agg = { created:0, duplicates:0, failed:0 };
  let done = 0;
  for(let i=0; i<files.length; i+=CHUNK){
    const batch = files.slice(i, i+CHUNK);
    const fd = new FormData();
    batch.forEach(f=>fd.append('files', f));
    fd.append('source', source); fd.append('branch', branch);
    try{
      const r = await fetch('/api/recruitment/upload', { method:'POST', body: fd }).then(x=>x.json());
      agg.created += r.created||0; agg.duplicates += r.duplicates||0; agg.failed += r.failed||0;
    }catch(e){ agg.failed += batch.length; }
    done += batch.length;
    prog(`${done} / ${files.length} qayta ishlandi`, Math.round(done/files.length*100));
  }
  document.getElementById('prog').classList.remove('on');
  let msg = `${agg.created} ta qo'shildi`;
  if(agg.duplicates) msg += `, ${agg.duplicates} takror`;
  if(agg.failed) msg += `, ${agg.failed} xato`;
  toast(msg);
  ALL = await api('/api/recruitment');
  render();
}

  let s;
  try { s = await api('/api/tg/status'); } catch(e){ toast(e.message); return; }

  const row = (k,v,ok) => `<div class="rc-row"><div class="rc-k">${k}</div><div class="rc-v" style="color:${ok===undefined?'var(--ink)':(ok?'var(--ok)':'var(--danger)')}">${v}</div></div>`;
  const whOk = s.webhook && s.webhook.set && !s.webhook.lastError;

  document.getElementById('md').innerHTML = `
    <div class="md-top"><b style="font-size:16px">Telegram bot</b><button class="md-x" id="mdX">✕</button></div>
    <div style="padding:18px">
      ${row('Bot', s.botUsername ? '@'+esc(s.botUsername) : 'sozlanmagan', s.platformReady)}
      ${row('Webhook', whOk ? 'ishlayapti' : (s.webhook && s.webhook.lastError ? esc(s.webhook.lastError) : 'o\'rnatilmagan'), whOk)}
      ${row('Sizning Telegramingiz', s.adminLinked ? 'ulangan' : 'ulanmagan', s.adminLinked)}
      ${row('Xabar yuborish kanali', (s.channels||[]).includes('sms') ? 'SMS + qo\'lda' : 'faqat qo\'lda (SMS ulanmagan)')}
      ${s.smsBalance != null ? row('SMS balans', esc(String(s.smsBalance))) : ''}
      <div id="tgAdminBox" style="margin-top:14px"></div>
      ${s.adminLinked ? '' : '<button class="btn btn-p" id="tgLinkMe" style="margin-top:12px">Telegramimni ulash</button>'}
      ${s.adminLinked ? `<div style="font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6">
        Nomzodlar javobi Telegramingizga keladi. Javob berish uchun nomzod
        xabariga <b>reply</b> qiling.</div>` : ''}
    </div>`;
  document.getElementById('ov').classList.add('on');
  document.getElementById('mdX').onclick = closeMd;

  const lb = document.getElementById('tgLinkMe');
  if(lb) lb.onclick = async ()=>{
    lb.disabled = true;
    try{
      const r = await api('/api/tg/admin-link');
      document.getElementById('tgAdminBox').innerHTML =
        `<div style="font-size:13.5px;margin-bottom:6px">Shu havolani Telegramda oching:</div>
         <div class="linkbox"><code>${esc(r.link)}</code><button class="btn btn-sm" id="tgAdmCopy">Nusxalash</button></div>
         <div style="font-size:12.5px;color:var(--muted);margin-top:6px">Havola bir martalik.</div>`;
      document.getElementById('tgAdmCopy').onclick = ()=>navigator.clipboard.writeText(r.link).then(()=>toast('Nusxalandi'));
      lb.style.display = 'none';
    }catch(e){ toast(e.message); lb.disabled = false; }
  };
};

(async function(){
  try{
    ALL = await api('/api/recruitment');
    render();
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="empty">Yuklab bo\'lmadi: '+esc(e.message)+'</div>';
  }
})();
</script>
</body>
</html>
