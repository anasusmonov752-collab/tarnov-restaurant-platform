<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mening profilim</title>
<link rel="stylesheet" href="/css/th.css?v=2">  <!-- dizayn tizimi: ranglar, kunduz/tun -->
<script src="/js/uz-date.js"></script>  <!-- o'zbekcha sana: brauzerda uz formati bo'lmasa -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/js/th-viewer.js?v=2" defer></script>  <!-- rasmni to'liq ko'rish -->
<style>
/* Ranglar — dizayn tizimidan (css/th.css); kunduz/tun Telegram'dan (applyTheme).
   Brend (ko'k) ikkala rejimda o'zimizniki — Telegram ranglari olinmaydi. */
:root{
  --bg:var(--th-bg); --card:var(--th-surface); --ink:var(--th-ink); --ink-2:var(--th-ink-2); --muted:var(--th-muted);
  --line:var(--th-line); --blue:var(--th-brand); --blue-d:var(--th-brand-2);
  --ok:var(--th-ok); --warn:var(--th-warn); --danger:var(--th-danger);
  --soft-blue:#E8EFFA; --sel:#F2F7FF;
}
:root[data-theme="dark"]{ --soft-blue:rgba(10,132,255,.18); --sel:rgba(10,132,255,.16); }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}   /* suzuvchi panel ostida qolmasin */

/* Oq va havodor. Oldin to'q ko'k gradient edi - u e'tiborni fotodan
   va ismdan tortib olardi va mobilda og'ir ko'rinardi. Ko'k endi faqat
   tugma va havolalarda: urg'u kamaygani sari kuchayadi. */
.hero{background:var(--card);border-radius:16px;padding:24px 18px 20px;text-align:center;
  margin-bottom:14px}
.hero .av{width:84px;height:84px;border-radius:50%;margin:0 auto;overflow:hidden;
  background:#E8F0FD;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:600;color:var(--blue)}
.hero .av img{width:100%;height:100%;object-fit:cover}
.hero .nm{font-size:23px;font-weight:600;line-height:1.25;margin-top:14px}
.hero .sb{font-size:14.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:7px;margin-top:16px;border:none;
  font-family:inherit;font-size:14px;font-weight:600;padding:9px 18px;border-radius:22px;cursor:pointer}
.pill.look{background:rgba(46,158,91,.12);color:var(--ok)}
.pill.think{background:rgba(180,128,46,.14);color:var(--warn)}
.pill.off{background:rgba(100,116,139,.13);color:var(--muted)}

.wrap{padding:14px}
.h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin:0 0 8px 3px}
.card{background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden}
.pad{padding:14px}

.prog{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0 12px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .3s}
.need{font-size:13px;color:var(--muted);line-height:1.5}
/* Yetishmagan maydon - bosiladigan. Ro'yxat o'qish emas, to'ldirish
   oqimi bo'lsin: bosilganda o'sha bo'lim ochiladi. */
.gaps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.gap{font-size:13px;padding:7px 13px;border-radius:9px;background:var(--sel);color:var(--blue);
  border:1px solid #D8E6FF;cursor:pointer;font-family:inherit;font-weight:600}
.gap:active{background:#E4EFFF}

.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border-radius:13px;padding:13px 10px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:700;line-height:1;color:var(--blue)}
.stat span{font-size:11.5px;color:var(--muted);display:block;margin-top:5px;line-height:1.3}

.opt{display:flex;align-items:center;width:100%;padding:16px 2px;border:none;
  background:transparent;border-bottom:1px solid var(--line);font-family:inherit;
  font-size:16px;color:var(--ink);cursor:pointer;text-align:left}
.opt:last-of-type{border-bottom:none}
.opt span{flex:1}
.opt b{color:var(--blue);font-size:17px}
.opt.on span{color:var(--blue);font-weight:600}

.sec-h{display:flex;align-items:center;padding:13px 14px 0}
.sec-h b{flex:1;font-size:15.5px;font-weight:600}
.ed{border:none;background:transparent;color:var(--blue);font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;padding:0}
.kv{display:flex;gap:12px;padding:10px 14px;font-size:14.5px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex:none;min-width:116px}
.kv .v{flex:1;text-align:right;word-break:break-word}
.kv .v.em{color:var(--muted)}


.w{padding:12px 14px;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:none}
.w b{font-size:14.5px;font-weight:600;display:block}
.w span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px}
.chip{font-size:13px;padding:6px 12px;border-radius:9px;background:var(--bg)}
.chip.more{border:none;font-family:inherit;color:var(--blue);font-weight:600;
  cursor:pointer;background:var(--sel)}

/* z-index suhbat oynasidan (.cv 60) yuqori — kompaniya kartasi suhbat ustida ochiladi */
.sheet{position:fixed;inset:0;background:rgba(8,20,38,.45);display:none;align-items:flex-end;z-index:70}
.sheet.on{display:flex}
.sh{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0}
.sh-h{position:sticky;top:0;background:var(--card);display:flex;align-items:center;
  padding:16px;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0}
.sh-h b{flex:1;font-size:16.5px}
.sh-x{border:none;background:transparent;font-size:19px;color:var(--muted);cursor:pointer}
.sh-b{padding:4px 16px 16px}
.f{padding:12px 0;border-bottom:1px solid var(--line)}
.f:last-of-type{border-bottom:none}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:none;background:transparent;font-family:inherit;
  font-size:16px;color:var(--ink);padding:0}
.f input:focus,.f textarea:focus,.f select:focus{outline:none}
.f textarea{resize:vertical;line-height:1.55;min-height:84px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--blue);
  color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.5}
.msg{text-align:center;padding:60px 24px;color:var(--muted);font-size:14.5px;line-height:1.6}
.hide{display:none !important}

/* ── Ish o'rinlari va arizalar ── */
.jb{background:var(--card);border-radius:14px;padding:14px;margin-bottom:11px}
.jb .ti{font-size:16px;font-weight:600;line-height:1.3}
.jb .pl{font-size:13.5px;color:var(--muted);margin-top:3px}
.jb .sl{font-size:15px;font-weight:600;color:var(--ok);margin-top:7px}
.jb .ln{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.55}
.jb .row{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap}
.tg2{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px}
.tg2.fit{background:rgba(46,158,91,.13);color:var(--ok)}
.tg2.fresh{background:rgba(37,99,235,.1);color:var(--blue)}
.tg2.wait{background:rgba(180,128,46,.14);color:var(--warn)}
.tg2.no{background:rgba(194,91,76,.12);color:var(--danger)}
.tg2.ok{background:rgba(46,158,91,.13);color:var(--ok)}
.ab{flex:1;padding:11px;border:none;border-radius:10px;background:var(--blue);
  color:#fff;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer}
.ab:disabled{background:var(--bg);color:var(--muted)}
.jb.tap{cursor:pointer}
.jb .more{font-size:12.5px;color:var(--blue);margin-top:8px;font-weight:600}

/* ── Vakansiya sahifasi va kompaniya kartasi (pastki oynada) ── */
.vd-ti{font-size:19px;font-weight:700;line-height:1.3;padding-top:6px}
.vd-pl{font-size:14px;color:var(--muted);margin-top:4px}
.vd-sl{font-size:18px;font-weight:700;color:var(--ok);margin-top:10px}
.vd-sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  font-weight:600;margin:18px 0 6px}
.vd-kv{display:flex;gap:12px;padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.vd-kv:last-child{border-bottom:none}
.vd-kv .k{color:var(--muted);flex:none;min-width:110px}
.vd-kv .v{flex:1;text-align:right}
.vd-chips{display:flex;flex-wrap:wrap;gap:6px}
.vd-chips span{font-size:13px;padding:5px 11px;border-radius:8px;background:var(--bg)}
.vd-tx{font-size:14.5px;line-height:1.55;white-space:pre-line}
/* Vakansiya: joy tavsifi, jalb, afzalliklar, ishonch belgisi */
.jb .vn{font-size:13.5px;color:var(--ink);margin-top:3px}
.jb .sl small,.vd-sl small{font-size:12.5px;font-weight:500;color:var(--muted)}
.jb .sl.no{color:var(--muted);font-weight:500;font-size:14px}
.jb .hk{font-size:13.5px;line-height:1.45;margin-top:8px}
.pk{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pk span{font-size:12px;padding:3px 9px;border-radius:7px;background:var(--bg);color:var(--ink)}
.vd-hk{font-size:14.5px;line-height:1.5;margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--bg)}
.vd-ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.vd-ul li{margin:2px 0}
/* Ariza oynasi: tekshiruv, xat, xato, muvaffaqiyat */
.ap-v{padding:12px 14px;border-radius:12px;background:var(--bg);margin-top:4px}
.ap-v b{font-size:15px;display:block}
.ap-v span{font-size:13px;color:var(--muted)}
.ck-l{margin-top:4px}
.ck-r{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ck-r:last-child{border-bottom:none}
.ck-r i{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700}
.ck-r i.y{background:rgba(46,158,91,.14);color:var(--ok)}
.ck-r i.n{background:rgba(194,91,76,.12);color:var(--danger)}
.ck-r i.o{background:var(--bg);color:var(--muted)}
.ck-r .v{margin-left:auto;color:var(--muted);font-size:13.5px;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-er{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(194,91,76,.1);color:var(--danger);font-size:14px;line-height:1.5}
.ap-er button{margin-top:9px;border:0;background:none;color:var(--blue);font:inherit;font-weight:600;padding:0;cursor:pointer}
.ap-ok{text-align:center;padding:18px 6px 6px}
.ap-ok .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;background:rgba(46,158,91,.14);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px}
.ap-ok h3{font-size:19px;margin-bottom:6px}
.ap-ok p{font-size:14.5px;color:var(--muted);line-height:1.55}
.nx{text-align:left;margin:16px 0 4px}
.nx div{display:flex;gap:10px;padding:8px 0;font-size:14.5px;line-height:1.45}
.nx b{width:22px;height:22px;border-radius:50%;flex:none;background:var(--blue);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.btn2{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--blue);font:inherit;font-weight:600;font-size:15px;margin-top:9px;cursor:pointer}
/* Arizalarim: bosqichlar yo'li */
.stp{margin-top:10px;padding-left:4px}
.stp div{position:relative;padding:0 0 9px 20px;font-size:13.5px;line-height:1.35}
.stp div::before{content:'';position:absolute;left:3px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.stp div::after{content:'';position:absolute;left:6px;top:13px;bottom:-1px;width:2px;background:var(--line)}
.stp div:last-child::after{display:none}
.stp div.cur{font-weight:600}
.stp div.no::before{background:var(--danger)}
.stp div.ok::before{background:var(--ok)}
.stp small{color:var(--muted);font-weight:400;margin-left:6px}
.co-hd{display:flex;gap:13px;align-items:center;padding:6px 0 4px}
.co-av{width:56px;height:56px;border-radius:14px;flex:none;background:var(--soft-blue);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.co-av{overflow:hidden}.co-av img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.co-nm{font-size:18px;font-weight:700;line-height:1.25}
.co-lc{font-size:13.5px;color:var(--muted);margin-top:3px}
.co-vc{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.cv-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.cv-who.tap{cursor:pointer}
.cv-who.tap .ch-last::after{content:' · kompaniya ›';color:var(--blue)}

/* ── Tab paneli: "suyuq shisha" ──
   Namuna — iOS Liquid Glass. Haqiqiy sinish (ortidagini egib ko'rsatish)
   veb'da mumkin emas: Safari backdrop-filter'da SVG filtrni qo'llamaydi.
   Shuning uchun taqlid: yupqa shisha + kuchli blur, yuqori chetda
   yaltirash, faol bo'limda kamalak chetli "linza" prujina bilan suriladi.
   Shisha faqat ortidan nimadir o'tganda ko'rinadi — bo'sh och fonda oq.
   Emoji EMAS — Lucide ikonkalari. Yozuv qoladi: bo'limlar universal emas.
   Blur ishlamaydigan eski WebView'da oddiy oq fon (@supports). */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:2px;padding:5px;border-radius:28px;z-index:50;isolation:isolate;
  background:rgba(255,255,255,.96);border:1px solid rgba(225,232,242,.9);
  box-shadow:0 10px 30px rgba(15,39,71,.16),0 2px 6px rgba(15,39,71,.08)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .tabs{background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.66));   /* audit: shaffofroq bo'lsa orqadagi matn ko'rinardi */
    -webkit-backdrop-filter:blur(14px) saturate(210%);backdrop-filter:blur(14px) saturate(210%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),
      inset 0 0 0 .5px rgba(15,39,71,.07),0 10px 30px rgba(15,39,71,.16),0 2px 6px rgba(15,39,71,.08)}
}
/* Yuqori yarmidagi yaltirash — shishaning "qalinligi" */
.tabs::before{content:'';position:absolute;left:2px;right:2px;top:1px;height:46%;
  border-radius:26px 26px 12px 12px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}

/* Faol bo'lim — linza. Bitta element, moveLens() uni faol tab ostiga
   suradi; tablardan biroz kattaroq (scale), namunadagidek panel chetidan
   chiqib turadi. ::after — kamalak chet (sinish chizig'i taqlidi). */
.lens{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:23px;z-index:0;
  pointer-events:none;opacity:0;
  transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1),opacity .2s;
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.9),rgba(255,255,255,.4) 55%,rgba(255,255,255,.2));
  box-shadow:inset 0 1px 1px #fff,inset 0 -3px 6px rgba(255,255,255,.45),
    0 4px 14px rgba(15,39,71,.15),0 1px 2px rgba(15,39,71,.08)}
.lens::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(100deg,rgba(255,80,160,.65),rgba(255,196,80,.5) 22%,rgba(255,255,255,.8) 46%,
    rgba(80,196,255,.65) 72%,rgba(140,96,255,.65));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.lens.on{opacity:1}
/* Surish: sahifa aylanmasin, matn belgilanmasin, uzoq bosishda menyu chiqmasin */
.tabs{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Surilayotgan linza — kattaroq va shaffofroq, "lupa" kabi */
.lens.drag{background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.7),rgba(255,255,255,.22) 60%,rgba(255,255,255,.08));
  box-shadow:inset 0 1px 1px #fff,inset 0 -4px 8px rgba(255,255,255,.5),
    0 10px 24px rgba(15,39,71,.2),0 2px 4px rgba(15,39,71,.1)}
.tb.hov{color:var(--ink)}

.tb{position:relative;z-index:1;flex:1;min-width:0;border:none;background:transparent;border-radius:21px;
  padding:7px 2px 6px;cursor:pointer;font-family:inherit;color:var(--muted);font-size:11px;
  font-weight:600;line-height:1.2;white-space:nowrap;display:flex;flex-direction:column;
  align-items:center;gap:3px;transition:color .2s;-webkit-tap-highlight-color:transparent}
.tb .ic{position:relative;display:block;width:23px;height:23px;transition:transform .3s cubic-bezier(.34,1.45,.5,1)}
.tb .ic svg{width:23px;height:23px;display:block}
.tb.on{color:var(--ink)}
.tb.on .ic{transform:scale(1.1)}
.tb.on .ic svg{stroke-width:2.3}
/* O'qilmagan xabar — qizil nuqta */
.tb .dot{position:absolute;top:-1px;right:-3px;width:10px;height:10px;border-radius:50%;
  background:#EF4444;border:2px solid var(--card);display:none}
.tb .dot.on{display:block}

/* ══ SUHBATLAR ══════════════════════════════════════════════
   Inbox: tepada qadalgan agentlik (galochka bilan), ostida
   kontakt ochilgan nomzodlar. */
.ch-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.ch-row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);
  border-bottom:1px solid var(--line);cursor:pointer}
.ch-row:active{background:var(--sel)}
.ch-av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:14px;background:var(--soft-blue);color:var(--blue)}
.ch-av.ag{background:var(--blue);color:#fff;font-size:17px}
.ch-av{overflow:hidden}.ch-av img{width:100%;height:100%;object-fit:cover}
.ch-av.ag svg{width:24px;height:24px}
.ch-mid{flex:1;min-width:0}
.ch-top{display:flex;align-items:center;gap:5px}
.ch-name{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-vf{flex:none;display:block}
.ch-pin{flex:none;color:var(--muted);font-size:12px}
.ch-last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.ch-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.ch-time{font-size:11.5px;color:var(--muted)}
.ch-badge{min-width:19px;height:19px;border-radius:10px;background:var(--blue);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Ochilgan suhbat */
.cv{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.cv.hide{display:none}
.cv-h{flex:none;display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:var(--card);border-bottom:1px solid var(--line)}
.cv-back{flex:none;background:transparent;border:0;font-size:19px;color:var(--blue);
  padding:4px 8px;cursor:pointer}
.cv-b{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.cv-f{flex:none;display:flex;gap:8px;padding:10px 12px;background:var(--card);
  border-top:1px solid var(--line)}
.cv-f input{flex:1;min-width:0;border:1px solid var(--line);border-radius:20px;
  padding:10px 14px;font-size:14.5px;outline:none;background:var(--bg);color:var(--ink)}
.cv-f input:focus{border-color:var(--blue)}
.cv-send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);
  color:#fff;font-size:16px;cursor:pointer}
.cv-send:disabled{opacity:.45}
.cmsg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;
  word-wrap:break-word;white-space:pre-wrap}
.cmsg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.cmsg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);
  border-bottom-left-radius:5px}
/* Tizim xabari ataylab boshqacha: uni odamning gapi bilan adashtirmaslik kerak */
.cmsg.sys{align-self:center;background:var(--soft-blue);color:var(--ink-2);font-size:12.5px;
  text-align:center;border-radius:12px;max-width:92%}
.cmsg-t{font-size:10.5px;opacity:.65;margin-top:3px;text-align:right}
/* Tungi rejim: qoramtir shisha (iOS dark material), linza xira oq — miniapp.html bilan bir xil */
:root[data-theme="dark"] .tabs{ background:rgba(28,28,30,.94); border-color:rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4); }
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root[data-theme="dark"] .tabs{ background:linear-gradient(180deg,rgba(44,44,46,.82),rgba(28,28,30,.74));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 10px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4); }
}
:root[data-theme="dark"] .tabs::before{ background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0)); }
:root[data-theme="dark"] .lens, :root[data-theme="dark"] .lens.drag{
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.22),rgba(255,255,255,.10) 60%,rgba(255,255,255,.05));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25), 0 4px 14px rgba(0,0,0,.4); }
</style>
</head>
<body>

<div id="app"><div class="msg">Yuklanmoqda…</div></div>

<div id="vJ" class="hide"><div class="wrap">
  <div class="h3">Ish o'rinlari</div>
  <div id="jobList"><div class="msg">Yuklanmoqda…</div></div>
</div></div>

<div id="vA" class="hide"><div class="wrap">
  <div class="h3">Arizalarim</div>
  <div id="appList"><div class="msg">Yuklanmoqda…</div></div>
</div></div>

<div id="vM" class="hide">
  <div id="chatList"><div class="ch-empty">Yuklanmoqda…</div></div>
</div>

<!-- Ikonkalar: Lucide (circle-user, briefcase, file-text, message-circle) -->
<nav class="tabs">
  <span class="lens" id="lens" aria-hidden="true"></span>
  <button class="tb on" id="tP"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg></span>Profilim</button>
  <button class="tb"    id="tJ"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg></span>Ish o'rinlari</button>
  <button class="tb"    id="tA"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></span>Arizalarim</button>
  <button class="tb"    id="tM"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><i class="dot" id="dM"></i></span>Xabarlar</button>
</nav>

<!-- Ochilgan suhbat: butun ekran, tablar ustidan -->
<div class="cv hide" id="cv">
  <div class="cv-h">
    <button class="cv-back" id="cvBack">&#10094;</button>
    <div class="cv-who" id="cvWho">
      <div class="ch-av" id="cvAv" data-nozoom>—</div>
      <div style="flex:1;min-width:0">
        <div class="ch-top"><span class="ch-name" id="cvName">—</span><span id="cvVf"></span></div>
        <div class="ch-last" id="cvSub"></div>
      </div>
    </div>
  </div>
  <div class="cv-b" id="cvBody"></div>
  <div class="cv-f">
    <input id="cvIn" placeholder="Xabar yozing…" autocomplete="off" maxlength="2000">
    <button class="cv-send" id="cvSend">&#10148;</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sh">
    <div class="sh-h"><b id="shT">—</b><button class="sh-x" id="shX">&#10005;</button></div>
    <div class="sh-b" id="shB"></div>
  </div>
</div>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
// Kunduz/tun — Telegram sozlamasidan; sarlavha va fon rangi ham moslanadi
// (miniapp.html bilan bir xil qoida — 2026-10-22 iOS dizayni)
function applyTheme(){
  const dark = !!(TG && TG.colorScheme === 'dark');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = dark ? '#000000' : '#F2F2F7';
  try {
    if (TG && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9')) { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); }
    if (TG && TG.isVersionAtLeast && TG.isVersionAtLeast('7.10') && TG.setBottomBarColor) TG.setBottomBarColor(bg);
  } catch(e){}
}
applyTheme();
if (TG) { TG.ready(); TG.expand(); try { TG.onEvent('themeChanged', applyTheme); } catch(e){} }

const INIT = (TG && TG.initData) || '';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const haptic = () => { try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch(e){} };

// Rasm havolasi uchun token (X-Photo-Token) — havolaga Telegram imzosi qo'yilmaydi
let PT = '';
async function api(path, opt){
  const r = await fetch(path, Object.assign({
    headers:{ 'Content-Type':'application/json', 'X-Telegram-Init-Data': INIT }
  }, opt));
  PT = r.headers.get('X-Photo-Token') || PT;
  const d = await r.json().catch(()=>({}));
  // status va code — ariza oynasi xatoni tushunarli qilib ko'rsatadi
  if(!r.ok){ const e = new Error(d.error || 'Xato'); e.status = r.status; e.code = d.code || ''; throw e; }
  return d;
}

let P = null;

const STATUS = [['active','Ish qidiryapman'],['considering',"Ko'rib chiqaman"],['not_looking','Qidirmayapman']];
const MISS = {
  fullName:'ism', phone:'telefon', desiredPosition:'lavozim', location:'hudud',
  age:'yosh', shift:'smena', salaryExpectation:'maosh', experienceSummary:"o'zingiz haqingizda",
  languages:'tillar'
};
// Yetishmagan maydon qaysi bo'limda tahrirlanadi
const SECTION_OF = {
  fullName:'main', phone:'main', age:'main', location:'main',
  desiredPosition:'job', shift:'job', salaryExpectation:'job',
  languages:'skill', experienceSummary:'about'
};
// Ko'nikmalar rezyumedan kelganda 15-20 tagacha chiqadi va butun
// ekranni egallaydi. Dastlab 6 tasi ko'rinadi, qolgani bir bosishda.
const SKILL_SHOW = 6;
let skillsOpen = false;

function skillsHtml(sk){
  if (!sk.length) return '';
  const vis = skillsOpen ? sk : sk.slice(0, SKILL_SHOW);
  const rest = sk.length - vis.length;
  return `<div class="chips" style="padding-top:0">
    ${vis.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}
    ${rest > 0 ? `<button class="chip more" id="skMore">Yana ${rest} ta</button>` : ''}
    ${skillsOpen && sk.length > SKILL_SHOW ? `<button class="chip more" id="skLess">Yig'ish</button>` : ''}
  </div>`;
}
// Bo'sh qiymatda "ko'rsatilmagan" so'zini har qatorda takrorlamaymiz —
// yetishmaganlar yuqorida alohida chiqadi, bu yerda tire yetarli.
const row = (k,v) => `<div class="kv"><span class="k">${k}</span><span class="v ${v?'':'em'}">${v?esc(v):'—'}</span></div>`;

function render(p){
  P = p;
  const ini = (p.fullName || '?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  const sub = [p.desiredPosition||'', p.experienceYears ? p.experienceYears+' yil tajriba' : ''].filter(Boolean).join(' · ');
  const cm = p.completeness || { percent:0, missing:[] };
  const st = p.stats || { picked:0, opened:0 };
  const cur = p.jobStatus && p.jobStatus !== 'unknown' ? p.jobStatus : 'active';

  const work = (p.workHistory||[]).filter(w=>w.company||w.position).map(w=>`
    <div class="w"><b>${esc(w.position||'Lavozim')}</b>
      <span>${[esc(w.company||''), esc(w.period||'')].filter(Boolean).join(' · ')}</span></div>`).join('');


  const PILL = { active:['look','Ish qidiryapman'], considering:['think',"Ko'rib chiqaman"], not_looking:['off','Qidirmayapman'] };
  const [pcls, plbl] = PILL[cur] || PILL.active;

  $('app').innerHTML = `
  <div class="wrap">
    <div class="hero">
      <div class="av">${p.hasPhoto ? `<img src="/api/cand/photo?t=${encodeURIComponent(PT)}" alt="">` : esc(ini)}</div>
      <div class="nm">${esc(p.fullName) || 'Ismingizni kiriting'}</div>
      <div class="sb">${esc(sub) || 'Profilni to\'ldiring'}</div>
      <button class="pill ${pcls}" data-e="status">${plbl}</button>
    </div>

    ${cm.percent < 100 ? `<div class="card"><div class="pad">
      <b style="font-size:15.5px">Profil ${cm.percent}% to'ldirilgan</b>
      <div class="prog"><i style="width:${cm.percent}%"></i></div>
      <div class="gaps">${cm.missing.map(k =>
        `<button class="gap" data-e="${SECTION_OF[k] || 'main'}">${MISS[k] || k}</button>`).join('')}</div>
      <div class="need">Bosing — to'g'ri bo'lim ochiladi. To'liq profil restoranlar
        ro'yxatida yuqoriroq turadi.</div>
    </div></div>` : ''}

    ${st.picked || st.opened ? `<div class="stats">
      <div class="stat"><b>${st.picked}</b><span>restoran<br>tanlovida</span></div>
      <div class="stat"><b>${st.opened}</b><span>kontakt<br>ochilgan</span></div>
    </div>` : `<div class="card"><div class="pad need">
      Profilingiz restoranlarga ko'rsatila boshlagach, shu yerda nechta
      restoran sizni tanlagani ko'rinadi.
    </div></div>`}

    <div class="card">
      <div class="sec-h"><b>Asosiy</b><button class="ed" data-e="main">Tahrirlash</button></div>
      ${row('Ism familiya', p.fullName)}
      ${row('Telefon', p.phone)}
      ${row('Yosh', p.age ? p.age + ' yosh' : '')}
      ${row('Hudud', p.location)}
    </div>

    <div class="card">
      <div class="sec-h"><b>Qidirayotgan ish</b><button class="ed" data-e="job">Tahrirlash</button></div>
      ${row('Lavozim', p.desiredPosition)}
      ${row('Tajriba', p.experienceYears ? p.experienceYears + ' yil' : '')}
      ${row('Smena', p.shift)}
      ${row('Kutilgan maosh', p.salaryExpectation)}
    </div>

    <div class="card">
      <div class="sec-h"><b>Til va ko'nikma</b><button class="ed" data-e="skill">Tahrirlash</button></div>
      ${(p.languages||[]).length ? `<div class="chips">${p.languages.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>` : row('Tillar','')}
      ${skillsHtml(p.skills || [])}
      ${row("Ta'lim", p.education)}
    </div>

    <div class="card">
      <div class="sec-h"><b>O'zingiz haqingizda</b><button class="ed" data-e="about">Tahrirlash</button></div>
      <div class="pad" style="padding-top:9px;font-size:14.5px;line-height:1.6;color:${p.experienceSummary?'var(--ink)':'var(--muted)'}">
        ${p.experienceSummary ? esc(p.experienceSummary)
          : "Qisqacha yozing: qayerda ishlagansiz, nimani yaxshi bilasiz. Restoran shuni birinchi o'qiydi."}
      </div>
    </div>

    ${work ? `<div class="card">
      <div class="sec-h"><b>Ish tarixi</b></div>
      ${work}
      <div class="pad" style="padding-top:9px"><div class="need">Rezyumengizdan olingan. O'zgartirish kerak bo'lsa HR'ga yozing.</div></div>
    </div>` : ''}
  </div>`;

  // '.ed' (bo'lim sarlavhasi), '.gap' (yetishmagan maydon) va holat
  // chipi — hammasi data-e bilan bir xil oynani ochadi
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openSheet(b.dataset.e));

  const more = $('skMore'), less = $('skLess');
  if (more) more.onclick = () => { skillsOpen = true;  haptic(); render(P); };
  if (less) less.onclick = () => { skillsOpen = false; haptic(); render(P); };
}

// ── Bo'limni tahrirlash ──
// hh'dagidek: bitta ulkan forma emas, har bo'lim alohida. Telefonda
// uzun formani oxirigacha to'ldiradigan odam kam.
const FORMS = {
  main: ['Asosiy', p => `
    <div class="f"><label>Ism familiya</label><input id="fullName" value="${esc(p.fullName)}"></div>
    <div class="f"><label>Telefon</label><input id="phone" value="${esc(p.phone)}" inputmode="tel"></div>
    <div class="f"><label>Yosh</label><input id="age" value="${p.age||''}" inputmode="numeric"></div>
    <div class="f"><label>Hudud</label><input id="location" value="${esc(p.location)}" placeholder="Chilonzor"></div>`],

  job: ['Qidirayotgan ish', p => `
    <div class="f"><label>Qaysi lavozim</label><input id="desiredPosition" value="${esc(p.desiredPosition)}" placeholder="Ofitsiant"></div>
    <div class="f"><label>Tajriba (yil)</label><input id="experienceYears" value="${p.experienceYears||''}" inputmode="numeric"></div>
    <div class="f"><label>Smena</label><input id="shift" value="${esc(p.shift)}" placeholder="kunduzgi / kechki / ikkalasi"></div>
    <div class="f"><label>Kutilayotgan maosh</label><input id="salaryExpectation" value="${esc(p.salaryExpectation)}" placeholder="4-5 mln">
      <div class="hint">Aniq yozing — restoran shu bo'yicha tanlaydi.</div></div>`],

  skill: ["Til va ko'nikma", p => `
    <div class="f"><label>Tillar</label><input id="languages" value="${esc((p.languages||[]).join(', '))}" placeholder="o'zbek, rus">
      <div class="hint">Vergul bilan ajrating</div></div>
    <div class="f"><label>Ko'nikmalar</label><input id="skills" value="${esc((p.skills||[]).join(', '))}" placeholder="R-Keeper, upsell">
      <div class="hint">Vergul bilan ajrating</div></div>
    <div class="f"><label>Ta'lim</label><input id="education" value="${esc(p.education)}"></div>`],

  about: ["O'zingiz haqingizda", p => `
    <div class="f"><textarea id="experienceSummary" placeholder="Masalan: 3 yil ofitsiant bo'lib ishlaganman, kechki smenada tezkor xizmat ko'rsataman, rus tilida erkin gaplashaman.">${esc(p.experienceSummary)}</textarea>
      <div class="hint">2-3 jumla yetarli.</div></div>`]
};

const TEXT_IDS = ['fullName','phone','desiredPosition','location','shift','salaryExpectation','education','experienceSummary','age','experienceYears'];

function openSheet(key){
  // Holat — forma emas, uchta tanlov. Bosilgan zahoti saqlanadi va
  // oyna yopiladi: "Saqlash" tugmasini qo'shish ortiqcha qadam bo'lardi.
  if (key === 'status') {
    $('shT').textContent = 'Holatingiz';
    $('shB').innerHTML = STATUS.map(([k,l]) => `
      <button class="opt ${k === P.jobStatus ? 'on' : ''}" data-s="${k}">
        <span>${l}</span>${k === P.jobStatus ? '<b>&#10003;</b>' : ''}
      </button>`).join('') +
      `<div class="hint" style="padding:10px 0 2px">"Qidirmayapman" tanlasangiz restoranlarga
       ko'rsatilmaysiz. Istalgan payt qaytarasiz.</div>`;
    $('sheet').classList.add('on');
    document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
      haptic();
      try { await save({ jobStatus: b.dataset.s }); closeSheet(); }
      catch(e){ $('shB').insertAdjacentHTML('beforeend', fail(e.status === 401 ? 'Sessiya eskirgan — ilovani yopib, qayta oching.' : e.message)); }
    });
    return;
  }

  const [title, body] = FORMS[key];
  $('shT').textContent = title;
  $('shB').innerHTML = body(P) + '<button class="btn" id="shSave">Saqlash</button>';
  $('sheet').classList.add('on');

  $('shSave').onclick = async () => {
    const b = $('shSave');
    b.disabled = true; b.textContent = 'Saqlanmoqda…';
    const payload = {};
    for (const id of TEXT_IDS) if ($(id)) payload[id] = $(id).value.trim();
    for (const id of ['languages','skills']) {
      if ($(id)) payload[id] = $(id).value.split(',').map(s=>s.trim()).filter(Boolean);
    }
    try { await save(payload); closeSheet(); }
    catch(e){
      // alert() Telegram ichida chiqmasligi mumkin — xato oynaning o'zida
      b.disabled = false; b.textContent = 'Qayta urinish';
      const old = $('shB').querySelector('.ap-er'); if (old) old.remove();
      b.insertAdjacentHTML('beforebegin', fail(e.status === 401 ? 'Sessiya eskirgan — ilovani yopib, qayta oching.' : e.message));
    }
  };
}
function closeSheet(){ $('sheet').classList.remove('on'); $('shB').innerHTML = ''; }
$('shX').onclick = closeSheet;
$('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); };

async function save(patch){
  const r = await api('/api/cand/me', { method:'PATCH', body: JSON.stringify(patch) });
  // Statistika va to'ldirilganlik PATCH javobida yo'q — qayta o'qiymiz
  render(await api('/api/cand/me'));
  try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
  return r;
}

// ══════════════════════════════════════════════════════════
//  ISH O'RINLARI
// ══════════════════════════════════════════════════════════
// Restoran nomi ko'rinmaydi — faqat hudud. Buni server hal qiladi
// (services/vacancy.js forCandidate), bu yerda shunchaki ko'rsatamiz.

// ── Vakansiya sahifasi (hh kabi) ──
// Ro'yxatdagi karta qisqa; bosilganda hamma shart ochiladi. Ro'yxat
// javobida hamma maydon allaqachon bor — alohida so'rov kerak emas.
// Kontaktgacha kompaniya NOMI yo'q (server "place" ni hudud bilan beradi).
const SHIFT_L = { kunduzgi:'Kunduzgi', kechki:'Kechki', ikkalasi:'Kunduzgi va kechki' };
const OYLAR = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
// Server shabloni bilan bir xil: Toshkent vaqti (+5), o'zbekcha oy nomi
const dLong = s => { const x = new Date(new Date(s).getTime() + 5 * 3600e3); return x.getUTCDate() + '-' + OYLAR[x.getUTCMonth()]; };
// Joy satri: tuman va mo'ljal ("Yunusobod · Bodomzor metrosi yonida")
const placeOf = v => [v.where || (v.landmark ? '' : 'Toshkent'), v.landmark].filter(Boolean).join(' · ') || v.place || '';
// Afzalliklar: yangi shablonda kalitlar (perkLabels); eski vakansiyada
// "Ovqat · Forma" matni. Erkin matn belgi emas — "Qo'shimcha" bo'lib chiqadi.
function perksOf(v){
  if ((v.perkLabels || []).length) return { chips: v.perkLabels, text: v.conditions || '' };
  const c = String(v.conditions || '');
  return / · /.test(c) ? { chips: c.split(/\s*·\s*/).filter(Boolean), text: '' } : { chips: [], text: c };
}
// Ishonch belgisi faqat haqiqat bo'lsa (server: forCandidate.trust)
function trustTag(v){
  const d = v.trustDays === 0 ? 'bugun' : v.trustDays === 1 ? 'kecha' : v.trustDays + ' kun oldin';
  if (v.trust === 'verified') return `<span class="tg2 ok">TalentHub tekshirgan ✓ · ${d}</span>`;
  if (v.trust === 'client') return `<span class="tg2 fresh">Ish beruvchi tasdiqlagan · ${d}</span>`;
  if (v.trust === 'posted') return `<span class="tg2 fresh">Joylandi: ${d}</span>`;
  return v.freshDays != null ? `<span class="tg2 fresh">${v.freshDays === 0 ? 'Bugun tasdiqlangan' : v.freshDays + ' kun oldin tasdiqlangan'}</span>` : '';
}
const salLine = v => v.salaryText
  ? esc(v.salaryText).replace(/ (\/ \S+)$/, ' <small>$1</small>')
  : '';

function vacancyHtml(v){
  const kv = (k, val) => val ? `<div class="vd-kv"><span class="k">${k}</span><span class="v">${esc(val)}</span></div>` : '';
  const ul = xs => `<ul class="vd-ul">${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const age = v.minAge && v.maxAge ? `${v.minAge}–${v.maxAge} yosh`
            : v.minAge ? `${v.minAge} yoshdan` : v.maxAge ? `${v.maxAge} yoshgacha` : '';
  const work = [
    kv('Jadval', v.schedule),
    kv('Smena', SHIFT_L[v.shift] || v.shift),
    kv('To\'lov', v.payoutText),
    kv('Boshlash', v.startDate ? dLong(v.startDate) : ''),
    kv('Kerak', v.headcount > 1 ? v.headcount + ' kishi' : '')
  ].join('');
  const need = [
    kv('Tajriba', v.minExp ? v.minExp + ' yildan' : 'Talab qilinmaydi'),
    kv('Yosh', age),
    kv('Tillar', (v.languages || []).join(', '))
  ].join('');
  const pk = perksOf(v);
  const trust = trustTag(v);
  return `<div class="vd-ti">${esc(v.title)}</div>
    ${v.venue ? `<div class="vd-pl" style="color:var(--ink)">${esc(v.venue)}</div>` : ''}
    <div class="vd-pl">${esc(placeOf(v))}</div>
    <div class="vd-sl">${salLine(v) || 'Maosh suhbatda aytiladi'}</div>
    ${v.hook ? `<div class="vd-hk">${esc(v.hook)}</div>` : ''}
    ${(v.duties || []).length ? `<div class="vd-sec">Vazifalar</div>${ul(v.duties)}` : ''}
    <div class="vd-sec">Talablar</div>${(v.requirements || []).length ? ul(v.requirements) : ''}${need}
    ${work ? `<div class="vd-sec">Ish sharoiti</div>${work}` : ''}
    ${pk.chips.length ? `<div class="vd-sec">Afzalliklar</div><div class="vd-chips">${pk.chips.map(p => `<span>${esc(p)}</span>`).join('')}</div>` : ''}
    ${pk.text ? `<div class="vd-sec">Qo'shimcha</div><div class="vd-tx">${esc(pk.text)}</div>` : ''}
    ${trust || v.match ? `<div class="row" style="display:flex;gap:7px;margin-top:14px;flex-wrap:wrap">
      ${v.match ? '<span class="tg2 fit">Sizga mos</span>' : ''}${trust}</div>` : ''}`;
}

// ── ARIZA OYNASI ──
// Ilgari bitta bosish bilan ketardi, xato bo'lsa alert() — Telegram ichida
// u ko'pincha chiqmaydi, tugma jimgina qaytib qolardi (2026-10-22: "bosdim,
// hech narsa bo'lmadi"). Endi: nima yuborilayotgani, profil tekshiruvi,
// xato SHU oynada va tushunarli, muvaffaqiyat — keyingi qadamlar bilan.
const fail = (msg, btn) => `<div class="ap-er">${esc(msg)}${btn ? `<br><button id="apFix">${esc(btn)}</button>` : ''}</div>`;
function openApply(v){
  const p = P || {};
  const row = (ok, label, val, opt) => `<div class="ck-r"><i class="${ok ? 'y' : opt ? 'o' : 'n'}">${ok ? '✓' : opt ? '–' : '!'}</i>${label}
    <span class="v">${esc(val || (opt ? 'ixtiyoriy' : 'yo\'q'))}</span></div>`;
  const hasName = !!String(p.fullName || '').trim(), hasPhone = !!String(p.phone || '').trim();
  const ready = hasName && hasPhone;
  showSheet('Ariza', `
    <div class="ap-v"><b>${esc(v.title)}</b><span>${esc([v.venue, placeOf(v)].filter(Boolean).join(' · '))}</span>
      ${v.salaryText ? `<div style="font-weight:600;color:var(--ok);margin-top:4px">${salLine(v)}</div>` : ''}</div>
    <div class="vd-sec">Ish beruvchi ko'radi</div>
    <div class="ck-l">
      ${row(hasName, 'Ism', p.fullName)}
      ${row(hasPhone, 'Telefon', p.phone)}
      ${row(!!(p.desiredPosition || p.role), 'Lavozim', p.desiredPosition, true)}
      ${row(!!p.experienceYears, 'Tajriba', p.experienceYears ? p.experienceYears + ' yil' : '', true)}
      ${row(!!p.hasPhoto, 'Rasm', p.hasPhoto ? 'bor' : '', true)}
    </div>
    ${ready ? '' : fail('Ariza uchun ism va telefon kerak — HR sizga shu raqam orqali qo\'ng\'iroq qiladi.', 'Profilni to\'ldirish')}
    <div id="apEr"></div>
    <button class="btn" id="apGo" style="margin-top:12px" ${ready ? '' : 'disabled'}>Arizani yuborish</button>`);
  if ($('apFix')) $('apFix').onclick = () => { closeSheet(); pickTab('tP'); };
  $('apGo').onclick = () => sendApply(v);
}

async function sendApply(v){
  const b = $('apGo');
  b.disabled = true; b.textContent = 'Yuborilmoqda…'; $('apEr').innerHTML = '';
  try {
    // Xat maydoni yo'q (Anas qarori: ko'k yoqa uchun ortiqcha qadam) — profilning o'zi yetadi
    await api(`/api/cand/vacancies/${encodeURIComponent(v.id)}/apply`, { method:'POST', body: JSON.stringify({}) });
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
    v.applied = true;
    applied(v);
    loadJobs();
  } catch(e){
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('error'); } catch(_){}
    b.disabled = false; b.textContent = 'Arizani yuborish';
    let html, fix = null;
    if (e.code === 'expired' || e.status === 401) {
      html = fail('Sessiya eskirgan: ilova uzoq vaqt ochiq turdi. Ilovani yopib, botdan qayta oching.', 'Ilovani yopish');
      fix = () => { try { TG.close(); } catch(_){} };
    } else if (['no_name', 'no_phone', 'bad_phone'].includes(e.code)) {
      html = fail(e.message, 'Profilni to\'ldirish'); fix = () => { closeSheet(); pickTab('tP'); };
    } else if (e.code === 'duplicate') {
      v.applied = true; html = fail(e.message, 'Arizalarimni ko\'rish'); fix = () => { closeSheet(); pickTab('tA'); };
    } else if (e.code === 'closed') {
      html = fail(e.message, 'Boshqa vakansiyalar'); fix = () => { closeSheet(); loadJobs(); };
    } else if (!e.status) {
      html = fail('Internet aloqasi yo\'q yoki server javob bermadi. Qayta urinib ko\'ring.');
    } else {
      html = fail(e.message || 'Xato yuz berdi. Qayta urinib ko\'ring.');
    }
    $('apEr').innerHTML = html;
    if (fix && $('apFix')) $('apFix').onclick = fix;
  }
}

const dmy = d => d ? new Date(d).toLocaleDateString('uz-UZ',{day:'2-digit',month:'short'}) : '';


// ══════════════════════════════════════════════════════════
//  SUHBATLAR
// ══════════════════════════════════════════════════════════
// Tepada qadalgan "TalentHub" (agentlik) — u BotMessage'dagi mavjud
// Telegram yozishmasi, shuning uchun id'si maxsus: 'agency'.
// Ostida kontaktingizni ochgan mijozlar — ular NOMI bilan ko'rinadi,
// chunki kontakt ochilgan, ya'ni tanishish allaqachon bo'lgan.

const VF = '<svg class="ch-vf" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">'
  + '<circle cx="12" cy="12" r="11" fill="#2563EB"/>'
  + '<path d="M10.8 16.2l-3.4-3.4 1.3-1.3 2.1 2.1 5-5 1.3 1.3z" fill="#fff"/></svg>';

// Agentlik suhbati — yordam chati (yulduzcha emas, quloqchin: "bu yerda javob beriladi")
const AG_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/>'
  + '<path d="M21 16v2a4 4 0 0 1-4 4h-5"/></svg>';

let CHATS = [], CUR = null;

const initialsOf = s => String(s || '—').replace(/[^\p{L}\p{N} ]/gu, '').trim().slice(0, 2).toUpperCase();

function tmOf(s){
  if (!s) return '';
  const d = new Date(s), n = new Date();
  return d.toDateString() === n.toDateString()
    ? d.toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' })
    : d.toLocaleDateString('uz-UZ', { day:'2-digit', month:'short' });
}

async function loadChats(){
  try {
    CHATS = await api('/api/cand/chats');
    drawChats();
  } catch(e){
    $('chatList').innerHTML = '<div class="ch-empty">' + esc(e.message) + '</div>';
  }
}

function drawChats(){
  const box = $('chatList');
  setDot(CHATS.reduce((s, c) => s + (c.unread || 0), 0));
  if (!CHATS.length){ box.innerHTML = '<div class="ch-empty">Hali suhbat yo\'q</div>'; return; }
  box.innerHTML = CHATS.map((c, i) => {
    const ag = !!c.pinned;
    const nm = c.title || '—';
    return '<div class="ch-row" data-i="' + i + '">'
      + '<div class="ch-av' + (ag ? ' ag' : '') + '" data-nozoom>' + (ag ? AG_IC : coAvatar(c)) + '</div>'
      + '<div class="ch-mid"><div class="ch-top"><span class="ch-name">' + esc(nm) + '</span>'
      + (ag ? VF + '<span class="ch-pin">&#128204;</span>' : '') + '</div>'
      + '<div class="ch-last">' + esc(c.subtitle || c.lastMsgText || '') + '</div></div>'
      + '<div class="ch-right"><span class="ch-time">' + (c.lastMsgFrom ? tmOf(c.lastMsgAt) : '') + '</span>'
      + (c.unread ? '<span class="ch-badge">' + c.unread + '</span>' : '') + '</div></div>';
  }).join('');
  box.querySelectorAll('.ch-row').forEach(el => {
    el.onclick = () => openChat(CHATS[+el.dataset.i]);
  });
}

// Ish beruvchi — logotipi (kontakt ochiq va yuklangan bo'lsa), aks holda bosh harflar.
// Ro'yxatda bosish suhbatni ochadi (data-nozoom); to'liq ko'rish — kompaniya kartasida.
function coAvatar(c){
  return c.open && c.hasLogo
    ? '<img src="/api/cand/companies/' + encodeURIComponent(c.clientId) + '/logo?t=' + encodeURIComponent(PT)
      + '&v=' + encodeURIComponent(c.logoAt || '') + '" alt="">'
    : esc(initialsOf(c.title));
}

async function openChat(c){
  CUR = c;
  const ag = !!c.pinned;
  $('cvName').textContent = c.title || '—';
  $('cvVf').innerHTML = ag ? VF : '';
  $('cvSub').textContent = ag ? 'Yordam chati' : (c.subtitle || '');
  $('cvAv').innerHTML = ag ? AG_IC : coAvatar(c);
  $('cvAv').className = 'ch-av' + (ag ? ' ag' : '');
  // Mijoz nomini bosish — kompaniya va vakansiya (faqat kontakt ochiq bo'lsa)
  const tap = !ag && c.open && c.clientId;
  $('cvWho').classList.toggle('tap', !!tap);
  $('cvWho').onclick = tap ? () => showCompany(c.clientId) : null;
  $('cvBody').innerHTML = '<div class="ch-empty">Yuklanmoqda…</div>';
  $('cv').classList.remove('hide');
  await reloadMsgs();
  c.unread = 0;
  drawChats();
}

async function reloadMsgs(){
  if (!CUR) return;
  try {
    const d = await api('/api/cand/chats/' + encodeURIComponent(CUR.id) + '/messages');
    drawMsgs(d.messages || []);
  } catch(e){
    $('cvBody').innerHTML = '<div class="ch-empty">' + esc(e.message) + '</div>';
  }
}

function drawMsgs(ms){
  const b = $('cvBody');
  if (!ms.length){
    // Yordam chati bo'sh — salomlashuv (bazaga yozilmaydi), "nima yozaman" savoliga javob
    b.innerHTML = CUR && CUR.pinned
      ? '<div class="cmsg them">Assalomu alaykum! Bu TalentHub yordam chati. Ish, ariza yoki profil bo\'yicha savolingizni shu yerga yozing — javob beramiz.</div>'
      : '<div class="ch-empty">Hali xabar yo\'q</div>';
    return;
  }
  b.innerHTML = ms.map(m => {
    if (m.kind === 'system') return '<div class="cmsg sys">' + esc(m.text) + '</div>';
    const me = m.from === 'candidate';
    return '<div class="cmsg ' + (me ? 'me' : 'them') + '">' + esc(m.text)
      + '<div class="cmsg-t">' + tmOf(m.createdAt) + '</div></div>';
  }).join('');
  b.scrollTop = b.scrollHeight;
}

async function sendMsg(){
  const inp = $('cvIn'), t = inp.value.trim();
  if (!t || !CUR) return;
  $('cvSend').disabled = true;
  try {
    await api('/api/cand/chats/' + encodeURIComponent(CUR.id) + '/messages',
      { method:'POST', body: JSON.stringify({ text: t }) });
    inp.value = '';
    await reloadMsgs();
    loadChats();
  } catch(e){
    $('cvBody').insertAdjacentHTML('beforeend',
      '<div class="cmsg sys">Yuborilmadi: ' + esc(e.message) + '</div>');
    $('cvBody').scrollTop = $('cvBody').scrollHeight;
  }
  $('cvSend').disabled = false;
}

// ── Qizil nuqta: o'qilmagan xabarlar (mijozlardan) ──
// Kirganda, suhbatdan chiqqanda va ilovaga qaytganda yangilanadi.
function setDot(n){ const d = $('dM'); if (d) d.classList.toggle('on', n > 0); }
function refreshUnread(){
  if (!INIT) return;
  api('/api/cand/unread').then(d => setDot(d.chats)).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshUnread(); });

$('cvBack').onclick = () => { $('cv').classList.add('hide'); CUR = null; refreshUnread(); };
$('cvSend').onclick = sendMsg;
$('cvIn').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };

// Telegram xabaridagi tugma profil.html#chat ga olib keladi —
// shu holda darhol Xabarlar tabini ochamiz.
// Element tekshiriladi: INIT bo'lmasa tablar yo'qoladi.
if (location.hash === '#chat') setTimeout(() => { if ($('tM')) pickTab('tM'); }, 0);
// Ariza xabaridagi tugmalar: #apps — Arizalarim, #jobs — Ish o'rinlari (services/appLife)
if (location.hash === '#apps') setTimeout(() => { if ($('tA')) pickTab('tA'); }, 0);
if (location.hash === '#jobs') setTimeout(() => { if ($('tJ')) pickTab('tJ'); }, 0);
// ── Tablar ──
const TABS = [['tP','app'], ['tJ','vJ'], ['tA','vA'], ['tM','vM']];
function pickTab(id){
  TABS.forEach(([t, v]) => {
    $(t).classList.toggle('on', t === id);
    $(v).classList.toggle('hide', t !== id);
  });
  haptic();
  window.scrollTo(0, 0);
  if (id === 'tJ') loadJobs();
  if (id === 'tA') loadApps();
  if (id === 'tM') loadChats();
  moveLens();
}
TABS.forEach(([t]) => { $(t).onclick = () => pickTab(t); });

// ── Linza: faol tab ostiga prujina bilan suriladi ──
// Birinchi joylashuv animatsiyasiz — aks holda ochilganda chapdan uchib keladi.
function moveLens(){
  const lens = $('lens'), on = document.querySelector('.tabs .tb.on');
  if (!lens || !on || !on.offsetWidth) return;
  const first = !lens.classList.contains('on');
  if (first) lens.style.transition = 'none';
  lens.style.width = on.offsetWidth + 'px';
  lens.style.transform = 'translateX(' + on.offsetLeft + 'px) scale(1.04,1.16)';
  if (first) { void lens.offsetWidth; lens.style.transition = ''; lens.classList.add('on'); }
}
window.addEventListener('resize', moveLens);

// ── Linzani barmoq bilan surish (iOS Telegram/Instagram kabi) ──
// Barmoq panelda 6px dan ko'p yursa — surish rejimi: linza barmoq ortidan
// yuradi va kattalashadi, ostidagi bo'lim belgilanadi, qo'yib yuborilganda
// o'sha bo'lim ochiladi va linza prujina bilan joyiga o'tiradi.
// Kichik harakat — oddiy bosish (click) bo'lib qoladi.
(function(){
  const nav = document.querySelector('.tabs'), lens = $('lens');
  if (!nav || !lens) return;
  const btns = [...nav.querySelectorAll('.tb')];
  const tick = () => { try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch(e){} };
  let sx = null, pid = null, drag = false, hov = null, quiet = 0;

  // Barmoq ostidagi bo'lim; panel chetidan chiqsa — eng chetdagisi
  const under = x => {
    const first = btns[0].getBoundingClientRect(), last = btns[btns.length - 1].getBoundingClientRect();
    if (x < first.left) return btns[0];
    if (x >= last.right) return btns[btns.length - 1];
    return btns.find(b => { const r = b.getBoundingClientRect(); return x >= r.left && x < r.right; }) || null;
  };

  nav.addEventListener('pointerdown', e => { sx = e.clientX; pid = e.pointerId; drag = false; });

  nav.addEventListener('pointermove', e => {
    if (sx == null || e.pointerId !== pid) return;
    if (!drag) {
      if (Math.abs(e.clientX - sx) < 6) return;
      drag = true;
      try { nav.setPointerCapture(pid); } catch(err){}
      lens.style.transition = 'width .2s, opacity .2s';      // barmoqqa darhol ergashsin
      lens.classList.add('drag', 'on');
    }
    const nr = nav.getBoundingClientRect(), w = lens.offsetWidth;
    const x = Math.max(5, Math.min(nr.width - 5 - w, e.clientX - nr.left - w / 2));
    lens.style.transform = 'translateX(' + x + 'px) scale(1.1,1.3)';
    const b = under(e.clientX);
    if (b && b !== hov) {
      if (hov) hov.classList.remove('hov');
      hov = b; b.classList.add('hov'); tick();
    }
  });

  const end = e => {
    if (sx == null || (e && e.pointerId !== pid)) return;
    const was = drag;
    sx = null; drag = false;
    if (!was) return;                                       // oddiy bosish — click o'zi ishlaydi
    lens.classList.remove('drag');
    lens.style.transition = '';                             // joyiga prujina bilan
    quiet = Date.now() + 350;                               // surishdan keyingi click bo'limni qayta almashtirmasin
    const target = hov;
    if (hov) { hov.classList.remove('hov'); hov = null; }
    if (target) pickTab(target.id); else moveLens();
  };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', end);

  // iOS: linzani surayotganda butun Mini App qimirlab ketardi. Ikki sabab:
  //  1) Telegram'ning "pastga surib yig'ish" imo-ishorasi — barmoq ozgina
  //     pastga og'sa ham ishga tushadi. Barmoq panelda turganda o'chiramiz,
  //     qo'yilganda qaytaramiz: boshqa joyda odatdagidek yopiladi.
  //  2) WebView touch-action'ni to'liq hurmat qilmaydi — sahifa "rezinadek"
  //     cho'ziladi. Panelda boshlangan harakatda aylantirishni to'xtatamiz
  //     (pointer hodisalari va oddiy bosish bunga tegmaydi).
  const swipes = on => { try {
    if (!TG || !TG.isVersionAtLeast || !TG.isVersionAtLeast('7.7')) return;
    on ? TG.enableVerticalSwipes() : TG.disableVerticalSwipes();
  } catch(e){} };
  const restore = () => setTimeout(() => swipes(true), 60);
  nav.addEventListener('touchstart', () => swipes(false), { passive: true });
  nav.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  nav.addEventListener('touchend', restore);
  nav.addEventListener('touchcancel', restore);
  nav.addEventListener('click', e => {
    if (Date.now() < quiet) { e.stopPropagation(); e.preventDefault(); }
  }, true);
})();
moveLens();

(async function(){
  if (!INIT) { $('app').innerHTML = '<div class="msg">Bu sahifa Telegram ichida ochilishi kerak.</div>'; return; }
  try { render(await api('/api/cand/me')); refreshUnread(); }
  catch(e){ $('app').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
