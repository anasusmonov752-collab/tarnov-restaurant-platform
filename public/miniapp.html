<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentHub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Rang Telegram mavzusidan OLINMAYDI.
   Avval --tg-theme-* o'zgaruvchilariga tayanardik, natijada mijozda tungi
   rejim yoqilgan bo'lsa ilova qora ochilar va platformaning oq/ko'k
   ko'rinishi yo'qolardi. Brend bir xil bo'lishi uchun palitra qattiq. */
:root{
  --bg:#EEF3FB; --card:#FFFFFF; --ink:#16233A; --muted:#64748B;
  --line:#E1E8F2; --blue:#2563EB; --blue-d:#1D4ED8;
  --ok:#2E9E5B; --warn:#B4802E; --danger:#C25B4C;
  --btn:var(--blue); --btn-ink:#fff; --link:var(--blue);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));   /* suzuvchi panel ostida qolmasin */
  -webkit-text-size-adjust:100%}
.wrap{padding:12px}
.hide{display:none !important}

/* ── Ro'yxat ── */
.top{position:sticky;top:0;background:var(--bg);padding:10px 12px;z-index:5;border-bottom:1px solid var(--line)}
.backcab{border:0;background:transparent;color:var(--blue);font-family:inherit;font-size:14px;
  font-weight:600;padding:2px 0 8px;cursor:pointer}
.sum{font-size:13.5px;color:var(--muted);line-height:1.45}
.cnt{font-size:13px;color:var(--muted);margin-top:3px}

.c{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;
  display:flex;gap:11px;position:relative;cursor:pointer;
  border:2px solid transparent;transition:border-color .12s}
.c.on{border-color:var(--btn)}
.c.seen .pos::after{content:' ·';color:var(--muted)}
.ph{width:68px;height:84px;border-radius:10px;flex:none;overflow:hidden;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover}
.b{flex:1;min-width:0}
.code{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
.pos{font-size:15.5px;font-weight:600;margin-top:1px;line-height:1.25}
.meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.t{font-size:11.5px;padding:3px 8px;border-radius:7px;background:var(--bg);color:var(--muted)}
.t.ai{color:#1E7A46}
.t.act{color:#1E7A46}
.t.no{color:#B4542B}
.seenmark{font-size:11.5px;color:var(--muted);margin-top:6px;display:none}
.c.seen .seenmark{display:block}
.tick{position:absolute;top:10px;right:10px;width:23px;height:23px;border-radius:50%;
  border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.c.on .tick{background:var(--btn);border-color:var(--btn)}
.c.on .tick::after{content:'';width:6px;height:11px;border:solid var(--btn-ink);
  border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* ── Alohida sahifa ── */
#detail{display:none}
.d-ph{width:100%;max-height:300px;object-fit:cover;display:block;background:var(--card)}
.d-ph-none{height:150px;background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:30px;font-weight:600;color:var(--muted)}
.d-head{padding:14px 12px 0}
.d-code{font-size:12.5px;color:var(--muted);font-family:ui-monospace,monospace}
.d-pos{font-size:21px;font-weight:600;line-height:1.2;margin-top:2px}
.d-meta{font-size:14px;color:var(--muted);margin-top:6px}
.sec{padding:14px 12px 0}
.sec h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:7px}
.sec p{font-size:14.5px;line-height:1.6}
.ai{background:var(--card);border-radius:12px;padding:12px;font-size:14px;line-height:1.55}
.ai b{color:var(--link)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:5px 11px;border-radius:9px;background:var(--card)}
.w{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.w-p{font-size:15px;font-weight:600}
.w-c{font-size:13.5px;color:var(--muted);margin-top:1px}
.w-d{font-size:13.5px;margin-top:6px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right}

/* ── Pastki amal paneli (qidiruv rejimi) ── */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:14px;border:none;border-radius:12px;background:var(--btn);
  color:var(--btn-ink);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--bg);color:var(--ink)}
.nav{width:52px;flex:none;padding:14px 0;border:none;border-radius:12px;
  background:var(--bg);color:var(--ink);font-size:17px;cursor:pointer}
.nav:disabled{opacity:.3}
.pg{font-size:13px;color:var(--muted);flex:none;min-width:48px;text-align:center}
.msg{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px;line-height:1.6}

/* ══ KABINET ══════════════════════════════════════════════ */
/* Oq va havodor — nomzod profili bilan bir tilda. Oldin to'q ko'k
   gradient edi; mobilda og'ir ko'rinar va asosiy raqamni (balans)
   bo'rttirish o'rniga u bilan raqobatlashardi. */
.chead{background:var(--card);border-bottom:1px solid var(--line);
  padding:18px 16px 16px;position:sticky;top:0;z-index:6}
.chead .nm{font-size:15px;color:var(--muted);font-weight:500}
.chead .cr{display:flex;align-items:baseline;gap:9px;margin-top:6px}
.chead .cr b{font-size:34px;font-weight:600;color:var(--blue);line-height:1}
.chead .cr span{font-size:13px;color:var(--muted);line-height:1.4}

.stats{display:flex;gap:8px;padding:12px 12px 0}
.stat{flex:1;background:var(--card);border-radius:11px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:700}
.stat span{font-size:11px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}

.sl{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sl-h{padding:12px 13px;border-bottom:1px solid var(--line)}
.sl-h .q{font-size:14.5px;font-weight:600;line-height:1.35}
.sl-h .d{font-size:12.5px;color:var(--muted);margin-top:3px}
.it{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;gap:11px}
.it:last-child{border-bottom:none}
.it .av{width:46px;height:56px;border-radius:9px;flex:none;overflow:hidden;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.it .av img{width:100%;height:100%;object-fit:cover}
.it .bd{flex:1;min-width:0}
.it .p{font-size:14.5px;font-weight:600;line-height:1.3}
.it .m{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.st{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;margin-top:7px}
.st.waiting{background:rgba(180,128,46,.13);color:var(--warn)}
.st.open{background:rgba(46,158,91,.13);color:var(--ok)}
.st.no{background:rgba(194,91,76,.12);color:var(--danger)}
.st.refunded{background:rgba(100,116,139,.14);color:var(--muted)}
.ct{margin-top:9px;background:rgba(46,158,91,.07);border:1px solid rgba(46,158,91,.25);
  border-radius:10px;padding:10px}
.ct .nm{font-size:14.5px;font-weight:700}
.ct a{display:block;font-size:16px;font-weight:700;color:var(--ok);text-decoration:none;margin-top:5px}
.ct .em{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-all}
.rz{font-size:12.5px;color:var(--danger);margin-top:6px;line-height:1.45}
.iv{font-size:12.5px;color:var(--ok);font-weight:600;margin-top:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ab{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;
  font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
.ab.ok{border-color:rgba(46,158,91,.4);color:var(--ok)}
.ab.no{border-color:rgba(194,91,76,.35);color:var(--danger)}
.ab:disabled{opacity:.5}
.ivbox{margin-top:9px}
.ivbox input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  font-family:inherit;font-size:15px;color:var(--ink);background:var(--card)}

.le{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.le:last-child{border-bottom:none}
.le .dl{font-size:16px;font-weight:700;min-width:34px}
.le .dl.p{color:var(--ok)}
.le .dl.m{color:var(--danger)}
.le .rr{flex:1;font-size:13.5px}
.le .rr i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.le .ba{font-size:13px;color:var(--muted)}

.card{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px}
.pad{padding:14px 13px}
.h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin:0 0 9px 13px}

/* ── Vakansiyalar ── */
.vc{background:var(--card);border-radius:14px;padding:13px;margin-bottom:11px}
.vc .ti{font-size:15.5px;font-weight:600;line-height:1.3}
.vc .mt{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.vc .row{display:flex;gap:7px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px}
.tag.open{background:rgba(46,158,91,.13);color:var(--ok)}
.tag.paused{background:rgba(180,128,46,.14);color:var(--warn)}
.tag.closed{background:rgba(100,116,139,.14);color:var(--muted)}
.tag.stale{background:rgba(194,91,76,.12);color:var(--danger)}
.tag.app{background:rgba(37,99,235,.12);color:var(--blue)}
.tag.priv{background:rgba(100,116,139,.14);color:var(--ink)}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink);cursor:pointer}
.sbtn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.sbtn.d{border-color:var(--danger);color:var(--danger)}

/* ── Pastki oyna ── */
/* z-index suhbat oynasidan (.cv 60) yuqori — rezyume suhbat ustida ochiladi */
.sheet{position:fixed;inset:0;background:rgba(8,20,38,.45);display:none;align-items:flex-end;z-index:70}
.sheet.on{display:flex}
.sh{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0}
.sh-h{position:sticky;top:0;background:var(--card);display:flex;align-items:center;
  padding:16px;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0}
.sh-h b{flex:1;font-size:16.5px}
.sh-x{border:none;background:transparent;font-size:19px;color:var(--muted);cursor:pointer}
.sh-b{padding:4px 16px 20px}
.fl{padding:12px 0;border-bottom:1px solid var(--line)}
.fl:last-of-type{border-bottom:none}
.fl label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.fl input,.fl select,.fl textarea{width:100%;border:none;background:transparent;
  font-family:inherit;font-size:16px;color:var(--ink);padding:0}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none}
.fl textarea{resize:vertical;min-height:60px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}

/* ── Tab paneli: "suyuq shisha" ──
   Namuna — iOS Liquid Glass. Haqiqiy sinish (ortidagini egib ko'rsatish)
   veb'da mumkin emas: Safari backdrop-filter'da SVG filtrni qo'llamaydi.
   Shuning uchun taqlid: yupqa shisha + kuchli blur, yuqori chetda
   yaltirash, faol bo'limda kamalak chetli "linza" prujina bilan suriladi.
   Shisha faqat ortidan nimadir o'tganda ko'rinadi — bo'sh och fonda oq.
   Emoji EMAS — Lucide ikonkalari. Yozuv qoladi: bo'limlar universal emas.
   Blur ishlamaydigan eski WebView'da oddiy oq fon (@supports). */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:2px;padding:5px;border-radius:28px;z-index:10;isolation:isolate;
  background:rgba(255,255,255,.96);border:1px solid rgba(225,232,242,.9);
  box-shadow:0 10px 30px rgba(15,39,71,.16),0 2px 6px rgba(15,39,71,.08)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .tabs{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));
    -webkit-backdrop-filter:blur(14px) saturate(210%);backdrop-filter:blur(14px) saturate(210%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),
      inset 0 0 0 .5px rgba(15,39,71,.07),0 10px 30px rgba(15,39,71,.16),0 2px 6px rgba(15,39,71,.08)}
}
/* Yuqori yarmidagi yaltirash — shishaning "qalinligi" */
.tabs::before{content:'';position:absolute;left:2px;right:2px;top:1px;height:46%;
  border-radius:26px 26px 12px 12px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}

/* Faol bo'lim — linza. Bitta element, moveLens() uni faol tab ostiga
   suradi; tablardan biroz kattaroq (scale), namunadagidek panel chetidan
   chiqib turadi. ::after — kamalak chet (sinish chizig'i taqlidi). */
.lens{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:23px;z-index:0;
  pointer-events:none;opacity:0;
  transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1),opacity .2s;
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.9),rgba(255,255,255,.4) 55%,rgba(255,255,255,.2));
  box-shadow:inset 0 1px 1px #fff,inset 0 -3px 6px rgba(255,255,255,.45),
    0 4px 14px rgba(15,39,71,.15),0 1px 2px rgba(15,39,71,.08)}
.lens::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(100deg,rgba(255,80,160,.65),rgba(255,196,80,.5) 22%,rgba(255,255,255,.8) 46%,
    rgba(80,196,255,.65) 72%,rgba(140,96,255,.65));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.lens.on{opacity:1}
/* Surish: sahifa aylanmasin, matn belgilanmasin, uzoq bosishda menyu chiqmasin */
.tabs{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Surilayotgan linza — kattaroq va shaffofroq, "lupa" kabi */
.lens.drag{background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.7),rgba(255,255,255,.22) 60%,rgba(255,255,255,.08));
  box-shadow:inset 0 1px 1px #fff,inset 0 -4px 8px rgba(255,255,255,.5),
    0 10px 24px rgba(15,39,71,.2),0 2px 4px rgba(15,39,71,.1)}
.tb.hov{color:var(--ink)}

.tb{position:relative;z-index:1;flex:1;min-width:0;border:none;background:transparent;border-radius:21px;
  padding:7px 2px 6px;cursor:pointer;font-family:inherit;color:var(--muted);font-size:10.5px;
  font-weight:600;line-height:1.2;white-space:nowrap;display:flex;flex-direction:column;
  align-items:center;gap:3px;transition:color .2s;-webkit-tap-highlight-color:transparent}
.tb .ic{position:relative;display:block;width:23px;height:23px;transition:transform .3s cubic-bezier(.34,1.45,.5,1)}
.tb .ic svg{width:23px;height:23px;display:block}
.tb.on{color:var(--ink)}
.tb.on .ic{transform:scale(1.1)}
.tb.on .ic svg{stroke-width:2.3}
/* O'qilmagan xabar — qizil nuqta */
.tb .dot{position:absolute;top:-1px;right:-3px;width:10px;height:10px;border-radius:50%;
  background:#EF4444;border:2px solid #fff;display:none}
.tb .dot.on{display:block}

/* ══ SUHBATLAR ══════════════════════════════════════════════
   Inbox: tepada qadalgan agentlik (galochka bilan), ostida
   kontakt ochilgan nomzodlar. */
.ch-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.ch-row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);
  border-bottom:1px solid var(--line);cursor:pointer}
.ch-row:active{background:#F3F7FD}
.ch-av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:14px;background:#E8EFFA;color:var(--blue)}
.ch-av.ag{background:var(--blue);color:#fff;font-size:17px}
.ch-mid{flex:1;min-width:0}
.ch-top{display:flex;align-items:center;gap:5px}
.ch-name{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-vf{flex:none;display:block}
.ch-pin{flex:none;color:var(--muted);font-size:12px}
.ch-last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.ch-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.ch-time{font-size:11.5px;color:var(--muted)}
.ch-badge{min-width:19px;height:19px;border-radius:10px;background:var(--blue);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.ch-av{overflow:hidden}
.ch-av img{width:100%;height:100%;object-fit:cover}
/* Kontakt ochilgan suhbat sarlavhasi bosiladi — rezyume ochiladi */
.cv-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.cv-who.tap{cursor:pointer}
.cv-who.tap .ch-last::after{content:' · rezyume ›';color:var(--blue)}

/* ══ REZYUME (kontakt ochilgandan keyin) ═══════════════════ */
.rs-hd{display:flex;gap:13px;align-items:center;padding:6px 0 14px}
.rs-ph{width:64px;height:76px;border-radius:12px;flex:none;overflow:hidden;background:#E8EFFA;
  color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.rs-ph img{width:100%;height:100%;object-fit:cover}
.rs-nm{font-size:18px;font-weight:700;line-height:1.25}
.rs-po{font-size:14px;margin-top:3px}
.rs-mt{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.rs-ct{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:12px;
  padding:11px 13px;font-size:14.5px}
.rs-ct a{color:var(--blue);font-weight:600;text-decoration:none}
.rs-sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  font-weight:600;margin:18px 0 8px}
.rs-tx{font-size:14px;line-height:1.55;white-space:pre-line}
.rs-w{padding:10px 0;border-bottom:1px solid var(--line)}
.rs-w:last-child{border-bottom:none}
.rs-w b{font-size:14.5px;font-weight:600}
.rs-w .m{font-size:13px;color:var(--muted);margin-top:2px}
.rs-w .d{font-size:13.5px;margin-top:5px;line-height:1.5;white-space:pre-line}
.rs-kv{display:flex;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
.rs-kv:last-child{border-bottom:none}
.rs-kv .k{color:var(--muted);flex:none;min-width:120px}
.rs-kv .v{flex:1;text-align:right}
.rs-chips{display:flex;flex-wrap:wrap;gap:6px}
.rs-chips span{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--bg)}
.rzb{margin-top:8px;border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--blue);cursor:pointer}

/* Ochilgan suhbat */
.cv{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.cv.hide{display:none}
.cv-h{flex:none;display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:var(--card);border-bottom:1px solid var(--line)}
.cv-back{flex:none;background:transparent;border:0;font-size:19px;color:var(--blue);
  padding:4px 8px;cursor:pointer}
.cv-b{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.cv-f{flex:none;display:flex;gap:8px;padding:10px 12px;background:var(--card);
  border-top:1px solid var(--line)}
.cv-f input{flex:1;min-width:0;border:1px solid var(--line);border-radius:20px;
  padding:10px 14px;font-size:14.5px;outline:none;background:var(--bg);color:var(--ink)}
.cv-f input:focus{border-color:var(--blue)}
.cv-send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);
  color:#fff;font-size:16px;cursor:pointer}
.cv-send:disabled{opacity:.45}
.cmsg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;
  word-wrap:break-word;white-space:pre-wrap}
.cmsg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.cmsg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);
  border-bottom-left-radius:5px}
/* Tizim xabari ataylab boshqacha: uni odamning gapi bilan adashtirmaslik kerak */
.cmsg.sys{align-self:center;background:#E8EFFA;color:#3A5070;font-size:12.5px;
  text-align:center;border-radius:12px;max-width:92%}
.cmsg-t{font-size:10.5px;opacity:.65;margin-top:3px;text-align:right}
</style>
</head>
<body>

<!-- ══ QIDIRUV REJIMI (?s=<kalit> bilan ochilganda) ══ -->
<div id="searchMode" class="hide">
  <div id="listView">
    <div class="top">
      <button class="backcab hide" id="bBackCab">&#10094; Vakansiyalar</button>
      <div class="sum" id="sum">Yuklanmoqda…</div>
      <div class="cnt" id="cnt"></div>
    </div>
    <div class="wrap" id="list"></div>
  </div>
  <div id="detail"></div>
  <div class="bar" id="bar" style="display:none"></div>
</div>

<!-- ══ KABINET (menyu tugmasidan ochilganda) ══ -->
<div id="cabMode" class="hide">
  <div class="chead">
    <div class="nm" id="cName">—</div>
    <div class="cr"><b id="cCred">—</b><span>kredit · 1 kredit = 1 ochilgan kontakt</span></div>
  </div>

  <div id="vSL">
    <div class="stats" id="cStats"></div>
    <div class="wrap" id="slList"><div class="msg">Yuklanmoqda…</div></div>
  </div>

  <div id="vVC" class="hide">
    <div class="wrap">
      <button class="btn" id="bNewV" style="width:100%;margin-bottom:14px">+ Yangi vakansiya</button>
      <div id="vcList"><div class="msg">Yuklanmoqda…</div></div>
    </div>
  </div>

  <div id="vCR" class="hide">
    <div class="wrap">
      <div class="card"><div class="pad">
        <button class="btn" id="bTop" style="width:100%">Kredit so'rash</button>
        <div style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5">
          So'rov HR'ga boradi. Tasdiqlangach balansingiz yangilanadi.
        </div>
      </div></div>
      <div class="h3">Harakatlar tarixi</div>
      <div class="card" id="crList"><div class="msg">Yuklanmoqda…</div></div>
    </div>
  </div>

  <div id="vMS" class="hide">
    <div id="chatList"><div class="ch-empty">Yuklanmoqda…</div></div>
    <div class="wrap" style="padding-top:14px">
      <button class="btn" id="bChat" style="width:100%">Botga qaytish</button>
    </div>
  </div>

  <!-- Ochilgan suhbat: butun ekran, pastdagi tablar ustidan.
       Shunda klaviatura chiqqanda tab paneli yozuv maydonini bosmaydi. -->
  <div class="cv hide" id="cv">
    <div class="cv-h">
      <button class="cv-back" id="cvBack">&#10094;</button>
      <div class="cv-who" id="cvWho">
        <div class="ch-av" id="cvAv">—</div>
        <div style="flex:1;min-width:0">
          <div class="ch-top"><span class="ch-name" id="cvName">—</span><span id="cvVf"></span></div>
          <div class="ch-last" id="cvSub"></div>
        </div>
      </div>
    </div>
    <div class="cv-b" id="cvBody"></div>
    <div class="cv-f">
      <input id="cvIn" placeholder="Xabar yozing…" autocomplete="off" maxlength="2000">
      <button class="cv-send" id="cvSend">&#10148;</button>
    </div>
  </div>

  <!-- Ikonkalar: Lucide (clipboard-list, briefcase, wallet, message-circle) -->
  <nav class="tabs">
    <span class="lens" id="lens" aria-hidden="true"></span>
    <button class="tb on" id="tSL"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span>Tanlovlar</button>
    <button class="tb"    id="tVC"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg></span>Vakansiya</button>
    <button class="tb"    id="tCR"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>Balans</button>
    <button class="tb"    id="tMS"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><i class="dot" id="dMS"></i></span>Aloqa</button>
  </nav>
</div>

<div class="sheet" id="sheet">
  <div class="sh">
    <div class="sh-h"><b id="shT">—</b><button class="sh-x" id="shX">&#10005;</button></div>
    <div class="sh-b" id="shB"></div>
  </div>
</div>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
if (TG) { TG.ready(); TG.expand(); }

// Qidiruv seansi kaliti. Botdan ?s= bilan keladi; kabinetdagi "Mos
// nomzodlar" esa uni joyida almashtiradi (openSearch) — sahifani qayta
// yuklamaymiz, chunki Telegram initData qayta yuklashda yo'qolishi mumkin.
let KEY = new URLSearchParams(location.search).get('s') || '';
let FROM_CAB = false;      // qidiruv kabinetdan ochilgan — orqaga qaytish bor
const INIT = (TG && TG.initData) || '';
const $ = id => document.getElementById(id);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const haptic = t => { try { TG && TG.HapticFeedback && TG.HapticFeedback[t==='sel'?'selectionChanged':'impactOccurred'](t==='sel'?undefined:'light'); } catch(e){} };

async function api(path, opt){
  const r = await fetch(path, Object.assign({
    headers: { 'Content-Type':'application/json', 'X-Telegram-Init-Data': INIT }
  }, opt));
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || 'Xato');
  return d;
}

const dt = s => s ? new Date(s).toLocaleDateString('uz-UZ',{day:'2-digit',month:'short'}) : '';
const initialsOf = code => String(code||'—').replace('A-','').slice(0,2);

// ══════════════════════════════════════════════════════════
//  QIDIRUV REJIMI
// ══════════════════════════════════════════════════════════
const SEL = new Set(), SEEN = new Set();
let ROWS = [], cur = -1;

const show = h => { $('list').innerHTML = `<div class="msg">${h}</div>`; };
const photoUrl = c => `/api/ma/photo/${encodeURIComponent(KEY)}/${encodeURIComponent(c.id)}?i=${encodeURIComponent(INIT)}`;

function statusChip(c){
  if (!c.jobStatus || c.jobStatus === 'unknown') return '';
  const cls = c.jobStatus === 'active' ? 'act' : (c.jobStatus === 'not_looking' ? 'no' : '');
  return `<span class="t ${cls}">${esc(c.jobStatusLabel)}</span>`;
}
function factLine(c){
  const b = [];
  b.push(c.experienceYears ? c.experienceYears + ' yil tajriba' : 'Tajribasiz');
  if (c.age) b.push(c.age + ' yosh');
  if (c.location) b.push(c.location);
  return b.join(' · ');
}

function cardHtml(c){
  return `<div class="c ${SEL.has(c.id)?'on':''} ${SEEN.has(c.id)?'seen':''}" data-id="${c.id}">
    <div class="ph">${c.hasPhoto ? `<img src="${photoUrl(c)}" alt="">` : esc(initialsOf(c.publicCode))}</div>
    <div class="b">
      <div class="code">${esc(c.publicCode)}</div>
      <div class="pos">${esc(c.desiredPosition || c.roleLabel || 'Nomzod')}</div>
      <div class="meta">${esc(factLine(c))}</div>
      <div class="tags">
        ${c.fitScore ? `<span class="t ai">AI ${c.fitScore}/5</span>` : ''}
        ${statusChip(c)}
        ${c.salaryExpectation ? `<span class="t">${esc(c.salaryExpectation)}</span>` : ''}
      </div>
      <div class="seenmark">Ko'rib chiqilgan</div>
    </div>
    <div class="tick"></div>
  </div>`;
}

function renderList(){
  cur = -1;
  $('listView').style.display = 'block';
  $('detail').style.display = 'none';
  if (TG && TG.BackButton) TG.BackButton.hide();

  $('list').innerHTML = ROWS.map(cardHtml).join('');
  document.querySelectorAll('.c').forEach(el=>{
    el.onclick = e => {
      if (e.target.classList.contains('tick')) { toggle(el.dataset.id); return; }
      openDetail(ROWS.findIndex(r => r.id === el.dataset.id));
    };
  });
  updateBar();
}

function toggle(id){
  SEL.has(id) ? SEL.delete(id) : SEL.add(id);
  haptic('sel');
  const el = document.querySelector(`.c[data-id="${id}"]`);
  if (el) el.classList.toggle('on');
  updateBar();
}

function openDetail(i){
  if (i < 0 || i >= ROWS.length) return;
  cur = i;
  const c = ROWS[i];
  SEEN.add(c.id);

  $('listView').style.display = 'none';
  const d = $('detail');
  // 'block' aniq yoziladi: bo'sh qiymat inline stilni olib tashlaydi va
  // CSS'dagi #detail{display:none} qaytib kuchga kiradi.
  d.style.display = 'block';
  window.scrollTo(0, 0);
  if (TG && TG.BackButton) { TG.BackButton.show(); TG.BackButton.onClick(renderList); }

  const work = (c.workHistory||[]).map(w => `
    <div class="w">
      <div class="w-p">${esc(w.position||'Lavozim ko\'rsatilmagan')}</div>
      ${w.company ? `<div class="w-c">${esc(w.company)}</div>` : ''}
      ${w.period ? `<div class="w-c">${esc(w.period)}</div>` : ''}
      ${w.description ? `<div class="w-d">${esc(w.description)}</div>` : ''}
    </div>`).join('');

  d.innerHTML = `
    ${c.hasPhoto ? `<img class="d-ph" src="${photoUrl(c)}" alt="">`
                 : `<div class="d-ph-none">${esc(initialsOf(c.publicCode))}</div>`}
    <div class="d-head">
      <div class="d-code">${esc(c.publicCode)}</div>
      <div class="d-pos">${esc(c.desiredPosition || c.roleLabel || 'Nomzod')}</div>
      <div class="d-meta">${esc(factLine(c))}</div>
      <div class="tags" style="margin-top:9px">
        ${c.fitScore ? `<span class="t ai">AI moslik ${c.fitScore}/5</span>` : ''}
        ${statusChip(c)}
      </div>
    </div>
    ${c.summary ? `<div class="sec"><h3>Qisqacha</h3><div class="ai">${esc(c.summary)}</div></div>` : ''}
    ${c.fitReason ? `<div class="sec"><div class="ai"><b>Nega mos:</b> ${esc(c.fitReason)}</div></div>` : ''}
    <div class="sec"><h3>Ma'lumot</h3>
      ${c.salaryExpectation ? `<div class="kv"><span class="k">Kutilayotgan maosh</span><span class="v">${esc(c.salaryExpectation)}</span></div>` : ''}
      ${c.experienceYears ? `<div class="kv"><span class="k">Umumiy tajriba</span><span class="v">${c.experienceYears} yil</span></div>` : ''}
      ${c.education ? `<div class="kv"><span class="k">Ta'lim</span><span class="v">${esc(c.education)}</span></div>` : ''}
      ${c.location ? `<div class="kv"><span class="k">Hudud</span><span class="v">${esc(c.location)}</span></div>` : ''}
      ${c.shift ? `<div class="kv"><span class="k">Smena</span><span class="v">${esc(c.shift)}</span></div>` : ''}
    </div>
    ${(c.languages||[]).length ? `<div class="sec"><h3>Tillar</h3><div class="chips">${c.languages.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>` : ''}
    ${(c.skills||[]).length ? `<div class="sec"><h3>Ko'nikmalar</h3><div class="chips">${c.skills.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>` : ''}
    ${c.experienceSummary ? `<div class="sec"><h3>Tajriba haqida</h3><p>${esc(c.experienceSummary)}</p></div>` : ''}
    ${work ? `<div class="sec"><h3>Ish tarixi</h3>${work}</div>` : ''}
    <div style="height:14px"></div>`;

  updateBar();
}

function updateBar(){
  const bar = $('bar');
  bar.style.display = ROWS.length ? 'flex' : 'none';

  if (cur < 0) {
    $('cnt').textContent = `${ROWS.length} ta nomzod` + (SEL.size ? ` · ${SEL.size} ta tanlandi` : '');
    bar.innerHTML = `<button class="btn" id="send" ${SEL.size?'':'disabled'}>
      ${SEL.size ? SEL.size + ' ta nomzodni yuborish' : 'Nomzod tanlang'}</button>`;
    if (SEL.size) $('send').onclick = submit;
    return;
  }

  const c = ROWS[cur], on = SEL.has(c.id);
  bar.innerHTML = `
    <button class="nav" id="prev" ${cur===0?'disabled':''}>&#9664;</button>
    <span class="pg">${cur+1} / ${ROWS.length}</span>
    <button class="btn ${on?'ghost':''}" id="pick">${on?'Tanlangan':'Tanlash'}</button>
    <button class="nav" id="next" ${cur===ROWS.length-1?'disabled':''}>&#9654;</button>`;
  $('prev').onclick = ()=>openDetail(cur-1);
  $('next').onclick = ()=>openDetail(cur+1);
  $('pick').onclick = ()=>{ SEL.has(c.id) ? SEL.delete(c.id) : SEL.add(c.id); haptic('sel'); updateBar(); };
}

async function submit(){
  const b = $('send');
  b.disabled = true; b.textContent = 'Yuborilmoqda…';
  try{
    const r = await api('/api/ma/shortlist', {
      method:'POST', body: JSON.stringify({ key: KEY, ids: [...SEL] })
    });
    $('bar').style.display = 'none';
    $('sum').textContent = ''; $('cnt').textContent = '';
    show(`<b>${r.count} ta nomzod yuborildi.</b><br><br>
      HR ular bilan bog'lanadi va kontaktlarni ochib beradi.<br>
      Holatni "Kabinet" tugmasidan kuzatib boring.`);
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
    // Kabinetdan ochilgan bo'lsa — kabinetga qaytamiz (Mini App'ni yopmaymiz)
    if (FROM_CAB) setTimeout(backToCab, 2500);
    else if (TG) setTimeout(()=>TG.close(), 3000);
  }catch(e){
    b.disabled = false; b.textContent = 'Qayta urinish';
    show('Yuborilmadi: ' + esc(e.message));
  }
}

// ══════════════════════════════════════════════════════════
//  KABINET
// ══════════════════════════════════════════════════════════
async function loadMe(){
  try{
    const m = await api('/api/ma/me');
    $('cName').textContent = m.name || 'Mijoz';
    $('cCred').textContent = m.credits;
    const s = m.stats || {};
    $('cStats').innerHTML = `
      <div class="stat"><b>${s.searches||0}</b><span>qidiruv</span></div>
      <div class="stat"><b>${s.picked||0}</b><span>tanlangan</span></div>
      <div class="stat"><b>${s.revealed||0}</b><span>kontakt</span></div>
      <div class="stat"><b>${s.avgHours==null?'—':s.avgHours+'s'}</b><span>o'rtacha<br>ochilish</span></div>`;
  }catch(e){ $('cName').textContent = e.message; }
}

function itemHtml(slId, it){
  const meta = [
    it.experienceYears ? it.experienceYears + ' yil' : 'Tajribasiz',
    it.age ? it.age + ' yosh' : '',
    it.location || ''
  ].filter(Boolean).join(' · ');

  const ct = it.contact ? `
    <div class="ct">
      <div class="nm">${esc(it.contact.fullName) || 'Nomzod'}</div>
      <a href="tel:${esc(it.contact.phone)}">${esc(it.contact.phone) || '—'}</a>
      ${it.contact.email ? `<div class="em">${esc(it.contact.email)}</div>` : ''}
      <button class="rzb" data-rz="${esc(it.candidateId)}">Rezyumeni ochish</button>
    </div>` : '';

  const rz = it.reason ? `<div class="rz">Sabab: ${esc(it.reason)}</div>` : '';

  const iv = it.interviewAt
    ? `<div class="iv">Suhbat: ${new Date(it.interviewAt).toLocaleString('uz-UZ',
        { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })}</div>` : '';

  // Qaror tugmalari faqat kontakt ochilgandan keyin. Oldin ularning
  // ma'nosi yo'q — raqam hali sizda emas.
  const act = it.canAct ? `<div class="acts" id="a-${esc(it.candidateId)}">
      ${it.interviewAt ? '' : `<button class="ab" data-iv="${esc(it.candidateId)}" data-sl="${esc(slId)}">Suhbatga chaqirdim</button>`}
      <button class="ab ok" data-hire="${esc(it.candidateId)}" data-sl="${esc(slId)}">Ishga oldim</button>
      <button class="ab no" data-nf="${esc(it.candidateId)}" data-sl="${esc(slId)}">Mos kelmadi</button>
    </div>` : '';

  return `<div class="it">
    <div class="av">${it.hasPhoto
      ? `<img src="/api/ma/photo-sl/${encodeURIComponent(slId)}/${encodeURIComponent(it.candidateId)}?i=${encodeURIComponent(INIT)}" alt="">`
      : esc(initialsOf(it.publicCode))}</div>
    <div class="bd">
      <div class="p">${esc(it.desiredPosition || 'Nomzod')}</div>
      <div class="m">${esc(it.publicCode)}${meta ? ' · ' + esc(meta) : ''}</div>
      <span class="st ${it.state}">${esc(it.stateLabel)}</span>
      ${rz}${iv}${ct}${act}
    </div>
  </div>`;
}

async function loadShortlists(){
  try{
    const rows = await api('/api/ma/shortlists');
    if (!rows.length) {
      $('slList').innerHTML = `<div class="msg">Hali tanlov yo'q.<br><br>
        Botga "xostes kerak" deb yozing — mos nomzodlarni ko'rsataman.</div>`;
      return;
    }
    $('slList').innerHTML = rows.map(s => `<div class="sl">
      <div class="sl-h">
        <div class="q">${esc(s.summary)}</div>
        <div class="d">${dt(s.createdAt)} · ${s.items.length} ta nomzod</div>
      </div>
      ${s.items.map(it => itemHtml(s.id, it)).join('')}
    </div>`).join('');
    wireActions();
  }catch(e){ $('slList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}

const NOT_FIT = [
  ['experience','Tajriba yetarli emas'], ['language','Til darajasi'],
  ['no_show','Suhbatga kelmadi'], ['salary_ask','Maosh talabi yuqori'], ['other','Boshqa']
];

async function decide(slId, candId, body){
  await api(`/api/ma/shortlists/${encodeURIComponent(slId)}/items/${encodeURIComponent(candId)}`,
    { method:'POST', body: JSON.stringify(body) });
  try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
  loadShortlists(); loadMe();
}

function wireActions(){
  // Rezyume — kontakt ochilgan nomzodlarda
  document.querySelectorAll('[data-rz]').forEach(b => b.onclick = () => showResume(b.dataset.rz));

  // Suhbat sanasi
  document.querySelectorAll('[data-iv]').forEach(b => b.onclick = () => {
    const id = b.dataset.iv, sl = b.dataset.sl;
    const box = $('a-' + id);
    box.innerHTML = `<div class="ivbox">
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">Suhbat qachon?</div>
      <input type="datetime-local" id="iv-${id}">
      <div class="acts"><button class="ab ok" id="ivok-${id}">Saqlash</button>
        <button class="ab" id="ivno-${id}">Bekor</button></div></div>`;
    $('ivok-' + id).onclick = async () => {
      const v = $('iv-' + id).value;
      if (!v) return;
      $('ivok-' + id).disabled = true;
      try { await decide(sl, id, { state:'interview', interviewAt: new Date(v).toISOString() }); }
      catch(e){ alert(e.message); $('ivok-' + id).disabled = false; }
    };
    $('ivno-' + id).onclick = loadShortlists;
  });

  // Ishga oldim — butun tizimning yakuniy ko'rsatkichi
  document.querySelectorAll('[data-hire]').forEach(b => b.onclick = async () => {
    if (!confirm('Bu nomzodni ishga oldingizmi?')) return;
    b.disabled = true;
    try { await decide(b.dataset.sl, b.dataset.hire, { state:'hired' }); }
    catch(e){ alert(e.message); b.disabled = false; }
  });

  // Mos kelmadi — sabab bilan, aks holda keyingi qidiruv yaxshilanmaydi
  document.querySelectorAll('[data-nf]').forEach(b => b.onclick = () => {
    const id = b.dataset.nf, sl = b.dataset.sl;
    const box = $('a-' + id);
    box.innerHTML = `<div style="width:100%">
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">Nega mos kelmadi?</div>
      <div class="acts">${NOT_FIT.map(([k, l]) =>
        `<button class="ab" data-r="${k}">${l}</button>`).join('')}
        <button class="ab" data-r="">Bekor</button></div></div>`;
    box.querySelectorAll('[data-r]').forEach(x => x.onclick = async () => {
      if (!x.dataset.r) return loadShortlists();
      x.disabled = true;
      try { await decide(sl, id, { state:'not_fit', reason: x.dataset.r }); }
      catch(e){ alert(e.message); x.disabled = false; }
    });
  });
}

function openSheet(title, html){ $('shT').textContent = title; $('shB').innerHTML = html; $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); $('shB').innerHTML = ''; }
$('shX').onclick = closeSheet;
$('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); };

const VST = { open:['open','Ochiq'], paused:['paused','To\'xtatilgan'], closed:['closed','Yopilgan'] };

async function loadVacancies(){
  try{
    const rows = await api('/api/ma/vacancies');
    if (!rows.length) {
      $('vcList').innerHTML = `<div class="msg">Vakansiya yo'q.<br><br>
        "+ Yangi vakansiya" bilan kim kerakligini yozing — nomzodlar
        o'zi ariza bera boshlaydi.</div>`;
      return;
    }
    $('vcList').innerHTML = rows.map(v => {
      const [cls, lbl] = VST[v.status] || VST.open;
      const meta = [v.salaryText, v.shift, v.schedule].filter(Boolean).join(' · ');
      return `<div class="vc">
        <div class="ti">${esc(v.title)}</div>
        ${meta ? `<div class="mt">${esc(meta)}</div>` : ''}
        ${v.headcount > 1 ? `<div class="mt">${v.headcount} ta odam kerak</div>` : ''}
        <div class="row">
          <span class="tag ${cls}">${lbl}</span>
          ${!v.listed ? '<span class="tag priv">Faqat sizga</span>' : ''}
          ${v.listed && v.stale && v.status === 'open' ? '<span class="tag stale">Tasdiqlang</span>' : ''}
          ${v.shortlists ? `<span class="tag app">${v.shortlists} tanlov</span>` : ''}
        </div>
        ${!v.listed && v.status === 'open' ? `<div class="mt">Qidiruvdan o'zi yaratilgan. Nomzodlar
          ko'rmaydi — e'lon qilsangiz, ular ariza bera boshlaydi.</div>` : ''}
        <div class="row">
          ${v.status === 'open' ? `<button class="sbtn p" data-match="${v.id}">Mos nomzodlar</button>` : ''}
          <button class="sbtn" data-apps="${v.id}">Arizalar</button>
          ${!v.listed && v.status === 'open' ? `<button class="sbtn p" data-pub="${v.id}">E'lon qilish</button>` : ''}
          ${v.listed && v.status === 'open' ? `<button class="sbtn" data-conf="${v.id}">Tasdiqlash</button>` : ''}
          <button class="sbtn" data-edit="${v.id}">Tahrirlash</button>
          ${v.status === 'open' ? `<button class="sbtn d" data-close="${v.id}">Yopish</button>` : ''}
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('[data-apps]').forEach(b => b.onclick = () => showApps(b.dataset.apps));
    document.querySelectorAll('[data-conf]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await api(`/api/ma/vacancies/${b.dataset.conf}/confirm`, { method:'POST' }); haptic(); loadVacancies(); }
      catch(e){ alert(e.message); b.disabled = false; }
    });
    // Mos nomzodlar — vakansiya mezonlari bo'yicha anonim kartalar
    document.querySelectorAll('[data-match]').forEach(b => b.onclick = async () => {
      b.disabled = true; const was = b.textContent; b.textContent = 'Qidirilmoqda…';
      try {
        const r = await api(`/api/ma/vacancies/${b.dataset.match}/matches`, { method:'POST', body:'{}' });
        if (!r.key) { alert(r.message || 'Mos nomzod topilmadi'); b.disabled = false; b.textContent = was; return; }
        haptic(); openSearch(r.key, true);
      } catch(e){ alert(e.message); b.disabled = false; b.textContent = was; }
    });
    document.querySelectorAll('[data-pub]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await api(`/api/ma/vacancies/${b.dataset.pub}`, { method:'PATCH', body: JSON.stringify({ listed:true }) }); haptic(); loadVacancies(); }
      catch(e){ alert(e.message); b.disabled = false; }
    });
    document.querySelectorAll('[data-close]').forEach(b => b.onclick = async () => {
      if (!confirm('Vakansiya yopiladi. Davom etamizmi?')) return;
      b.disabled = true;
      try { await api(`/api/ma/vacancies/${b.dataset.close}`, { method:'PATCH', body: JSON.stringify({ status:'closed' }) }); loadVacancies(); }
      catch(e){ alert(e.message); b.disabled = false; }
    });
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      vacForm(rows.find(x => x.id === b.dataset.edit));
    });
  }catch(e){ $('vcList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}

// Forma ataylab ikki qismga bo'lingan: TALAB (kimni qidiramiz) va
// TAKLIF (nima beramiz). Mijoz ikkinchisini to'ldirmasa, HR qo'ng'iroq
// qilganda nima aytishini bilmaydi.
// Lavozim — server bilan bir xil ro'yxat (src/data/roles.js), o'zgarsa
// ikkala joyda. Ilgari forma lavozim so'ramasdi: vakansiya 'boshqa'
// bo'lib qolardi va bot qidiruvi uni tanimay yoniga dublikat ochardi.
const ROLES = [['ofitsiant','Ofitsiant'],['barmen','Barmen'],['xostess','Xostess'],
  ['oshpaz','Oshpaz'],['kassir','Kassir'],['menejer','Menejer'],['operator','Call operator']];
const SHIFT_T = { kunduzgi:'kunduzgi smena', kechki:'kechki smena', ikkalasi:'kunduzgi/kechki smena' };
// Server shabloni bilan bir xil sarlavha (vacancyAuto.makeTitle)
const autoTitle = (r, s) => {
  const l = (ROLES.find(x => x[0] === r) || [])[1];
  return l ? (SHIFT_T[s] ? l + ', ' + SHIFT_T[s] : l) : '';
};

function vacForm(v){
  const d = v || {};
  const roleOpts = `<option value="">— tanlang —</option>` + ROLES.map(([k, l]) =>
    `<option value="${k}" ${d.role === k ? 'selected' : ''}>${l}</option>`).join('');
  openSheet(v ? 'Tahrirlash' : 'Yangi vakansiya', `
    <div class="fl"><label>Lavozim *</label>
      <select id="fRo">${roleOpts}</select></div>
    <div class="fl"><label>Sarlavha *</label>
      <input id="fTi" value="${esc(d.title)}" placeholder="Ofitsiant, kechki smena"></div>

    <div style="font-size:12px;color:var(--muted);text-transform:uppercase;
      letter-spacing:.5px;font-weight:600;margin:16px 0 0">Talab</div>
    <div class="two">
      <div class="fl"><label>Tajriba (yil)</label><input id="fEx" inputmode="numeric" value="${d.minExp ?? ''}"></div>
      <div class="fl"><label>Nechta odam</label><input id="fHc" inputmode="numeric" value="${d.headcount || 1}"></div>
    </div>
    <div class="fl"><label>Smena</label>
      <select id="fSh">
        <option value=""           ${!d.shift ? 'selected' : ''}>Farqi yo'q</option>
        <option value="kunduzgi"   ${d.shift === 'kunduzgi' ? 'selected' : ''}>Kunduzgi</option>
        <option value="kechki"     ${d.shift === 'kechki' ? 'selected' : ''}>Kechki</option>
        <option value="ikkalasi"   ${d.shift === 'ikkalasi' ? 'selected' : ''}>Ikkalasi</option>
      </select></div>

    <div style="font-size:12px;color:var(--muted);text-transform:uppercase;
      letter-spacing:.5px;font-weight:600;margin:16px 0 0">Taklif</div>
    <div class="two">
      <div class="fl"><label>Maosh (dan)</label><input id="fSf" inputmode="numeric" value="${d.salaryFrom ?? ''}" placeholder="4000000"></div>
      <div class="fl"><label>Maosh (gacha)</label><input id="fSt" inputmode="numeric" value="${d.salaryTo ?? ''}" placeholder="5000000"></div>
    </div>
    <div class="fl"><label>Grafik</label><input id="fSc" value="${esc(d.schedule)}" placeholder="6/1, 16:00-24:00"></div>
    <div class="fl"><label>Qo'shimcha shartlar</label>
      <textarea id="fCo" placeholder="Ovqat, forma, yo'l kira">${esc(d.conditions)}</textarea>
      <div class="hint">Nomzod birinchi shuni o'qiydi. Aniq yozsangiz
        rozi bo'lish ehtimoli oshadi.</div></div>

    <button class="btn" id="fSave" style="width:100%;margin-top:16px">Saqlash</button>`);

  // Sarlavha lavozim va smenadan o'zi yoziladi — mijoz o'zi yozguncha
  let autoT = !d.title || d.title === autoTitle(d.role, d.shift);
  const syncT = () => { if (autoT) $('fTi').value = autoTitle($('fRo').value, $('fSh').value); };
  $('fTi').oninput = () => { autoT = false; };
  $('fRo').onchange = syncT;
  $('fSh').onchange = syncT;

  $('fSave').onclick = async () => {
    const role = $('fRo').value;
    if (!role) return alert('Lavozimni tanlang');
    const title = $('fTi').value.trim() || autoTitle(role, $('fSh').value);
    const body = {
      role, title, minExp: $('fEx').value, headcount: $('fHc').value, shift: $('fSh').value,
      salaryFrom: $('fSf').value, salaryTo: $('fSt').value,
      schedule: $('fSc').value.trim(), conditions: $('fCo').value.trim()
    };
    $('fSave').disabled = true; $('fSave').textContent = 'Saqlanmoqda…';
    try {
      if (v) await api('/api/ma/vacancies/' + v.id, { method:'PATCH', body: JSON.stringify(body) });
      else   await api('/api/ma/vacancies', { method:'POST', body: JSON.stringify(body) });
      closeSheet(); loadVacancies();
    } catch(e){ alert(e.message); $('fSave').disabled = false; $('fSave').textContent = 'Qayta urinish'; }
  };
}
$('bNewV').onclick = () => vacForm(null);

      <div class="mt">${esc(meta)}</div>

            <button class="sbtn p" data-pick="${it.id}">Tanlash</button>
            <button class="sbtn d" data-rej="${it.id}">Rad etish</button>
          </div>`}

    b.disabled = true;
    try { await api(`/api/ma/applications/${b.dataset.rej}/reject`, { method:'POST', body: JSON.stringify({}) });
      showApps(id); }
    catch(e){ alert(e.message); b.disabled = false; }
  });
}


// ══════════════════════════════════════════════════════════
//  SUHBATLAR
// ══════════════════════════════════════════════════════════
// Tepada qadalgan "TalentHub" galochka bilan, ostida kontakt ochilgan
// nomzodlar. Suhbatni mijoz o'zi boshlay olmaydi — u kontakt ochilganda
// serverda avtomatik ochiladi.

const VF = '<svg class="ch-vf" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">'
  + '<circle cx="12" cy="12" r="11" fill="#2563EB"/>'
  + '<path d="M10.8 16.2l-3.4-3.4 1.3-1.3 2.1 2.1 5-5 1.3 1.3z" fill="#fff"/></svg>';

let CHATS = [], CUR = null;

function tmOf(s){
  if (!s) return '';
  const d = new Date(s), n = new Date();
  const sameDay = d.toDateString() === n.toDateString();
  return sameDay
    ? d.toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' })
    : d.toLocaleDateString('uz-UZ', { day:'2-digit', month:'short' });
}

async function loadChats(){
  const box = $('chatList');
  try {
    CHATS = await api('/api/ma/chats');
    drawChats();
  } catch(e){
    box.innerHTML = '<div class="ch-empty">' + esc(e.message) + '</div>';
  }
}

function drawChats(){
  const box = $('chatList');
  setDot(CHATS.reduce((s, c) => s + (c.unread || 0), 0));
  if (!CHATS.length){ box.innerHTML = '<div class="ch-empty">Hali suhbat yo\'q</div>'; return; }
  box.innerHTML = CHATS.map((c, i) => {
    const ag = !!c.pinned;
    const nm = c.title || '—';
    return '<div class="ch-row" data-i="' + i + '">'
      + '<div class="ch-av' + (ag ? ' ag' : '') + '">' + (ag ? '&#9733;' : avatarHtml(c)) + '</div>'
      + '<div class="ch-mid"><div class="ch-top"><span class="ch-name">' + esc(nm) + '</span>'
      + (ag ? VF + '<span class="ch-pin">&#128204;</span>' : '') + '</div>'
      + '<div class="ch-last">' + esc(c.subtitle || c.lastMsgText || '') + '</div></div>'
      + '<div class="ch-right"><span class="ch-time">' + (c.lastMsgFrom ? tmOf(c.lastMsgAt) : '') + '</span>'
      + (c.unread ? '<span class="ch-badge">' + c.unread + '</span>' : '') + '</div></div>';
  }).join('');
  box.querySelectorAll('.ch-row').forEach(el => {
    el.onclick = () => openChat(CHATS[+el.dataset.i]);
  });
}

// Kontakt ochilgan nomzod — fotosi (bo'lsa), aks holda bosh harflar
const candPhoto = id => '/api/ma/candidates/' + encodeURIComponent(id) + '/photo?i=' + encodeURIComponent(INIT);
function avatarHtml(c){
  return c.open && c.hasPhoto
    ? '<img src="' + candPhoto(c.candidateId) + '" alt="">'
    : esc(initialsOf(c.title));
}

async function openChat(c){
  CUR = c;
  const ag = !!c.pinned;
  $('cvName').textContent = c.title || '—';
  $('cvVf').innerHTML = ag ? VF : '';
  // Nomzod suhbatida ostki qator — lavozimi (oxirgi xabar emas): sarlavha
  // "kim bilan gaplashyapman" ga javob beradi
  $('cvSub').textContent = ag ? 'Agentlik' : (c.position || c.subtitle || '');
  $('cvAv').innerHTML = ag ? '&#9733;' : avatarHtml(c);
  $('cvAv').className = 'ch-av' + (ag ? ' ag' : '');
  // Sarlavhani bosish — rezyume (faqat kontakt ochiq bo'lsa)
  const tap = !ag && c.open && c.candidateId;
  $('cvWho').classList.toggle('tap', !!tap);
  $('cvWho').onclick = tap ? () => showResume(c.candidateId) : null;
  $('cvBody').innerHTML = '<div class="ch-empty">Yuklanmoqda…</div>';
  $('cv').classList.remove('hide');
  await reloadMsgs();
  c.unread = 0;
  drawChats();
}

async function reloadMsgs(){
  if (!CUR) return;
  try {
    const d = await api('/api/ma/chats/' + encodeURIComponent(CUR.id) + '/messages');
    drawMsgs(d.messages || []);
  } catch(e){
    $('cvBody').innerHTML = '<div class="ch-empty">' + esc(e.message) + '</div>';
  }
}

function drawMsgs(ms){
  const b = $('cvBody');
  if (!ms.length){ b.innerHTML = '<div class="ch-empty">Hali xabar yo\'q</div>'; return; }
  b.innerHTML = ms.map(m => {
    // Tizim xabari ALOHIDA ko'rinadi — uni odamning gapi bilan
    // adashtirish yozishmani dalil sifatida ishlatishni buzadi.
    if (m.kind === 'system') return '<div class="cmsg sys">' + esc(m.text) + '</div>';
    const me = m.from === 'client';
    return '<div class="cmsg ' + (me ? 'me' : 'them') + '">' + esc(m.text)
      + '<div class="cmsg-t">' + tmOf(m.createdAt) + '</div></div>';
  }).join('');
  b.scrollTop = b.scrollHeight;
}

async function sendMsg(){
  const inp = $('cvIn'), t = inp.value.trim();
  if (!t || !CUR) return;
  $('cvSend').disabled = true;
  try {
    await api('/api/ma/chats/' + encodeURIComponent(CUR.id) + '/messages',
      { method:'POST', body: JSON.stringify({ text: t }) });
    inp.value = '';
    await reloadMsgs();
    loadChats();
  } catch(e){
    // Xatoni ko'rinadigan qilamiz: jim yutilsa odam qayta-qayta bosadi
    $('cvBody').insertAdjacentHTML('beforeend',
      '<div class="cmsg sys">Yuborilmadi: ' + esc(e.message) + '</div>');
    $('cvBody').scrollTop = $('cvBody').scrollHeight;
  }
  $('cvSend').disabled = false;
}

// ── Rezyume ──
// Faqat kontakt ochilgan nomzod: server tekshiradi (contactView), bu
// yerda shunchaki ko'rsatamiz. Asl PDF emas — nomzodning o'z profili:
// u tahrirlasa mijoz yangisini ko'radi.
const SHIFT_L = { kunduzgi:'Kunduzgi', kechki:'Kechki', ikkalasi:'Kunduzgi va kechki' };
const SAN_L = { yes:'Bor', no:"Yo'q", expired:"Muddati o'tgan" };

async function showResume(id){
  openSheet('Rezyume', '<div class="msg">Yuklanmoqda…</div>');
  let r;
  try { r = await api('/api/ma/candidates/' + encodeURIComponent(id)); }
  catch(e){ $('shB').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; return; }

  $('shT').textContent = r.fullName || 'Rezyume';
  const meta = [r.age ? r.age + ' yosh' : '', r.location || '',
    r.experienceYears ? r.experienceYears + ' yil tajriba' : 'Tajribasiz'].filter(Boolean).join(' · ');
  const kv = (k, v) => v ? '<div class="rs-kv"><span class="k">' + k + '</span><span class="v">' + esc(v) + '</span></div>' : '';
  const info = [
    kv('Smena', SHIFT_L[r.shift] || r.shift),
    kv('Kutilgan maosh', r.salaryExpectation),
    kv("Ta'lim", r.education),
    kv('Tillar', (r.languages || []).join(', ')),
    kv('Sanitar kitobcha', SAN_L[r.sanitaryBook])
  ].join('');
  const work = (r.workHistory || []).map(w =>
    '<div class="rs-w"><b>' + esc(w.position || 'Lavozim') + '</b>'
    + '<div class="m">' + esc([w.company, w.period].filter(Boolean).join(' · ')) + '</div>'
    + (w.description ? '<div class="d">' + esc(w.description) + '</div>' : '') + '</div>').join('');
  const about = r.experienceSummary || r.summary || '';

  $('shB').innerHTML =
    '<div class="rs-hd"><div class="rs-ph">'
    + (r.hasPhoto ? '<img src="' + candPhoto(r.id) + '" alt="">' : esc(initialsOf(r.fullName)))
    + '</div><div style="min-width:0"><div class="rs-nm">' + esc(r.fullName || 'Nomzod') + '</div>'
    + (r.desiredPosition ? '<div class="rs-po">' + esc(r.desiredPosition) + '</div>' : '')
    + '<div class="rs-mt">' + esc(meta) + '</div></div></div>'
    + '<div class="rs-ct">'
    + (r.phone ? '<a href="tel:' + esc(r.phone) + '">&#128222; ' + esc(r.phone) + '</a>' : '<span>Telefon yo\'q</span>')
    + (r.email ? '<span>&#9993;&#65039; ' + esc(r.email) + '</span>' : '') + '</div>'
    + (about ? '<div class="rs-sec">O\'zi haqida</div><div class="rs-tx">' + esc(about) + '</div>' : '')
    + (work ? '<div class="rs-sec">Ish tajribasi</div>' + work : '')
    + (info ? '<div class="rs-sec">Ma\'lumotlar</div>' + info : '')
    + ((r.skills || []).length ? '<div class="rs-sec">Ko\'nikmalar</div><div class="rs-chips">'
      + r.skills.map(s => '<span>' + esc(s) + '</span>').join('') + '</div>' : '');
}

// ── Qizil nuqta: o'qilmagan xabarlar ──
// Kirganda, suhbatdan chiqqanda va ilovaga qaytganda yangilanadi.
// Suhbatlar ro'yxati ochiq bo'lsa — qo'shimcha so'rovsiz, ro'yxatdan.
function setDot(n){ const d = $('dMS'); if (d) d.classList.toggle('on', n > 0); }
function refreshUnread(){
  if (!INIT || $('cabMode').classList.contains('hide')) return;
  api('/api/ma/unread').then(d => setDot(d.chats)).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshUnread(); });

$('cvBack').onclick = () => { $('cv').classList.add('hide'); CUR = null; refreshUnread(); };
$('cvSend').onclick = sendMsg;
$('cvIn').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
// ── Tablar ──
const TABS = [['tSL','vSL'], ['tVC','vVC'], ['tCR','vCR'], ['tMS','vMS']];
function pickTab(id){
  TABS.forEach(([t,v]) => {
    $(t).classList.toggle('on', t === id);
    $(v).classList.toggle('hide', t !== id);
  });
  haptic('sel');
  if (id === 'tCR') loadCredits();
  if (id === 'tSL') loadShortlists();
  if (id === 'tVC') loadVacancies();
  if (id === 'tMS') loadChats();
  moveLens();
}
TABS.forEach(([t]) => { $(t).onclick = () => pickTab(t); });

// ── Linza: faol tab ostiga prujina bilan suriladi ──
// Birinchi joylashuv animatsiyasiz — aks holda ochilganda chapdan uchib keladi.
// Panel yashirin bo'lsa (qidiruv rejimi) o'lchami 0 — kutamiz.
function moveLens(){
  const lens = $('lens'), on = document.querySelector('.tabs .tb.on');
  if (!lens || !on || !on.offsetWidth) return;
  const first = !lens.classList.contains('on');
  if (first) lens.style.transition = 'none';
  lens.style.width = on.offsetWidth + 'px';
  lens.style.transform = 'translateX(' + on.offsetLeft + 'px) scale(1.04,1.16)';
  if (first) { void lens.offsetWidth; lens.style.transition = ''; lens.classList.add('on'); }
}
window.addEventListener('resize', moveLens);

// ── Linzani barmoq bilan surish (iOS Telegram/Instagram kabi) ──
// Barmoq panelda 6px dan ko'p yursa — surish rejimi: linza barmoq ortidan
// yuradi va kattalashadi, ostidagi bo'lim belgilanadi, qo'yib yuborilganda
// o'sha bo'lim ochiladi va linza prujina bilan joyiga o'tiradi.
// Kichik harakat — oddiy bosish (click) bo'lib qoladi.
(function(){
  const nav = document.querySelector('.tabs'), lens = $('lens');
  if (!nav || !lens) return;
  const btns = [...nav.querySelectorAll('.tb')];
  const tick = () => { try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch(e){} };
  let sx = null, pid = null, drag = false, hov = null, quiet = 0;

  // Barmoq ostidagi bo'lim; panel chetidan chiqsa — eng chetdagisi
  const under = x => {
    const first = btns[0].getBoundingClientRect(), last = btns[btns.length - 1].getBoundingClientRect();
    if (x < first.left) return btns[0];
    if (x >= last.right) return btns[btns.length - 1];
    return btns.find(b => { const r = b.getBoundingClientRect(); return x >= r.left && x < r.right; }) || null;
  };

  nav.addEventListener('pointerdown', e => { sx = e.clientX; pid = e.pointerId; drag = false; });

  nav.addEventListener('pointermove', e => {
    if (sx == null || e.pointerId !== pid) return;
    if (!drag) {
      if (Math.abs(e.clientX - sx) < 6) return;
      drag = true;
      try { nav.setPointerCapture(pid); } catch(err){}
      lens.style.transition = 'width .2s, opacity .2s';      // barmoqqa darhol ergashsin
      lens.classList.add('drag', 'on');
    }
    const nr = nav.getBoundingClientRect(), w = lens.offsetWidth;
    const x = Math.max(5, Math.min(nr.width - 5 - w, e.clientX - nr.left - w / 2));
    lens.style.transform = 'translateX(' + x + 'px) scale(1.1,1.3)';
    const b = under(e.clientX);
    if (b && b !== hov) {
      if (hov) hov.classList.remove('hov');
      hov = b; b.classList.add('hov'); tick();
    }
  });

  const end = e => {
    if (sx == null || (e && e.pointerId !== pid)) return;
    const was = drag;
    sx = null; drag = false;
    if (!was) return;                                       // oddiy bosish — click o'zi ishlaydi
    lens.classList.remove('drag');
    lens.style.transition = '';                             // joyiga prujina bilan
    quiet = Date.now() + 350;                               // surishdan keyingi click bo'limni qayta almashtirmasin
    const target = hov;
    if (hov) { hov.classList.remove('hov'); hov = null; }
    if (target) pickTab(target.id); else moveLens();
  };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', end);

  // iOS: linzani surayotganda butun Mini App qimirlab ketardi. Ikki sabab:
  //  1) Telegram'ning "pastga surib yig'ish" imo-ishorasi — barmoq ozgina
  //     pastga og'sa ham ishga tushadi. Barmoq panelda turganda o'chiramiz,
  //     qo'yilganda qaytaramiz: boshqa joyda odatdagidek yopiladi.
  //  2) WebView touch-action'ni to'liq hurmat qilmaydi — sahifa "rezinadek"
  //     cho'ziladi. Panelda boshlangan harakatda aylantirishni to'xtatamiz
  //     (pointer hodisalari va oddiy bosish bunga tegmaydi).
  const swipes = on => { try {
    if (!TG || !TG.isVersionAtLeast || !TG.isVersionAtLeast('7.7')) return;
    on ? TG.enableVerticalSwipes() : TG.disableVerticalSwipes();
  } catch(e){} };
  const restore = () => setTimeout(() => swipes(true), 60);
  nav.addEventListener('touchstart', () => swipes(false), { passive: true });
  nav.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  nav.addEventListener('touchend', restore);
  nav.addEventListener('touchcancel', restore);
  nav.addEventListener('click', e => {
    if (Date.now() < quiet) { e.stopPropagation(); e.preventDefault(); }
  }, true);
})();

// Telegram push tugmasi miniapp.html#chat ga olib keladi — Aloqa tabini ochamiz.
// Element tekshiriladi: INIT bo'lmasa sahifa body'ni almashtiradi va
// tablar yo'qoladi — shunda pickTab null ustida yiqilardi.
if (location.hash === '#chat') setTimeout(() => { if ($('tMS')) pickTab('tMS'); }, 0);

// ── Qidiruv natijasini ochish ──
// Ikki joydan: botdagi "Ko'rish" (?s=) va kabinetdagi "Mos nomzodlar".
async function openSearch(key, fromCab){
  KEY = key; FROM_CAB = !!fromCab;
  SEL.clear(); SEEN.clear(); ROWS = []; cur = -1;
  // openDetail/renderList style.display bilan almashtiradi — xuddi shunday qaytaramiz
  $('detail').innerHTML = ''; $('detail').style.display = 'none';
  $('listView').style.display = 'block';
  $('bar').style.display = 'none';
  $('cnt').textContent = '';
  $('sum').textContent = 'Yuklanmoqda…';
  $('list').innerHTML = '';
  $('bBackCab').classList.toggle('hide', !FROM_CAB);
  $('cabMode').classList.add('hide');
  $('searchMode').classList.remove('hide');
  window.scrollTo(0, 0);
  try{
    const d = await api('/api/ma/session/' + encodeURIComponent(KEY), { method:'POST', body:'{}' });
    ROWS = d.candidates || [];
    $('sum').textContent = d.summary || '';
    if (!ROWS.length) { show('Nomzod topilmadi.'); return; }
    renderList();
  }catch(e){ show(esc(e.message)); }
}

function backToCab(){
  $('searchMode').classList.add('hide');
  $('bar').style.display = 'none';
  $('cabMode').classList.remove('hide');
  FROM_CAB = false;
  pickTab('tVC');
  refreshUnread();
}
$('bBackCab').onclick = backToCab;

// ══════════════════════════════════════════════════════════
(async function(){
  if (!INIT) {
    document.body.innerHTML = '<div class="msg">Bu sahifa Telegram ichida ochilishi kerak.</div>';
    return;
  }

  // Kalit bor -> qidiruv natijasi; yo'q -> kabinet (menyu tugmasi)
  if (KEY) { openSearch(KEY, false); return; }

  $('cabMode').classList.remove('hide');
  moveLens();
  loadMe();
  loadShortlists();
  refreshUnread();
})();
</script>
