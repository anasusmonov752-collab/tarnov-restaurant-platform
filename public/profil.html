<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mening profilim</title>
<link rel="stylesheet" href="/css/th.css?v=2">  <!-- dizayn tizimi: ranglar, kunduz/tun -->
<script src="/js/uz-date.js"></script>  <!-- o'zbekcha sana: brauzerda uz formati bo'lmasa -->
<script src="/js/th-i18n.js?v=22"></script>  <!-- uz/ru lug'at (cb.*), server bilan bitta -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/js/th-viewer.js?v=2" defer></script>  <!-- rasmni to'liq ko'rish -->
<style>
/* Ranglar — dizayn tizimidan (css/th.css); kunduz/tun Telegram'dan (applyTheme).
   Brend (ko'k) ikkala rejimda o'zimizniki — Telegram ranglari olinmaydi. */
:root{
  --bg:var(--th-bg); --card:var(--th-surface); --ink:var(--th-ink); --ink-2:var(--th-ink-2); --muted:var(--th-muted);
  --line:var(--th-line); --blue:var(--th-brand); --blue-d:var(--th-brand-2);
  --ok:var(--th-ok); --warn:var(--th-warn); --danger:var(--th-danger);
  --soft-blue:#E8EFFA; --sel:#F2F7FF;
}
:root[data-theme="dark"]{ --soft-blue:rgba(10,132,255,.18); --sel:rgba(10,132,255,.16); }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}   /* suzuvchi panel ostida qolmasin */

/* Oq va havodor. Oldin to'q ko'k gradient edi - u e'tiborni fotodan
   va ismdan tortib olardi va mobilda og'ir ko'rinardi. Ko'k endi faqat
   tugma va havolalarda: urg'u kamaygani sari kuchayadi. */
.hero{background:var(--card);border-radius:16px;padding:24px 18px 20px;text-align:center;
  margin-bottom:14px}
.hero .av{width:84px;height:84px;border-radius:50%;margin:0 auto;overflow:hidden;
  background:#E8F0FD;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:600;color:var(--blue)}
.hero .av img{width:100%;height:100%;object-fit:cover}
.hero .nm{font-size:23px;font-weight:600;line-height:1.25;margin-top:14px}
.hero .sb{font-size:14.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:7px;margin-top:16px;border:none;
  font-family:inherit;font-size:14px;font-weight:600;padding:9px 18px;border-radius:22px;cursor:pointer}
.pill.look{background:rgba(46,158,91,.12);color:var(--ok)}
.pill.think{background:rgba(180,128,46,.14);color:var(--warn)}
.pill.off{background:rgba(100,116,139,.13);color:var(--muted)}

.wrap{padding:14px}
.h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin:0 0 8px 3px}
.card{background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden}
.pad{padding:14px}

.prog{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0 12px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .3s}
.need{font-size:13px;color:var(--muted);line-height:1.5}
/* Yetishmagan maydon - bosiladigan. Ro'yxat o'qish emas, to'ldirish
   oqimi bo'lsin: bosilganda o'sha bo'lim ochiladi. */
.gaps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.gap{font-size:13px;padding:7px 13px;border-radius:9px;background:var(--sel);color:var(--blue);
  border:1px solid #D8E6FF;cursor:pointer;font-family:inherit;font-weight:600}
.gap:active{background:#E4EFFF}

.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border-radius:13px;padding:13px 10px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:700;line-height:1;color:var(--blue)}
.stat span{font-size:11.5px;color:var(--muted);display:block;margin-top:5px;line-height:1.3}

.opt{display:flex;align-items:center;width:100%;padding:16px 2px;border:none;
  background:transparent;border-bottom:1px solid var(--line);font-family:inherit;
  font-size:16px;color:var(--ink);cursor:pointer;text-align:left}
.opt:last-of-type{border-bottom:none}
.opt span{flex:1}
.opt b{color:var(--blue);font-size:17px}
.opt.on span{color:var(--blue);font-weight:600}

.sec-h{display:flex;align-items:center;padding:13px 14px 0}
.sec-h b{flex:1;font-size:15.5px;font-weight:600}
.ed{border:none;background:transparent;color:var(--blue);font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;padding:0}
.kv{display:flex;gap:12px;padding:10px 14px;font-size:14.5px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex:none;min-width:116px}
.kv .v{flex:1;text-align:right;word-break:break-word}
.kv .v.em{color:var(--muted)}


.w{padding:12px 14px;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:none}
.w b{font-size:14.5px;font-weight:600;display:block}
.w span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px}
.chip{font-size:13px;padding:6px 12px;border-radius:9px;background:var(--bg)}
.chip.more{border:none;font-family:inherit;color:var(--blue);font-weight:600;
  cursor:pointer;background:var(--sel)}

/* z-index suhbat oynasidan (.cv 60) yuqori — kompaniya kartasi suhbat ustida ochiladi */
.sheet{position:fixed;inset:0;background:rgba(8,20,38,.45);display:none;align-items:flex-end;z-index:70}
.sheet.on{display:flex}
.sh{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0}
.sh-h{position:sticky;top:0;background:var(--card);display:flex;align-items:center;
  padding:16px;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0}
.sh-h b{flex:1;font-size:16.5px}
.sh-x{border:none;background:transparent;font-size:19px;color:var(--muted);cursor:pointer}
.sh-b{padding:4px 16px 16px}
.f{padding:12px 0;border-bottom:1px solid var(--line)}
.f:last-of-type{border-bottom:none}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:none;background:transparent;font-family:inherit;
  font-size:16px;color:var(--ink);padding:0}
.f input:focus,.f textarea:focus,.f select:focus{outline:none}
.f textarea{resize:vertical;line-height:1.55;min-height:84px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--blue);
  color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.5}
.msg{text-align:center;padding:60px 24px;color:var(--muted);font-size:14.5px;line-height:1.6}
.hide{display:none !important}

/* ── Ish o'rinlari va arizalar ── */
.jb{background:var(--card);border-radius:14px;padding:14px;margin-bottom:11px}
.jb .ti{font-size:16px;font-weight:600;line-height:1.3}
.jb .pl{font-size:13.5px;color:var(--muted);margin-top:3px}
.jb .sl{font-size:15px;font-weight:600;color:var(--ok);margin-top:7px}
.jb .ln{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.55}
.jb .row{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap}
.tg2{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px}
.tg2.fit{background:rgba(46,158,91,.13);color:var(--ok)}
.tg2.fresh{background:rgba(37,99,235,.1);color:var(--blue)}
.tg2.wait{background:rgba(180,128,46,.14);color:var(--warn)}
.tg2.no{background:rgba(194,91,76,.12);color:var(--danger)}
.tg2.ok{background:rgba(46,158,91,.13);color:var(--ok)}
.ab{flex:1;padding:11px;border:none;border-radius:10px;background:var(--blue);
  color:#fff;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer}
.ab:disabled{background:var(--bg);color:var(--muted)}
.jb.tap{cursor:pointer}
.jb .more{font-size:12.5px;color:var(--blue);margin-top:8px;font-weight:600}

/* ── Vakansiya sahifasi va kompaniya kartasi (pastki oynada) ── */
.vd-ti{font-size:19px;font-weight:700;line-height:1.3;padding-top:6px}
.vd-pl{font-size:14px;color:var(--muted);margin-top:4px}
.vd-sl{font-size:18px;font-weight:700;color:var(--ok);margin-top:10px}
.vd-sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  font-weight:600;margin:18px 0 6px}
.vd-kv{display:flex;gap:12px;padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.vd-kv:last-child{border-bottom:none}
.vd-kv .k{color:var(--muted);flex:none;min-width:110px}
.vd-kv .v{flex:1;text-align:right}
.vd-chips{display:flex;flex-wrap:wrap;gap:6px}
.vd-chips span{font-size:13px;padding:5px 11px;border-radius:8px;background:var(--bg)}
.vd-tx{font-size:14.5px;line-height:1.55;white-space:pre-line}
/* Vakansiya: joy tavsifi, jalb, afzalliklar, ishonch belgisi */
.jb .vn{font-size:13.5px;color:var(--ink);margin-top:3px}
.jb .sl small,.vd-sl small{font-size:12.5px;font-weight:500;color:var(--muted)}
.jb .sl.no{color:var(--muted);font-weight:500;font-size:14px}
.jb .hk{font-size:13.5px;line-height:1.45;margin-top:8px}
.pk{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pk span{font-size:12px;padding:3px 9px;border-radius:7px;background:var(--bg);color:var(--ink)}
.vd-hk{font-size:14.5px;line-height:1.5;margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--bg)}
.vd-ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.vd-ul li{margin:2px 0}
/* Ariza oynasi: tekshiruv, xat, xato, muvaffaqiyat */
.ap-v{padding:12px 14px;border-radius:12px;background:var(--bg);margin-top:4px}
.ap-v b{font-size:15px;display:block}
.ap-v span{font-size:13px;color:var(--muted)}
.ck-l{margin-top:4px}
.ck-r{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ck-r:last-child{border-bottom:none}
.ck-r i{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700}
.ck-r i.y{background:rgba(46,158,91,.14);color:var(--ok)}
.ck-r i.n{background:rgba(194,91,76,.12);color:var(--danger)}
.ck-r i.o{background:var(--bg);color:var(--muted)}
.ck-r .v{margin-left:auto;color:var(--muted);font-size:13.5px;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-er{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(194,91,76,.1);color:var(--danger);font-size:14px;line-height:1.5}
.ap-er button{margin-top:9px;border:0;background:none;color:var(--blue);font:inherit;font-weight:600;padding:0;cursor:pointer}
.ap-ok{text-align:center;padding:18px 6px 6px}
.ap-ok .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;background:rgba(46,158,91,.14);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px}
.ap-ok h3{font-size:19px;margin-bottom:6px}
.ap-ok p{font-size:14.5px;color:var(--muted);line-height:1.55}
.nx{text-align:left;margin:16px 0 4px}
.nx div{display:flex;gap:10px;padding:8px 0;font-size:14.5px;line-height:1.45}
.nx b{width:22px;height:22px;border-radius:50%;flex:none;background:var(--blue);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.btn2{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--blue);font:inherit;font-weight:600;font-size:15px;margin-top:9px;cursor:pointer}
/* Arizalarim: bosqichlar yo'li */
.stp{margin-top:10px;padding-left:4px}
.stp div{position:relative;padding:0 0 9px 20px;font-size:13.5px;line-height:1.35}
.stp div::before{content:'';position:absolute;left:3px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.stp div::after{content:'';position:absolute;left:6px;top:13px;bottom:-1px;width:2px;background:var(--line)}
.stp div:last-child::after{display:none}
.stp div.cur{font-weight:600}
.stp div.no::before{background:var(--danger)}
.stp div.ok::before{background:var(--ok)}
.stp small{color:var(--muted);font-weight:400;margin-left:6px}
.co-hd{display:flex;gap:13px;align-items:center;padding:6px 0 4px}
.co-av{width:56px;height:56px;border-radius:14px;flex:none;background:var(--soft-blue);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.co-av{overflow:hidden}.co-av img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.co-nm{font-size:18px;font-weight:700;line-height:1.25}
.co-lc{font-size:13.5px;color:var(--muted);margin-top:3px}
.co-vc{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.cv-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.cv-who.tap{cursor:pointer}
.cv-who.tap .ch-last::after{content:' · kompaniya ›';color:var(--blue)}

/* ── Tab paneli: "suyuq shisha" ──
   Namuna — iOS Liquid Glass. Haqiqiy sinish (ortidagini egib ko'rsatish)
   veb'da mumkin emas: Safari backdrop-filter'da SVG filtrni qo'llamaydi.
   Shuning uchun taqlid: yupqa shisha + kuchli blur, yuqori chetda
   yaltirash, faol bo'limda kamalak chetli "linza" prujina bilan suriladi.
   Shisha faqat ortidan nimadir o'tganda ko'rinadi — bo'sh och fonda oq.
   Emoji EMAS — Lucide ikonkalari. Yozuv qoladi: bo'limlar universal emas.
   Blur ishlamaydigan eski WebView'da oddiy oq fon (@supports). */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:2px;padding:5px;border-radius:28px;z-index:50;isolation:isolate;
  background:rgba(255,255,255,.96);border:1px solid rgba(225,232,242,.9);
  box-shadow:0 10px 30px rgba(15,39,71,.16),0 2px 6px rgba(15,39,71,.08)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .tabs{background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.66));   /* audit: shaffofroq bo'lsa orqadagi matn ko'rinardi */
    -webkit-backdrop-filter:blur(14px) saturate(210%);backdrop-filter:blur(14px) saturate(210%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),
      inset 0 0 0 .5px rgba(15,39,71,.07),0 10px 30px rgba(15,39,71,.16),0 2px 6px rgba(15,39,71,.08)}
}
/* Yuqori yarmidagi yaltirash — shishaning "qalinligi" */
.tabs::before{content:'';position:absolute;left:2px;right:2px;top:1px;height:46%;
  border-radius:26px 26px 12px 12px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}

/* Faol bo'lim — linza. Bitta element, moveLens() uni faol tab ostiga
   suradi; tablardan biroz kattaroq (scale), namunadagidek panel chetidan
   chiqib turadi. ::after — kamalak chet (sinish chizig'i taqlidi). */
.lens{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:23px;z-index:0;
  pointer-events:none;opacity:0;
  transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1),opacity .2s;
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.9),rgba(255,255,255,.4) 55%,rgba(255,255,255,.2));
  box-shadow:inset 0 1px 1px #fff,inset 0 -3px 6px rgba(255,255,255,.45),
    0 4px 14px rgba(15,39,71,.15),0 1px 2px rgba(15,39,71,.08)}
.lens::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(100deg,rgba(255,80,160,.65),rgba(255,196,80,.5) 22%,rgba(255,255,255,.8) 46%,
    rgba(80,196,255,.65) 72%,rgba(140,96,255,.65));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.lens.on{opacity:1}
/* Surish: sahifa aylanmasin, matn belgilanmasin, uzoq bosishda menyu chiqmasin */
.tabs{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Surilayotgan linza — kattaroq va shaffofroq, "lupa" kabi */
.lens.drag{background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.7),rgba(255,255,255,.22) 60%,rgba(255,255,255,.08));
  box-shadow:inset 0 1px 1px #fff,inset 0 -4px 8px rgba(255,255,255,.5),
    0 10px 24px rgba(15,39,71,.2),0 2px 4px rgba(15,39,71,.1)}
.tb.hov{color:var(--ink)}

.tb{position:relative;z-index:1;flex:1;min-width:0;border:none;background:transparent;border-radius:21px;
  padding:7px 2px 6px;cursor:pointer;font-family:inherit;color:var(--muted);font-size:11px;
  font-weight:600;line-height:1.2;white-space:nowrap;display:flex;flex-direction:column;
  align-items:center;gap:3px;transition:color .2s;-webkit-tap-highlight-color:transparent}
.tb .ic{position:relative;display:block;width:23px;height:23px;transition:transform .3s cubic-bezier(.34,1.45,.5,1)}
.tb .ic svg{width:23px;height:23px;display:block}
.tb.on{color:var(--ink)}
.tb.on .ic{transform:scale(1.1)}
.tb.on .ic svg{stroke-width:2.3}
/* O'qilmagan xabar — qizil nuqta */
.tb .dot{position:absolute;top:-1px;right:-3px;width:10px;height:10px;border-radius:50%;
  background:#EF4444;border:2px solid var(--card);display:none}
.tb .dot.on{display:block}
/* Son bilan — Telegram/Instagram kabi: nechta o'qilmagan */
.tb .dot.n{width:auto;min-width:19px;height:19px;padding:0 5px;border-radius:10px;top:-7px;right:-13px;
  color:#fff;font-size:11px;font-weight:700;font-style:normal;line-height:15px;text-align:center}

/* ══ SUHBATLAR ══════════════════════════════════════════════
   Inbox: tepada qadalgan agentlik (galochka bilan), ostida
   kontakt ochilgan nomzodlar. */
.ch-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.ch-row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);
  border-bottom:1px solid var(--line);cursor:pointer}
.ch-row:active{background:var(--sel)}
.ch-av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:14px;background:var(--soft-blue);color:var(--blue)}
.ch-av.ag{background:var(--blue);color:#fff;font-size:17px}
.ch-av{overflow:hidden}.ch-av img{width:100%;height:100%;object-fit:cover}
.ch-av.ag svg{width:24px;height:24px}
.ch-mid{flex:1;min-width:0}
.ch-top{display:flex;align-items:center;gap:5px}
.ch-name{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-vf{flex:none;display:block}
.ch-pin{flex:none;color:var(--muted);font-size:12px}
.ch-last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.ch-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.ch-time{font-size:11.5px;color:var(--muted)}
.ch-badge{min-width:19px;height:19px;border-radius:10px;background:var(--blue);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Ochilgan suhbat */
.cv{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.cv.hide{display:none}
.cv-h{flex:none;display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:var(--card);border-bottom:1px solid var(--line)}
.cv-back{flex:none;background:transparent;border:0;font-size:19px;color:var(--blue);
  padding:4px 8px;cursor:pointer}
.cv-b{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.cv-f{flex:none;display:flex;gap:8px;padding:10px 12px;background:var(--card);
  border-top:1px solid var(--line)}
.cv-f input{flex:1;min-width:0;border:1px solid var(--line);border-radius:20px;
  padding:10px 14px;font-size:14.5px;outline:none;background:var(--bg);color:var(--ink)}
.cv-f input:focus{border-color:var(--blue)}
.cv-send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);
  color:#fff;font-size:16px;cursor:pointer}
.cv-send:disabled{opacity:.45}
.cmsg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;
  word-wrap:break-word;white-space:pre-wrap}
.cmsg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.cmsg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);
  border-bottom-left-radius:5px}
/* Tizim xabari ataylab boshqacha: uni odamning gapi bilan adashtirmaslik kerak */
.cmsg.sys{align-self:center;background:var(--soft-blue);color:var(--ink-2);font-size:12.5px;
  text-align:center;border-radius:12px;max-width:92%}
.cmsg-t{font-size:10.5px;opacity:.65;margin-top:3px;text-align:right}
/* Tungi rejim: qoramtir shisha (iOS dark material), linza xira oq — miniapp.html bilan bir xil */
:root[data-theme="dark"] .tabs{ background:rgba(28,28,30,.94); border-color:rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4); }
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root[data-theme="dark"] .tabs{ background:linear-gradient(180deg,rgba(44,44,46,.82),rgba(28,28,30,.74));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 10px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4); }
}
:root[data-theme="dark"] .tabs::before{ background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0)); }
:root[data-theme="dark"] .lens, :root[data-theme="dark"] .lens.drag{
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.22),rgba(255,255,255,.10) 60%,rgba(255,255,255,.05));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25), 0 4px 14px rgba(0,0,0,.4); }
/* Ish o'rinlari: qidiruv va filtr chiplari */
#jobBar{margin:4px 0 12px}
.js{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;height:42px}
.js svg{width:18px;height:18px;color:var(--muted);flex:none}
.js input{flex:1;min-width:0;border:0;outline:none;background:none;font-family:inherit;font-size:16px;color:var(--ink)}
.jf{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jf::-webkit-scrollbar{display:none}
.jf button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;
  font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.jf button.on{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:600}
.msg .lnk{border:0;background:none;color:var(--blue);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}

/* ══ YAGONA DIZAYN v2 (2026-10-25) — mijoz Mini App'idagi "Hisob" tili ══
   Katta sarlavhalar, gradientli profil kartasi, 18px chegarasiz kartalar,
   kapsula chiplar, to'ldirilgan tugmalar, iOS ro'yxatlari. Blok oxirida —
   oldingi qoidalar ustidan yozadi. */
.lt{padding:18px 18px 4px}
.lt h1{font-size:31px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
.wrap{padding:12px 14px}
/* Profil kartasi — gradient (Hisob balans kartasi bilan bir xil) */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 18px 20px;color:#fff;margin-bottom:12px;
  background:radial-gradient(130% 120% at 100% 0%,#2F6BFF 0%,#16357A 42%,#0B1430 100%);box-shadow:0 14px 34px rgba(11,20,48,.26)}
.hero::before{content:'';position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
.hero > *{position:relative;z-index:1}
.hero .av{width:88px;height:88px;background:rgba(255,255,255,.14);color:#fff;border:3px solid rgba(255,255,255,.35);
  box-shadow:0 8px 20px rgba(0,0,0,.25)}
.hero .nm{font-size:24px;font-weight:800;letter-spacing:-.4px;color:#fff}
.hero .sb{color:rgba(255,255,255,.72);font-size:14px}
.pill{background:rgba(255,255,255,.14) !important;color:#fff !important;border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:9px 16px}
.pill::before{content:'';width:8px;height:8px;border-radius:50%;background:#34C759;box-shadow:0 0 0 3px rgba(52,199,89,.25)}
.pill.think::before{background:#FFB020;box-shadow:0 0 0 3px rgba(255,176,32,.25)}
.pill.off::before{background:#A1A1AA;box-shadow:none}
/* Kartalar va bo'limlar */
.card,.jb,.co-vc{border-radius:18px;box-shadow:none}
.card{margin-bottom:12px}
.pad{padding:15px}
.prog{height:8px;background:var(--th-fill);border-radius:99px}
.prog i{border-radius:99px;background:linear-gradient(90deg,#2F6BFF,#5AA0FF)}
.gap{border:none;border-radius:99px;background:var(--th-brand-soft);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:18px;padding:15px 10px 13px}
.stat b{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.stat span{font-size:12px}
.sec-h{padding:15px 15px 4px}
.sec-h b{font-size:18px;font-weight:800;letter-spacing:-.2px}
.ed{background:var(--th-fill);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.kv{border-bottom:none;position:relative;padding:11px 15px}
.kv + .kv::before,.w + .w::before{content:'';position:absolute;top:0;left:15px;right:0;height:.5px;background:var(--line)}
.w{border-bottom:none;position:relative;padding:12px 15px}
.chip,.vd-chips span,.pk span{border-radius:99px}
.h3,.vd-sec{font-size:13px;font-weight:700;letter-spacing:.3px}
/* Ish o'rinlari */
.js{border-radius:14px;height:44px;background:var(--th-fill)}
:root[data-theme="dark"] .js{background:var(--card)}
.jf button{border:none;background:var(--card);font-weight:600;font-size:13.5px;padding:8px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.jf button.on{background:var(--blue);color:#fff}
.jb{padding:16px;margin-bottom:12px}
.jb .ti{font-size:17px;font-weight:800;letter-spacing:-.2px}
.jb .sl{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.tg2{border-radius:99px;font-weight:700;padding:3px 10px}
.tg2.fit{background:var(--th-ok-soft)}
.tg2.fresh{background:var(--th-brand-soft)}
.tg2.wait{background:var(--th-warn-soft)}
.tg2.no{background:var(--th-danger-soft)}
.tg2.ok{background:var(--th-ok-soft)}
.ab{border-radius:12px;padding:12px;font-weight:700}
.ab:disabled{background:var(--th-fill)}
.btn{border-radius:14px;font-weight:700}
.btn2{border:none;background:var(--th-fill);border-radius:14px;font-weight:700}
.vd-ti{font-size:22px;font-weight:800;letter-spacing:-.3px}
.vd-hk,.ap-v{border-radius:14px}
.ap-er{border-radius:14px}
.co-vc{border:none;background:var(--bg)}
.co-av{border-radius:16px}
/* Pastdan oyna */
.sheet{background:rgba(8,20,38,.42)}
.sh{border-radius:22px 22px 0 0}
.sh::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--th-line-2,#C7C7CC);margin:7px auto -2px}
.sh-h{border-bottom:none;padding:12px 16px 10px;border-radius:22px 22px 0 0}
.sh-h b{font-size:18px;font-weight:800;letter-spacing:-.2px}
.sh-x{width:30px;height:30px;border-radius:50%;background:var(--th-fill);font-size:14px;display:flex;align-items:center;justify-content:center}
.f{border-bottom:.5px solid var(--line)}
.opt{border-bottom:.5px solid var(--line)}
/* Xabarlar — guruhlangan ro'yxat */
#chatList{margin:10px 14px 0;border-radius:18px;overflow:hidden;background:var(--card)}
.ch-row{border-bottom:none;position:relative}
.ch-row + .ch-row::before{content:'';position:absolute;top:0;right:0;left:72px;height:.5px;background:var(--line)}
.ch-row:active{background:var(--th-fill)}
.ch-av{width:48px;height:48px}
.ch-name{font-size:15.5px;font-weight:700}
.cv-h{border-bottom:.5px solid var(--line)}
.cv-f{border-top:.5px solid var(--line)}
.cv-f input{border:none;background:var(--th-fill);border-radius:99px}
.cmsg{border-radius:18px}
.cmsg.them{border:none}
.msg{padding:56px 24px}
/* ── Profil kartasi rangi (c-*): 8 ta bosiq, chuqur rang; tasdiq belgisi (.vb) ── */
.hero.c-blue,.sty-c.c-blue{background:radial-gradient(130% 120% at 100% 0%,#2F6BFF 0%,#16357A 45%,#0B1430 100%)}
.hero.c-graphite,.sty-c.c-graphite{background:radial-gradient(130% 120% at 100% 0%,#6B7280 0%,#374151 45%,#111827 100%)}
.hero.c-emerald,.sty-c.c-emerald{background:radial-gradient(130% 120% at 100% 0%,#1FA67A 0%,#0B5E45 45%,#032B20 100%)}
.hero.c-teal,.sty-c.c-teal{background:radial-gradient(130% 120% at 100% 0%,#2BA3BF 0%,#0F5868 45%,#06262F 100%)}
.hero.c-burgundy,.sty-c.c-burgundy{background:radial-gradient(130% 120% at 100% 0%,#C2415A 0%,#7A1C30 45%,#350A13 100%)}
.hero.c-plum,.sty-c.c-plum{background:radial-gradient(130% 120% at 100% 0%,#8C6BD9 0%,#4C3391 45%,#1F133D 100%)}
.hero.c-rose,.sty-c.c-rose{background:radial-gradient(130% 120% at 100% 0%,#D98AA3 0%,#8E4561 45%,#3B1626 100%)}
.hero.c-bronze,.sty-c.c-bronze{background:radial-gradient(130% 120% at 100% 0%,#C9954F 0%,#7D5221 45%,#33210B 100%)}
.hb{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hb svg{width:16px;height:16px}
.hb:active{background:rgba(255,255,255,.2)}
.vb{width:20px;height:20px;vertical-align:-2px;margin-left:7px}
/* Rang oynasi */
.hero.mini{padding:20px 16px 18px;margin:4px 0 16px;box-shadow:none}
.hero.mini .av{width:60px;height:60px;font-size:19px}
.hero.mini .nm{font-size:18px;margin-top:10px}
.sty-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.sty-c{aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;padding:0}
.sty-c.on{box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px var(--ink)}
.sty-nm{text-align:center;font-size:14px;font-weight:700;margin-top:12px}
.sty-reset{display:block;margin:14px auto 0;border:0;background:none;color:var(--blue);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;padding:6px}
/* ── Vakansiya sahifasi (to'liq ekran) ── */
.vp{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);visibility:hidden}
.vp.on{transform:none;visibility:visible}
body.vp-lock{overflow:hidden}
.vp-h{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);transition:background .2s,box-shadow .2s}
.vp.scrolled .vp-h{background:var(--card);box-shadow:0 .5px 0 var(--line)}
.vp-ib{width:38px;height:38px;flex:none;border-radius:50%;border:none;background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vp.scrolled .vp-ib{background:var(--th-fill);box-shadow:none}
.vp-ib svg{width:20px;height:20px}
.vp-ht{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity .2s}
.vp.scrolled .vp-ht{opacity:1}
.vp-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
.vp-hero{background:var(--card);border-radius:22px;padding:20px 18px 18px;margin-bottom:12px}
.vp-badge{width:46px;height:46px;border-radius:14px;background:var(--th-brand-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.vp-badge svg{width:24px;height:24px}
.vp-hero h1{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.vp-ven{font-size:15px;color:var(--ink-2);margin-top:6px;line-height:1.4}
.vp-pl{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted);margin-top:6px}
.vp-pl svg{width:15px;height:15px;flex:none}
.vp-sal{font-size:22px;font-weight:800;color:var(--ok);margin-top:14px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.vp-sal small{font-size:14px;font-weight:600;color:var(--muted)}
.vp-sal.no{font-size:16px;font-weight:600;color:var(--muted)}
.vp-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.vp-hook{background:var(--th-brand-soft);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.5;margin-bottom:12px;color:var(--ink)}
.vp-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.vp-facts div{background:var(--card);border-radius:16px;padding:12px 14px;min-width:0}
.vp-facts span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.vp-facts b{display:block;font-size:15px;font-weight:700;margin-top:3px;line-height:1.3;word-break:break-word}
.vp-sec{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px}
.vp-sec h3{font-size:17px;font-weight:800;letter-spacing:-.2px;margin-bottom:10px}
.vp-ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.vp-ul li{display:flex;gap:10px;font-size:15px;line-height:1.45}
.vp-ul li i{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none;margin-top:8px}
.vp-ul.ck li svg{width:18px;height:18px;flex:none;color:var(--ok);margin-top:2px}
.vp-chips{display:flex;flex-wrap:wrap;gap:7px}
.vp-chips span{font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--th-fill)}
.vp-tx{font-size:15px;line-height:1.55;white-space:pre-line}
.vp-note{font-size:12.5px;color:var(--muted);line-height:1.5;text-align:center;padding:4px 14px 6px}
.vp-f{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -6px 20px rgba(15,39,71,.07)}
.vp-f .btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:15px;font-size:16.5px;box-shadow:0 8px 20px rgba(0,102,224,.22)}
.vp-f .btn svg{width:18px;height:18px}
.vp-f .btn:disabled{opacity:1;background:var(--th-ok-soft);color:var(--ok);box-shadow:none}
:root[data-theme="dark"] .vp-f{box-shadow:0 -6px 20px rgba(0,0,0,.4)}
/* Til: UZ | RU (profildagi "Til" kartasi) */
.lsw{display:flex;background:var(--th-fill);border-radius:9px;padding:2px;gap:2px}
.lsw button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;padding:5px 13px;border-radius:7px;color:var(--muted);cursor:pointer}
.lsw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
</style>
</head>

  <button class="tb"    id="tJ"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg></span><span data-t="cb.tabJ">Ish o'rinlari</span></button>

  <div class="vp-h">
    <button class="vp-ib" id="vpBack" data-tal="cb.back" aria-label="Orqaga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <b class="vp-ht" id="vpHT"></b>
    <button class="vp-ib" id="vpShare" data-tal="cb.share" aria-label="Ulashish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg></button>
  </div>
  <div class="vp-b" id="vpBody"></div>
  <div class="vp-f"><button class="btn" id="vpAp" data-t="cb.apply">Ariza berish</button></div>
</div>

<div class="sheet" id="sheet">
  <div class="sh">
    <div class="sh-h"><b id="shT">—</b><button class="sh-x" id="shX">&#10005;</button></div>
    <div class="sh-b" id="shB"></div>
  </div>
</div>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
// Kunduz/tun — Telegram sozlamasidan; sarlavha va fon rangi ham moslanadi
// (miniapp.html bilan bir xil qoida — 2026-10-22 iOS dizayni)
function applyTheme(){
  const dark = !!(TG && TG.colorScheme === 'dark');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = dark ? '#000000' : '#F2F2F7';
  try {
    if (TG && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9')) { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); }
    if (TG && TG.isVersionAtLeast && TG.isVersionAtLeast('7.10') && TG.setBottomBarColor) TG.setBottomBarColor(bg);
  } catch(e){}
}
applyTheme();
if (TG) { TG.ready(); TG.expand(); try { TG.onEvent('themeChanged', applyTheme); } catch(e){} }

const INIT = (TG && TG.initData) || '';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// ── Til ── lug'at public/js/th-i18n.js (cb.*), server bilan bitta.
// Boshlanishida Telegram tilidan taxmin; /me javobidagi `lang` (nomzod
// tanlagani) bilan almashtiriladi. Profilda UZ | RU.
const I18N = window.THI18N;
let LANG = I18N.fromTelegram(TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.language_code);
const t = (k, v) => I18N.t(LANG, k, v);
// Ko'plik: t('cb.yrs', {n}) — rus tilida shakl n bo'yicha (lug'atda massiv)
const nl2br = s => esc(s).replace(/\n/g, '<br>');
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = t('cb.tabP');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-tph]').forEach(el => { el.placeholder = t(el.dataset.tph); });
  document.querySelectorAll('[data-tal]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.tal)); });
}
applyStatic();
// Sana: "24-oktabr" / "24 октября" (Toshkent vaqti, server appLife.fmt bilan bir xil)
const dLong = s => { const x = new Date(new Date(s).getTime() + 5 * 3600e3);
  return t('cb.dateFmt', { d: x.getUTCDate(), m: t('cb.months').split(',')[x.getUTCMonth()] }); };
const LOC = () => LANG === 'ru' ? 'ru-RU' : 'uz-UZ';
const haptic = () => { try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch(e){} };

// Rasm havolasi uchun token (X-Photo-Token) — havolaga Telegram imzosi qo'yilmaydi
let PT = '';
async function api(path, opt){
  const r = await fetch(path, Object.assign({
    headers:{ 'Content-Type':'application/json', 'X-Telegram-Init-Data': INIT }
  }, opt));
  PT = r.headers.get('X-Photo-Token') || PT;
  const d = await r.json().catch(()=>({}));
  // status va code — ariza oynasi xatoni tushunarli qilib ko'rsatadi
  if(!r.ok){ const e = new Error(d.error || t('cb.err')); e.status = r.status; e.code = d.code || ''; throw e; }
  return d;
}

let P = null;

const STATUS = ['active', 'considering', 'not_looking'];          // matn — t('cb.st.<kalit>')
// Yetishmagan maydon qaysi bo'limda tahrirlanadi
const SECTION_OF = {
  fullName:'main', phone:'main', age:'main', location:'main',
  desiredPosition:'job', shift:'job', salaryExpectation:'job',
  languages:'skill', experienceSummary:'about'
};
// Ko'nikmalar rezyumedan kelganda 15-20 tagacha chiqadi va butun
// ekranni egallaydi. Dastlab 6 tasi ko'rinadi, qolgani bir bosishda.
const SKILL_SHOW = 6;
let skillsOpen = false;

function skillsHtml(sk){
  if (!sk.length) return '';
  const vis = skillsOpen ? sk : sk.slice(0, SKILL_SHOW);
  const rest = sk.length - vis.length;
  return `<div class="chips" style="padding-top:0">
    ${vis.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}
    ${rest > 0 ? `<button class="chip more" id="skMore">${esc(t('cb.skMore', { n: rest }))}</button>` : ''}
    ${skillsOpen && sk.length > SKILL_SHOW ? `<button class="chip more" id="skLess">${esc(t('cb.skLess'))}</button>` : ''}
  </div>`;
}
// Bo'sh qiymatda "ko'rsatilmagan" so'zini har qatorda takrorlamaymiz —
// yetishmaganlar yuqorida alohida chiqadi, bu yerda tire yetarli.
const row = (k,v) => `<div class="kv"><span class="k">${k}</span><span class="v ${v?'':'em'}">${v?esc(v):'—'}</span></div>`;
const SHIFTS = ['kunduzgi', 'kechki', 'ikkalasi', 'weekend'];
const shiftLbl = k => SHIFTS.includes(k) ? t('cb.sh.' + k) : (k || '');
// Tajriba: yil bo'lsa yil; anketada yil oraliqning pastki chegarasidan ("1+ yil");
// 0 yil, lekin ish joyi bor ("6 oy – 1 yil") — o'sha muddat; "Tajribam yo'q" — Tajribasiz
function expText(p){
  const wh = p.workHistory || [], ank = p.source === 'anketa';
  if (p.experienceYears) return t(ank ? 'cb.yrsPlus' : 'cb.yrs', { n: p.experienceYears });
  if (wh.length) return wh.length === 1 && wh[0].period ? wh[0].period : t('cb.lt1y');
  if (p.experienceMonths) return t('cb.lt1y');
  if (ank && /^(Tajribasiz|Tajribam yo'q)$/.test(p.experienceSummary || '')) return t('cb.noExp');
  return '';
}
// Anketa experienceSummary'ga TIZIM yozuvini qo'yadi (birinchi ish joyi yoki
// tanlangan javob) — bu "O'zingiz haqingizda" emas, u ish tarixida ko'rinadi.
// Bunday matnni o'zi yozgandek ko'rsatmaymiz; nomzod o'zi yozsa — ko'rinadi.
function autoSummary(p){
  const s = p.experienceSummary || '';
  if (p.source !== 'anketa' || !s) return false;
  if (/^(Tajribasiz|Tajribam yo'q|1 yilgacha|1–2 yil|3–5 yil|5 yildan ortiq)$/.test(s)) return true;
  return (p.workHistory || []).some(w => w.company && s.startsWith(`${w.position} — ${w.company}`));
}

function render(p){
  P = p;
  const ini = (p.fullName || '?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  const ex = expText(p);
  const sub = [p.desiredPosition||'', ex && ex !== t('cb.noExp') ? t('cb.expSub', { x: ex }) : ''].filter(Boolean).join(' · ');
  const about = autoSummary(p) ? '' : (p.experienceSummary || '');
  const cm = p.completeness || { percent:0, missing:[] };
  const st = p.stats || { picked:0, opened:0 };
  const cur = p.jobStatus && p.jobStatus !== 'unknown' ? p.jobStatus : 'active';

  const work = (p.workHistory||[]).filter(w=>w.company||w.position).map(w=>`
    <div class="w"><b>${esc(w.position||t('cb.fPos'))}</b>
      <span>${[esc(w.company||''), esc(w.period||'')].filter(Boolean).join(' · ')}</span></div>`).join('');


  const PILL = { active:'look', considering:'think', not_looking:'off' };
  const pk = PILL[cur] ? cur : 'active';
  const [pcls, plbl] = [PILL[pk], esc(t('cb.st.' + pk))];

  $('app').innerHTML = `
  <div class="lt"><h1>${esc(t('cb.tabP'))}</h1></div>
  <div class="wrap">
    <div class="hero c-${esc(styleOf(p).color)}">
      <button class="hb" id="bStyle" aria-label="${esc(t('cb.styleT'))}">${PAL_IC}</button>
      <div class="av">${p.hasPhoto ? `<img src="/api/cand/photo?t=${encodeURIComponent(PT)}" alt="">` : esc(ini)}</div>
      <div class="nm">${esc(p.fullName) || esc(t('cb.noName'))}${p.phoneVerified ? VB_IC() : ''}</div>
      <div class="sb">${esc(sub) || esc(t('cb.fill'))}</div>
      <button class="pill ${pcls}" data-e="status">${plbl}</button>
    </div>

    ${cm.percent < 100 ? `<div class="card"><div class="pad">
      <b style="font-size:15.5px">${esc(t('cb.pct', { p: cm.percent }))}</b>
      <div class="prog"><i style="width:${cm.percent}%"></i></div>
      <div class="gaps">${cm.missing.map(k =>
        `<button class="gap" data-e="${SECTION_OF[k] || 'main'}">${esc(I18N.D.uz["cb.miss." + k] ? t("cb.miss." + k) : k)}</button>`).join('')}</div>
      <div class="need">${esc(t('cb.gapsHint'))}</div>
    </div></div>` : ''}

    ${st.picked || st.opened ? `<div class="stats">
      <div class="stat"><b>${st.picked}</b><span>${nl2br(t('cb.statPicked'))}</span></div>
      <div class="stat"><b>${st.opened}</b><span>${nl2br(t('cb.statOpened'))}</span></div>
    </div>` : `<div class="card"><div class="pad need">${esc(t('cb.statsEmpty'))}</div></div>`}

    <div class="card">
      <div class="sec-h"><b>${esc(t('cb.secMain'))}</b><button class="ed" data-e="main">${esc(t('cb.edit'))}</button></div>
      ${row(t('cb.fName'), p.fullName)}
      ${row(t('cb.fPhone'), p.phone)}
      ${row(t('cb.fAge'), p.age ? t('cb.ageVal', { n: p.age }) : '')}
      ${row(t('cb.fLoc'), p.location)}
    </div>

    <div class="card">
      <div class="sec-h"><b>${esc(t('cb.secJob'))}</b><button class="ed" data-e="job">${esc(t('cb.edit'))}</button></div>
      ${row(t('cb.fPos'), p.desiredPosition)}
      ${row(t('cb.fExp'), ex)}
      ${row(t('cb.fShift'), shiftLbl(p.shift))}
      ${row(t('cb.fSal'), p.salaryExpectation)}
    </div>

    <div class="card">
      <div class="sec-h"><b>${esc(t('cb.secSkill'))}</b><button class="ed" data-e="skill">${esc(t('cb.edit'))}</button></div>
      ${(p.languages||[]).length ? `<div class="chips">${p.languages.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>` : row(t('cb.fLangs'),'')}
      ${skillsHtml(p.skills || [])}
      ${row(t('cb.fEdu'), p.education)}
    </div>

    <div class="card">
      <div class="sec-h"><b>${esc(t('cb.secAbout'))}</b><button class="ed" data-e="about">${esc(t('cb.edit'))}</button></div>
      <div class="pad" style="padding-top:9px;font-size:14.5px;line-height:1.6;color:${about?'var(--ink)':'var(--muted)'}">
        ${about ? esc(about) : esc(t('cb.aboutEmpty'))}
      </div>
    </div>

    ${work ? `<div class="card">
      <div class="sec-h"><b>${esc(t('cb.secWork'))}</b></div>
      ${work}
      <div class="pad" style="padding-top:9px"><div class="need">${esc(t(p.source === 'anketa' ? 'cb.fromAnk' : 'cb.fromRes'))}. ${esc(t('cb.workHint'))}</div></div>
    </div>` : ''}

    <div class="card">
      <div class="sec-h"><b>${esc(t('cb.secLang'))}</b>
        <div class="lsw" id="lsw">${I18N.LANGS.map(l => `<button class="${l === LANG ? 'on' : ''}" data-l="${l}">${l.toUpperCase()}</button>`).join('')}</div></div>
      <div class="pad" style="padding-top:2px"><div class="need">${esc(t('cb.langHint'))}</div></div>
    </div>
  </div>`;
  $('lsw').querySelectorAll('[data-l]').forEach(b => b.onclick = () => setLang(b.dataset.l));

  // '.ed' (bo'lim sarlavhasi), '.gap' (yetishmagan maydon) va holat
  // chipi — hammasi data-e bilan bir xil oynani ochadi
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openSheet(b.dataset.e));
  if ($('bStyle')) $('bStyle').onclick = () => openStyle();

  const more = $('skMore'), less = $('skLess');
  if (more) more.onclick = () => { skillsOpen = true;  haptic(); render(P); };
  if (less) less.onclick = () => { skillsOpen = false; haptic(); render(P); };
}

// ── Bo'limni tahrirlash ──
// hh'dagidek: bitta ulkan forma emas, har bo'lim alohida. Telefonda
// uzun formani oxirigacha to'ldiradigan odam kam.
// Sarlavha — lug'at kaliti (oyna ochilganda o'qiladi: til almashsa ham to'g'ri)
const FORMS = {
  main: ['cb.secMain', p => `
    <div class="f"><label>${esc(t('cb.fName'))}</label><input id="fullName" value="${esc(p.fullName)}"></div>
    <div class="f"><label>${esc(t('cb.fPhone'))}</label><input id="phone" value="${esc(p.phone)}" inputmode="tel"></div>
    <div class="f"><label>${esc(t('cb.fAge'))}</label><input id="age" value="${p.age||''}" inputmode="numeric"></div>
    <div class="f"><label>${esc(t('cb.fLoc'))}</label><input id="location" value="${esc(p.location)}" placeholder="${esc(t('cb.locPh'))}"></div>`],

  job: ['cb.secJob', p => `
    <div class="f"><label>${esc(t('cb.fPosQ'))}</label><input id="desiredPosition" value="${esc(p.desiredPosition)}" placeholder="${esc(t('cb.posPh'))}"></div>
    <div class="f"><label>${esc(t('cb.fExpY'))}</label><input id="experienceYears" value="${p.experienceYears||''}" inputmode="numeric"></div>
    <div class="f"><label>${esc(t('cb.fShift'))}</label><select id="shift" class="sel">
      ${['', ...SHIFTS].map(k => `<option value="${k}" ${p.shift === k ? 'selected' : ''}>${esc(k ? shiftLbl(k) : t('cb.choose'))}</option>`).join('')}
    </select></div>
    <div class="f"><label>${esc(t('cb.fSal'))}</label><input id="salaryExpectation" value="${esc(p.salaryExpectation)}" placeholder="${esc(t('cb.salPh'))}">
      <div class="hint">${esc(t('cb.salHint'))}</div></div>`],

  skill: ['cb.secSkill', p => `
    <div class="f"><label>${esc(t('cb.fLangs'))}</label><input id="languages" value="${esc((p.languages||[]).join(', '))}" placeholder="${esc(t('cb.langsPh'))}">
      <div class="hint">${esc(t('cb.comma'))}</div></div>
    <div class="f"><label>${esc(t('cb.fSkills'))}</label><input id="skills" value="${esc((p.skills||[]).join(', '))}" placeholder="R-Keeper, upsell">
      <div class="hint">${esc(t('cb.comma'))}</div></div>
    <div class="f"><label>${esc(t('cb.fEdu'))}</label><input id="education" value="${esc(p.education)}"></div>`],

  about: ['cb.secAbout', p => `
    <div class="f"><textarea id="experienceSummary" placeholder="${esc(t('cb.aboutPh'))}">${esc(autoSummary(p) ? '' : p.experienceSummary)}</textarea>
      <div class="hint">${esc(t('cb.aboutHint'))}</div></div>`]
};

const TEXT_IDS = ['fullName','phone','desiredPosition','location','shift','salaryExpectation','education','experienceSummary','age','experienceYears'];

function openSheet(key){
  // Holat — forma emas, uchta tanlov. Bosilgan zahoti saqlanadi va
  // oyna yopiladi: "Saqlash" tugmasini qo'shish ortiqcha qadam bo'lardi.
  if (key === 'status') {
    $('shT').textContent = t('cb.statusT');
    $('shB').innerHTML = STATUS.map(k => `
      <button class="opt ${k === P.jobStatus ? 'on' : ''}" data-s="${k}">
        <span>${esc(t('cb.st.' + k))}</span>${k === P.jobStatus ? '<b>&#10003;</b>' : ''}
      </button>`).join('') +
      `<div class="hint" style="padding:10px 0 2px">${esc(t('cb.statusHint'))}</div>`;
    $('sheet').classList.add('on');
    document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
      haptic();
      try { await save({ jobStatus: b.dataset.s }); closeSheet(); }
      catch(e){ $('shB').insertAdjacentHTML('beforeend', fail(e.status === 401 ? t('auth.expired') : e.message)); }
    });
    return;
  }

  const [title, body] = FORMS[key];
  $('shT').textContent = t(title);
  $('shB').innerHTML = body(P) + `<button class="btn" id="shSave">${esc(t('common.save'))}</button>`;
  $('sheet').classList.add('on');

  $('shSave').onclick = async () => {
    const b = $('shSave');
    b.disabled = true; b.textContent = t('common.saving');
    const payload = {};
    for (const id of TEXT_IDS) if ($(id)) payload[id] = $(id).value.trim();
    for (const id of ['languages','skills']) {
      if ($(id)) payload[id] = $(id).value.split(',').map(s=>s.trim()).filter(Boolean);
    }
    try { await save(payload); closeSheet(); }
    catch(e){
      // alert() Telegram ichida chiqmasligi mumkin — xato oynaning o'zida
      b.disabled = false; b.textContent = t('common.retry');
      const old = $('shB').querySelector('.ap-er'); if (old) old.remove();
      b.insertAdjacentHTML('beforebegin', fail(e.status === 401 ? t('auth.expired') : e.message));
    }
  };
}
// ══ Profil kartasi rangi ═════════════════════════════════════
// 8 ta bosiq rang — server: PATCH /api/cand/style (services/profileStyle).
// Boshlang'ich rang — Telegram profilingiz rangiga eng yaqini. Naqsh, emoji
// va yorqin gradientlar ATAYLAB yo'q (2026-10-26: "professional bo'lsin").
// Faqat shu kabinetda ko'rinadi, restoranlarga emas.
const CARD_COLORS = ['blue', 'graphite', 'emerald', 'teal', 'burgundy', 'plum', 'rose', 'bronze'];   // nomi — t('cb.col.<k>')
const styleOf = p => Object.assign({ color: 'blue' }, p && p.style);
const PAL_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
// Tasdiq belgisi — telefoni Telegram orqali tasdiqlangan nomzodga (oq doira, ✓)
const VB_IC = () => '<svg class="vb" viewBox="0 0 20 20" aria-label="' + esc(t('cb.verified')) + '"><circle cx="10" cy="10" r="9" fill="#fff"/><path d="M6.2 10.2l2.5 2.5 5.1-5.2" fill="none" stroke="#16357A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function openStyle(){
  let cur = styleOf(P).color;
  const ini = (P.fullName || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
  $('shT').textContent = t('cb.styleT');
  const nameOf = k => t('cb.col.' + (CARD_COLORS.includes(k) ? k : 'blue'));
  const draw = () => {
    $('shB').innerHTML = `
      <div class="hero mini c-${cur}">
        <div class="av">${P.hasPhoto ? `<img src="/api/cand/photo?t=${encodeURIComponent(PT)}" alt="" data-nozoom>` : esc(ini)}</div>
        <div class="nm">${esc(P.fullName || t('cb.yourName'))}${P.phoneVerified ? VB_IC() : ''}</div>
      </div>
      <div class="sty-grid">${CARD_COLORS.map(k =>
        `<button class="sty-c c-${k} ${cur === k ? 'on' : ''}" data-c="${k}" aria-label="${esc(nameOf(k))}"></button>`).join('')}</div>
      <div class="sty-nm">${esc(nameOf(cur))}</div>
      <div class="hint" style="padding:4px 2px 14px;text-align:center">${esc(t('cb.styleHint'))}</div>
      <button class="btn" id="styOk">${esc(t('common.save'))}</button>
      ${P.style && P.style.chosen ? `<button class="sty-reset" id="styReset">${esc(t('cb.styleReset'))}</button>` : ''}`;
    $('shB').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cur = b.dataset.c; haptic(); draw(); });
    const go = async body => {
      const b = $('styOk'); b.disabled = true;
      try {
        const r = await api('/api/cand/style', { method: 'PATCH', body: JSON.stringify(body) });
        P.style = r; closeSheet(); render(P);
      } catch(e){ b.disabled = false; b.insertAdjacentHTML('beforebegin', fail(e.message)); }
    };
    $('styOk').onclick = () => go({ color: cur });
    if ($('styReset')) $('styReset').onclick = () => go({ color: '' });
  };
  draw();
  $('sheet').classList.add('on');
}

function closeSheet(){ $('sheet').classList.remove('on'); $('shB').innerHTML = ''; }
$('shX').onclick = closeSheet;
$('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); };

async function save(patch){
  const r = await api('/api/cand/me', { method:'PATCH', body: JSON.stringify(patch) });
  // Statistika va to'ldirilganlik PATCH javobida yo'q — qayta o'qiymiz
  render(await api('/api/cand/me'));
  try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
  return r;
}

// ══════════════════════════════════════════════════════════
//  ISH O'RINLARI
// ══════════════════════════════════════════════════════════
// Restoran nomi ko'rinmaydi — faqat hudud. Buni server hal qiladi
// (services/vacancy.js forCandidate), bu yerda shunchaki ko'rsatamiz.

// ── Vakansiya sahifasi (hh kabi) ──
// Ro'yxatdagi karta qisqa; bosilganda hamma shart ochiladi. Ro'yxat
// javobida hamma maydon allaqachon bor — alohida so'rov kerak emas.
// Kontaktgacha kompaniya NOMI yo'q (server "place" ni hudud bilan beradi).
// Vakansiya smenasi: "ikkalasi" bu yerda "Kunduzgi va kechki" (profilda "Farqi yo'q")
const vShift = k => k === 'ikkalasi' ? t('cb.vsh.ikkalasi') : shiftLbl(k);
// Joy satri: tuman va mo'ljal ("Yunusobod · Bodomzor metrosi yonida")
const placeOf = v => [v.where || (v.landmark ? '' : t('cb.tashkent')), v.landmark].filter(Boolean).join(' · ') || v.place || '';
// Afzalliklar: yangi shablonda kalitlar (perkLabels); eski vakansiyada
// "Ovqat · Forma" matni. Erkin matn belgi emas — "Qo'shimcha" bo'lib chiqadi.
function perksOf(v){
  if ((v.perkLabels || []).length) return { chips: v.perkLabels, text: v.conditions || '' };
  const c = String(v.conditions || '');
  return / · /.test(c) ? { chips: c.split(/\s*·\s*/).filter(Boolean), text: '' } : { chips: [], text: c };
}
// Ishonch belgisi faqat haqiqat bo'lsa (server: forCandidate.trust)
function trustTag(v){
  const d = v.trustDays === 0 ? t('cb.today') : v.trustDays === 1 ? t('cb.yesterday') : t('cb.daysAgo', { n: v.trustDays });
  if (v.trust === 'verified') return `<span class="tg2 ok">${esc(t('cb.trVer', { d }))}</span>`;
  if (v.trust === 'client') return `<span class="tg2 fresh">${esc(t('cb.trCl', { d }))}</span>`;
  if (v.trust === 'posted') return `<span class="tg2 fresh">${esc(t('cb.trPost', { d }))}</span>`;
  return v.freshDays != null ? `<span class="tg2 fresh">${esc(v.freshDays === 0 ? t('cb.frToday') : t('cb.frDays', { n: v.freshDays }))}</span>` : '';
}
const salLine = v => v.salaryText
  ? esc(v.salaryText).replace(/ (\/ \S+)$/, ' <small>$1</small>')
  : '';

// Yosh oralig'i — ikkala sahifada bir xil
const ageOf = v => v.minAge && v.maxAge ? t('cb.ageRange', { a: v.minAge, b: v.maxAge })
  : v.minAge ? t('cb.ageFrom', { n: v.minAge }) : v.maxAge ? t('cb.ageTo', { n: v.maxAge }) : '';
const matchTag = () => `<span class="tg2 fit">${esc(t('cb.match'))}</span>`;

function vacancyHtml(v){
  const kv = (k, val) => val ? `<div class="vd-kv"><span class="k">${esc(t(k))}</span><span class="v">${esc(val)}</span></div>` : '';
  const ul = xs => `<ul class="vd-ul">${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const work = [
    kv('cb.vSched', v.schedule),
    kv('cb.fShift', vShift(v.shift)),
    kv('cb.vPay', v.payoutText),
    kv('cb.vStart', v.startDate ? dLong(v.startDate) : ''),
    kv('cb.vNeed', v.headcount > 1 ? t('cb.people', { n: v.headcount }) : '')
  ].join('');
  const need = [
    kv('cb.fExp', v.minExp ? t('cb.expFrom', { n: v.minExp }) : t('cb.notReq')),
    kv('cb.fAge', ageOf(v)),
    kv('cb.fLangs', (v.languages || []).join(', '))
  ].join('');
  const pk = perksOf(v);
  const trust = trustTag(v);
  return `<div class="vd-ti">${esc(v.title)}</div>
    ${v.venue ? `<div class="vd-pl" style="color:var(--ink)">${esc(v.venue)}</div>` : ''}
    <div class="vd-pl">${esc(placeOf(v))}</div>
    <div class="vd-sl">${salLine(v) || esc(t('cb.noSal'))}</div>
    ${v.hook ? `<div class="vd-hk">${esc(v.hook)}</div>` : ''}
    ${(v.duties || []).length ? `<div class="vd-sec">${esc(t('cb.duties'))}</div>${ul(v.duties)}` : ''}
    <div class="vd-sec">${esc(t('cb.reqs'))}</div>${(v.requirements || []).length ? ul(v.requirements) : ''}${need}
    ${work ? `<div class="vd-sec">${esc(t('cb.terms'))}</div>${work}` : ''}
    ${pk.chips.length ? `<div class="vd-sec">${esc(t('cb.perks'))}</div><div class="vd-chips">${pk.chips.map(p => `<span>${esc(p)}</span>`).join('')}</div>` : ''}
    ${pk.text ? `<div class="vd-sec">${esc(t('cb.extra'))}</div><div class="vd-tx">${esc(pk.text)}</div>` : ''}
    ${trust || v.match ? `<div class="row" style="display:flex;gap:7px;margin-top:14px;flex-wrap:wrap">
      ${v.match ? matchTag() : ''}${trust}</div>` : ''}`;
}

  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>',
  job: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
};

function vacPageHtml(v){
  const facts = [
    ['cb.fShift', vShift(v.shift)], ['cb.vSched', v.schedule], ['cb.vPay', v.payoutText],
    ['cb.fExp', v.minExp ? t('cb.expFrom', { n: v.minExp }) : t('cb.notReq')], ['cb.fAge', ageOf(v)],
    ['cb.vStart', v.startDate ? dLong(v.startDate) : ''], ['cb.vNeed', v.headcount > 1 ? t('cb.people', { n: v.headcount }) : ''],
    ['cb.fLangs', (v.languages || []).join(', ')]
  ].filter(f => f[1]);
  const pk = perksOf(v), trust = trustTag(v);
  const list = (xs, ic) => `<ul class="vp-ul ${ic ? 'ck' : ''}">${xs.map(x => `<li>${ic ? VP_IC.check : '<i></i>'}<span>${esc(x)}</span></li>`).join('')}</ul>`;
  return `
    <div class="vp-hero">
      <div class="vp-badge">${VP_IC.job}</div>
      <h1>${esc(v.title)}</h1>
      ${v.venue ? `<div class="vp-ven">${esc(v.venue)}</div>` : ''}
      ${placeOf(v) ? `<div class="vp-pl">${VP_IC.pin}<span>${esc(placeOf(v))}</span></div>` : ''}
      <div class="vp-sal ${v.salaryText ? '' : 'no'}">${salLine(v) || esc(t('cb.noSal'))}</div>
      ${trust || v.match ? `<div class="vp-tags">${v.match ? matchTag() : ''}${trust}</div>` : ''}
    </div>
    ${v.hook ? `<div class="vp-hook">${esc(v.hook)}</div>` : ''}
    ${facts.length ? `<div class="vp-facts">${facts.map(([k, val]) => `<div><span>${esc(t(k))}</span><b>${esc(val)}</b></div>`).join('')}</div>` : ''}
    ${(v.duties || []).length ? `<div class="vp-sec"><h3>${esc(t('cb.duties'))}</h3>${list(v.duties, true)}</div>` : ''}
    ${(v.requirements || []).length ? `<div class="vp-sec"><h3>${esc(t('cb.reqs'))}</h3>${list(v.requirements)}</div>` : ''}
    ${pk.chips.length ? `<div class="vp-sec"><h3>${esc(t('cb.perks'))}</h3><div class="vp-chips">${pk.chips.map(p => `<span>${esc(p)}</span>`).join('')}</div></div>` : ''}
    ${pk.text ? `<div class="vp-sec"><h3>${esc(t('cb.extra'))}</h3><p class="vp-tx">${esc(pk.text)}</p></div>` : ''}
    <div class="vp-note">${esc(t('cb.vpNote'))}</div>`;
}

function showJob(v){
  $('vpBody').innerHTML = vacPageHtml(v);
  $('vpHT').textContent = v.title;
  $('vp').classList.remove('scrolled');
  const b = $('vpAp');
  b.disabled = !!v.applied;
  b.innerHTML = v.applied ? VP_IC.check + esc(t('cb.applied')) : esc(t('cb.apply'));
  b.onclick = () => openApply(v);
  $('vpShare').onclick = () => {
    const link = `https://t.me/${(P && P.bot) || 'TalentHubUzBot'}?start=v_${v.id}_ref`;
    const text = t('cb.shareTx', { t: `${v.title}${v.salaryText ? ' — ' + v.salaryText : ''}` });
    const u = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text);
    try { TG && TG.openTelegramLink ? TG.openTelegramLink(u) : window.open(u, '_blank'); } catch(e){ location.href = u; }
  };
  $('vp').classList.add('on');
  $('vp').setAttribute('aria-hidden', 'false');
  $('vpBody').scrollTop = 0;
  document.body.classList.add('vp-lock');
  syncBack();
}
function closeJob(){
  $('vp').classList.remove('on');
  $('vp').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('vp-lock');
  syncBack();
}
// Telegram "Orqaga": avval oyna (ariza), keyin vakansiya sahifasi
function syncBack(){
  try {
    if (!TG || !TG.BackButton || !(TG.isVersionAtLeast && TG.isVersionAtLeast('6.1'))) return;
    if ($('sheet').classList.contains('on') || $('vp').classList.contains('on')) TG.BackButton.show(); else TG.BackButton.hide();
  } catch(e){}
}
function onBack(){
  if ($('sheet').classList.contains('on')) { closeSheet(); return; }
  if ($('vp').classList.contains('on')) closeJob();
}
try { TG && TG.BackButton && TG.BackButton.onClick(onBack); } catch(e){}
new MutationObserver(syncBack).observe($('sheet'), { attributes: true, attributeFilter: ['class'] });
$('vpBack').onclick = closeJob;
$('vpBody').addEventListener('scroll', () => $('vp').classList.toggle('scrolled', $('vpBody').scrollTop > 90), { passive: true });
// Havola bilan to'g'ridan-to'g'ri vakansiya: profil.html#v=<id> (bot xabarlari uchun)
let OPEN_VAC = (location.hash.match(/^#v=([0-9a-f-]{36})$/) || [])[1] || null;

// ── ARIZA OYNASI ──
// Ilgari bitta bosish bilan ketardi, xato bo'lsa alert() — Telegram ichida
// u ko'pincha chiqmaydi, tugma jimgina qaytib qolardi (2026-10-22: "bosdim,
// hech narsa bo'lmadi"). Endi: nima yuborilayotgani, profil tekshiruvi,
// xato SHU oynada va tushunarli, muvaffaqiyat — keyingi qadamlar bilan.
const fail = (msg, btn) => `<div class="ap-er">${esc(msg)}${btn ? `<br><button id="apFix">${esc(btn)}</button>` : ''}</div>`;
function openApply(v){
  const p = P || {};
  const row = (ok, label, val, opt) => `<div class="ck-r"><i class="${ok ? 'y' : opt ? 'o' : 'n'}">${ok ? '✓' : opt ? '–' : '!'}</i>${label}
    <span class="v">${esc(val || t(opt ? 'cb.opt' : 'cb.none'))}</span></div>`;
  const hasName = !!String(p.fullName || '').trim(), hasPhone = !!String(p.phone || '').trim();
  const ready = hasName && hasPhone;
  showSheet(t('cb.apT'), `
    <div class="ap-v"><b>${esc(v.title)}</b><span>${esc([v.venue, placeOf(v)].filter(Boolean).join(' · '))}</span>
      ${v.salaryText ? `<div style="font-weight:600;color:var(--ok);margin-top:4px">${salLine(v)}</div>` : ''}</div>
    <div class="vd-sec">${esc(t('cb.apSees'))}</div>
    <div class="ck-l">
      ${row(hasName, esc(t('cb.apName')), p.fullName)}
      ${row(hasPhone, esc(t('cb.fPhone')), p.phone)}
      ${row(!!(p.desiredPosition || p.role), esc(t('cb.fPos')), p.desiredPosition, true)}
      ${row(!!p.experienceYears, esc(t('cb.fExp')), p.experienceYears ? t('cb.yrs', { n: p.experienceYears }) : '', true)}
      ${row(!!p.hasPhoto, esc(t('cb.photo')), p.hasPhoto ? t('cb.has') : '', true)}
    </div>
    ${ready ? '' : fail(t('cb.apNeed'), t('cb.fillProfile'))}
    <div id="apEr"></div>
    <button class="btn" id="apGo" style="margin-top:12px" ${ready ? '' : 'disabled'}>${esc(t('cb.apSend'))}</button>`);
  if ($('apFix')) $('apFix').onclick = () => { closeSheet(); pickTab('tP'); };
  $('apGo').onclick = () => sendApply(v);
}

async function sendApply(v){
  const b = $('apGo');
  b.disabled = true; b.textContent = t('cb.sending'); $('apEr').innerHTML = '';
  try {
    // Xat maydoni yo'q (Anas qarori: ko'k yoqa uchun ortiqcha qadam) — profilning o'zi yetadi
    await api(`/api/cand/vacancies/${encodeURIComponent(v.id)}/apply`, { method:'POST', body: JSON.stringify({}) });
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
    v.applied = true;
    applied(v);
    if ($('vp').classList.contains('on')) { $('vpAp').disabled = true; $('vpAp').innerHTML = VP_IC.check + esc(t('cb.applied')); }
    loadJobs();
  } catch(e){
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('error'); } catch(_){}
    b.disabled = false; b.textContent = t('cb.apSend');
    let html, fix = null;
    if (e.code === 'expired' || e.status === 401) {
      html = fail(t('cb.expLong'), t('cb.closeApp'));
      fix = () => { try { TG.close(); } catch(_){} };
    } else if (['no_name', 'no_phone', 'bad_phone'].includes(e.code)) {
      html = fail(e.message, t('cb.fillProfile')); fix = () => { closeSheet(); pickTab('tP'); };
    } else if (e.code === 'duplicate') {
      v.applied = true; html = fail(e.message, t('cb.myApps')); fix = () => { closeSheet(); pickTab('tA'); };
    } else if (e.code === 'closed') {
      html = fail(e.message, t('cb.otherJobs')); fix = () => { closeSheet(); loadJobs(); };
    } else if (!e.status) {
      html = fail(t('cb.noNet'));
    } else {
      html = fail(e.message || t('cb.errRetry'));
    }
    $('apEr').innerHTML = html;
    if (fix && $('apFix')) $('apFix').onclick = fix;
  }
}

function applied(v){
  showSheet(t('cb.sent'), `<div class="ap-ok">
    <div class="ic">✓</div>
    <h3>${esc(t('cb.sent'))}</h3>
    <p>${esc(v.title)}${v.venue ? ' · ' + esc(v.venue) : ''}</p>
    <div class="nx">
      <div><b>1</b>${esc(t('cb.nx1'))}</div>
      <div><b>2</b>${esc(t('cb.nx2'))}</div>
      <div><b>3</b>${esc(t('cb.nx3'))}</div>
    </div>
    <button class="btn" id="okA">${esc(t('cb.tabA'))}</button>
    <button class="btn2" id="okJ">${esc(t('cb.otherJobs'))}</button></div>`);
  $('okA').onclick = () => { closeSheet(); pickTab('tA'); };
  $('okJ').onclick = () => closeSheet();
}
