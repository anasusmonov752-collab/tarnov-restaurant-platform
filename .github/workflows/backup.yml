# ── Kunlik zaxira nusxa (MongoDB Atlas) ──────────────────────
# Atlas bepul tarifi (M0) o'zi zaxira qilmaydi, Render bepul tarifida
# cron ishonchsiz — shuning uchun GitHub Actions. Har kecha 03:00
# (Toshkent) to'liq dump olinadi va SHIFRLANGAN holda artifact bo'lib
# 30 kun saqlanadi. Repo ochiq: shifrsiz dump hech qachon yuklanmaydi.
#
# Kerakli sirlar (GitHub -> Settings -> Secrets and variables -> Actions):
#   MONGODB_URI        — Render'dagi bilan bir xil
#   BACKUP_PASSPHRASE  — uzun tasodifiy parol; YO'QOTMANG (usiz nusxa ochilmaydi)
# Sirlar yo'q bo'lsa ish o'tkazib yuboriladi (xato bermaydi).
#
# Tiklash:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tarnov.archive.gz.enc \
#     -out tarnov.archive.gz -pass pass:"$BACKUP_PASSPHRASE"
#   mongorestore --uri "$MONGODB_URI" --archive=tarnov.archive.gz --gzip --drop
#   (avval boshqa bazaga tiklab tekshiring: --nsFrom 'tarnov.*' --nsTo 'tiklash.*')

name: backup

on:
  schedule:
    - cron: '0 22 * * *'      # 22:00 UTC = 03:00 Toshkent
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Sirlar bormi
        id: check
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "MONGODB_URI yoki BACKUP_PASSPHRASE sozlanmagan — zaxira o'tkazib yuborildi"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ ${#BACKUP_PASSPHRASE} -lt 20 ]; then
            echo "BACKUP_PASSPHRASE 20 belgidan qisqa — xavfsiz emas" && exit 1
          fi

      # Faqat ilova bazasi: manzilda baza nomi bo'lmasa mongoose 'test' ni
      # ishlatadi. Butun klasterni olishga urinsa Atlas foydalanuvchisi
      # admin bazasiga kira olmay yiqiladi (2026-10-20, birinchi ishga tushirish).
      # Xato matni annotatsiyada ko'rinadi; parol va manzil yashiriladi.
      - name: Dump (mongo:7 konteyneridagi mongodump)
        if: steps.check.outputs.skip != '1'
        shell: bash
        run: |
          URI=$(printf '%s' "$MONGODB_URI" | tr -d '[:space:]' | sed -E "s/^MONGODB_URI=//; s/^[\"']//; s/[\"']$//")
          echo "::add-mask::$URI"
          PASS=$(printf '%s' "$URI" | sed -nE 's#^[^:]+://[^:/@]+:([^@]+)@.*#\1#p')
          [ -n "$PASS" ] && echo "::add-mask::$PASS"
          case "$URI" in mongodb://*|mongodb+srv://*) ;; *) echo "::error title=MONGODB_URI::mongodb:// yoki mongodb+srv:// bilan boshlanmaydi"; exit 1;; esac
          # Manzilda baza nomi bo'lsa mongodump o'zi shuni oladi; bo'lmasa --db test
          DB=$(printf '%s' "$URI" | sed -nE 's#^[^:]+://[^/]+/([^?]+).*#\1#p')
          DBARG=""; [ -z "$DB" ] && { DB=test; DBARG="--db test"; }
          echo "::notice title=Baza::$DB"
          mkdir -p out
          if ! docker run --rm -e URI="$URI" -e DBARG="$DBARG" -v "$PWD/out:/out" mongo:7 \
               sh -c 'mongodump --uri "$URI" $DBARG --archive=/out/tarnov.archive.gz --gzip' 2> dump.err; then
            tail -n 6 dump.err | while read -r l; do echo "::error title=mongodump::$l"; done
            exit 1
          fi
          tail -n 3 dump.err
          ls -la out

      - name: Shifrlash (AES-256, PBKDF2)
        if: steps.check.outputs.skip != '1'
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in out/tarnov.archive.gz -out out/tarnov.archive.gz.enc -pass env:BACKUP_PASSPHRASE
          rm -f out/tarnov.archive.gz
          sha256sum out/tarnov.archive.gz.enc

      - name: Saqlash (30 kun)
        if: steps.check.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: tarnov-db-${{ github.run_number }}
          path: out/tarnov.archive.gz.enc
          retention-days: 30
          if-no-files-found: error
